<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зачёт: ЕГЭ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Зачёт: ЕГЭ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Школьная тетрадь, собранная как приложение: чернильно-синяя обложка-герой в клетку с красной линией полей,
   белые листы-карточки, красная ручка учителя для отметок. Одна колонка, плавающая нижняя панель. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f8; --fg:#141a33; --muted:#5f6786; --line:#e1e5f0;
  --ink:#2f45c8; --ink-2:#e6eafc; --on-ink:#ffffff;
  --red:#d4372c; --red-2:#fdecea; --ok:#1d8a52; --ok-2:#e3f5eb; --warn:#9a5c00; --warn-2:#fff1d9;
  --s1:#2f45c8; --s2:#8a3fa6; --s3:#1f7a64;
  --hero:#2235a8; --hero-fg:#ffffff; --hero-mute:rgba(255,255,255,.74); --hero-line:rgba(255,255,255,.08); --pen:#ff8a7e;
  --shadow:0 1px 2px rgba(22,32,90,.05),0 8px 24px rgba(22,32,90,.07);
  --navbg:rgba(255,255,255,.9); --scrim:rgba(14,18,40,.42);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:16px; --r-s:12px; --nav-h:56px; --ol:#1d2340;
  --c-itog:#d4372c; --c-rus:#2f45c8; --c-mathp:#c8322a; --c-mathb:#c45a1c; --c-phys:#1b6f8c; --c-chem:#1d8048; --c-inf:#5b3fc4; --c-bio:#3d7f1c; --c-hist:#8f5600; --c-soc:#a3325f; --c-geo:#0d746f; --c-lit:#8a3fa6; --c-eng:#b0283f; --c-deu:#4a4a5e; --c-fra:#2a5bd7; --c-spa:#b4400e; --c-chi:#b01c1c; --lg-b:#a5622f; --lg-s:#6f7a8c; --lg-g:#b58300; --lg-p:#16857a; --lg-d:#3d63e0; --on-c:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b2c; --surface-2:#1f2438; --fg:#e9ebf5; --muted:#9ba2c0; --line:#283050;
  --ink:#93a5ff; --ink-2:#232a4b; --on-ink:#0e1120;
  --red:#ff6f63; --red-2:#3a1e23; --ok:#5ad08f; --ok-2:#15301f; --warn:#f2b24c; --warn-2:#33270f;
  --s1:#93a5ff; --s2:#d68fec; --s3:#5ccaac;
  --hero:#1c256c; --hero-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px var(--line); --navbg:rgba(23,27,44,.9); --scrim:rgba(0,0,0,.55); --c-itog:#ff6f63; --c-rus:#93a5ff; --c-mathp:#ff7a6e; --c-mathb:#ff9a66; --c-phys:#5cc3e6; --c-chem:#5ad08f; --c-inf:#a993ff; --c-bio:#8ed05c; --c-hist:#f2b24c; --c-soc:#f08ab5; --c-geo:#4fd1c9; --c-lit:#d68fec; --c-eng:#ff7d92; --c-deu:#b9b9cc; --c-fra:#88a8ff; --c-spa:#fb923c; --c-chi:#f87171; --lg-b:#d9955f; --lg-s:#b4bdcc; --lg-g:#f2c94c; --lg-p:#4fd1c0; --lg-d:#8fb0ff; --on-c:#0e1120; --ol:#cdd3ea; color-scheme:dark}}
:root[data-theme="dark"]{ --ol:#cdd3ea;
  --bg:#0e1120; --surface:#171b2c; --surface-2:#1f2438; --fg:#e9ebf5; --muted:#9ba2c0; --line:#283050;
  --ink:#93a5ff; --ink-2:#232a4b; --on-ink:#0e1120;
  --red:#ff6f63; --red-2:#3a1e23; --ok:#5ad08f; --ok-2:#15301f; --warn:#f2b24c; --warn-2:#33270f;
  --s1:#93a5ff; --s2:#d68fec; --s3:#5ccaac;
  --hero:#1c256c; --hero-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px var(--line); --navbg:rgba(23,27,44,.9); --scrim:rgba(0,0,0,.55); --c-itog:#ff6f63; --c-rus:#93a5ff; --c-mathp:#ff7a6e; --c-mathb:#ff9a66; --c-phys:#5cc3e6; --c-chem:#5ad08f; --c-inf:#a993ff; --c-bio:#8ed05c; --c-hist:#f2b24c; --c-soc:#f08ab5; --c-geo:#4fd1c9; --c-lit:#d68fec; --c-eng:#ff7d92; --c-deu:#b9b9cc; --c-fra:#88a8ff; --c-spa:#fb923c; --c-chi:#f87171; --lg-b:#d9955f; --lg-s:#b4bdcc; --lg-g:#f2c94c; --lg-p:#4fd1c0; --lg-d:#8fb0ff; --on-c:#0e1120; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.18;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.caption{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.view-in{animation:viewIn .22s ease-out}
@keyframes viewIn{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}

/* заголовки экранов */
.apphead{display:flex;flex-direction:column;gap:2px;padding:6px 2px 0}
.apphead h1{font-size:25px}
.apphead .sub{font-size:13px;color:var(--muted)}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0}
.mark{font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1;color:var(--red);transform:rotate(-4deg);display:inline-block}
.mark small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px;transform:rotate(4deg);display:inline-block;letter-spacing:.02em}

/* карточки */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card.tight{padding:2px 14px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title h2{font-size:18px}

/* герой: обложка тетради */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:14px 14px 8px 28px;color:var(--hero-fg);background-color:var(--hero);
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:18px 18px}
.hero::before{content:"";position:absolute;top:0;bottom:0;left:16px;width:2px;background:var(--pen);opacity:.85}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero-num{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.03em}
.hero-lbl{font-size:14px;font-weight:600;margin-top:3px}
.hero-lbl span{display:block;font-weight:400;color:var(--hero-mute);font-size:12px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:rgba(255,255,255,.16)}
.ring .fgc{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-size:16px;line-height:1}
.ring b small{display:block;font:500 10px/1.3 var(--f-body);color:var(--hero-mute)}
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.track .stage{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.dot{border:0;background:none;padding:8px 0;display:block;min-width:0}
.dot i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:transform .15s}
.dot.part i{background:rgba(255,255,255,.55)}
.dot.done i{background:#fff}
.dot.cur i{background:var(--pen);transform:scaleY(1.5)}
.dot.cur.done i{background:#fff;box-shadow:0 0 0 2px var(--pen)}
.dot.sel:not(.cur) i{outline:2px solid #fff;outline-offset:2px}
.track-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--hero-mute);font-weight:500}

/* урок дня */
.lesson{display:flex;flex-direction:column;gap:10px}
.lesson-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--ink-2);color:var(--ink);letter-spacing:.02em}
.pill.red{background:var(--red-2);color:var(--red)}
.pill.ok{background:var(--ok-2);color:var(--ok)}
.lesson-title{font-size:21px}
.lesson-title .daynum{display:block;font-family:var(--f-hand);color:var(--red);font-size:19px;font-weight:700;line-height:1.1;letter-spacing:0;transform:rotate(-2deg);transform-origin:left;margin-bottom:1px}
.prose{display:flex;flex-direction:column;gap:8px;font-size:15px}
.prose ul,.prose ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prose.closed{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{align-self:flex-start;margin-top:-4px}
.prose li::marker{color:var(--muted)}
.prose b{font-weight:600}
.note{background:var(--surface-2);border-radius:var(--r-s);padding:9px 12px;font-size:14px}
.note.red{background:var(--red-2)}
.example{position:relative;background:var(--surface-2);border-radius:var(--r-s);padding:26px 12px 10px;font-family:var(--f-display);font-style:italic;font-size:14.5px;line-height:1.55}
.example::before{content:"пример";position:absolute;top:3px;left:12px;font:700 19px/1.2 var(--f-hand);font-style:normal;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:9px 16px;min-height:42px;font-weight:600;background:var(--ink);color:var(--on-ink);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--ink-2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{flex:1}
.iconbtn{display:inline-grid;place-content:center;width:42px;height:42px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);flex:none}
.link{background:none;border:0;padding:6px 0;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* задания */
.tasks{position:relative}
.tasks-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tasks-head h2{font-size:18px}
.count{font-weight:600;color:var(--muted);font-size:14px}
.minibar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:8px 0 2px}
.minibar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .35s ease}
.checklist{list-style:none;padding:0;display:flex;flex-direction:column}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.checklist label{flex:1;min-width:0;cursor:pointer;padding-top:2px;transition:color .2s}
.checklist li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
.chk::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.chk:checked{background:var(--red);border-color:var(--red)}
.chk:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.stamp{position:absolute;top:8px;right:14px;font:700 26px/1 var(--f-hand);color:var(--red);border:2.5px solid var(--red);border-radius:12px;padding:2px 12px 6px;transform:rotate(-9deg);animation:stamp .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp{from{transform:rotate(-20deg) scale(1.8);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.daynav{display:flex;justify-content:space-between;gap:8px}

/* книги-подсказки и теги */
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;color:var(--c,var(--ink));background:var(--surface-2);background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent)}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:500;min-height:32px;text-align:left}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink));flex:none}
.subbooks{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.subbooks .lbl{font-size:13px;font-weight:600;margin-bottom:6px}
.subbooks .lbl span{color:var(--muted);font-weight:500}

/* сегменты и фильтры */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button .ic{width:17px;height:17px;vertical-align:-3px;margin-right:5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(20,30,80,.12)}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.scroller::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;min-height:34px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* план: лента */
.stagehead{display:flex;align-items:center;gap:14px}
.stagenum{width:36px;height:36px;border-radius:11px;display:grid;place-content:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--ink-2);color:var(--ink);flex:none}
.stagehead h2{font-size:17px}
.stagehead .caption{margin-top:2px}
.stagehead .count{margin-left:auto}
.timeline{position:relative;display:flex;flex-direction:column;margin-top:6px}
.timeline::before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:2px;background:var(--line)}
.tl{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:6px 0}
.tl-node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-content:center;font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.tl.part .tl-node{border-color:var(--warn);color:var(--warn);background:var(--warn-2)}
.tl.done .tl-node{background:var(--ok);border-color:var(--ok);color:#fff}
.tl.done .tl-node .ic{width:15px;height:15px;stroke-width:3}
.tl.cur .tl-node{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 4px var(--red-2)}
.tl-body{flex:1;min-width:0;display:flex;flex-direction:column}
.tl-title{font-weight:600;line-height:1.3;font-size:14.5px}
.tl.done .tl-title{color:var(--muted)}
.tl-sub{font-size:12px;color:var(--muted)}

/* справка */
.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fk{display:inline-grid;place-content:center;min-width:38px;height:38px;padding:0 8px;border-radius:12px;font-weight:700;font-family:var(--f-display);font-size:17px;background:var(--surface-2);color:var(--fg)}
.fk.m{background:var(--ink);color:var(--on-ink)}
.op{font-weight:700;color:var(--muted);font-size:18px}
.fgroup{display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:15px;border:1.5px dashed var(--muted)}
.fgroup .fk{min-width:36px;height:36px;font-size:15px}
.fgroup small{font-size:11px;color:var(--muted);padding:0 4px;line-height:1.2;max-width:52px}
.stampmini{font:700 26px/1 var(--f-hand);color:var(--red);border:2px solid var(--red);border-radius:10px;padding:1px 9px 5px;transform:rotate(-6deg)}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.rowi:first-child{border-top:0}
.rowi .fk{flex:none}
.rowi .fk.req{background:var(--red-2);color:var(--red)}
.rowi h3{font-family:var(--f-body);font-size:15px;font-weight:600;letter-spacing:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowi p{color:var(--muted);font-size:14px;margin-top:1px}
.sbar{display:flex;gap:3px;height:30px;border-radius:10px;overflow:hidden}
.sbar span{display:grid;place-content:center;font-size:12px;font-weight:700;color:#fff;min-width:0}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.legend .li{display:flex;gap:12px}
.legend .sw{width:12px;height:12px;border-radius:4px;margin-top:6px;flex:none}
.secthead{display:flex;gap:12px;align-items:flex-start}
.secthead .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.secthead h2{font-size:17px}
details.acc{border-top:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 0;font-size:14.5px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .idx{flex:none;font-weight:700;font-size:13px;color:var(--c);background:var(--surface-2);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:8px;padding:3px 7px}
details.acc>summary .nm{flex:1;min-width:0;font-weight:500;line-height:1.35}
details.acc>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s;flex:none}
details.acc[open]>summary::after{transform:rotate(225deg);margin-bottom:-4px}

<li>Объём: рекомендовано <b>от 350 слов</b>. Если меньше 250 — сразу «незачёт», работу не проверяют.</li>
<li>Работа должна быть самостоятельной: списанное сочинение = «незачёт».</li>
<li>Критериев 5. Для зачёта нужны <b>К1 и К2</b> плюс хотя бы <b>один из К3–К5</b>.</li></ul>
<p>Конкретные темы заранее не известны, но все они из банка ФИПИ, а у банка понятная структура: <b>3 раздела по 4 подраздела</b>. В комплекте по две темы из каждого раздела.</p>
<div class="note">Значит, к тысячам тем готовиться не нужно. Достаточно иметь по 2–3 произведения на каждый подраздел, а многие книги подходят сразу к нескольким.</div>`,
 tasks:['Прочитать «Критерии» в Справке','Пройти тест «Проверь себя» (цель — 8 из 10)','Прочитать все 12 подразделов в Справке → Банк тем','Узнать у учителя время начала сочинения в своей школе'], act:{label:'Открыть критерии', go:'ref:crit'}},
{t:'Как понять тему и построить сочинение', th:`
<ol><li>Подчеркни <b>ключевые слова</b>. В теме «Почему человек способен на предательство?» это <i>почему</i> и <i>предательство</i>.</li>
<li>Определи, <b>что спрашивают</b>: причину («почему»), способ («как»), оценку («всегда ли», «можно ли»), смысл понятия («что значит»).</li>
<li>Ответь на вопрос <b>одним предложением</b>. Это тезис, который ты будешь доказывать.</li></ol>
<div class="note red">Самая частая причина незачёта по К1 — подмена темы. Тема «Почему опасно равнодушие?» — не о доброте вообще, а именно о <b>последствиях</b> равнодушия.</div>
<p>Надёжная схема на 350–450 слов:</p>
<ol><li><b>Вступление</b> (50–70 слов): подводка → <b>тезис</b>.</li>
<li><b>Аргумент 1</b> (120–150): микротезис → эпизод → анализ → микровывод.</li>
<li><b>Аргумент 2</b> (120–150): другое произведение.</li>
<li><b>Заключение</b> (40–60): вывод, который отвечает на вопрос темы.</li></ol>`,
 tasks:['Разобрать 3 темы из банка: ключевые слова и ответ в одно предложение','Составить план к теме «Что значит быть сильной личностью?»','Записать своими словами определения: совесть, честь, свобода, память, милосердие'], act:{label:'Открыть структуру', go:'ref:struct'}},
{t:'Вступление и заключение', th:`
<p>Четыре рабочих способа начать: <b>через понятие</b>, <b>через вопрос</b>, <b>через цитату</b> (если точно помнишь её и автора), <b>через наблюдение</b> из жизни. Последняя фраза вступления — <b>тезис</b>.</p>
<div class="example">Предательство редко начинается с громкого поступка. Чаще оно вырастает из слабости, страха или желания получить выгоду. На мой взгляд, человек способен предать, когда ставит собственные интересы выше верности и чести.</div>
<p>Заключение: тезис <b>другими словами</b> → обобщение обоих аргументов → (по желанию) короткий личный вывод. Новых примеров в заключении не приводят.</p>
<div class="example">Таким образом, человек способен на предательство, когда страх или выгода оказываются для него важнее совести. Андрий и Швабрин сделали такой выбор и потеряли себя. Мне кажется, верность проверяется именно тогда, когда за неё приходится платить.</div>`,
 tasks:['Написать два вступления разными способами к одной теме (в тренажёре)','Написать к ним заключение','Выписать 5 связок из Справки → Фразы'], act:{label:'Открыть фразы', go:'ref:phr'}},
{t:'Твоя литературная база', th:`
<p>Выбери <b>6–8 произведений</b>, которые знаешь лучше всего, так, чтобы закрыть все 3 раздела. Для каждого нужно помнить:</p>
<ul><li>точное название и автора (с инициалами);</li><li>имена героев;</li><li>2–3 эпизода с деталями;</li><li>к каким подразделам подходит.</li></ul>
<div class="note">Лучше 7 книг, которые знаешь назубок, чем 20, о которых помнишь только название.</div>`,
 tasks:['Отметить во вкладке «Книги» 6–8 произведений, которые читал(а)','Пройти их в режиме карточек','Перечитать краткое содержание тех, что помнишь хуже'], act:{label:'Открыть книги', go:'books'}},
{t:'Аргумент, а не пересказ', th:`
<p>Пересказ сюжета — ошибка №1. Формула аргумента:</p>
<ol><li><b>Микротезис</b> — как произведение связано с темой.</li>
<li><b>Эпизод</b> — кто, что сделал, конкретная деталь.</li>
<li><b>Анализ</b> — почему это важно и что это говорит о герое и о теме.</li>
<li><b>Микровывод</b> — возврат к тезису.</li></ol>
<div class="example">Обратимся к повести А. С. Пушкина «Капитанская дочка». Пётр Гринёв попадает в плен к Пугачёву и может спасти жизнь ценой присяги самозванцу. Однако он отвечает, что присягал императрице и не может нарушить слово. Герой понимает, что его могут казнить, но страх смерти для него слабее страха потерять честь. Так отцовское «береги честь смолоду» становится его внутренним законом. Этот пример показывает, что сохранить честь — значит остаться верным себе даже тогда, когда это опасно.</div>`,
 tasks:['Написать 2 аргумента по формуле к одной теме','Отметить, где пересказ, а где анализ: анализа должно быть не меньше половины']},
/* ЭТАП 2: АРГУМЕНТЫ */
{t:'Пробное сочинение №1', th:`
<p>Первое сочинение пишем <b>без таймера</b>. Задача — пройти весь путь от темы до заключения и увидеть свои слабые места.</p>
<div class="note">Не бойся, что получится плохо. Это точка отсчёта: через неделю сравнишь.</div>`,
 tasks:['Взять случайную тему в тренажёре и написать сочинение','Проверить объём: от 350 слов','Пройти самопроверку по 5 критериям','Записать 3 главных недочёта'], act:{label:'В тренажёр', go:'write'}},
{t:'Раздел 1: духовно-нравственные ориентиры', sec:1, th:`
<p>Темы о характере, совести, выборе между добром и злом, самопознании и свободе.</p>
<p><b>Опорные произведения:</b> «Преступление и наказание», «Капитанская дочка», «Мастер и Маргарита», «Герой нашего времени», «Старуха Изергиль», «Маленький принц».</p>`,
 tasks:['Выучить 2 произведения для этого раздела (режим карточек)','Составить планы к 2 темам раздела','Написать 1 полный аргумент'], act:{label:'Темы раздела', go:'ref:bank'}},
{t:'Раздел 2: семья, общество, Отечество', sec:2, th:`
<p>Темы о семье и воспитании, человеке и обществе, патриотизме, памяти и связи поколений.</p>
<p><b>Опорные произведения:</b> «Война и мир», «Судьба человека», «А зори здесь тихие…», «Тарас Бульба», «Матрёнин двор», «Телеграмма», «Прощание с Матёрой».</p>`,
 tasks:['Выучить 2 произведения для этого раздела','Составить планы к 2 темам раздела','Написать 1 полный аргумент'], act:{label:'Темы раздела', go:'ref:bank'}},
{t:'Раздел 3: природа и культура', sec:3, th:`
<p>Темы о природе, науке и прогрессе, искусстве, языке.</p>
<p><b>Опорные произведения:</b> «Отцы и дети», «Царь-рыба», «Собачье сердце», «451° по Фаренгейту», «Портрет», «Франкенштейн», «Русский язык» Тургенева, «Живой как жизнь» Чуковского.</p>
<div class="note">Для подраздела «Язык» можно привлекать и нехудожественную литературу: публицистику, книги о языке. Главное — это литературный источник, а не фильм или сериал.</div>`,
 tasks:['Выучить 2 произведения для этого раздела','Составить планы к 2 темам раздела','Написать 1 полный аргумент'], act:{label:'Темы раздела', go:'ref:bank'}},
{t:'Чистая речь (критерий К4)', th:`
<ul><li><b>Повторы</b>: «герой… герой… герой» → он, юноша, Гринёв, молодой офицер.</li>
<li><b>Канцелярит</b>: «является», «данный», «имеет место» → проще.</li>
<li><b>Штампы</b>: «в наше время», «испокон веков», «красной нитью».</li>
<li><b>Разговорные слова</b>: «прикольно», «короче», «капец».</li>
<li><b>Времена в пересказе</b>: не прыгай между прошедшим и настоящим.</li></ul>`,
 tasks:['Открыть сочинение №1 в тренажёре и посмотреть «Проверку речи»','Переписать 5 неудачных предложений','Пересохранить исправленный вариант'], act:{label:'В тренажёр', go:'write'}},

{t:'Сочинение №2 на время', th:`

{t:'Грамотность и оформление', th:`
<p>Для зачёта по К5 нужно не больше <b>5 ошибок на 100 слов</b> (орфография, пунктуация и грамматика вместе). На экзамене дают орфографический словарь.</p>
<ul><li>Вводные слова: <i>во-первых, например, к сожалению, конечно</i> выделяй запятыми.</li>
<li>Деепричастный оборот выделяется всегда: <i>Вернувшись домой, герой…</i></li>
<li>Причастный оборот после определяемого слова — запятые: <i>человек, потерявший честь,…</i></li>
<li>Запятая перед <i>что, который, потому что, чтобы, когда</i> в сложном предложении.</li>
<li><i>-тся / -ться</i>: «что делает?» — без ь, «что делать?» — с ь.</li></ul>
<p><b>Оформление:</b> название — в кавычках, автор — с инициалами (Л. Н. Толстой), жанр — точно («Шинель» — повесть, «Матрёнин двор» — рассказ). Цитату помнишь неточно — перескажи своими словами без кавычек.</p>`,
 tasks:['Выписать свои ошибки из сочинений №1 и №2 и повторить правила к ним','Выучить по одной цитате из 6–8 произведений своей базы','Проверить жанры всех своих произведений']},
{t:'Сочинение №3 — полная репетиция', th:`
<p>Таймер <b>3 часа 55 минут</b>. Распредели время так:</p>
<ul class="num"><li>15 мин — выбор темы и план</li><li>90 мин — черновик</li><li>25 мин — проверка черновика</li><li>60 мин — переписать начисто</li><li>20 мин — финальная проверка, подсчёт слов</li></ul>
<div class="note">Тема — из раздела, по которому ты ещё не писал(а).</div>`,

{t:'Ошибки и быстрые планы', th:`

/* ===================== ГЕНЕРАТОРЫ ЗАДАЧ ===================== */
/* Каждый генератор возвращает новую задачу с вычисленным ответом: задачи не заканчиваются. */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const nf=x=>{const r=Math.round(x*1e6)/1e6;return String(r).replace('.',',')};          // 0.5 → «0,5»
const sgn=(n,first)=>n<0?(first?'−':' − ')+Math.abs(n):(first?'':' + ')+n;
const term=(c,v,first)=>c===0?'':(c<0?(first?'−':' − '):(first?'':' + '))+(Math.abs(c)===1?'':Math.abs(c))+v;
function distract(ans,spread){const s=new Set([ans]);let g=0;while(s.size<4&&g++<50){const d=ans+P([-1,1])*R(1,spread);if(d!==ans)s.add(d)}return [...s]}
function mcqNum(q,ans,spread,extra){const opts=shuffle(distract(ans,spread||5));return Object.assign({q,o:opts.map(nf),a:opts.indexOf(ans)},extra)}
const inp=(q,ans,extra)=>Object.assign({q,inp:1,a:typeof ans==='number'?nf(ans):ans},extra);

const GEN={
 /* ----- Математика ----- */
 percent:()=>{const A=R(2,40)*100,p=P([5,10,15,20,25,30,40,50]),up=Math.random()<.6;const v=up?A+A*p/100:A-A*p/100;
   return inp(`Цена товара — ${A} руб. Её ${up?'повысили':'снизили'} на ${p}%. Сколько рублей стал стоить товар?`,v,{t:'Текстовые задачи',k:'Задание 10',e:`${p}% от ${A} = ${A*p/100}. ${A} ${up?'+':'−'} ${A*p/100} = ${v}.`})},
 linear:()=>{const a=R(2,9)*P([1,-1]),x=R(-9,9),b=R(-20,20),c=a*x+b;
   return inp(`Решите уравнение: ${term(a,'x',true)}${sgn(b)} = ${c}`,x,{t:'Уравнения',k:'Задание 6',e:`${a}x = ${c} − (${b}) = ${c-b}, x = ${x}.`})},
 quad:()=>{let r1=R(-9,9),r2=R(-9,9);while(r2===r1)r2=R(-9,9);const p=-(r1+r2),q=r1*r2,big=Math.random()<.5;
   return inp(`Решите уравнение x²${p?term(p,'x'):''}${q?sgn(q):''} = 0. Если корней несколько, запишите ${big?'больший':'меньший'}.`,big?Math.max(r1,r2):Math.min(r1,r2),{t:'Уравнения',k:'Задание 6',e:`По теореме Виета корни ${r1} и ${r2}: сумма ${r1+r2}, произведение ${q}.`})},
 expeq:()=>{const a=P([2,3,5]),k=R(1,a===2?6:3),m=R(-4,4);
   return inp(`Решите уравнение: ${a}<sup>x${sgn(m)}</sup> = ${a**k}`,k-m,{t:'Уравнения',k:'Задание 6',e:`${a**k} = ${a}<sup>${k}</sup>, значит x${sgn(m)} = ${k}, x = ${k-m}.`})},
 logeq:()=>{const a=P([2,3,5]),k=R(1,a===2?5:3),m=R(-5,5);
   return inp(`Решите уравнение: log<sub>${a}</sub>(x${sgn(m)}) = ${k}`,a**k-m,{t:'Уравнения',k:'Задание 6',e:`x${sgn(m)} = ${a}<sup>${k}</sup> = ${a**k}, x = ${a**k-m}.`})},
 logval:()=>{const a=P([2,3,5]),k=R(1,a===2?6:3),b=P([2,3]),j=R(1,b===2?5:3);
   return inp(`Найдите значение выражения: log<sub>${a}</sub> ${a**k} + log<sub>${b}</sub> ${b**j}`,k+j,{t:'Вычисления',k:'Задание 7',e:`log<sub>${a}</sub> ${a**k} = ${k}, log<sub>${b}</sub> ${b**j} = ${j}.`})},
 trig:()=>{const k=R(1,9)*2,m=R(1,9)*2,f=P([['sin 30°',.5],['cos 60°',.5]]),g=P([['tg 45°',1],['cos 0°',1],['sin 90°',1]]);
   return inp(`Найдите значение выражения: ${k}·${f[0]} + ${m}·${g[0]}`,k*f[1]+m*g[1],{t:'Вычисления',k:'Задание 7',e:`${f[0]} = ${nf(f[1])}, ${g[0]} = 1: ${k}·${nf(f[1])} + ${m} = ${nf(k*f[1]+m)}.`})},
 deriv:()=>{const a=R(1,4),b=R(-5,5),c=R(-9,9),x=R(-3,3);const v=3*a*x*x+2*b*x+c;
   return inp(`Найдите f′(${x}), если f(x) = ${term(a,'x³',true)}${term(b,'x²')}${term(c,'x')}`,v,{t:'Производная',e:`f′(x) = ${3*a}x² ${2*b<0?'−':'+'} ${Math.abs(2*b)}x ${c<0?'−':'+'} ${Math.abs(c)}; f′(${x}) = ${v}.`})},
 prob1:()=>{const n=P([10,20,25,40,50]),k=R(1,n-1);
   return inp(`В сборнике ${n} билетов, в ${k} из них встречается вопрос по теме «Логарифмы». Найдите вероятность того, что в случайно выбранном билете есть этот вопрос.`,k/n,{t:'Теория вероятностей',k:'Задание 4',e:`P = ${k}/${n} = ${nf(k/n)}.`})},
 prob2:()=>{const p1=R(80,98),p2=R(40,p1-5);
   return inp(`Вероятность того, что чайник прослужит больше года, равна ${nf(p1/100)}, а больше двух лет — ${nf(p2/100)}. Найдите вероятность того, что он прослужит больше года, но меньше двух лет.`,(p1-p2)/100,{t:'Теория вероятностей',k:'Задание 5',e:`${nf(p1/100)} − ${nf(p2/100)} = ${nf((p1-p2)/100)}.`})},
 prob3:()=>{const p=P([.5,.6,.8,.9]),q=P([.5,.7,.8,.9]);
   return inp(`Два стрелка независимо стреляют по мишени. Вероятность попадания первого ${nf(p)}, второго ${nf(q)}. Найдите вероятность того, что оба попадут.`,p*q,{t:'Теория вероятностей',k:'Задание 5',e:`Независимые события: ${nf(p)} · ${nf(q)} = ${nf(p*q)}.`})},
 pyth:()=>{const t=P([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10]]),m=R(1,3);
   return inp(`Катеты прямоугольного треугольника равны ${t[0]*m} и ${t[1]*m}. Найдите гипотенузу.`,t[2]*m,{t:'Планиметрия',k:'Задание 1',e:`c = √(${t[0]*m}² + ${t[1]*m}²) = ${t[2]*m}.`})},
 triarea:()=>{const a=R(2,20),b=R(2,20)*2;
   return inp(`Катеты прямоугольного треугольника равны ${a} и ${b}. Найдите его площадь.`,a*b/2,{t:'Планиметрия',k:'Задание 1',e:`S = ½·${a}·${b} = ${a*b/2}.`})},
 vec:()=>{const a=R(-6,6),b=R(-6,6),c=R(-6,6),d=R(-6,6);
   return inp(`Даны векторы a(${a}; ${b}) и b(${c}; ${d}). Найдите скалярное произведение a·b.`,a*c+b*d,{t:'Векторы',k:'Задание 2',e:`${a}·${c} + ${b}·${d} = ${a*c+b*d}.`})},
 box:()=>{const t=P([[1,2,2,3],[2,3,6,7],[1,4,8,9],[2,6,9,11],[4,4,7,9],[2,10,11,15]]);
   return inp(`Рёбра прямоугольного параллелепипеда равны ${t[0]}, ${t[1]} и ${t[2]}. Найдите его диагональ.`,t[3],{t:'Стереометрия',k:'Задание 3',e:`d = √(${t[0]}² + ${t[1]}² + ${t[2]}²) = √${t[3]*t[3]} = ${t[3]}.`})},
 meet:()=>{const v1=R(4,12)*5,v2=R(4,12)*5,t=R(1,5);const S=(v1+v2)*t;
   return inp(`Из двух городов, расстояние между которыми ${S} км, одновременно навстречу друг другу выехали два автомобиля со скоростями ${v1} и ${v2} км/ч. Через сколько часов они встретятся?`,t,{t:'Текстовые задачи',k:'Задание 10',e:`Скорость сближения ${v1+v2} км/ч, t = ${S} / ${v1+v2} = ${t}.`})},
 arith:()=>{const a1=R(-10,10),d=R(-5,6)||2,n=R(5,15);
   return inp(`В арифметической прогрессии a₁ = ${a1}, d = ${d}. Найдите a${String(n).split('').map(x=>'₀₁₂₃₄₅₆₇₈₉'[x]).join('')}.`,a1+(n-1)*d,{t:'Прогрессии',e:`aₙ = a₁ + (n − 1)d = ${a1} + ${n-1}·${d} = ${a1+(n-1)*d}.`})},
 frac:()=>{const ds=[2,4,5,8,10,20,25];const b=P(ds),d=P(ds),a=R(1,b*2),c=R(1,d*2);
   return inp(`Найдите значение выражения: ${a}/${b} + ${c}/${d}`,a/b+c/d,{t:'Вычисления',e:`${a}/${b} = ${nf(a/b)}, ${c}/${d} = ${nf(c/d)}, сумма ${nf(a/b+c/d)}.`})},
 pctof:()=>{const n=R(2,40)*50,p=P([2,4,5,10,12,15,20,25,30,40,60,75]);
   return inp(`Найдите ${p}% от числа ${n}.`,n*p/100,{t:'Проценты',e:`${n} · ${p} / 100 = ${nf(n*p/100)}.`})},
 packs:()=>{const n=P([5,6,8,10,12,20]),k=R(2,9),m=R(3,12);const need=Math.ceil(k*m/n);
   return inp(`Ученик тратит ${k} тетрадей в неделю. Тетради продаются пачками по ${n} штук. Какое наименьшее число пачек нужно купить на ${m} недель?`,need,{t:'Текстовые задачи',e:`Нужно ${k*m} тетрадей. ${k*m} / ${n} = ${nf(k*m/n)} → округляем вверх: ${need}.`})},
 change:()=>{const price=R(12,95),cnt=R(2,6),pay=Math.ceil(price*cnt/500)*500;
   return inp(`Ручка стоит ${price} руб. Какую сдачу получит покупатель с ${pay} руб. при покупке ${cnt} ручек?`,pay-price*cnt,{t:'Текстовые задачи',e:`${cnt} · ${price} = ${price*cnt}; ${pay} − ${price*cnt} = ${pay-price*cnt}.`})},
 rectarea:()=>{const a=R(2,30),b=R(2,30);
   return inp(`Участок прямоугольной формы имеет размеры ${a} м × ${b} м. Найдите его площадь в квадратных метрах.`,a*b,{t:'Геометрия',e:`${a} · ${b} = ${a*b}.`})},

 /* ----- Физика (g = 10 м/с²) ----- */
 kin:()=>{const t=R(2,20),v=R(2,30);return inp(`Тело движется равномерно со скоростью ${v} м/с. Какой путь (в метрах) оно пройдёт за ${t} с?`,v*t,{t:'Кинематика',e:`s = v·t = ${v}·${t} = ${v*t} м.`})},
 accel:()=>{const a=R(1,5),t=R(2,10),v0=R(0,10);return inp(`Скорость тела за ${t} с выросла с ${v0} до ${v0+a*t} м/с. Найдите ускорение (м/с²).`,a,{t:'Кинематика',e:`a = (v − v₀)/t = ${a*t}/${t} = ${a}.`})},
 newton:()=>{const m=R(2,50),a=R(1,8);return inp(`На тело массой ${m} кг действует сила, сообщающая ускорение ${a} м/с². Найдите силу (Н).`,m*a,{t:'Динамика',e:`F = ma = ${m}·${a} = ${m*a} Н.`})},
 ek:()=>{const m=R(1,10)*2,v=R(1,10);return inp(`Найдите кинетическую энергию (Дж) тела массой ${m} кг, движущегося со скоростью ${v} м/с.`,m*v*v/2,{t:'Энергия',e:`Eк = mv²/2 = ${m}·${v*v}/2 = ${m*v*v/2} Дж.`})},
 ep:()=>{const m=R(1,20),h=R(1,30);return inp(`Тело массой ${m} кг подняли на высоту ${h} м. Найдите его потенциальную энергию (Дж), g = 10 м/с².`,m*10*h,{t:'Энергия',e:`Eп = mgh = ${m}·10·${h} = ${m*10*h} Дж.`})},
 ohm:()=>{const R0=P([2,4,5,10,20,25,50]),I=R(1,10);return inp(`Сопротивление проводника ${R0} Ом, сила тока ${I} А. Найдите напряжение (В).`,R0*I,{t:'Электричество',e:`U = IR = ${I}·${R0} = ${I*R0} В.`})},
 power:()=>{const U=P([12,24,110,220]),I=R(1,10);return inp(`Напряжение ${U} В, сила тока ${I} А. Найдите мощность (Вт).`,U*I,{t:'Электричество',e:`P = UI = ${U}·${I} = ${U*I} Вт.`})},
 pres:()=>{const S=P([.1,.2,.5,2,4]),F=R(1,20)*100;return inp(`Сила ${F} Н действует на площадь ${nf(S)} м². Найдите давление (Па).`,F/S,{t:'Давление',e:`p = F/S = ${F}/${nf(S)} = ${nf(F/S)} Па.`})},
 dens:()=>{const V=P([2,4,5,10]),r=P([800,1000,2700,7800]);return inp(`Тело объёмом ${nf(V/1000)} м³ имеет массу ${nf(r*V/1000)} кг. Найдите плотность (кг/м³).`,r,{t:'Давление',e:`ρ = m/V = ${r} кг/м³.`})},
 heat:()=>{const m=R(1,5),dt=R(5,50);return inp(`Какое количество теплоты (кДж) нужно, чтобы нагреть ${m} кг воды на ${dt} °C? c = 4200 Дж/(кг·°C).`,4.2*m*dt,{t:'Теплота',e:`Q = cmΔt = 4200·${m}·${dt} = ${4200*m*dt} Дж = ${nf(4.2*m*dt)} кДж.`})},
 impulse:()=>{const m=R(1,10),v=R(2,20);return inp(`Найдите импульс (кг·м/с) тела массой ${m} кг, движущегося со скоростью ${v} м/с.`,m*v,{t:'Импульс',e:`p = mv = ${m*v} кг·м/с.`})},

 hartley:()=>{const i=R(1,8);return inp(`Алфавит содержит ${2**i} символов. Сколько бит нужно для кодирования одного символа?`,i,{t:'Информация',e:`N = 2ⁱ: ${2**i} = 2<sup>${i}</sup>, i = ${i}.`})},
 msg:()=>{const i=R(3,8),K=R(1,8)*128;return inp(`Сообщение из ${K} символов записано алфавитом мощностью ${2**i}. Каков его объём в байтах?`,K*i/8,{t:'Информация',e:`I = K·i = ${K}·${i} = ${K*i} бит = ${K*i/8} байт.`})},
 img:()=>{const w=P([64,128,256]),h=P([64,128,256]),i=P([1,2,4,8]);return inp(`Изображение ${w}×${h} пикселей, палитра из ${2**i} цветов. Каков объём файла в Кбайтах (без сжатия)?`,w*h*i/8/1024,{t:'Информация',e:`${w}·${h}·${i} бит = ${w*h*i/8} байт = ${nf(w*h*i/8/1024)} Кбайт.`})},
 logic:()=>{const A=R(0,1),B=R(0,1),C=R(0,1);const ex=P([['¬A ∨ B ∧ C',(!A)||(B&&C)],['(A ∨ B) ∧ ¬C',(A||B)&&!C],['A → B',(!A)||B],['¬(A ∧ B) ∨ C',!(A&&B)||C],['A ≡ ¬B',A===(1-B)]]);
   return {q:`Чему равно значение выражения ${ex[0]} при A = ${A}, B = ${B}, C = ${C}?`,o:['0','1'],a:ex[1]?1:0,t:'Логика',e:`Подставляем значения: результат ${ex[1]?1:0}. ¬ — НЕ, ∧ — И, ∨ — ИЛИ, → — импликация, ≡ — эквивалентность.`}},

 dna:()=>{const s=Array.from({length:9},()=>P('ATGC'.split(''))).join('');const c=s.split('').map(x=>({A:'T',T:'A',G:'C',C:'G'})[x]).join('');
   return inp(`Цепь ДНК: ${s}. Запишите комплементарную цепь ДНК (латинскими буквами, без пробелов).`,c,{t:'Молекулярная биология',e:`A — T, G — C: ${c}.`})},
 rna:()=>{const s=Array.from({length:9},()=>P('ATGC'.split(''))).join('');const c=s.split('').map(x=>({A:'U',T:'A',G:'C',C:'G'})[x]).join('');
   return inp(`Матричная цепь ДНК: ${s}. Запишите последовательность иРНК (латинскими буквами, без пробелов).`,c,{t:'Молекулярная биология',e:`При транскрипции A → U, T → A, G → C, C → G: ${c}.`})},
 cross:()=>{const c=P([['AA × aa',0],['Aa × Aa',25],['Aa × aa',50],['aa × aa',100],['AA × Aa',0]]);
   return inp(`Признак рецессивный (a). Скрещивание ${c[0]}. Какой процент потомков будет с рецессивным признаком?`,c[1],{t:'Генетика',e:`Составь решётку Пеннета: доля aa — ${c[1]}%.`})},

 /* ----- География ----- */
 natinc:()=>{const b=R(8,15),d=R(9,17);return inp(`Рождаемость в регионе ${b}‰, смертность ${d}‰. Найдите естественный прирост (‰). Если убыль, запишите с минусом.`,b-d,{t:'Население',e:`${b} − ${d} = ${b-d}‰.`})},
 natabs:()=>{const pop=R(5,40)*100000,b=R(8,14),d=R(9,16);const v=pop*(b-d)/1000;return inp(`Население региона ${pop.toLocaleString('ru-RU')} чел., рождаемость ${b}‰, смертность ${d}‰. Найдите естественный прирост за год (чел.). Убыль — с минусом.`,v,{t:'Население',e:`${pop} · (${b} − ${d}) / 1000 = ${v}.`})},
 density:()=>{const s=R(10,200)*1000,d=R(2,60);return inp(`Площадь региона ${s.toLocaleString('ru-RU')} км², население ${(s*d).toLocaleString('ru-RU')} чел. Найдите плотность населения (чел./км²).`,d,{t:'Население',e:`${s*d} / ${s} = ${d} чел./км².`})},
 scale:()=>{const N=P([10000,25000,50000,100000,200000]),cm=R(2,9);return inp(`Масштаб карты 1 : ${N.toLocaleString('ru-RU')}. Расстояние на карте ${cm} см. Каково расстояние на местности в метрах?`,N*cm/100,{t:'Карты',e:`В 1 см ${N/100} м; ${cm} · ${N/100} = ${N*cm/100} м.`})},

 /* ----- Русский язык ----- */
 stress:()=>{const w=P(STRESS);const lw=w.toLowerCase();const vs=[...lw].map((c,i)=>'аеёиоуыэюя'.includes(c)?i:-1).filter(i=>i>=0);
   const ci=[...w].findIndex(c=>'АЕЁИОУЫЭЮЯ'.includes(c));const show=i=>[...lw].map((c,j)=>j===i?c.toUpperCase():c).join('');
   const wrong=shuffle(vs.filter(i=>i!==ci)).slice(0,2);const opts=shuffle([ci,...wrong]);
   return {q:'Где правильно поставлено ударение?',o:opts.map(show),a:opts.indexOf(ci),t:'Ударения',k:'Задание 4',e:`Правильно: ${show(ci)}. Слово из орфоэпического словника ЕГЭ.`}},

 /* ----- История ----- */
 date2ev:()=>{const [y,ev]=P(HIST_DATES);const o=shuffle([ev,...shuffle(HIST_DATES.filter(d=>d[0]!==y)).slice(0,3).map(d=>d[1])]);return {q:`Какое событие произошло в <b>${y}</b> году?`,o,a:o.indexOf(ev),t:'Даты',e:`${y} — ${ev}.`}},
 ev2date:()=>{const [y,ev]=P(HIST_DATES);const near=HIST_DATES.filter(d=>d[0]!==y).sort((a,b)=>Math.abs(a[0]-y)-Math.abs(b[0]-y)).slice(0,6);const o=shuffle([y,...shuffle(near).slice(0,3).map(d=>d[0])]);return {q:`В каком году: <b>${ev}</b>?`,o,a:o.indexOf(y),t:'Даты',e:`${ev} — ${y} год.`}},
 person:()=>{const [p,ev]=P(HIST_PEOPLE);const o=shuffle([p,...shuffle(HIST_PEOPLE.filter(x=>x[0]!==p)).slice(0,3).map(x=>x[0])]);return {q:`С кем связано: <b>${ev}</b>?`,o,a:o.indexOf(p),t:'Личности',e:`${ev} — ${p}.`}},

 term:()=>{const [t,d]=P(SOC_TERMS);const o=shuffle([t,...shuffle(SOC_TERMS.filter(x=>x[0]!==t)).slice(0,3).map(x=>x[0])]);return {q:`Какому понятию соответствует определение: <i>${d}</i>?`,o,a:o.indexOf(t),t:'Понятия',e:`${t} — ${d}.`}},

 author:()=>{const b=P(BOOKS);const o=shuffle([b.a,...shuffle([...new Set(BOOKS.map(x=>x.a))].filter(a=>a!==b.a)).slice(0,3)]);return {q:`Кто автор произведения «${b.t}»?`,o,a:o.indexOf(b.a),t:'Произведения',e:`«${b.t}» — ${b.a}.`}},
 hero:()=>{const b=P(BOOKS.filter(x=>!['rya','chuk'].includes(x.id)));const h=b.heroes.split(',')[0].trim();const o=shuffle([b.t,...shuffle(BOOKS.filter(x=>x.id!==b.id)).slice(0,3).map(x=>x.t)]);return {q:`В каком произведении есть герой: <b>${h}</b>?`,o:o.map(x=>'«'+x+'»'),a:o.indexOf(b.t),t:'Произведения',e:`${h} — «${b.t}», ${b.a}.`}},
 lterm:()=>{const [t,d]=P(LIT_TERMS);const o=shuffle([t,...shuffle(LIT_TERMS.filter(x=>x[0]!==t)).slice(0,3).map(x=>x[0])]);return {q:`Как называется приём: <i>${d}</i>?`,o,a:o.indexOf(t),t:'Теория литературы',e:`${t} — ${d}.`}}
};

const AR={H:1,C:12,N:14,O:16,Na:23,Mg:24,Al:27,S:32,Cl:35.5,K:39,Ca:40,Fe:56,Cu:64,Zn:65,P:31,Ag:108,Ba:137};
const CHEM_F=['H2O','CO2','NaCl','H2SO4','CaCO3','NaOH','HCl','KOH','HNO3','MgO','Al2O3','Fe2O3','CuSO4','Ca(OH)2','NH3','CH4','SO2','KCl','ZnO','H3PO4','AgNO3','BaCl2','Na2SO4','MgCl2'];
const CHEM_CLASS=[['CO2','оксид'],['Na2O','оксид'],['SO3','оксид'],['Fe2O3','оксид'],['MgO','оксид'],['H2SO4','кислота'],['HCl','кислота'],['HNO3','кислота'],['H3PO4','кислота'],['NaOH','основание'],['KOH','основание'],['Ca(OH)2','основание'],['Mg(OH)2','основание'],['NaCl','соль'],['CaCO3','соль'],['K2SO4','соль'],['CuSO4','соль'],['AgNO3','соль']];
function parseF(f){const st=[{}];const re=/([A-Z][a-z]?|\(|\))(\d*)/g;let m;
  while((m=re.exec(f))){const n=+m[2]||1;if(m[1]==='(')st.push({});else if(m[1]===')'){const g=st.pop(),t=st[st.length-1];for(const k in g)t[k]=(t[k]||0)+g[k]*n}else{const t=st[st.length-1];t[m[1]]=(t[m[1]]||0)+n}}
  return st[0]}
const M=f=>{const c=parseF(f);let s=0;for(const k in c)s+=AR[k]*c[k];return Math.round(s*10)/10};
const cnt=(f,el)=>parseF(f)[el]||0;
const fml=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');
const arList=f=>Object.keys(parseF(f)).map(k=>`${k} = ${nf(AR[k])}`).join(', ');

 T('Запятые в ССП и при однородных','Задание 16',
  '• Сложносочинённое предложение: запятая перед и, а, но между частями. Не ставится, если есть общий второстепенный член или общее вводное слово.\n• Однородные члены с одиночным «и» — без запятой.\n• Повторяющиеся союзы (и… и, ни… ни) — запятая перед вторым и далее.\n• Двойные союзы (как… так и, не только… но и) — запятая перед второй частью.',[
  ['«Наступила весна и прилетели птицы». Нужна ли запятая перед «и»?',['нужна','не нужна'],'Две основы — сложносочинённое предложение.'],
  ['«Весной наступила оттепель и прилетели птицы». Нужна ли запятая перед «и»?',['не нужна','нужна'],'Общий второстепенный член «весной».'],
  ['«Мальчик читал и улыбался». Нужна ли запятая?',['не нужна','нужна'],'Однородные сказуемые с одиночным «и».'],
  ['«Мы купили и хлеба и молока и сыра». Сколько запятых нужно?',['2','1','3','0'],'Повторяющийся союз: и хлеба, и молока, и сыра.'],
  ['«Как в городе так и в деревне шёл дождь». Нужна ли запятая?',['нужна, перед «так и»','не нужна'],'Двойной союз «как… так и».'],
  ['«Он не только умён но и добр». Где нужна запятая?',['перед «но и»','перед «не только»','не нужна'],'Перед второй частью двойного союза.']]),
 T('Обособленные члены','Задание 17',
  '• Деепричастные обороты и одиночные деепричастия обособляются (кроме фразеологизмов: работать спустя рукава).\n• Причастный оборот — если стоит после определяемого слова.\n• Определение при личном местоимении обособляется всегда (Уставший, он лёг).\n• Распространённое приложение после определяемого слова обособляется.',[
  ['«Прочитав письмо он улыбнулся». Нужна ли запятая?',['нужна, после «письмо»','не нужна'],'Деепричастный оборот обособляется.'],
  ['«Дорога ведущая к лесу заросла травой». Сколько запятых?',['2','1','0'],'Причастный оборот после определяемого слова — с двух сторон.'],
  ['«Ведущая к лесу дорога заросла травой». Нужны ли запятые?',['не нужны','нужны'],'Оборот перед определяемым словом не обособляется.'],
  ['«Уставший он лёг спать». Нужна ли запятая?',['нужна, после «уставший»','не нужна'],'Определение при личном местоимении.'],
  ['«Мой брат студент университета приехал домой». Сколько запятых?',['2','1','0'],'Распространённое приложение: Мой брат, студент университета, приехал.'],
  ['«Он работал спустя рукава». Нужна ли запятая?',['не нужна','нужна'],'Фразеологизм не обособляется.']]),
 T('Вводные слова и обращения','Задание 18',

  ['«Мама я дома!» Нужна ли запятая?',['нужна, после «мама»','не нужна'],'Обращение выделяется.'],

  ['«По-моему он прав». Нужна ли запятая?',['нужна','не нужна'],'«По-моему» — вводное.']]),
 T('Сложноподчинённые предложения','Задания 19–20',

  ['«Я знал что он придёт». Нужна ли запятая?',['нужна, перед «что»','не нужна'],'Придаточное отделяется запятой.'],

 angles3:()=>{const a=R(20,80),b=R(20,150-a);return inp(`В треугольнике два угла равны ${a}° и ${b}°. Найдите третий угол (в градусах).`,180-a-b,{e:`Сумма углов треугольника 180°: 180 − ${a} − ${b} = ${180-a-b}.`})},
 inscribed:()=>{const d=R(10,85)*2;return inp(`Вписанный угол опирается на дугу ${d}°. Найдите этот угол (в градусах).`,d/2,{e:`Вписанный угол равен половине дуги: ${d}/2 = ${d/2}.`})},
 midline:()=>{const a=R(2,20),b=a+R(1,10)*2;return inp(`Основания трапеции равны ${a} и ${b}. Найдите её среднюю линию.`,(a+b)/2,{e:`(${a} + ${b})/2 = ${(a+b)/2}.`})},
 paral:()=>{const a=R(3,20),h=R(2,15);return inp(`Сторона параллелограмма равна ${a}, высота, проведённая к ней, — ${h}. Найдите площадь.`,a*h,{e:`S = a·h = ${a*h}.`})},

 veclen:()=>{const t=P([[3,4,5],[6,8,10],[5,12,13],[8,6,10],[9,12,15]]);const s=P([1,-1]);return inp(`Найдите длину вектора a(${t[0]*s}; ${t[1]}).`,t[2],{e:`|a| = √(${t[0]}² + ${t[1]}²) = ${t[2]}.`})},
 cubeV:()=>{const a=R(2,9);return inp(`Найдите объём куба с ребром ${a}.`,a**3,{e:`V = a³ = ${a**3}.`})},
 boxV:()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return inp(`Найдите объём прямоугольного параллелепипеда с рёбрами ${a}, ${b} и ${c}.`,a*b*c,{e:`V = ${a}·${b}·${c} = ${a*b*c}.`})},
 pyrV:()=>{const S=R(2,20),h=R(1,6)*3;return inp(`Площадь основания пирамиды ${S}, высота ${h}. Найдите объём.`,S*h/3,{e:`V = ⅓·S·h = ${S*h/3}.`})},
 coins:()=>{const n=P([2,3]);return inp(`Монету бросают ${n} раза. Найдите вероятность того, что орёл выпадет все ${n} раза.`,1/2**n,{e:`(½)<sup>${n}</sup> = ${nf(1/2**n)}.`})},
 dice:()=>{const s=R(2,12);let c=0;for(let i=1;i<=6;i++)for(let j=1;j<=6;j++)if(i+j===s)c++;const p=Math.round(c/36*100)/100;
   return inp(`Игральный кубик бросают дважды. Найдите вероятность того, что сумма очков равна ${s}. Ответ округлите до сотых.`,p,{e:`Благоприятных исходов ${c} из 36: ${c}/36 ≈ ${nf(p)}.`})},
 atleast:()=>{const p=P([.5,.6,.8,.9]),q=P([.5,.7,.8,.9]);return inp(`Два стрелка независимо стреляют по мишени. Вероятность попадания первого ${nf(p)}, второго ${nf(q)}. Найдите вероятность того, что в мишень попадёт хотя бы один.`,1-(1-p)*(1-q),{e:`1 − (1 − ${nf(p)})·(1 − ${nf(q)}) = ${nf(1-(1-p)*(1-q))}.`})},

 powers:()=>{const a=P([2,3,5,10]),m=R(2,6),n=R(2,6),k=R(2,m+n-1);const v=a**(m+n-k);return inp(`Найдите значение выражения: ${a}<sup>${m}</sup> · ${a}<sup>${n}</sup> : ${a}<sup>${k}</sup>`,v,{e:`${a}<sup>${m}+${n}−${k}</sup> = ${a}<sup>${m+n-k}</sup> = ${v}.`})},

 ball:()=>{const v=R(1,6)*10;return inp(`Мяч брошен вертикально вверх, его высота меняется по закону h(t) = ${v}t − 5t² (м). Через сколько секунд мяч упадёт на землю?`,v/5,{e:`${v}t − 5t² = 0 ⇒ t = ${v}/5 = ${v/5} с.`})},
 fahr:()=>{const c=R(-4,8)*5;return inp(`Температура по Фаренгейту: F = 1,8·C + 32. Сколько градусов по Фаренгейту соответствует ${c} °C?`,1.8*c+32,{e:`1,8·${c} + 32 = ${nf(1.8*c+32)}.`})},
 pipes:()=>{const t=P([[3,6,2],[4,12,3],[6,12,4],[10,15,6],[12,24,8],[20,30,12]]);return inp(`Одна труба наполняет бассейн за ${t[0]} ч, другая — за ${t[1]} ч. За сколько часов наполнят бассейн обе трубы вместе?`,t[2],{e:`1/${t[0]} + 1/${t[1]} = 1/${t[2]}.`})},
 slope:()=>{const k=R(-5,5)||2,b=R(-9,9),x1=R(-4,0),x2=R(1,5);return inp(`Прямая проходит через точки (${x1}; ${k*x1+b}) и (${x2}; ${k*x2+b}). Найдите её угловой коэффициент.`,k,{e:`k = (${k*x2+b} − ${k*x1+b}) / (${x2} − ${x1}) = ${k}.`})},
 vertex:()=>{const a=P([1,2,-1]),x0=R(-5,5),c=R(-9,9);const b=-2*a*x0;return inp(`Найдите абсциссу вершины параболы y = ${term(a,'x²',true)}${term(b,'x')}${c?sgn(c):''}.`,x0,{e:`x₀ = −b/(2a) = ${x0}.`})},
 extr:()=>{const c=R(-10,10),mx=Math.random()<.5;return mx?inp(`Найдите наибольшее значение функции y = x³ − 3x²${sgn(c)} на отрезке [−1; 1].`,c,{e:`y′ = 3x² − 6x = 0 ⇒ x = 0 или 2. На [−1; 1]: y(−1) = ${c-4}, y(0) = ${c}, y(1) = ${c-2}. Наибольшее ${c}.`})
   :inp(`Найдите наименьшее значение функции y = x³ − 3x²${sgn(c)} на отрезке [1; 4].`,c-4,{e:`y′ = 3x² − 6x = 0 ⇒ x = 2. y(1) = ${c-2}, y(2) = ${c-4}, y(4) = ${c+16}. Наименьшее ${c-4}.`})},
 ineq:()=>{const a=R(2,7),x0=R(-5,8),b=R(-10,10);const c=a*x0+b;return inp(`Найдите наименьшее целое решение неравенства ${a}x${sgn(b)} > ${c}.`,x0+1,{e:`${a}x > ${c-b} ⇒ x > ${x0}. Наименьшее целое — ${x0+1}.`})},
 deposit:()=>{const S=R(1,10)*100000,p=P([5,10,20]),n=2;const v=Math.round(S*(1+p/100)**n);return inp(`Вклад ${S.toLocaleString('ru-RU')} руб. положили на ${n} года под ${p}% годовых с ежегодной капитализацией. Сколько рублей будет на счёте через ${n} года?`,v,{e:`${S}·${nf(1+p/100)}² = ${v}.`})},
 credit1:()=>{const S=R(1,20)*100000,p=P([10,12,15,20]);return inp(`Кредит ${S.toLocaleString('ru-RU')} руб. взят на год под ${p}% годовых и возвращается одним платежом в конце года. Сколько рублей нужно вернуть?`,S*(1+p/100),{e:`${S}·${nf(1+p/100)} = ${nf(S*(1+p/100))}.`})},
 gcd:()=>{const g=R(2,12),a=g*R(2,9),b=g*R(2,9);const G=(x,y)=>y?G(y,x%y):x;return inp(`Найдите наибольший общий делитель чисел ${a} и ${b}.`,G(a,b),{e:`НОД(${a}, ${b}) = ${G(a,b)}.`})},
 digsum:()=>{const n=R(100,9999);const s=String(n).split('').reduce((x,y)=>x+ +y,0);return {q:`Делится ли число ${n} на 3?`,o:['да','нет'],a:n%3===0?0:1,e:`Сумма цифр ${s}${s%3===0?' делится':' не делится'} на 3.`}},
 units:()=>{const c=P([['м','см',100],['км','м',1000],['ч','мин',60],['кг','г',1000],['т','кг',1000],['л','мл',1000]]),v=R(2,40)/2;return inp(`Сколько ${c[1]} в ${nf(v)} ${c[0]}?`,v*c[2],{e:`1 ${c[0]} = ${c[2]} ${c[1]}: ${nf(v)}·${c[2]} = ${nf(v*c[2])}.`})}
});

/* ===================== УЧИТЕЛЬ ===================== */
/* Урок: правило маленькими порциями → задания → ошибки возвращаются в конец урока → интервальное повторение */
const SRS_DAYS=[1,2,4,7,14,30];
function chunksOf(th){th=String(th).trim();
  if(th.startsWith('<'))return th.split(/(?=<p|<ul|<ol|<div)/).map(x=>x.trim()).filter(Boolean).reduce((a,x)=>{if(a.length&&a[a.length-1].length+x.length<260)a[a.length-1]+=x;else a.push(x);return a},[]);
  const out=[];let ul=[],lead='';const flush=()=>{while(ul.length){out.push(thHTML((lead?lead+'\n':'')+ul.splice(0,3).map(x=>'• '+x).join('\n')));lead=''}};
  for(const line of th.split('\n')){if(line.startsWith('• '))ul.push(line.slice(2));else{flush();if(lead){out.push(thHTML(lead));lead=''}if(!line.trim())continue;if(/:\s*$/.test(line)||line.length<70)lead=line;else out.push(thHTML(line))}}flush();if(lead)out.push(thHTML(lead));return out}
const srsKey=(id,ti)=>id+'|'+ti;
function srsDue(){const t=today();return Object.entries(S.srs||{}).filter(([k,v])=>v.due<=t&&TOP[k.split('|')[0]]&&S.subjects.includes(k.split('|')[0])).sort((a,b)=>a[1].due<b[1].due?-1:1).map(([k])=>({id:k.split('|')[0],ti:+k.split('|')[1]}))}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function teachPlan(){
  S.teach=S.teach||{};
  if(S.teach.date!==today()||!Array.isArray(S.teach.plan)){
    const steps=[];srsDue().slice(0,2).forEach(x=>steps.push({type:'review',id:x.id,ti:x.ti}));
    const mist=S.mistakes.filter(q=>S.subjects.includes(q.subj)).length;if(mist>=3)steps.push({type:'mist',n:Math.min(mist,15)});
    const nt=nextTopic();if(nt)steps.push({type:'learn',id:nt.id,ti:nt.i});
    S.teach={date:today(),plan:steps,done:[]};save();
  }
  return S.teach;
}
const stepKey=s=>s.type+(s.id?':'+s.id+':'+s.ti:'');
function stepTitle(s){if(s.type==='mist')return ['Работа над ошибками',`${s.n} ${plural(s.n,'задача','задачи','задач')}, где ты ошибался`];const t=TOP[s.id][s.ti];
  const st=tpStat(s.id,s.ti);
  return s.type==='review'?[`Повторение: «${t.n}»`,`${SUB[s.id].short} · пора закрепить`]:st.n?[`Слабая тема: «${t.n}»`,`${SUB[s.id].short} · верно ${Math.round(st.c/st.n*100)}%, разберём правило заново`]:[`Новая тема: «${t.n}»`,`${SUB[s.id].short} · правило и задания`]}
function teacherCard(){
  const tp=teachPlan(),steps=tp.plan;if(!steps.length)return '';
  const left=steps.filter(s=>!tp.done.includes(stepKey(s)));
  const nm=S.name?S.name+', ':'';
  const say=!left.length?`${nm}план на сегодня выполнен! Можно потренироваться ещё или отдохнуть.`:tp.done.length?`Отлично идёшь! Осталось ${left.length} ${plural(left.length,'шаг','шага','шагов')}.`:`${nm}я составила план на сегодня: ${steps.length} ${plural(steps.length,'шаг','шага','шагов')}. Начнём?`;
  return `<section class="card teacher"><div class="tch-head">${owl(left.length?'happy':'happy',58)}<div class="bubble">${esc(say)}</div></div>
   <ol class="tsteps">${steps.map((s,k)=>{const dn=tp.done.includes(stepKey(s)),[a,b]=stepTitle(s);return `<li class="${dn?'done':''}" ${s.id?`style="--c:${sc(s.id)}"`:''}><span class="sn">${dn?ic('check'):k+1}</span><span class="st"><b>${a}</b><span class="caption">${b}</span></span></li>`}).join('')}</ol>
   <button class="btn wide" data-teach="1">${left.length?ic('play','fill')+(tp.done.length?'Следующий шаг':'Начать урок'):ic('redo')+'Новый урок'}</button></section>`;
}
function runTeach(){const tp=teachPlan();let s=tp.plan.find(x=>!tp.done.includes(stepKey(x)));
  if(!s){const nt=nextTopic();if(!nt){toast('Все темы пройдены — так держать!');return}s={type:'learn',id:nt.id,ti:nt.i};tp.plan.push(s);save()}
  if(s.type==='mist'){startSession('mist-all')}else if(s.type==='review'){startLesson(s.id,s.ti,true)}else startLesson(s.id,s.ti,false);
  if(Q)Q.teachKey=stepKey(s);
}
function startLesson(id,ti,review){
  const t=topicsOf(id)[ti];if(!t)return;
  Q={mode:'learn',subj:id,pool:[id],topic:ti,review,i:0,list:[],res:[],xp:0,r0:{[id]:rs(id).r},picked:null,checked:false,start:Date.now(),ach:[],combo:0,best:0,
     phase:review?'practice':'theory',chunks:chunksOf(t.th),ci:0};
  for(let j=0;j<(review?5:6);j++)Q.list.push(makeQ(id,ti));Q.list=Q.list.filter(Boolean);Q.n=Q.list.length;
  nav('quiz');
}
function viewLessonTheory(){
  const t=TOP[Q.subj][Q.topic],c=Q.chunks[Q.ci],n=Q.chunks.length;
  return `<div class="qtop"><button class="iconbtn" id="quitQ" aria-label="Выйти">${ic('close')}</button><div class="qtop-mid"><b>Урок · ${esc(t.n)}</b><span class="caption num">правило ${Q.ci+1} из ${n}</span></div></div>

  <section class="card qcard lesson-chunk" style="--c:${sc(Q.subj)}"><div class="eyebrow">${SUB[Q.subj].short}${t.k?' · '+t.k:''}</div><div class="prose">${c}</div></section>
  <div class="qnav">${Q.ci>0?`<button class="btn ghost" id="lessonPrev">${ic('left')}</button>`:''}<button class="btn wide" id="lessonNext">${Q.ci<n-1?'Понятно':'К заданиям'}${ic('arrow')}</button></div>`;
}
function hintFor(q){const t=TOP[q.subj]&&TOP[q.subj][q.ti];if(!t)return '';const ch=chunksOf(t.th);
  const words=String(q.q+' '+(q.e||'')).toLowerCase().replace(/<[^>]+>/g,' ').match(/[а-яёa-z]{4,}/g)||[];
  let best=ch[0],sc0=-1;for(const c of ch){const lc=c.toLowerCase();const s=words.filter(w=>lc.includes(w.slice(0,6))).length;if(s>sc0){sc0=s;best=c}}
  return `<details class="hint"><summary>${ic('book')}Вспомнить правило</summary><div class="prose">${best}</div></details>`}
function lessonDone(){
  const first=Q.list.map((q,i)=>({q,r:Q.res[i]})).filter(x=>!x.q.retry);const ok=first.filter(x=>x.r&&x.r.ok).length,tot=first.length||1;
  const acc=ok/tot,key=srsKey(Q.subj,Q.topic);S.srs=S.srs||{};const cur=S.srs[key]||{l:-1};
  const l=acc>=.8?Math.min(SRS_DAYS.length-1,cur.l+1):0;S.srs[key]={l,due:addDays(acc>=.8?SRS_DAYS[l]:1)};
  Q.lesson={acc:Math.round(acc*100),days:acc>=.8?SRS_DAYS[l]:1,mastered:acc>=.8};
}

  rules:['Нулевое окончание в Р. п. мн. ч.: (нет) ботинок, сапог, чулок, валенок, погон; грузин, армян, болгар, татар, бурят; солдат, партизан, гусар; ампер, вольт, ватт; яблок, полотенец, туфель, мест.','Окончание -ов: носков, помидоров, апельсинов, мандаринов, баклажанов, гектаров, килограммов, рельсов, джинсов; киргизов, монголов, якутов.','Числительные: полтора — полутора; пятьсот — пятисот, пятистам, пятьюстами; оба — обоих (м., ср. р.), обе — обеих (ж. р.).','Собирательные (двое, трое) — с существительными м. р., называющими людей (двое друзей), со словами дети, люди и словами только мн. ч. (трое суток). Нельзя «трое девушек».','Степени сравнения: красивее или более красивый; нельзя «более красивее», «самый красивейший».','Повелительное наклонение: ляг, лягте; поезжай; положи; выйди.','Глаголы: полощет, машет, сыплет; у «победить», «убедить» нет формы 1-го лица ед. ч.','Род: кофе, шампунь, тюль, рояль — м. р.; туфля, мозоль, бандероль — ж. р.; какао, кафе — ср. р.'],
  hacks:['Представь «пара …»: пара носков, пара чулок, пара сапог.','Национальности: нет армян, грузин, татар, но нет монголов, киргизов, якутов.','«Более» + «-ее» в одном слове — всегда ошибка.'],
  errs:['«Более лучше», «самый красивейший».','«Ихний», «ложи», «ехай».'],
  ex:['Где ошибка: «около пятиста рублей», «пара носков», «обеими руками»?','«Около пятиста» — правильно «около пятисот».'],
  test:[['Р. п. мн. ч. от «сапоги»:',['сапог','сапогов'],'Нулевое окончание.'],['Как правильно?',['около пятисот','около пятиста'],'Пятьсот — пятисот.'],['Как правильно?',['три девушки','трое девушек'],'Собирательные не сочетаются с существительными ж. р.'],['Род слова «тюль»:',['мужской','женский','средний'],'Новый тюль.'],['Как правильно?',['нет грузин','нет грузинов'],'Нулевое окончание.']]}),
 LS('Синтаксические нормы','Задание 8',{from:'Синтаксические нормы',
  intro:'Задание 8 — сопоставление предложений с типами грамматических ошибок. Разберём все типы.',
  rules:['Деепричастный оборот: действие деепричастия выполняет подлежащее. «Подъезжая к станции, у меня слетела шляпа» — ошибка.','Предлоги благодаря, согласно, вопреки, наперекор + дательный падеж (согласно приказу); по + предложный в значении «после» (по приезде, по окончании, по прибытии).','Однородные члены: части двойного союза — перед однородными («любил не только музыку, но и живопись»); нельзя соединять родовое и видовое понятие («фрукты и яблоки»); нельзя общее дополнение при глаголах с разным управлением («люблю и восхищаюсь музыкой»).','Причастный оборот: определяемое слово не может стоять внутри оборота; причастие согласуется с определяемым словом.','Несогласованное приложение: название в кавычках после родового слова не склоняется — «в романе «Отцы и дети»».','Подлежащее и сказуемое: «Все, кто пришёл»; «Ряд студентов не явился».','Сложноподчинённое: лишние союзы и частицы — «Он спросил, что не знаю ли я».','Косвенная речь: «Он сказал, что он придёт», а не «что я приду».','Придаточное с «который» — рядом с определяемым словом.','Видо-временная соотнесённость: «Он пришёл и сел», а не «пришёл и садится».'],
  hacks:['Начни с самых узнаваемых ошибок: деепричастие, предлоги «благодаря/согласно/по», кавычки с названием.','Спроси «кто, подъезжая к станции?» — если ответ не совпадает с подлежащим, это ошибка.'],
  errs:['«По окончанию школы» вместо «по окончании».','«В романе «Войне и мире»» при родовом слове.'],
  ex:['«Согласно расписания поезд опоздал». Ошибка?','Да: согласно + дательный падеж — «согласно расписанию».'],
  test:[['«По окончанию школы» — правильно?',['нет, «по окончании»','да'],'По + П. п. в значении «после».'],['Как правильно?',['в романе «Война и мир»','в романе «Войне и мире»'],'После родового слова название не склоняется.'],
   ['«Он пришёл и садится» — какая ошибка?',['видо-временная соотнесённость','неправильный предлог','деепричастный оборот'],'Прошедшее и настоящее время рядом.'],['«Читая книгу, мне стало грустно». Ошибка в…',['деепричастном обороте','предлоге','кавычках'],'Читает не «мне».'],
   ['«Не только он любил музыку, но и живопись». Ошибка в…',['расположении частей двойного союза','падеже','кавычках'],'Нужно: «Он любил не только музыку, но и живопись».']]}),
 LS('Корни','Задание 9',{from:'Корни',
  intro:'В корнях три случая: проверяемые гласные, непроверяемые (словарные) и чередующиеся. Главное — сначала узнать чередующийся корень.',
  rules:['-гар-/-гор-: без ударения — о (загорать); искл. выгарки, изгарь, пригарь.','-зар-/-зор-: без ударения — а (заря); искл. зоревать, зорянка.','-клан-/-клон-, -твар-/-твор-: без ударения — о; искл. утварь.','-плав-/-плов-: без ударения — а; искл. пловец, пловчиха, плывуны.','-лаг-/-лож-: перед г — а, перед ж — о; искл. полог.','-раст-/-ращ-/-рос-: перед ст, щ — а, иначе о; искл. росток, ростовщик, отрасль.','-скак-/-скоч-: перед к — а, перед ч — о; искл. скачок, скачу.','-бир-/-бер-, -дир-/-дер-, -мир-/-мер-, -пир-/-пер-, -тир-/-тер-, -жиг-/-жег-, -стил-/-стел-, -блист-/-блест-, -чит-/-чет-, -кас-/-кос-: если после корня суффикс -а-, пишется и (а): собирать, касаться.','-мак-/-моч-: погружать — а (макать), пропускать жидкость — о (промокнуть).','-равн-/-ровн-: одинаковый — а (уравнять), ровный — о (выровнять); искл. равнина, ровесник, поровну, уровень.'],
  hacks:['Сначала проверь, не чередующийся ли корень: «загорать» не проверяют «горит».','Проверочное слово должно совпадать по значению: посидеть (сидеть) — поседеть (седой).','Иностранные слова — только по словарю: интеллигенция, абитуриент.'],
  errs:['Проверяют чередующийся корень ударением.','Подбирают проверочное слово с другим значением.'],
  ex:['«Предп..лагать» — какая буква?','Корень -лаг-/-лож-: перед г — а. Предполагать.'],
  test:[['Правило для -лаг-/-лож-:',['перед г — а, перед ж — о','зависит от ударения','зависит от суффикса -а-'],'Предлагать — предложить.'],['Как пишется?',['запирать','заперать'],'Суффикс -а- после корня → и.'],
   ['Исключение из правила -раст-/-рос-:',['росток','растение','выращенный'],'Росток, ростовщик, отрасль.'],['«Пол..жить» — какая буква?',['о','а'],'Перед ж — о.'],['«Пос..деть от горя» — проверочное слово:',['седой','сидеть'],'Значение — стать седым.']]}),
 LS('Приставки','Задание 10',{from:'Приставки',
  intro:'Приставки — одно из самых «правильных» заданий: здесь почти всё решают правила.',
  rules:['Неизменяемые приставки: в-, вы-, до-, за-, на-, над-, о-, об-, от-, пере-, по-, под-, пред-, про-, с- (сделать, сжечь).','З/С: перед звонкой согласной и гласной — без-, воз-, из-, раз-, низ-, вз-, через-; перед глухой — бес-, вос-, ис-, рас-, нис-, вс-, черес-.','ПРЕ- = «очень» (премилый) или «пере-» (преодолеть). ПРИ- = близость (приморский), присоединение (пришить), неполнота (приоткрыть), доведение до конца (придумать).','Ы после приставок на согласный (безыдейный, предыстория); И после меж-, сверх-, иноязычных (сверхинтересный, постимпрессионизм).','Ъ после приставки на согласный перед е, ё, ю, я (подъезд, объём, адъютант).','Раз-/роз-: под ударением роз- (розыск), без ударения раз- (разыскать).'],
  hacks:['Сомневаешься в пре-/при-? Попробуй заменить на «очень» или «пере-» — подходит, значит пре-.','Слова-различители: пребывать (находиться) — прибывать (приезжать), преступить (нарушить) — приступить (начать), предать (изменить) — придать (добавить).'],
  errs:['«Зделать» — приставка с- не меняется.','Путают пребывать и прибывать.'],
  ex:['«Пр..ступить закон» — какая буква?','Преступить = нарушить, «пере-» → пре-: преступить.'],
  test:[['Приставка в значении «близость»:',['при-','пре-'],'Пригородный, приморский.'],['Меняется ли приставка «с-» перед звонкой?',['нет: сделать','да: зделать'],'С- не изменяется.'],['Когда после приставки пишется Ъ?',['перед е, ё, ю, я после приставки на согласный','перед любой гласной','после приставки на гласный'],'Подъезд, объём.'],
   ['«Р..зыск» (ударение на первый слог):',['о','а'],'Под ударением — роз-.'],['После какой приставки сохраняется И?',['меж-','пред-','без-'],'После меж- и сверх- — и.']]}),
 LS('Суффиксы','Задание 11',{from:'Суффиксы',
  intro:'Суффиксы различных частей речи. Почти для каждого есть простой способ проверки.',
  rules:['-ик/-ек: гласная при склонении сохраняется — -ик (ключик — ключика), выпадает — -ек (замочек — замочка).','-чик после д, т, з, с, ж (переводчик, разносчик); иначе -щик (каменщик).','-ец (м. р.) / -иц- (ж. р.): красавец, красавица.','-ив- под ударением, -ев- без ударения: красИвый, боевОй; -чив-, -лив- — всегда и (обидчивый, заботливый).','-ова-/-ева-, если в 1-м лице -ую/-юю (рисую); -ыва-/-ива-, если -ываю/-иваю (размахиваю).','-еньк-: хорошенький, маленький; -оньк- после г, к, х: лёгонький.','Глаголы: обессилеть (стать бессильным) — обессилить (сделать бессильным кого-то).'],
  hacks:['Для -ова-/-ыва- поставь глагол в 1-е лицо: «я заведую» → заведовать.','Для -ик/-ек просклоняй слово: если гласная «убегает» — пиши -ек.'],
  errs:['«Заведывать» вместо «заведовать».','«Камещик» вместо «каменщик».'],
  ex:['«Проповед..вать» — какая буква?','Я проповедую → -ова-: проповедовать.'],
  test:[['Как проверить -ик/-ек?',['просклонять слово','поставить ударение','подобрать антоним'],'Ключик — ключика, замочек — замочка.'],['Суффикс в «обидчивый»:',['-чив- с и','-чев- с е'],'-чив-, -лив- — всегда и.'],
   ['Как пишется (я заведую)?',['заведовать','заведывать'],'-ую в 1-м лице → -ова-.'],['После какой согласной пишут -чик?',['после д, т, з, с, ж','после любой','после н'],'Переводчик, разносчик.']]}),
 LS('Окончания глаголов и суффиксы причастий','Задание 12',{from:'Окончания глаголов и суффиксы причастий',
  intro:'Всё решает спряжение глагола. Научимся определять его за секунды.',
  rules:['II спряжение: глаголы на -ить (кроме брить, стелить, зиждиться) + 7 на -еть (смотреть, видеть, ненавидеть, терпеть, обидеть, зависеть, вертеть) + 4 на -ать (гнать, держать, дышать, слышать). Остальные — I спряжение.','Окончания: I — -ешь, -ет, -ем, -ете, -ут/-ют; II — -ишь, -ит, -им, -ите, -ат/-ят.','Приставочные глаголы спрягаются как бесприставочные: выгонишь (гнать).','Причастия настоящего времени: от I спр. — -ущ-/-ющ-, -ем-; от II спр. — -ащ-/-ящ-, -им-.','Причастия на -вш- сохраняют гласную инфинитива: клеивший (клеить), увидевший (увидеть).','Страдательные прошедшего времени: от глаголов на -ать/-ять — -анн-/-янн- (посеянный), от остальных — -енн- (наклеенный).'],
  hacks:['Окончание ударное? Спряжение видно сразу: лежИт (II), несЁт (I).','Выпишите! (просьба) — повелительное наклонение с -ите; выпишете — будущее время.','Стишок-исключения: «Гнать, держать, дышать, обидеть, слышать, видеть, ненавидеть, и зависеть, и вертеть, и смотреть, и терпеть».'],
  errs:['Ставят окончание по произношению: «борятся» вместо «борются».','Забывают про брить и стелить (I спряжение).'],
  ex:['«Они кле..т обои» — какая буква?','Клеить — на -ить, II спряжение: клеят.'],
  test:[['Какой глагол — исключение II спряжения?',['гнать','брить','стелить','писать'],'Гнать, держать, дышать, слышать.'],['Спряжение глагола «брить»:',['I','II'],'Брить, стелить — исключения I спряжения.'],
   ['Суффикс причастия от «колыхать»:',['-ущ- (колышущийся)','-ащ- (колышащийся)'],'Колыхать — I спряжение.'],['Как пишется страдательное причастие от «посеять»?',['посеянный','посеенный'],'На -ять — -янн-.'],['Окончание 3-го л. мн. ч. глаголов II спряжения:',['-ат/-ят','-ут/-ют'],'Слышат, видят.']]}),
 LS('НЕ с разными частями речи','Задание 13',{from:'НЕ с разными частями речи',
  intro:'Правило НЕ складывается из нескольких проверок по порядку. Пройдём их.',
  rules:['Всегда слитно: если слово без НЕ не употребляется (ненавидеть, негодовать, невежа, нелепый).','С глаголами и деепричастиями — раздельно (не знал, не зная); слитно — с приставкой недо- (недоедать = есть меньше нормы).','С существительными, прилагательными, наречиями на -о — слитно, если можно заменить синонимом без НЕ (недалёкий = близкий); раздельно при противопоставлении с «а» (не высокий, а низкий).','Раздельно со словами «далеко не», «вовсе не», «ничуть не», «нисколько не».','С полными причастиями — слитно без зависимых слов (непрочитанная книга), раздельно с зависимыми или противопоставлением (не прочитанная мной книга).','С краткими причастиями — всегда раздельно (не закончена).','С местоимениями отрицательными без предлога — слитно (некого), с предлогом — раздельно (не у кого).'],
  hacks:['Проверяй по порядку: без НЕ не употребляется? → часть речи? → противопоставление «а»? → зависимые слова?','Противопоставление с «но» не мешает слитному написанию: «недорогой, но качественный».'],
  errs:['Пишут раздельно «не навидеть».','Слитно «непрочитанная мной книга».'],
  ex:['«(Не)законченная работа лежала на столе». Как?','Полное причастие без зависимых слов — слитно: незаконченная.'],
  test:[['НЕ с глаголами пишется…',['раздельно, кроме слов без НЕ','всегда слитно','всегда раздельно'],'Не знал, но ненавидеть.'],['«Не высокий, а низкий» — почему раздельно?',['есть противопоставление с «а»','это глагол','есть приставка'],'Противопоставление.'],
   ['НЕ с краткими причастиями:',['всегда раздельно','всегда слитно','как с прилагательными'],'Работа не закончена.'],['«Далеко (не)простой» —',['раздельно','слитно'],'«Далеко не» — раздельно.'],['«(Не)у кого спросить» —',['раздельно','слитно'],'Отрицательное местоимение с предлогом — раздельно.']]}),
 LS('Слитно, раздельно, через дефис','Задание 14',{from:'Слитно, раздельно, через дефис',
  intro:'В задании 14 встречаются предлоги, союзы, наречия, частицы и сложные слова. У каждой группы свои признаки.',
  rules:['Предлоги: в течение, в продолжение, в заключение, в отличие (раздельно); вследствие, ввиду, навстречу, наподобие, насчёт (слитно, когда это предлоги).','Союзы: чтобы, тоже, также, зато, притом, причём — слитно (если заменяются на «для того чтобы», «и», «но»); что бы, то же, так же, за то — раздельно.','Наречия: вдали, наверху, понемногу, вдвоём — слитно; по-русски, по-моему, во-первых, кое-как — через дефис; с ходу, на бегу, в обнимку — раздельно.','Пол-: через дефис перед гласной, л и заглавной (пол-лимона, пол-яблока, пол-Москвы), иначе слитно (полчаса); полу- всегда слитно.','Частицы -то, -либо, -нибудь, -ка, кое- — через дефис; бы, ли, же — раздельно.','Сложные прилагательные: через дефис — равноправные части и оттенки цвета (русско-английский, светло-зелёный); слитно — подчинение (железнодорожный).'],
  hacks:['Тоже/также: попробуй заменить на «и». Получилось — слитно.','Если между частями можно вставить слово («за то время»), пишется раздельно.'],
  errs:['«Вследствии» — у предлога на конце -е: вследствие.','«Пол-часа» вместо «полчаса».'],
  ex:['«Я (так)же, как и ты, люблю читать». Как?','Есть «как» — сравнение: так же (раздельно).'],
  test:[['«(В)течение дня» —',['раздельно, на конце -е','слитно','через дефис'],'Предлог «в течение».'],['Когда «тоже» пишется слитно?',['если можно заменить на «и»','всегда','если рядом «самое»'],'Я тоже = и я.'],

 LS('Н и НН','Задание 15',{from:'Н и НН',
  intro:'Н и НН пишутся в прилагательных, причастиях и наречиях. Для каждого случая есть чёткий алгоритм.',
  rules:['Прилагательные от существительных: НН — суффиксы -онн-, -енн- (революционный, клюквенный) и корень на н + суффикс н (туманный, длинный). Н — суффиксы -ан-, -ян-, -ин- (кожаный, серебряный, свиной).','Исключения: стеклянный, оловянный, деревянный (НН); ветреный (Н); юный, багряный, румяный, пряный, зелёный, свиной — Н.','Причастия и отглагольные прилагательные: НН, если есть приставка (кроме не-), зависимое слово, суффикс -ова-/-ева-, или глагол совершенного вида (решённый, купленный).','Н — у отглагольных прилагательных без этих признаков (жареный, варёный, крашеный). Исключения с НН: невиданный, неслыханный, нечаянный, желанный, жеманный, священный, чванный, медленный, деланный.','Краткие причастия — всегда Н (книга прочитана); краткие прилагательные — как полные (длинный — длинна).','Наречия на -о пишутся как слово, от которого образованы (туманно, взволнованно).'],

 LS('Запятые в ССП и при однородных','Задание 16',{from:'Запятые в ССП и при однородных',
  intro:'Задание 16: выбрать предложения, где нужна одна запятая. Разберём, когда она ставится.',
  rules:['Сложносочинённое предложение: запятая между частями перед и, а, но, да (= но), или, либо.','В ССП запятая не ставится, если у частей есть общий второстепенный член, общее вводное слово или общее придаточное; если части — безличные или вопросительные/восклицательные/побудительные предложения с одиночным «и».','Однородные члены с одиночным «и», «или» — без запятой.','Однородные с повторяющимися союзами (и… и, ни… ни, или… или) — запятая перед вторым и следующими.','Двойные союзы (как… так и, не только… но и, если не… то) — запятая перед второй частью.','Перед «а», «но» между однородными — всегда запятая.','Фразеологизмы с повторяющимися союзами без запятых: ни свет ни заря, и смех и грех, ни рыба ни мясо.'],
  hacks:['Найди все грамматические основы: две основы с «и» → проверь, нет ли общего второстепенного члена.','Считай союзы «и»: если их два и больше при однородных — нужны запятые.'],
  errs:['Ставят запятую перед одиночным «и» между однородными сказуемыми.','Не замечают общий второстепенный член в ССП.'],
  ex:['«Ночью подморозило и выпал снег». Нужна запятая?','Нет: «ночью» относится к обеим частям — общий второстепенный член.'],
  test:[['Когда в ССП с «и» запятая НЕ ставится?',['есть общий второстепенный член','всегда ставится','если части короткие'],'Общий член объединяет части.'],['«Ни свет ни заря» — запятая нужна?',['нет, это фразеологизм','да'],'Устойчивое сочетание.'],
   ['Перед «но» между однородными…',['всегда запятая','никогда','только в конце'],'Противительный союз.'],['«Он не только умный но и добрый» — сколько запятых?',['1','0','2'],'Перед второй частью двойного союза.'],['Сколько грамматических основ в ССП?',['две и больше','одна','ни одной'],'ССП — сложное предложение.']]}),
 LS('Обособленные члены','Задание 17',{from:'Обособленные члены',

  rules:['Группы вводных слов: уверенность (конечно, безусловно), неуверенность (наверное, кажется, вероятно), чувства (к счастью, к сожалению), источник (по-моему, по мнению…), порядок мыслей (во-первых, итак, следовательно, таким образом), способ выражения (словом, иначе говоря), призыв (видите ли, представьте).','Никогда не бывают вводными: вдруг, якобы, будто, вряд ли, даже, именно, авось, как будто, приблизительно, почти, буквально, всё-таки, исключительно.','Однако: в значении «но» в начале части — союз (без запятой после него); в середине — вводное.','Обращение выделяется запятыми; «о» перед обращением не отделяется.','Проверка: вводное слово можно удалить или переставить без потери смысла.'],

 LS('Средства выразительности','',{from:'Средства выразительности',
  intro:'Средства выразительности нужны и в анализе текста, и в сочинении. Разберём тропы и фигуры речи.',
  defs:['Эпитет — художественное определение (золотая осень).','Метафора — скрытое сравнение (горит восток зарёю новой).','Сравнение — с союзами как, словно, будто или творительным падежом.','Олицетворение — неживое ведёт себя как живое (спит земля).','Гипербола — преувеличение; литота — преуменьшение.','Метонимия — перенос по смежности (читал Пушкина); синекдоха — часть вместо целого (ни одного паруса).','Перифраз — описательный оборот (царь зверей); ирония — насмешка через противоположный смысл.','Фигуры: антитеза, оксюморон, анафора, эпифора, градация, инверсия, парцелляция, риторический вопрос, восклицание, обращение, ряды однородных членов, лексический повтор.'],

const cd=s=>`<code>${s.replace(/\n/g,'<br>').replace(/  /g,'&nbsp;&nbsp;')}</code>`;
/* Теория игр: классификация позиций одной кучи, ходы +1 и ×2, игра до W */
function gameClass(W,moves){const cls={};const mv=s=>moves.map(f=>f(s));
  for(let s=W-1;s>=1;s--){const nx=mv(s);if(nx.some(x=>x>=W)){cls[s]='W1';continue}
    const c=nx.map(x=>cls[x]);if(c.every(x=>x==='W1'))cls[s]='L1';else if(c.some(x=>x==='L1'))cls[s]='W2';else if(c.every(x=>x==='W1'||x==='W2')&&c.some(x=>x==='W2'))cls[s]='L2';else cls[s]='?'}
  return cls}

function makeQ(id,ti){
  const tops=topicsOf(id);if(!tops.length)return null;
  if(ti==null){const w=tops.map(t=>t.qs.length+t.g.length*4);let r=Math.random()*w.reduce((a,b)=>a+b,0);ti=0;while(ti<tops.length-1&&(r-=w[ti])>0)ti++}
  const t=tops[ti];const nq=t.qs.length,ng=t.g.length;
  let q;
  if(ng&&(!nq||Math.random()<ng*3/(ng*3+nq)))q=runGen(P(t.g));else q={...P(t.qs)};
  q=Object.assign({},q,{subj:id,ti,t:t.n,k:t.k||q.k||''});
  if(q.o&&!q.shuffled&&!q.keep&&q.o.length>2&&!/^(0|1)$/.test(q.o[0])){const idx=shuffle(q.o.map((_,i)=>i));q.o=idx.map(i=>q.o[i]);q.a=idx.indexOf(q.a);q.shuffled=1}
  else if(q.o&&q.o.length===2&&!q.shuffled&&Math.random()<.5&&!/^(да|нет|0|1)$/.test(q.o[0])){q.o=[q.o[1],q.o[0]];q.a=1-q.a;q.shuffled=1}

}
