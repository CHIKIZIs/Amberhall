function streak(){let d=new Date(),n=0;if(!S.days[iso(d)])d.setDate(d.getDate()-1);while(S.days[iso(d)]){n++;d.setDate(d.getDate()-1)}return n}
const todayCount=()=>S.days[today()]||0;
function daysToExam(){return Math.max(0,Math.round((dayStart(new Date(S.examDate+'T00:00:00'))-dayStart(new Date()))/864e5))}

const ACH=[
 ['first','Первый шаг','Реши первую задачу',s=>s.stat.answered>=1],
 ['c100','Сотня','100 верных ответов',s=>s.stat.correct>=100],
 ['c500','Пятьсот','500 верных ответов',s=>s.stat.correct>=500],
 ['goal','План выполнен','Дневная цель за день',s=>Object.values(s.days).some(v=>v>=s.goal)],
 ['streak3','Три дня подряд','Занимайся 3 дня без пропусков',s=>streak()>=3],
 ['streak7','Неделя','7 дней подряд',s=>streak()>=7],
 ['mock','Пробник','Пройди пробный вариант',s=>s.stat.mocks>=1],
 ['mock80','На высокий балл','Пробный вариант от 80%',s=>s.stat.mock80],
 ['blitz15','Молния','15 верных в блице',s=>s.stat.blitzBest>=15],
 ['multi3','Многостаночник','Занимайся по 3 предметам',s=>Object.values(s.r).filter(x=>x.n>0).length>=3],
 ['gold','Золотая лига','Лига «Золото» по предмету',s=>Object.values(s.r).some(x=>x.r>=600)],
 ['diamond','Алмаз','Лига «Алмаз» по предмету',s=>Object.values(s.r).some(x=>x.r>=2000)],
 ['lvl5','Уровень 5','Набери 5-й уровень',s=>levelOf(s.xp)>=5],
 ['lvl10','Уровень 10','Набери 10-й уровень',s=>levelOf(s.xp)>=10],
 ['friend','Не один','Добавь друга в рейтинг',s=>s.friends.length>=1]
];
function checkAch(){const got=[];for(const [id,n,,f] of ACH){if(!S.ach[id]&&f(S)){S.ach[id]=today();S.xp+=50;got.push(n)}}return got}

/* ===================== ДРУЗЬЯ: КОД ДЛЯ ОБМЕНА ===================== */
function hashStr(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return (h%1679616).toString(36)}
function myCard(){const s={};for(const id of S.subjects){const x=rs(id);if(x.n)s[id]=Math.round(x.r)}return {u:S.uid,n:(S.name||'Ученик').slice(0,24),x:S.xp,s,st:streak(),d:today()}}
function myCode(){const j=JSON.stringify(myCard());const b=btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return 'ZCH1.'+b+'.'+hashStr(b)}
function parseCode(t){const m=String(t).match(/ZCH1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)/);if(!m||hashStr(m[1])!==m[2])return null;
  try{const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(!j.u||typeof j.x!=='number')return null;return {u:String(j.u).slice(0,12),n:String(j.n||'Друг').slice(0,24),x:Math.max(0,Math.min(1e7,j.x|0)),s:j.s&&typeof j.s==='object'?j.s:{},st:j.st|0,d:String(j.d||'')}}catch(e){return null}}
function addFriend(t){const f=parseCode(t);if(!f){toast('Код не распознан. Скопируй его целиком');return false}
  if(f.u===S.uid){toast('Это твой собственный код');return false}
  const i=S.friends.findIndex(x=>x.u===f.u);if(i>=0)S.friends[i]=f;else S.friends.push(f);
  checkAch();save();toast(i>=0?`Результат ${f.n} обновлён`:`${f.n} добавлен(а) в рейтинг`);return true}
function shareText(){return `Я готовлюсь к ЕГЭ в «Зачёте»: уровень ${levelOf(S.xp)}, ${S.xp} XP. Добавь меня в рейтинг — скопируй код и вставь во вкладке «Рейтинг»:\n${myCode()}`}

function subjCard(s){const x=rs(s.id),rd=readiness(s.id);

/* Что делать дальше: слабая тема (меньше 70% верных) или следующая новая */
function nextTopic(){const mine=S.subjects.filter(id=>TOP[id]);let weak=null;
  for(const id of mine)topicsOf(id).forEach((t,i)=>{const st=tpStat(id,i);if(st.n>=3){const a=st.c/st.n;if(a<.7&&(!weak||a<weak.a))weak={id,i,a,why:`повтори: верно ${Math.round(a*100)}%`}}});
  if(weak)return weak;
  const order=mine.slice().sort((a,b)=>tdone(a)/topicsOf(a).length-tdone(b)/topicsOf(b).length);
  for(const id of order){const i=topicsOf(id).findIndex((t,j)=>tpStat(id,j).n===0);if(i>=0)return {id,i,why:'новая тема'}}return null}
function continueCard(){const n=nextTopic();if(!n)return '';const t=TOP[n.id][n.i];
  return `<section class="card cont" style="--c:${sc(n.id)}">${subjArt(n.id,46)}<div class="ct"><div class="eyebrow">Продолжить · ${SUB[n.id].short}</div><b>${t.n}</b><span class="caption">${t.k?t.k+' · ':''}${n.why}</span></div><button class="play" data-start="train-${n.id}" data-topic-i="${n.i}" aria-label="Начать тренировку по теме ${esc(t.n)}">${ic('play','fill')}</button></section>`}

function searchTopics(q){q=q.trim().toLowerCase();if(q.length<2)return '';const ids=[...S.subjects,...SUBJ.map(s=>s.id).filter(id=>!S.subjects.includes(id))];const res=[];
  const wre=new RegExp('(^|[^а-яёa-z0-9])'+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i');
  for(const id of ids)topicsOf(id).forEach((t,i)=>{const ok=q.length<4?wre.test(t.n+' '+t.k):(t.n+' '+t.k+' '+t.th).toLowerCase().includes(q);if(ok)res.push({id,i,t,score:wre.test(t.n)?0:1})});
  res.sort((a,b)=>a.score-b.score);
  return res.length?`<section class="card tight"><div class="tlist">${res.slice(0,12).map(r=>`<button class="trow" data-nav="t-${r.id}-${r.i}" style="--c:${sc(r.id)}">${subjArt(r.id,30)}<span class="tb"><b>${r.t.n}</b><span class="caption">${SUB[r.id].short}${r.t.k?' · '+r.t.k:''}</span></span>${ic('right')}</button>`).join('')}</div></section>`:`<p class="caption" style="padding:0 2px">Ничего не нашлось. Попробуй другое слово.</p>`}

let Q=null;   // текущая сессия
const MODE_NAME={theory:'Теория',check:'Проверка',practice:'Практика',learn:'Урок',train:'Тренировка',test:'Тест',mock:'Пробный вариант',blitz:'Блиц',mist:'Работа над ошибками',cards:'Карточки',daily:'Задание дня'};
function startSession(code,topic){
  const [mode,arg]=code.split('-');const all=arg==='all';const subj=all?null:arg;
  const pool=subj?[subj]:S.subjects.filter(id=>SUB[id]);
  if(mode!=='mist'&&!pool.length){toast('Сначала выбери предметы');return}
  const n=topic!=null&&mode==='test'?10:({train:10,test:15,mock:25,daily:10,blitz:999,mist:15}[mode]||10);
  Q={mode,subj,pool,topic:topic||null,i:0,list:[],res:[],xp:0,r0:{},picked:null,checked:false,start:Date.now(),ach:[],combo:0,best:0};

function doShare(text){

  const copy=()=>{try{navigator.clipboard.writeText(text).then(()=>toast('Код скопирован — отправь его другу'),()=>showCode(text))}catch(e){showCode(text)}};
  try{if(navigator.share){navigator.share({text}).catch(e=>{if(!e||e.name!=='AbortError')copy()});return}}catch(e){}

/* ===================== ПРОГРЕСС КУРСА ===================== */
const cst=(id,ti)=>{S.course=S.course||{};return S.course[id+'|'+ti]||(S.course[id+'|'+ti]={th:false,ck:0,pr:0,done:false})};
const cpeek=(id,ti)=>(S.course&&S.course[id+'|'+ti])||{th:false,ck:0,pr:0,done:false};
const unlocked=(id,ti)=>S.free||ti===0||cpeek(id,ti-1).done;
const curTopic=id=>{const n=topicsOf(id).length;for(let i=0;i<n;i++)if(!cpeek(id,i).done)return i;return n-1};
const stageOf=(id,ti)=>{const c=cpeek(id,ti);return !c.th?'theory':c.ck<80?'check':!c.done?'practice':'done'};
const STAGE_NAME={theory:'Теория',check:'Проверка',practice:'Практика',done:'Пройдено'};
const doneCount=id=>topicsOf(id).filter((t,i)=>cpeek(id,i).done).length;
/* Проверочные вопросы урока: приводим к единому виду; если у темы нет практики, тренируемся на них */
for(const id in TOP)TOP[id].forEach((t,ti)=>{t.tq=(t.L&&t.L.test||[]).map((x,i)=>({q:x[0],o:x[1].slice(),a:0,e:x[2]||'',id:`${id}:${ti}:t${i}`,subj:id,ti,t:t.n,k:t.k}));
  if(!t.qs.length&&!t.g.length)t.qs=t.tq.map(q=>({...q}))});

function theoryCards(id,ti){const t=topicsOf(id)[ti],L=t.L,say=TEACH[id].say,cards=[];
  cards.push({who:say.intro,html:`<p class="lead">${L.intro}</p>`,mood:'happy'});
  const pack=(arr,title,key,n,mood)=>{for(let i=0;i<arr.length;i+=n)cards.push({who:say[key]+(arr.length>n?` (${Math.floor(i/n)+1}/${Math.ceil(arr.length/n)})`:''),title,html:'<ul class="tlist2">'+arr.slice(i,i+n).map(x=>`<li>${x}</li>`).join('')+'</ul>',mood})};
  pack(L.defs,'Понятия и определения','defs',4,'think');pack(L.rules,'Формулы и правила','rules',3,'think');pack(L.hacks,'Лайфхаки','hacks',3,'happy');pack(L.errs,'Типичные ошибки','errs',3,'sad');
  if(L.ex)cards.push({who:(VOICE[id]&&VOICE[id].tryEx)||say.ex,title:'Разбор примера',html:`<p class="ex-task">${L.ex[0]}</p>`,sol:L.ex[1],mood:'think'});
  const sum=[...L.rules.slice(0,2),...L.hacks.slice(0,1),...L.errs.slice(0,1).map(e=>'Не попадись: '+e)];
  if(sum.length>=2)cards.push({who:'Коротко о главном — это стоит запомнить',title:'Шпаргалка',html:'<ul class="tlist2">'+sum.map(x=>`<li>${x}</li>`).join('')+'</ul>',mood:'happy'});
  return cards}
function startStage(id,ti,stage){
  const t=topicsOf(id)[ti];if(!t)return;
  if(!unlocked(id,ti)){toast('Сначала пройди предыдущую тему');return}
  const base={subj:id,pool:[id],topic:ti,stage,i:0,list:[],res:[],xp:0,r0:{[id]:rs(id).r},picked:null,checked:false,start:Date.now(),ach:[],combo:0,best:0};
  if(stage==='theory'){Q=Object.assign(base,{mode:'theory',cards:theoryCards(id,ti),ci:0,reveal:false})}
  else if(stage==='check'){Q=Object.assign(base,{mode:'check',list:shuffle(t.tq.map(q=>{const idx=shuffle(q.o.map((_,i)=>i));return {...q,o:idx.map(i=>q.o[i]),a:idx.indexOf(0),shuffled:1}}))});Q.n=Q.list.length}
  else{Q=Object.assign(base,{mode:'practice'});for(let j=0;j<10;j++)Q.list.push(makeQ(id,ti));Q.list=Q.list.filter(Boolean);Q.n=Q.list.length}
  nav('quiz');window.scrollTo(0,0);
}

function theoryDone(){const c=cst(Q.subj,Q.topic);const first=!c.th;c.th=true;if(first){S.xp+=20;Q.xp+=20}Q.done=true;Q.ach.push(...checkAch());save();render();window.scrollTo(0,0)}
function stageDone(){
  const c=cst(Q.subj,Q.topic);
  if(Q.mode==='check'){const ok=Q.res.filter(x=>x&&x.ok).length;const pct=Math.round(ok/Math.max(1,Q.list.length)*100);c.ck=Math.max(c.ck,pct);Q.stagePct=pct;if(pct>=80&&!Q.passBonus){S.xp+=30;Q.xp+=30;Q.passBonus=1}}
  if(Q.mode==='practice'){const first=Q.list.map((q,i)=>({q,r:Q.res[i]})).filter(x=>!x.q.retry);const ok=first.filter(x=>x.r&&x.r.ok).length;const pct=Math.round(ok/Math.max(1,first.length)*100);
    c.pr=Math.max(c.pr,pct);Q.stagePct=pct;const was=c.done;if(pct>=60)c.done=true;Q.newDone=!was&&c.done;if(Q.newDone){S.xp+=50;Q.xp+=50}
    const key=srsKey(Q.subj,Q.topic);S.srs=S.srs||{};const cur=S.srs[key]||{l:-1};const l=pct>=80?Math.min(SRS_DAYS.length-1,cur.l+1):0;S.srs[key]={l,due:addDays(pct>=80?SRS_DAYS[l]:1)};Q.srsDays=pct>=80?SRS_DAYS[l]:1}
}
const stars=p=>p>=90?3:p>=75?2:p>=60?1:0;
function stageResult(){
  const id=Q.subj,ti=Q.topic,t=TOP[id][ti],T0=TEACH[id],tops=topicsOf(id),nxt=ti+1<tops.length?ti+1:null;
  let mood='happy',say='',mark='',btns='';
  if(Q.mode==='theory'){say=`Отлично, теория по теме «${t.n}» пройдена! Теперь проверим, как ты всё понял(а): нужно ответить верно хотя бы на 80% вопросов.`;mark='теория ✓';
    btns=`<button class="btn wide" data-stage="${id}|${ti}|check">${ic('list')}Проверка понимания</button><button class="btn ghost wide" data-stage="${id}|${ti}|theory">Перечитать</button>`}
  else if(Q.mode==='check'){const p=Q.stagePct,pass=p>=80;mood=pass?'happy':'sad';mark=p+'%';
    say=pass?`Проверка пройдена: ${p}%! Ты понял(а) главное. Переходим к практике — задачам как на экзамене.`:`${p}% — пока маловато, нужно 80%. Давай ещё раз посмотрим теорию: я покажу главное по шагам.`;
    btns=pass?`<button class="btn wide" data-stage="${id}|${ti}|practice">${ic('target')}К практике</button>`:`<button class="btn wide" data-stage="${id}|${ti}|theory">${ic('book')}Повторить теорию</button><button class="btn ghost wide" data-stage="${id}|${ti}|check">Ещё раз</button>`}
  else{const p=Q.stagePct,s=stars(p);mood=s===3?'wow':s>=2?'happy':s===1?'think':'sad';mark=p+'%';
    say=s?`${s===3?'Блестяще':'Хорошо'}! Тема «${t.n}» пройдена${Q.newDone?' — открываю следующую':''}. Повторим её через ${Q.srsDays} ${plural(Q.srsDays,'день','дня','дней')}, чтобы не забылась.`:`${p}% — тему ещё нужно потренировать: для зачёта темы нужно 60%. Ошибки сохранены в разделе «Ошибки» — разберём их.`;
    btns=(s&&nxt!=null?`<button class="btn wide" data-stage="${id}|${nxt}|theory">${ic('arrow')}Следующая тема</button>`:'')+`<button class="btn ${s&&nxt!=null?'ghost':''} wide" data-stage="${id}|${ti}|practice">${ic('redo')}Ещё практика</button>`}
  const wrong=Q.mode==='theory'?[]:Q.list.map((q,i)=>({q,r:Q.res[i]})).filter(x=>x.r&&!x.r.ok&&!x.q.retry).slice(0,20);
  const st=Q.mode==='practice'?stars(Q.stagePct):0;
  return `<section class="card result" style="--c:${sc(id)}">${teacher(id,mood,96)}
    <div class="tch-say"><b>${T0.name}:</b> ${say}</div>
    <div class="rbig num">${mark}</div>${Q.mode==='practice'?`<div class="stars">${[1,2,3].map(k=>`<span class="${k<=st?'on':''}">${art(ART.star||'<path d="M32 4l8 17 18 2-13 13 4 18-17-9-17 9 4-18L6 23l18-2z" fill="#ffc531" stroke="#1d2340" stroke-width="2.4" stroke-linejoin="round"/>',34)}</span>`).join('')}</div>`:''}
    <div class="rstats"><span class="rs"><b class="num">+${Q.xp}</b>XP</span><span class="rs"><b class="num">${doneCount(id)}/${tops.length}</b>тем пройдено</span></div>
    ${Q.ach.length?`<div class="levelup ach-up">${art('trophy',30)}${Q.ach.join(', ')}</div>`:''}</section>
  <div class="actions">${btns}</div>
  ${wrong.length?`<section class="card" style="display:flex;flex-direction:column;gap:4px"><div class="tasks-head"><h2>Разбор ошибок</h2><span class="count num">${wrong.length}</span></div><div class="errs">${wrong.map(({q,r})=>`<div class="err"><div class="qtext sm">${q.q}</div><div class="fx">${r.ans!=null&&r.ans!==''?`<s>${q.o?q.o[r.ans]:esc(r.ans)}</s><span class="caption">→</span>`:''}<ins>${q.o?q.o[q.a]:esc(q.a)}</ins></div>${q.e?`<div class="why">${q.e}</div>`:''}</div>`).join('')}</div></section>`:''}
  <button class="link" data-nav="t-${id}-${ti}" style="align-self:center">К теме</button>`;
}

/* Текст из Google Объектива приходит построчно. Склеиваем строки в абзацы:
   абзац заканчивается на короткой строке с точкой в конце (как в тетради) или на пустой строке. */
function cleanOCR(raw){
  let t=String(raw||'').replace(/\r\n?/g,'\n').replace(/[ \t]+/g,' ');
  t=t.replace(/([а-яёa-z])[-‐­]\n\s*([а-яёa-z])/gi,'$1$2');
  const lines=t.split('\n').map(l=>l.trim());
  const lens=lines.filter(Boolean).map(l=>l.length).sort((a,b)=>a-b);
  const med=lens.length?lens[Math.floor(lens.length/2)]:0;
  const paras=[];let cur=[];
  const close=()=>{if(cur.length){paras.push(cur.join(' '));cur=[]}};
  for(const l of lines){
    if(!l){close();continue}
    cur.push(l);
    if(lens.length>3&&/[.!?…»")]$/.test(l)&&l.length<med*0.72)close();
  }
  close();
  return paras.join('\n\n');
}

/* Подсказки по запятым: самые частые пропуски в сочинениях. Это подсказки «проверь», в счёт ошибок не идут. */
const INTRO=['на мой взгляд','по моему мнению','таким образом','во-первых','во-вторых','в-третьих','к сожалению','к счастью','конечно','безусловно','несомненно','например','по-моему','следовательно','итак','кроме того','разумеется','видимо','наверное','с одной стороны','с другой стороны','одним словом','как известно','как правило'];
const PREP='в|во|на|с|со|о|об|обо|к|ко|по|у|из|за|от|для|при|про|через|без|над|под|до|перед|между|среди|благодаря|вопреки|согласно';
function commaHints(text){
  const out=[], seen=new Set();
  const add=(frag,fix,why)=>{const k=frag.toLowerCase();if(seen.has(k))return;seen.add(k);out.push({fragment:frag,fix,rule:why})};
  for(const s of text.match(/[^.!?…]+[.!?…]*/g)||[]){
    const st=s.trim(), low=st.toLowerCase();
    for(const w of INTRO){ if(low.startsWith(w+' ')){const next=st.slice(w.length+1).split(/\s+/)[0]||'';add(st.slice(0,w.length)+' '+next,st.slice(0,w.length)+', '+next,'вводное слово выделяется запятой')} }
  }
  let m;
  const re1=/(^|[^,—–\-\s])\s+((?:тот|та|то|те|того|тех|тому|тем|той|того)\s+(?:кто|что|кого|чего|кому|чему|кем|чем))(?=[\s.,!?])/gi;
  while((m=re1.exec(text))){const p=m[2].split(/\s+/);add(m[2],p[0]+', '+p.slice(1).join(' '),'запятая перед придаточным: «тот, кто», «то, что»')}
  const re2=new RegExp('([а-яё]+)\\s+(?:('+PREP+')\\s+)?(котор[а-яё]+)','gi');
  while((m=re2.exec(text))){const before=text.slice(Math.max(0,m.index-1),m.index);if(/[,—–(]/.test(before)||/^(то|те|тот)$/i.test(m[1]))continue;if(new RegExp('^('+PREP+')$','i').test(m[1]))continue;
    const frag=m[0];const fix=m[1]+', '+(m[2]?m[2]+' ':'')+m[3];add(frag,fix,'придаточное с «который» отделяется запятой')}
  const re3=/([а-яё]{3,})\s+(что|чтобы|потому что|если|но|хотя)(?=\s)/gi;
  const skip=/^(потому|так|то|не|ни|вот|оттого|затем|для|того|тем|ли|лишь|только|даже|и|а|или|все|всё|почти|именно|будто|как)$/i;
  while((m=re3.exec(text))){const prev=text[m.index-1];if(prev===','||skip.test(m[1]))continue;if(/^хотя$/i.test(m[2])&&/^бы\b/i.test(text.slice(m.index+m[0].length).trim()))continue;
    add(m[0],m[1]+', '+m[2],m[2].toLowerCase()==='но'||m[2].toLowerCase()==='хотя'?'запятая перед союзом «'+m[2].toLowerCase()+'»':'запятая перед «'+m[2].toLowerCase()+'» в сложном предложении')}
  return out.slice(0,30);
}

/* Проверка ошибок: бесплатный сервис LanguageTool (нужен интернет, текст отправляется на languagetool.org). */
const ETYPES=['орфография','пунктуация','грамматика','речь'];
const ECOL={'орфография':'var(--red)','пунктуация':'var(--s1)','грамматика':'var(--s2)','речь':'var(--warn)'};
function ltType(m){const c=(m.rule&&m.rule.category&&m.rule.category.id)||'';const it=m.rule&&m.rule.issueType;
  if(c==='TYPOGRAPHY'||c==='WHITESPACE')return null;
  if(c==='TYPOS'||c==='CASING'||it==='misspelling')return 'орфография';
  if(c==='PUNCTUATION'||it==='typographical')return 'пунктуация';
  if(c==='GRAMMAR'||it==='grammar')return 'грамматика';
  return 'речь';}
async function langTool(text,signal){
  const body=new URLSearchParams({text,language:'ru-RU'});
  const r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',body,signal});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();
  return (d.matches||[]).map(m=>{const type=ltType(m);if(!type)return null;const frag=text.substr(m.offset,m.length);if(!frag.trim()||/\[\?\]/.test(frag))return null;
    return {type,fragment:frag,fix:(m.replacements||[]).slice(0,2).map(x=>x.value).join(' / '),rule:String(m.shortMessage||m.message||'').replace(/^Возможно найдена /,'').slice(0,90)}}).filter(Boolean).slice(0,80);
}

    <div class="actions">${HAS_APP?`<button class="btn soft sm" id="openLens">${ic('camera')}Открыть Объектив</button>`:''}<button class="btn soft sm" id="pasteBtn">${ic('copy')}Вставить из буфера</button></div>
  </section>
  <textarea id="paper" class="paper" aria-label="Текст из тетради" placeholder="Здесь появится текст с фото. Его можно поправить: Объектив иногда путает слова.">${esc(S.paper)}</textarea>
  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <div class="stats num" id="paperStats"></div>
    <p class="caption">Сверь текст с тетрадью: Объектив может сам исправить слово с ошибкой. Между абзацами должна быть пустая строка.</p>
    <div class="actions"><button class="btn wide" id="runPaper" ${checking?'disabled':''}>${ic('check')}Проверить</button><button class="btn ghost" id="askClearPaper">Очистить</button></div>
    <div id="clearZone"></div>
  </section>`;
}
function statTiles(t,extra){const w=words(t),p=paragraphs(t),s=sentences(t);
  return `<div class="stat"><b>${w}</b><span>${plural(w,'слово','слова','слов')}</span></div><div class="stat"><b>${p}</b><span>${plural(p,'абзац','абзаца','абзацев')}</span></div><div class="stat"><b>${s}</b><span>предлож.</span></div>${extra}`}
function resultView(c){
  const w=words(c.text);
  const by={}; ETYPES.forEach(t=>by[t]=0); c.errors.forEach(e=>by[e.type]++);
  const lit=by['орфография']+by['пунктуация']+by['грамматика'], allowed=Math.floor(w*5/100), k5=lit<=allowed;
  const vol=w>=350?['ok','Объём',`${w} — норма`]:w>=250?['warn','Объём',`${w} — лучше от 350`]:['bad','Объём',`${w} — меньше 250`];
  const gr=!c.lt?['warn','Грамотность, К5','не проверено: нет интернета']:k5?['ok','Грамотность, К5',`${lit} из ${allowed} допустимых`]:['bad','Грамотность, К5',`${lit} при ${allowed} допустимых`];
  const maxBy=Math.max(1,...Object.values(by));
  const low=c.text.toLowerCase();
  const found=CLICHES.map(x=>[x,(low.match(new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length]).filter(x=>x[1]);
  const freq={};(low.match(/[а-яё]{5,}/g)||[]).forEach(x=>{if(!STOP.has(x))freq[x]=(freq[x]||0)+1});
  const rep=Object.entries(freq).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const errRow=(e,col,tagTxt)=>`<div class="err"><div class="fx"><span class="tag" style="--c:${col}">${tagTxt}</span><s>${esc(e.fragment)}</s>${e.fix?`<span class="caption">→</span><ins>${esc(e.fix)}</ins>`:''}</div>${e.rule?`<div class="why">${esc(e.rule)}</div>`:''}</div>`;
  return `<section class="card" id="result" style="display:flex;flex-direction:column;gap:10px">
    <div><h2 style="font-size:18px">Результат проверки</h2><span class="caption">${c.date}</span></div>
    <div class="stats num">${statTiles(c.text,`<div class="stat ${!c.lt?'':k5?'good':'bad'}"><b>${c.lt?c.errors.length:'—'}</b><span>${c.lt?plural(c.errors.length,'ошибка','ошибки','ошибок'):'ошибки'}</span></div>`)}</div>
    <div class="verdicts">${[vol,gr].map(v=>`<div class="verdict ${v[0]}"><span>${v[1]}</span><b class="num">${v[2]}</b></div>`).join('')}${paragraphs(c.text)<3&&w>150?'<div class="verdict warn"><span>Абзацы</span><b>мало — нужно 4–5</b></div>':''}</div>
    ${c.lt?`<div class="ebars">${ETYPES.map(t=>`<div class="ebar"><span>${t==='речь'?'речевые':t}</span><span class="t"><i style="width:${by[t]/maxBy*100}%;background:${ECOL[t]}"></i></span><b class="num">${by[t]}</b></div>`).join('')}</div>`:''}
    ${found.length||rep.length?`<div class="chips">${found.map(([x,n])=>`<span class="hl">штамп: ${x==='данн'?'данный':x}${n>1?' ×'+n:''}</span>`).join('')}${rep.map(([x,n])=>`<span class="hl">повтор: ${x} ×${n}</span>`).join('')}</div>`:''}
    <p class="caption">Автопроверка находит не все ошибки, особенно в запятых. Это ориентир, а не оценка комиссии.</p>
  </section>
  ${c.errors.length?`<section class="card" style="display:flex;flex-direction:column;gap:4px"><div class="tasks-head"><h2>Ошибки</h2><span class="count num">${c.errors.length}</span></div>
    <div class="errs">${c.errors.map(e=>errRow(e,ECOL[e.type],e.type)).join('')}</div></section>`:''}
  ${c.hints.length?`<section class="card" style="display:flex;flex-direction:column;gap:4px"><div class="tasks-head"><h2>Проверь запятые</h2><span class="count num">${c.hints.length}</span></div>
    <p class="caption">Здесь часто пропускают запятую. Посмотри сам: в счёт ошибок это не входит.</p>
    <div class="errs">${c.hints.map(e=>errRow(e,'var(--s1)','запятая?')).join('')}</div></section>`:''}
  <div class="actions" style="justify-content:center">${c.source==='paper'?'<button class="btn sm" id="saveChecked">Сохранить в мои сочинения</button>':''}<button class="link" id="clearCheck" style="color:var(--muted)">Скрыть результат</button></div>`;
}
function renderStats(){
  const ta=document.activeElement&&document.activeElement.classList.contains('paper')?document.activeElement:null;
  const tbt=ta?ta.value:S.draft.text, tw=words(tbt);
  const tb=$('#tbWords'); if(tb) tb.textContent=`${tw} ${plural(tw,'слово','слова','слов')}${tw<250?' · минимум 250':tw<350?' · цель 350':' · норма'}`;
  const ps=$('#paperStats'); if(ps) ps.innerHTML=statTiles(S.paper,`<div class="stat"><b>${Math.floor(words(S.paper)*5/100)}</b><span>ошибок макс.</span></div>`);
  const box=$('#statsBox'); if(!box) return;
  const t=S.draft.text, w=words(t), paras=paragraphs(t);
  const col=w<250?'var(--red)':w<350?'var(--warn)':'var(--ok)';
  const status=w<250?`<span class="pill red">ещё ${250-w} до минимума</span>`:w<350?`<span class="pill">ещё ${350-w} до рекомендуемого</span>`:`<span class="pill ok">объём в норме</span>`;
  const low=t.toLowerCase();
  const found=CLICHES.map(c=>[c,(low.match(new RegExp(c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length]).filter(x=>x[1]);
  const freq={};(low.match(/[а-яё]{5,}/g)||[]).forEach(x=>{if(!STOP.has(x))freq[x]=(freq[x]||0)+1});
  const rep=Object.entries(freq).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=Math.max(450,w);
  box.innerHTML=`<div class="stats num">${statTiles(t,`<div class="stat"><b>${Math.floor(w*5/100)}</b><span>ошибок макс.</span></div>`)}</div>
  <div class="meter" aria-hidden="true"><i style="width:${Math.min(100,w/max*100)}%;background:${col}"></i><span class="mk" style="left:${250/max*100}%"><span>250</span></span><span class="mk" style="left:${350/max*100}%"><span>350</span></span></div>
  <div class="chips">${status}${paras&&paras<4&&w>150?'<span class="pill">мало абзацев: нужно 4–5</span>':''}</div>
  ${found.length||rep.length?`<div class="chips">${found.map(([c,n])=>`<span class="hl">штамп: ${c==='данн'?'данный':c}${n>1?' ×'+n:''}</span>`).join('')}${rep.map(([x,n])=>`<span class="hl">повтор: ${x} ×${n}</span>`).join('')}</div>`:`<span class="caption">${w?'Штампов и частых повторов не найдено.':'Начни писать — здесь появятся подсказки про штампы и повторы.'}</span>`}`;
}


/* ===================== СОБЫТИЯ ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-close]'); if(!el) return;
  const d=el.dataset;
  if(d.close){closeSheet();return}
  if(d.nav){if(d.nav==='back'){history.length>1?history.back():nav('home')}else nav(d.nav);return}
  if(d.teach){runTeach();return}
  if(d.stage){const [id,i,st]=d.stage.split('|');startStage(id,+i,st);return}
  if(d.cont){continueCourse(d.cont);return}
  if(el.id==='hintBtn'&&Q){Q.hintOn=Q.i;render(true);return}
  if(el.id==='thNext'&&Q){if(Q.ci<Q.cards.length-1){Q.ci++;Q.reveal=false;render(true);window.scrollTo(0,0)}else theoryDone();return}
  if(el.id==='thPrev'&&Q){Q.ci=Math.max(0,Q.ci-1);Q.reveal=false;render(true);return}
  if(el.id==='revealEx'&&Q){Q.reveal=true;render(true);return}
  if(d.learn){const [id,i]=d.learn.split('|');startLesson(id,+i,false);return}
  if(el.id==='lessonNext'&&Q){if(Q.ci<Q.chunks.length-1)Q.ci++;else Q.phase='practice';render(true);window.scrollTo(0,0);return}
  if(el.id==='lessonPrev'&&Q){Q.ci=Math.max(0,Q.ci-1);render(true);return}
  if(d.goday15){S.planView=+d.goday15===curDay15()?null:+d.goday15;save();render();window.scrollTo(0,0);return}
  if(el.id==='setStart'){const v=($('#startDate')||{}).value;if(v){S.start=v;S.planView=null;save();render(true);toast('Дата старта сохранена')}return}
  /* онбординг и выбор предметов */
  if(d.toggle){const id=d.toggle;S.subjects=S.subjects.includes(id)?S.subjects.filter(x=>x!==id):[...S.subjects,id];save();
    el.classList.toggle('on');el.setAttribute('aria-pressed',S.subjects.includes(id));el.querySelector('.tick').innerHTML=S.subjects.includes(id)?ic('check'):'';const c=$('#selCount');if(c)c.textContent=S.subjects.length;return}
  if(el.id==='finishOnb'){const n=($('#nameIn')||{}).value||'';if(!S.subjects.length){toast('Выбери хотя бы один предмет');return}S.name=n.trim().slice(0,24);S.onboarded=true;save();nav('home');return}
  /* тесты */
  if(d.start){startSession(d.start,d.topicI!=null?+d.topicI:null);return}
  if(d.pick!==undefined&&Q){answer(+d.pick);return}
  if(el.id==='ansBtn'){submitInput();return}
  if(el.id==='nextQ'){next();return}
  if(el.id==='prevQ'&&Q&&Q.i>0){const v=($('#ansIn')||{}).value;if(v&&v.trim()&&!Q.list[Q.i].o)Q.res[Q.i]={ok:isRight(Q.list[Q.i],v),ans:v.trim()};Q.i--;Q.picked=Q.res[Q.i]?Q.res[Q.i].ans:null;render(true);return}
  if(el.id==='quitQ'){const back=Q&&Q.subj?'s-'+Q.subj:'home';Q=null;nav(back);return}
  if(el.id==='againQ'&&Q){const code=Q.mode+'-'+(Q.subj||'all'),tp=Q.topic;if(Q.mode==='daily'){startSession('daily-all');return}startSession(code,tp);return}
  if(el.id==='flipCard'&&Q){Q.flip=!Q.flip;render(true);return}
  if(d.card!==undefined&&Q){if(d.card==='1'){Q.known++;S.xp+=2;save()}else{Q.list.push(Q.list[Q.i])}Q.flip=false;Q.i++;if(Q.i>=Q.list.length||Q.i>=60){Q.done=true;checkAch();save()}render(true);return}
  /* рейтинг */
  if(d.lb){lbSubj=d.lb;render(true);return}
  if(el.id==='shareCode'){doShare(shareText());return}
  if(el.id==='addFriend'){const v=($('#friendIn')||{}).value||'';if(addFriend(v))render(true);return}
  if(d.unfriend){S.friends=S.friends.filter(f=>f.u!==d.unfriend);save();render(true);return}
  /* профиль */
  if(d.goal){S.goal=+d.goal;save();render(true);return}
  if(el.id==='askReset'){$('#resetZone').innerHTML='<div style="display:flex;flex-direction:column;gap:10px"><span>Удалить весь прогресс: уровни, рейтинг, друзей, ошибки и сочинения? Это нельзя отменить.</span><div class="actions"><button class="btn danger sm" id="doReset">Да, сбросить</button><button class="btn ghost sm" id="noReset">Отмена</button></div></div>';return}
  if(el.id==='noReset'){render(true);return}
  if(el.id==='doReset'){S=fresh();save();Q=null;nav('home');toast('Прогресс сброшен');return}
  /* сочинение (русский язык) */
  if(d.wmode){S.writeMode=d.wmode;save();render(true);return}
  if(el.id==='runText'){runCheck('type');return}
  if(el.id==='runPaper'){runCheck('paper');return}
  if(el.id==='stopCheck'){checking&&checking.abort();return}
  if(el.id==='openLens'){let ok=false;try{ok=window.Android.openLens()}catch(err){}if(!ok)toast('Открой Объектив сам: в камере, в приложении Google или в Google Фото');return}
  if(el.id==='pasteBtn'){if(HAS_APP){let t='';try{t=window.Android.clipboard()||''}catch(err){}if(t.trim())window.receiveShared(t);else toast('Буфер пуст — сначала скопируй текст в Объективе');return}
    try{navigator.clipboard.readText().then(t=>t&&t.trim()?window.receiveShared(t):toast('Буфер пуст'),()=>toast('Нажми в поле и вставь текст долгим нажатием'))}catch(err){toast('Нажми в поле и вставь текст долгим нажатием')}return}
  if(el.id==='askClearPaper'){$('#clearZone').innerHTML='<div class="actions"><span class="caption" style="flex:1">Удалить текст из тетради?</span><button class="btn danger sm" id="doClearPaper">Удалить</button><button class="btn ghost sm" id="noClearPaper">Нет</button></div>';return}
  if(el.id==='doClearPaper'){S.paper='';if(S.lastCheck&&S.lastCheck.source==='paper')S.lastCheck=null;save();render(true);return}
  if(el.id==='noClearPaper'){$('#clearZone').innerHTML='';return}
  if(el.id==='saveChecked'){const c=S.lastCheck;S.essays.unshift({topic:S.draft.topic,text:c.text,words:words(c.text),errors:c.lt?c.errors.length:undefined,date:c.date});save();render(true);toast('Сочинение сохранено');return}
  if(el.id==='clearCheck'){S.lastCheck=null;save();render(true);return}
  if(d.sheet){openSheet(d.sheet);return}
  if(d.filter){S.bookFilter=d.filter;flash.id=null;save();render(true);return}
  if(d.mode){S.bookMode=d.mode;save();render(true);return}
  if(d.fl){if(d.fl==='open')flash.open=true;else{S.books[flash.id]=Object.assign({},S.books[flash.id],{known:d.fl==='know'});save();const l=bookList();flash.id=pickFlash(l.length?l:BOOKS);flash.open=false}render(true);return}
  if(el.id==='rndTopic'){const x=ALL_TOPICS[Math.floor(Math.random()*ALL_TOPICS.length)];S.draft.topic=x.t;save();$('#topic').value=x.t;return}
  if(d.dur){const s=+d.dur*60;S.timer={dur:s,end:null,left:s};save();render(true);return}
  if(el.id==='tStart'){if(S.timer.end){S.timer.left=timerLeft();S.timer.end=null}else{S.timer.end=Date.now()+S.timer.left*1000}save();render(true);return}
  if(el.id==='tReset'){S.timer={dur:S.timer.dur,end:null,left:S.timer.dur};save();render(true);return}
  if(el.id==='tbDone'){const t=document.activeElement;t&&t.blur&&t.blur();return}
  if(el.id==='saveEssay'){const w=words(S.draft.text);if(!w){toast('Сначала напиши текст');return}const ck=S.lastCheck&&S.lastCheck.source==='type'&&S.lastCheck.lt&&S.lastCheck.text===S.draft.text?S.lastCheck.errors.length:undefined;S.essays.unshift({topic:S.draft.topic,text:S.draft.text,words:w,errors:ck,date:new Date().toLocaleDateString('ru-RU')});save();render(true);toast('Сочинение сохранено');return}
  if(el.id==='newEssay'){S.draft={topic:'',text:''};S.check={};S.timer={dur:S.timer.dur,end:null,left:S.timer.dur};save();render();return}
  if(d.open!==undefined){const x=S.essays[+d.open];S.draft={topic:x.topic,text:x.text};S.writeMode='type';save();render();toast('Открыто в редакторе');return}
  if(d.del!==undefined){const k=+d.del;$('#ed-'+k).innerHTML=`<button class="btn danger sm" data-delok="${k}">Удалить</button><button class="btn ghost sm" data-delno="1">Нет</button>`;return}
  if(d.delok!==undefined){S.essays.splice(+d.delok,1);save();render(true);return}
  if(d.delno){render(true);return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.day){const i=+el.dataset.day,k=+el.dataset.k;S.done=S.done||{};S.done[i]=S.done[i]||{};S.done[i][k]=el.checked;save();el.closest('li').classList.toggle('done',el.checked);

  if(el.id==='nameIn'){S.name=el.value.trim().slice(0,24);save();return}
  if(el.id==='examIn'&&el.value){S.examDate=el.value;save();toast('Дата сохранена');return}

  if(el.dataset.check){S.check[el.dataset.check]=el.checked;el.closest('li').classList.toggle('done',el.checked);save();
    const c=el.closest('section').querySelector('.count');if(c)c.textContent=Object.values(S.check).filter(Boolean).length+' из 5';return}
});
let tmr;
document.addEventListener('input',e=>{
  if(e.target.id==='essay'){S.draft.text=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{save();renderStats()},250)}
  if(e.target.id==='paper'){S.paper=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{save();renderStats()},250)}
  if(e.target.id==='topic'){S.draft.topic=e.target.value;save()}

});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('paper')){document.body.classList.add('typing');renderStats();tick()}});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('paper'))document.body.classList.remove('typing')});

}
setInterval(tick,1000);
