<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зачёт">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Зачёт за 15 дней</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Школьная тетрадь, собранная как приложение: чернильно-синяя обложка-герой в клетку с красной линией полей,
   белые листы-карточки, красная ручка учителя для отметок. Одна колонка, плавающая нижняя панель. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f8; --fg:#141a33; --muted:#5f6786; --line:#e1e5f0;
  --ink:#2f45c8; --ink-2:#e6eafc; --on-ink:#ffffff;
  --red:#d4372c; --red-2:#fdecea; --ok:#1d8a52; --ok-2:#e3f5eb; --warn:#9a5c00; --warn-2:#fff1d9;
  --s1:#2f45c8; --s2:#8a3fa6; --s3:#1f7a64;
  --hero:#2235a8; --hero-fg:#ffffff; --hero-mute:rgba(255,255,255,.74); --hero-line:rgba(255,255,255,.08); --pen:#ff8a7e;
  --shadow:0 1px 2px rgba(22,32,90,.05),0 8px 24px rgba(22,32,90,.07);
  --navbg:rgba(255,255,255,.9); --scrim:rgba(14,18,40,.42);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:16px; --r-s:12px; --nav-h:56px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b2c; --surface-2:#1f2438; --fg:#e9ebf5; --muted:#9ba2c0; --line:#283050;
  --ink:#93a5ff; --ink-2:#232a4b; --on-ink:#0e1120;
  --red:#ff6f63; --red-2:#3a1e23; --ok:#5ad08f; --ok-2:#15301f; --warn:#f2b24c; --warn-2:#33270f;
  --s1:#93a5ff; --s2:#d68fec; --s3:#5ccaac;
  --hero:#1c256c; --hero-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px var(--line); --navbg:rgba(23,27,44,.9); --scrim:rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#171b2c; --surface-2:#1f2438; --fg:#e9ebf5; --muted:#9ba2c0; --line:#283050;
  --ink:#93a5ff; --ink-2:#232a4b; --on-ink:#0e1120;
  --red:#ff6f63; --red-2:#3a1e23; --ok:#5ad08f; --ok-2:#15301f; --warn:#f2b24c; --warn-2:#33270f;
  --s1:#93a5ff; --s2:#d68fec; --s3:#5ccaac;
  --hero:#1c256c; --hero-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px var(--line); --navbg:rgba(23,27,44,.9); --scrim:rgba(0,0,0,.55); color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.18;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.caption{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.view-in{animation:viewIn .22s ease-out}
@keyframes viewIn{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}

/* заголовки экранов */
.apphead{display:flex;flex-direction:column;gap:2px;padding:6px 2px 0}
.apphead h1{font-size:25px}
.apphead .sub{font-size:13px;color:var(--muted)}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0}
.mark{font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1;color:var(--red);transform:rotate(-4deg);display:inline-block}
.mark small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px;transform:rotate(4deg);display:inline-block;letter-spacing:.02em}

/* карточки */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card.tight{padding:2px 14px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title h2{font-size:18px}

/* герой: обложка тетради */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:14px 14px 8px 28px;color:var(--hero-fg);background-color:var(--hero);
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:18px 18px}
.hero::before{content:"";position:absolute;top:0;bottom:0;left:16px;width:2px;background:var(--pen);opacity:.85}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero-num{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.03em}
.hero-lbl{font-size:14px;font-weight:600;margin-top:3px}
.hero-lbl span{display:block;font-weight:400;color:var(--hero-mute);font-size:12px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:rgba(255,255,255,.16)}
.ring .fgc{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-size:16px;line-height:1}
.ring b small{display:block;font:500 10px/1.3 var(--f-body);color:var(--hero-mute)}
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.track .stage{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.dot{border:0;background:none;padding:8px 0;display:block;min-width:0}
.dot i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:transform .15s}
.dot.part i{background:rgba(255,255,255,.55)}
.dot.done i{background:#fff}
.dot.cur i{background:var(--pen);transform:scaleY(1.5)}
.dot.cur.done i{background:#fff;box-shadow:0 0 0 2px var(--pen)}
.dot.sel:not(.cur) i{outline:2px solid #fff;outline-offset:2px}
.track-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--hero-mute);font-weight:500}

/* урок дня */
.lesson{display:flex;flex-direction:column;gap:10px}
.lesson-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--ink-2);color:var(--ink);letter-spacing:.02em}
.pill.red{background:var(--red-2);color:var(--red)}
.pill.ok{background:var(--ok-2);color:var(--ok)}
.lesson-title{font-size:21px}
.lesson-title .daynum{display:block;font-family:var(--f-hand);color:var(--red);font-size:19px;font-weight:700;line-height:1.1;letter-spacing:0;transform:rotate(-2deg);transform-origin:left;margin-bottom:1px}
.prose{display:flex;flex-direction:column;gap:8px;font-size:15px}
.prose ul,.prose ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prose.closed{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{align-self:flex-start;margin-top:-4px}
.prose li::marker{color:var(--muted)}
.prose b{font-weight:600}
.note{background:var(--surface-2);border-radius:var(--r-s);padding:9px 12px;font-size:14px}
.note.red{background:var(--red-2)}
.example{position:relative;background:var(--surface-2);border-radius:var(--r-s);padding:26px 12px 10px;font-family:var(--f-display);font-style:italic;font-size:14.5px;line-height:1.55}
.example::before{content:"пример";position:absolute;top:3px;left:12px;font:700 19px/1.2 var(--f-hand);font-style:normal;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:9px 16px;min-height:42px;font-weight:600;background:var(--ink);color:var(--on-ink);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--ink-2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{flex:1}
.iconbtn{display:inline-grid;place-content:center;width:42px;height:42px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);flex:none}
.link{background:none;border:0;padding:6px 0;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* задания */
.tasks{position:relative}
.tasks-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tasks-head h2{font-size:18px}
.count{font-weight:600;color:var(--muted);font-size:14px}
.minibar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:8px 0 2px}
.minibar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .35s ease}
.checklist{list-style:none;padding:0;display:flex;flex-direction:column}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.checklist label{flex:1;min-width:0;cursor:pointer;padding-top:2px;transition:color .2s}
.checklist li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
.chk::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.chk:checked{background:var(--red);border-color:var(--red)}
.chk:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.stamp{position:absolute;top:8px;right:14px;font:700 26px/1 var(--f-hand);color:var(--red);border:2.5px solid var(--red);border-radius:12px;padding:2px 12px 6px;transform:rotate(-9deg);animation:stamp .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp{from{transform:rotate(-20deg) scale(1.8);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.daynav{display:flex;justify-content:space-between;gap:8px}

/* книги-подсказки и теги */
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;color:var(--c,var(--ink));background:var(--surface-2);background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent)}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:500;min-height:32px;text-align:left}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink));flex:none}
.subbooks{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.subbooks .lbl{font-size:13px;font-weight:600;margin-bottom:6px}
.subbooks .lbl span{color:var(--muted);font-weight:500}

/* сегменты и фильтры */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button .ic{width:17px;height:17px;vertical-align:-3px;margin-right:5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(20,30,80,.12)}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.scroller::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;min-height:34px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* план: лента */
.stagehead{display:flex;align-items:center;gap:14px}
.stagenum{width:36px;height:36px;border-radius:11px;display:grid;place-content:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--ink-2);color:var(--ink);flex:none}
.stagehead h2{font-size:17px}
.stagehead .caption{margin-top:2px}
.stagehead .count{margin-left:auto}
.timeline{position:relative;display:flex;flex-direction:column;margin-top:6px}
.timeline::before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:2px;background:var(--line)}
.tl{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:6px 0}
.tl-node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-content:center;font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.tl.part .tl-node{border-color:var(--warn);color:var(--warn);background:var(--warn-2)}
.tl.done .tl-node{background:var(--ok);border-color:var(--ok);color:#fff}
.tl.done .tl-node .ic{width:15px;height:15px;stroke-width:3}
.tl.cur .tl-node{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 4px var(--red-2)}
.tl-body{flex:1;min-width:0;display:flex;flex-direction:column}
.tl-title{font-weight:600;line-height:1.3;font-size:14.5px}
.tl.done .tl-title{color:var(--muted)}
.tl-sub{font-size:12px;color:var(--muted)}

/* справка */
.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fk{display:inline-grid;place-content:center;min-width:38px;height:38px;padding:0 8px;border-radius:12px;font-weight:700;font-family:var(--f-display);font-size:17px;background:var(--surface-2);color:var(--fg)}
.fk.m{background:var(--ink);color:var(--on-ink)}
.op{font-weight:700;color:var(--muted);font-size:18px}
.fgroup{display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:15px;border:1.5px dashed var(--muted)}
.fgroup .fk{min-width:36px;height:36px;font-size:15px}
.fgroup small{font-size:11px;color:var(--muted);padding:0 4px;line-height:1.2;max-width:52px}
.stampmini{font:700 26px/1 var(--f-hand);color:var(--red);border:2px solid var(--red);border-radius:10px;padding:1px 9px 5px;transform:rotate(-6deg)}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.rowi:first-child{border-top:0}
.rowi .fk{flex:none}
.rowi .fk.req{background:var(--red-2);color:var(--red)}
.rowi h3{font-family:var(--f-body);font-size:15px;font-weight:600;letter-spacing:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowi p{color:var(--muted);font-size:14px;margin-top:1px}
.sbar{display:flex;gap:3px;height:30px;border-radius:10px;overflow:hidden}
.sbar span{display:grid;place-content:center;font-size:12px;font-weight:700;color:#fff;min-width:0}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.legend .li{display:flex;gap:12px}
.legend .sw{width:12px;height:12px;border-radius:4px;margin-top:6px;flex:none}
.secthead{display:flex;gap:12px;align-items:flex-start}
.secthead .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.secthead h2{font-size:17px}
details.acc{border-top:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 0;font-size:14.5px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .idx{flex:none;font-weight:700;font-size:13px;color:var(--c);background:var(--surface-2);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:8px;padding:3px 7px}
details.acc>summary .nm{flex:1;min-width:0;font-weight:500;line-height:1.35}
details.acc>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s;flex:none}
details.acc[open]>summary::after{transform:rotate(225deg);margin-bottom:-4px}
.acc-body{display:flex;flex-direction:column;gap:10px;padding:0 0 12px}
.kv .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.topic-list{display:flex;flex-direction:column;gap:6px}
.topic{display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-weight:500;font-size:14px;width:100%}
.topic .ic{width:18px;height:18px;color:var(--ink)}
.phr{display:flex;flex-direction:column;gap:6px}
.phr button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px;width:100%}
.phr button .ic{width:17px;height:17px;color:var(--muted)}
.qprog{display:flex;gap:4px}
.qprog i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.qprog i.on{background:var(--ink)}
.qopt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;width:100%;font-weight:500;min-height:46px}
.qopt .lt{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-content:center;background:var(--surface-2);font-weight:700;font-size:13px}
.qopt.right{border-color:var(--ok);background:var(--ok-2)}
.qopt.right .lt{background:var(--ok);color:#fff}
.qopt.wrong{border-color:var(--red);background:var(--red-2)}
.qopt.wrong .lt{background:var(--red);color:#fff}
.bigmark{font:700 52px/1 var(--f-hand);color:var(--red);transform:rotate(-6deg);display:inline-block}

/* книги */
.blist{display:flex;flex-direction:column}
.brow{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}

.hl{display:inline-block;background:var(--warn-2);color:var(--warn);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.essay{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}

body.typing .typebar{display:flex}

<ol><li>Подчеркни <b>ключевые слова</b>. В теме «Почему человек способен на предательство?» это <i>почему</i> и <i>предательство</i>.</li>

<li>Ответь на вопрос <b>одним предложением</b>. Это тезис, который ты будешь доказывать.</li></ol>
<div class="note red">Самая частая причина незачёта по К1 — подмена темы. Тема «Почему опасно равнодушие?» — не о доброте вообще, а именно о <b>последствиях</b> равнодушия.</div>
<p>Надёжная схема на 350–450 слов:</p>
<ol><li><b>Вступление</b> (50–70 слов): подводка → <b>тезис</b>.</li>
<li><b>Аргумент 1</b> (120–150): микротезис → эпизод → анализ → микровывод.</li>
<li><b>Аргумент 2</b> (120–150): другое произведение.</li>
<li><b>Заключение</b> (40–60): вывод, который отвечает на вопрос темы.</li></ol>`,
 tasks:['Разобрать 3 темы из банка: ключевые слова и ответ в одно предложение','Составить план к теме «Что значит быть сильной личностью?»','Записать своими словами определения: совесть, честь, свобода, память, милосердие'], act:{label:'Открыть структуру', go:'ref:struct'}},
{t:'Вступление и заключение', th:`
<p>Четыре рабочих способа начать: <b>через понятие</b>, <b>через вопрос</b>, <b>через цитату</b> (если точно помнишь её и автора), <b>через наблюдение</b> из жизни. Последняя фраза вступления — <b>тезис</b>.</p>
<div class="example">Предательство редко начинается с громкого поступка. Чаще оно вырастает из слабости, страха или желания получить выгоду. На мой взгляд, человек способен предать, когда ставит собственные интересы выше верности и чести.</div>
<p>Заключение: тезис <b>другими словами</b> → обобщение обоих аргументов → (по желанию) короткий личный вывод. Новых примеров в заключении не приводят.</p>
<div class="example">Таким образом, человек способен на предательство, когда страх или выгода оказываются для него важнее совести. Андрий и Швабрин сделали такой выбор и потеряли себя. Мне кажется, верность проверяется именно тогда, когда за неё приходится платить.</div>`,
 tasks:['Написать два вступления разными способами к одной теме (в тренажёре)','Написать к ним заключение','Выписать 5 связок из Справки → Фразы'], act:{label:'Открыть фразы', go:'ref:phr'}},

<ul><li>точное название и автора (с инициалами);</li><li>имена героев;</li><li>2–3 эпизода с деталями;</li><li>к каким подразделам подходит.</li></ul>

{t:'Аргумент, а не пересказ', th:`
<p>Пересказ сюжета — ошибка №1. Формула аргумента:</p>
<ol><li><b>Микротезис</b> — как произведение связано с темой.</li>
<li><b>Эпизод</b> — кто, что сделал, конкретная деталь.</li>
<li><b>Анализ</b> — почему это важно и что это говорит о герое и о теме.</li>
<li><b>Микровывод</b> — возврат к тезису.</li></ol>
<div class="example">Обратимся к повести А. С. Пушкина «Капитанская дочка». Пётр Гринёв попадает в плен к Пугачёву и может спасти жизнь ценой присяги самозванцу. Однако он отвечает, что присягал императрице и не может нарушить слово. Герой понимает, что его могут казнить, но страх смерти для него слабее страха потерять честь. Так отцовское «береги честь смолоду» становится его внутренним законом. Этот пример показывает, что сохранить честь — значит остаться верным себе даже тогда, когда это опасно.</div>`,
 tasks:['Написать 2 аргумента по формуле к одной теме','Отметить, где пересказ, а где анализ: анализа должно быть не меньше половины']},

/* ===================== ХРАНИЛИЩЕ ===================== */
const KEY='zachet21:v1';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const fresh=()=>({plan:15,paper:'',start:iso(new Date()),done:{},books:{},essays:[],draft:{topic:'',text:''},timer:{dur:120*60,end:null,left:120*60},check:{},view:null,refTab:'crit',bookFilter:'all',bookMode:'list'});
let S=Object.assign(fresh(),load()||{});
if(S.writeMode==='photo')S.writeMode='paper';
if(S.lastCheck&&!Array.isArray(S.lastCheck.hints))S.lastCheck=null;
if(S.plan!==15){S.plan=15;S.done={};S.view=null;save()}  // переход со старого плана на 21 день
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===================== ПОМОЩНИКИ ===================== */
const TOTAL=15;
const STAGES=[{n:'Основа',d:'Правила, структура, аргумент'},{n:'Аргументы',d:'Три раздела банка тем, чистая речь'},{n:'Тренировка',d:'Грамотность и полные репетиции'}];
const SECC={1:'var(--s1)',2:'var(--s2)',3:'var(--s3)'};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
function dayStart(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function currentDay(){const s=new Date(S.start+'T00:00:00');const n=Math.floor((dayStart(new Date())-s)/864e5)+1;return Math.min(TOTAL,Math.max(1,n))}
function daysLeft(){return Math.max(0,Math.round((dayStart(EXAM)-dayStart(new Date()))/864e5))}
function tasksDone(i){const d=S.done[i]||{};return DAYS[i-1].tasks.filter((_,k)=>d[k]).length}
function dayState(i){const n=tasksDone(i);return n===0?'':(n===DAYS[i-1].tasks.length?'done':'part')}
function doneDays(){let c=0;for(let i=1;i<=TOTAL;i++)if(dayState(i)==='done')c++;return c}
function dateOfDay(i){const d=new Date(S.start+'T00:00:00');d.setDate(d.getDate()+i-1);return d}
const WD=['вс','пн','вт','ср','чт','пт','сб'], MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fmtShort=d=>`${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}`;
const fmtLong=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
function words(t){return (t.match(/[A-Za-zА-Яа-яЁё0-9]+(?:-[A-Za-zА-Яа-яЁё0-9]+)*/g)||[]).length}
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1900)}
function booksFor(sub){return BOOKS.filter(b=>b.tags.includes(sub))}
const secOf=b=>+b.tags[0][0];
const tag=t=>`<span class="tag" style="--c:${SECC[t[0]]}">${t}</span>`;
function bookChip(id){const b=BOOK[id];return `<button class="chip" style="--c:${SECC[secOf(b)]}" data-sheet="${id}">«${esc(b.t)}»</button>`}
function spine(b){return `<span class="spine" style="--c:${SECC[secOf(b)]}" aria-hidden="true">${(b.t.match(/[А-ЯЁA-Z0-9]/i)||['?'])[0]}</span>`}

const ic=(n,c='')=>`<svg class="ic ${c}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;
function head(title,sub){return `<header class="apphead"><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</header>`}
function ring(p){const r=34,c=2*Math.PI*r;return `<div class="ring" role="img" aria-label="Закрыто дней: ${doneDays()} из ${TOTAL}"><svg viewBox="0 0 84 84"><circle class="bgc" cx="42" cy="42" r="${r}"/><circle class="fgc" cx="42" cy="42" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg><b class="num">${doneDays()}<small>из ${TOTAL}</small></b></div>`}

/* ===================== СЕГОДНЯ ===================== */
function viewToday(){
  const cur=currentDay(), i=S.view||cur, D=DAYS[i-1], st=Math.ceil(i/5), done=S.done[i]||{};
  const n=tasksDone(i), total=D.tasks.length, left=daysLeft();
  const today=new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});

const HAS_APP=!!(window.Android&&window.Android.isApp);   // мост из APK (буфер обмена, Google Объектив)
function timerLeft(){return S.timer.end?Math.round((S.timer.end-Date.now())/1000):S.timer.left}
function fmtT(s){const neg=s<0;s=Math.abs(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (neg?'+':'')+(h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}
function sentences(t){return (t.replace(/\s+/g,' ').match(/[^.!?…]+(?:[.!?…]+|$)/g)||[]).filter(x=>words(x)>0).length}
function paragraphs(t){return t.split(/\n+/).filter(x=>x.trim()).length}

/* Текст из Google Объектива приходит построчно. Склеиваем строки в абзацы:
   абзац заканчивается на короткой строке с точкой в конце (как в тетради) или на пустой строке. */
function cleanOCR(raw){
  let t=String(raw||'').replace(/\r\n?/g,'\n').replace(/[ \t]+/g,' ');
  t=t.replace(/([а-яёa-z])[-‐­]\n\s*([а-яёa-z])/gi,'$1$2');
  const lines=t.split('\n').map(l=>l.trim());
  const lens=lines.filter(Boolean).map(l=>l.length).sort((a,b)=>a-b);
  const med=lens.length?lens[Math.floor(lens.length/2)]:0;
  const paras=[];let cur=[];
  const close=()=>{if(cur.length){paras.push(cur.join(' '));cur=[]}};
  for(const l of lines){
    if(!l){close();continue}
    cur.push(l);
    if(lens.length>3&&/[.!?…»")]$/.test(l)&&l.length<med*0.72)close();
  }
  close();
  return paras.join('\n\n');
}

/* Подсказки по запятым: самые частые пропуски в сочинениях. Это подсказки «проверь», в счёт ошибок не идут. */
const INTRO=['на мой взгляд','по моему мнению','таким образом','во-первых','во-вторых','в-третьих','к сожалению','к счастью','конечно','безусловно','несомненно','например','по-моему','следовательно','итак','кроме того','разумеется','видимо','наверное','с одной стороны','с другой стороны','одним словом','как известно','как правило'];
const PREP='в|во|на|с|со|о|об|обо|к|ко|по|у|из|за|от|для|при|про|через|без|над|под|до|перед|между|среди|благодаря|вопреки|согласно';
function commaHints(text){
  const out=[], seen=new Set();
  const add=(frag,fix,why)=>{const k=frag.toLowerCase();if(seen.has(k))return;seen.add(k);out.push({fragment:frag,fix,rule:why})};
  for(const s of text.match(/[^.!?…]+[.!?…]*/g)||[]){
    const st=s.trim(), low=st.toLowerCase();
    for(const w of INTRO){ if(low.startsWith(w+' ')){const next=st.slice(w.length+1).split(/\s+/)[0]||'';add(st.slice(0,w.length)+' '+next,st.slice(0,w.length)+', '+next,'вводное слово выделяется запятой')} }
  }
  let m;
  const re1=/(^|[^,—–\-\s])\s+((?:тот|та|то|те|того|тех|тому|тем|той|того)\s+(?:кто|что|кого|чего|кому|чему|кем|чем))(?=[\s.,!?])/gi;
  while((m=re1.exec(text))){const p=m[2].split(/\s+/);add(m[2],p[0]+', '+p.slice(1).join(' '),'запятая перед придаточным: «тот, кто», «то, что»')}
  const re2=new RegExp('([а-яё]+)\\s+(?:('+PREP+')\\s+)?(котор[а-яё]+)','gi');
  while((m=re2.exec(text))){const before=text.slice(Math.max(0,m.index-1),m.index);if(/[,—–(]/.test(before)||/^(то|те|тот)$/i.test(m[1]))continue;if(new RegExp('^('+PREP+')$','i').test(m[1]))continue;
    const frag=m[0];const fix=m[1]+', '+(m[2]?m[2]+' ':'')+m[3];add(frag,fix,'придаточное с «который» отделяется запятой')}
  const re3=/([а-яё]{3,})\s+(что|чтобы|потому что|если|но|хотя)(?=\s)/gi;
  const skip=/^(потому|так|то|не|ни|вот|оттого|затем|для|того|тем|ли|лишь|только|даже|и|а|или|все|всё|почти|именно|будто|как)$/i;
  while((m=re3.exec(text))){const prev=text[m.index-1];if(prev===','||skip.test(m[1]))continue;if(/^хотя$/i.test(m[2])&&/^бы\b/i.test(text.slice(m.index+m[0].length).trim()))continue;
    add(m[0],m[1]+', '+m[2],m[2].toLowerCase()==='но'||m[2].toLowerCase()==='хотя'?'запятая перед союзом «'+m[2].toLowerCase()+'»':'запятая перед «'+m[2].toLowerCase()+'» в сложном предложении')}
  return out.slice(0,30);
}

/* Проверка ошибок: бесплатный сервис LanguageTool (нужен интернет, текст отправляется на languagetool.org). */
const ETYPES=['орфография','пунктуация','грамматика','речь'];
const ECOL={'орфография':'var(--red)','пунктуация':'var(--s1)','грамматика':'var(--s2)','речь':'var(--warn)'};
function ltType(m){const c=(m.rule&&m.rule.category&&m.rule.category.id)||'';const it=m.rule&&m.rule.issueType;
  if(c==='TYPOGRAPHY'||c==='WHITESPACE')return null;
  if(c==='TYPOS'||c==='CASING'||it==='misspelling')return 'орфография';
  if(c==='PUNCTUATION'||it==='typographical')return 'пунктуация';
  if(c==='GRAMMAR'||it==='grammar')return 'грамматика';
  return 'речь';}
async function langTool(text,signal){
  const body=new URLSearchParams({text,language:'ru-RU'});
  const r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',body,signal});
  if(!r.ok)throw new Error('http '+r.status);
  const d=await r.json();
  return (d.matches||[]).map(m=>{const type=ltType(m);if(!type)return null;const frag=text.substr(m.offset,m.length);if(!frag.trim()||/\[\?\]/.test(frag))return null;
    return {type,fragment:frag,fix:(m.replacements||[]).slice(0,2).map(x=>x.value).join(' / '),rule:String(m.shortMessage||m.message||'').replace(/^Возможно найдена /,'').slice(0,90)}}).filter(Boolean).slice(0,80);
}
let checking=null;
async function runCheck(source){
  if(checking)return;
  const text=(source==='paper'?S.paper:S.draft.text).trim();
  if(words(text)<10){toast(source==='paper'?'Сначала добавь текст с фото':'Напиши хотя бы пару абзацев');return}
  checking=new AbortController();render(true);scrollToEl('#busy');
  let errors=[], lt=true;
  try{errors=await langTool(text,checking.signal)}catch(e){if(e&&e.name==='AbortError'){checking=null;render(true);return}lt=false}
  S.lastCheck={source,text,errors,lt,hints:commaHints(text),date:new Date().toLocaleDateString('ru-RU'),topic:S.draft.topic};
  save();checking=null;render(true);scrollToEl('#result');
  toast(lt?'Проверка готова':'Нет связи с сервисом ошибок — посчитал только слова и абзацы');
}

function statTiles(t,extra){const w=words(t),p=paragraphs(t),s=sentences(t);
  return `<div class="stat"><b>${w}</b><span>${plural(w,'слово','слова','слов')}</span></div><div class="stat"><b>${p}</b><span>${plural(p,'абзац','абзаца','абзацев')}</span></div><div class="stat"><b>${s}</b><span>предлож.</span></div>${extra}`}
function resultView(c){
  const w=words(c.text);
  const by={}; ETYPES.forEach(t=>by[t]=0); c.errors.forEach(e=>by[e.type]++);
  const lit=by['орфография']+by['пунктуация']+by['грамматика'], allowed=Math.floor(w*5/100), k5=lit<=allowed;
  const vol=w>=350?['ok','Объём',`${w} — норма`]:w>=250?['warn','Объём',`${w} — лучше от 350`]:['bad','Объём',`${w} — меньше 250`];
  const gr=!c.lt?['warn','Грамотность, К5','не проверено: нет интернета']:k5?['ok','Грамотность, К5',`${lit} из ${allowed} допустимых`]:['bad','Грамотность, К5',`${lit} при ${allowed} допустимых`];
  const maxBy=Math.max(1,...Object.values(by));
  const low=c.text.toLowerCase();
  const found=CLICHES.map(x=>[x,(low.match(new RegExp(x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length]).filter(x=>x[1]);
  const freq={};(low.match(/[а-яё]{5,}/g)||[]).forEach(x=>{if(!STOP.has(x))freq[x]=(freq[x]||0)+1});
  const rep=Object.entries(freq).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const errRow=(e,col,tagTxt)=>`<div class="err"><div class="fx"><span class="tag" style="--c:${col}">${tagTxt}</span><s>${esc(e.fragment)}</s>${e.fix?`<span class="caption">→</span><ins>${esc(e.fix)}</ins>`:''}</div>${e.rule?`<div class="why">${esc(e.rule)}</div>`:''}</div>`;
  return `<section class="card" id="result" style="display:flex;flex-direction:column;gap:10px">
    <div><h2 style="font-size:18px">Результат проверки</h2><span class="caption">${c.date}</span></div>
    <div class="stats num">${statTiles(c.text,`<div class="stat ${!c.lt?'':k5?'good':'bad'}"><b>${c.lt?c.errors.length:'—'}</b><span>${c.lt?plural(c.errors.length,'ошибка','ошибки','ошибок'):'ошибки'}</span></div>`)}</div>
    <div class="verdicts">${[vol,gr].map(v=>`<div class="verdict ${v[0]}"><span>${v[1]}</span><b class="num">${v[2]}</b></div>`).join('')}${paragraphs(c.text)<3&&w>150?'<div class="verdict warn"><span>Абзацы</span><b>мало — нужно 4–5</b></div>':''}</div>
    ${c.lt?`<div class="ebars">${ETYPES.map(t=>`<div class="ebar"><span>${t==='речь'?'речевые':t}</span><span class="t"><i style="width:${by[t]/maxBy*100}%;background:${ECOL[t]}"></i></span><b class="num">${by[t]}</b></div>`).join('')}</div>`:''}
    ${found.length||rep.length?`<div class="chips">${found.map(([x,n])=>`<span class="hl">штамп: ${x==='данн'?'данный':x}${n>1?' ×'+n:''}</span>`).join('')}${rep.map(([x,n])=>`<span class="hl">повтор: ${x} ×${n}</span>`).join('')}</div>`:''}
    <p class="caption">Автопроверка находит не все ошибки, особенно в запятых. Это ориентир, а не оценка комиссии.</p>
  </section>
  ${c.errors.length?`<section class="card" style="display:flex;flex-direction:column;gap:4px"><div class="tasks-head"><h2>Ошибки</h2><span class="count num">${c.errors.length}</span></div>
    <div class="errs">${c.errors.map(e=>errRow(e,ECOL[e.type],e.type)).join('')}</div></section>`:''}
  ${c.hints.length?`<section class="card" style="display:flex;flex-direction:column;gap:4px"><div class="tasks-head"><h2>Проверь запятые</h2><span class="count num">${c.hints.length}</span></div>
    <p class="caption">Здесь часто пропускают запятую. Посмотри сам: в счёт ошибок это не входит.</p>
    <div class="errs">${c.hints.map(e=>errRow(e,'var(--s1)','запятая?')).join('')}</div></section>`:''}
  <div class="actions" style="justify-content:center">${c.source==='paper'?'<button class="btn sm" id="saveChecked">Сохранить в мои сочинения</button>':''}<button class="link" id="clearCheck" style="color:var(--muted)">Скрыть результат</button></div>`;
}

  if(el.id==='runText'){runCheck('type');return}
  if(el.id==='runPaper'){runCheck('paper');return}
  if(el.id==='stopCheck'){checking&&checking.abort();return}
  if(el.id==='openLens'){let ok=false;try{ok=window.Android.openLens()}catch(err){}if(!ok)toast('Открой Объектив сам: в камере, в приложении Google или в Google Фото');return}
  if(el.id==='pasteBtn'){if(HAS_APP){let t='';try{t=window.Android.clipboard()||''}catch(err){}if(t.trim())receiveShared(t);else toast('Буфер пуст — сначала скопируй текст в Объективе');return}
    try{navigator.clipboard.readText().then(t=>t&&t.trim()?receiveShared(t):toast('Буфер пуст'),()=>toast('Нажми в поле и вставь текст долгим нажатием'))}catch(err){toast('Нажми в поле и вставь текст долгим нажатием')}return}
  if(el.id==='askClearPaper'){$('#clearZone').innerHTML='<div class="actions"><span class="caption" style="flex:1">Удалить текст из тетради?</span><button class="btn danger sm" id="doClearPaper">Удалить</button><button class="btn ghost sm" id="noClearPaper">Нет</button></div>';return}
  if(el.id==='doClearPaper'){S.paper='';if(S.lastCheck&&S.lastCheck.source==='paper')S.lastCheck=null;save();render(true);return}
  if(el.id==='noClearPaper'){$('#clearZone').innerHTML='';return}
  if(el.id==='saveChecked'){const c=S.lastCheck;S.essays.unshift({topic:S.draft.topic,text:c.text,words:words(c.text),errors:c.lt?c.errors.length:undefined,date:c.date});save();render(true);toast('Сочинение сохранено');return}
  if(el.id==='clearCheck'){S.lastCheck=null;save();render(true);return}
  if(d.sheet){openSheet(d.sheet);return}
  if(d.goday){S.view=+d.goday===currentDay()?null:+d.goday;save();nav('today');return}
  if(d.go){go(d.go);return}
  if(d.ref){S.refTab=d.ref;if(d.ref==='quiz')quiz={i:0,score:0,picked:null};save();render(true);return}
  if(d.topic){S.draft.topic=d.topic;save();nav('write');toast('Тема открыта в тренажёре');return}
  if(d.copy){const txt=d.copy;const ok=()=>toast('Скопировано');try{navigator.clipboard.writeText(txt).then(ok,()=>toast('Не получилось скопировать'))}catch(err){toast('Не получилось скопировать')}return}
  if(d.opt!==undefined){quiz.picked=+d.opt;if(+d.opt===QUIZ[quiz.i].a)quiz.score++;render(true);return}
  if(el.id==='quizNext'){quiz.i++;quiz.picked=null;render(true);return}
  if(el.id==='quizAgain'){quiz={i:0,score:0,picked:null};render(true);return}
  if(d.filter){S.bookFilter=d.filter;flash.id=null;save();render(true);return}
  if(d.mode){S.bookMode=d.mode;save();render(true);return}
  if(d.fl){if(d.fl==='open')flash.open=true;else{S.books[flash.id]=Object.assign({},S.books[flash.id],{known:d.fl==='know'});save();const l=bookList();flash.id=pickFlash(l.length?l:BOOKS);flash.open=false}render(true);return}
  if(el.id==='setStart'){const v=$('#startDate').value;if(v){S.start=v;S.view=null;save();render(true);toast('Дата старта сохранена')}return}
  if(el.id==='askReset'){$('#resetZone').innerHTML='<div style="display:flex;flex-direction:column;gap:10px"><span>Удалить отметки, сочинения и черновик? Это нельзя отменить.</span><div class="actions"><button class="btn danger sm" id="doReset">Да, сбросить</button><button class="btn ghost sm" id="noReset">Отмена</button></div></div>';return}
  if(el.id==='noReset'){render(true);return}
  if(el.id==='doReset'){S=fresh();save();render();toast('Прогресс сброшен');return}
  if(el.id==='rndTopic'){const x=ALL_TOPICS[Math.floor(Math.random()*ALL_TOPICS.length)];S.draft.topic=x.t;save();$('#topic').value=x.t;toast('Подраздел '+x.sub);return}
  if(d.dur){const s=+d.dur*60;S.timer={dur:s,end:null,left:s};save();render(true);return}
  if(el.id==='tStart'){if(S.timer.end){S.timer.left=timerLeft();S.timer.end=null}else{S.timer.end=Date.now()+S.timer.left*1000}save();render(true);return}
  if(el.id==='tReset'){S.timer={dur:S.timer.dur,end:null,left:S.timer.dur};save();render(true);return}
  if(el.id==='tbDone'){const t=document.activeElement;t&&t.blur&&t.blur();return}
  if(el.id==='saveEssay'){const w=words(S.draft.text);if(!w){toast('Сначала напиши текст');return}const ck=S.lastCheck&&S.lastCheck.source==='type'&&S.lastCheck.lt&&S.lastCheck.text===S.draft.text?S.lastCheck.errors.length:undefined;S.essays.unshift({topic:S.draft.topic,text:S.draft.text,words:w,errors:ck,date:new Date().toLocaleDateString('ru-RU')});save();render(true);toast('Сочинение сохранено');return}
  if(el.id==='newEssay'){S.draft={topic:'',text:''};S.check={};S.timer={dur:S.timer.dur,end:null,left:S.timer.dur};save();render();return}
  if(d.open!==undefined){const x=S.essays[+d.open];S.draft={topic:x.topic,text:x.text};S.writeMode='type';save();render();toast('Открыто в редакторе');return}
  if(d.del!==undefined){const k=+d.del;$('#ed-'+k).innerHTML=`<button class="btn danger sm" data-delok="${k}">Удалить</button><button class="btn ghost sm" data-delno="1">Нет</button>`;return}
  if(d.delok!==undefined){S.essays.splice(+d.delok,1);save();render(true);return}
  if(d.delno){render(true);return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.day){const i=+el.dataset.day,k=+el.dataset.k;S.done[i]=S.done[i]||{};S.done[i][k]=el.checked;save();
    el.closest('li').classList.toggle('done',el.checked);
    setTimeout(()=>{render(true);if(el.checked&&dayState(i)==='done')toast('День '+i+' закрыт!')},220);return}
  if(el.dataset.read){const id=el.dataset.read;S.books[id]=Object.assign({},S.books[id],{read:el.checked});save();toast(el.checked?'Добавлено в твою базу':'Убрано из базы');return}
  if(el.dataset.check){S.check[el.dataset.check]=el.checked;el.closest('li').classList.toggle('done',el.checked);save();
    const c=el.closest('section').querySelector('.count');if(c)c.textContent=Object.values(S.check).filter(Boolean).length+' из 5';return}
});
let tmr;
document.addEventListener('input',e=>{
  if(e.target.id==='essay'){S.draft.text=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{save();renderStats()},250)}
  if(e.target.id==='paper'){S.paper=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{save();renderStats()},250)}
  if(e.target.id==='topic'){S.draft.topic=e.target.value;save()}
});
document.addEventListener('focusin',e=>{if(e.target.classList&&e.target.classList.contains('paper')){document.body.classList.add('typing');renderStats();tick()}});
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('paper'))document.body.classList.remove('typing')});
function tick(){const s=timerLeft();const t=$('#timer');if(t&&S.timer.end){t.textContent=fmtT(s);t.classList.toggle('over',s<0)}const tb=$('#tbTimer');if(tb)tb.textContent=S.timer.end?'⏱ '+fmtT(s):''}
setInterval(tick,1000);

render();
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>

</body>
</html>
