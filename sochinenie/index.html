<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зачёт: ЕГЭ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Зачёт: ЕГЭ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Golos+Text:wght@400;500;600&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap">
<style>
/* Школьная тетрадь, собранная как приложение: чернильно-синяя обложка-герой в клетку с красной линией полей,
   белые листы-карточки, красная ручка учителя для отметок. Одна колонка, плавающая нижняя панель. */
:root{
  --bg:#f3f5fa; --surface:#ffffff; --surface-2:#eef1f8; --fg:#141a33; --muted:#5f6786; --line:#e1e5f0;
  --ink:#2f45c8; --ink-2:#e6eafc; --on-ink:#ffffff;
  --red:#d4372c; --red-2:#fdecea; --ok:#1d8a52; --ok-2:#e3f5eb; --warn:#9a5c00; --warn-2:#fff1d9;
  --s1:#2f45c8; --s2:#8a3fa6; --s3:#1f7a64;
  --hero:#2235a8; --hero-fg:#ffffff; --hero-mute:rgba(255,255,255,.74); --hero-line:rgba(255,255,255,.08); --pen:#ff8a7e;
  --shadow:0 1px 2px rgba(22,32,90,.05),0 8px 24px rgba(22,32,90,.07);
  --navbg:rgba(255,255,255,.9); --scrim:rgba(14,18,40,.42);
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --r:16px; --r-s:12px; --nav-h:56px; --ol:#1d2340;
  --c-rus:#2f45c8; --c-mathp:#c8322a; --c-mathb:#c45a1c; --c-phys:#1b6f8c; --c-chem:#1d8048; --c-inf:#5b3fc4; --c-bio:#3d7f1c; --c-hist:#8f5600; --c-soc:#a3325f; --c-geo:#0d746f; --c-lit:#8a3fa6; --c-eng:#b0283f; --c-deu:#4a4a5e; --c-fra:#2a5bd7; --c-spa:#b4400e; --c-chi:#b01c1c; --lg-b:#a5622f; --lg-s:#6f7a8c; --lg-g:#b58300; --lg-p:#16857a; --lg-d:#3d63e0; --on-c:#ffffff;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1120; --surface:#171b2c; --surface-2:#1f2438; --fg:#e9ebf5; --muted:#9ba2c0; --line:#283050;
  --ink:#93a5ff; --ink-2:#232a4b; --on-ink:#0e1120;
  --red:#ff6f63; --red-2:#3a1e23; --ok:#5ad08f; --ok-2:#15301f; --warn:#f2b24c; --warn-2:#33270f;
  --s1:#93a5ff; --s2:#d68fec; --s3:#5ccaac;
  --hero:#1c256c; --hero-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px var(--line); --navbg:rgba(23,27,44,.9); --scrim:rgba(0,0,0,.55); --c-rus:#93a5ff; --c-mathp:#ff7a6e; --c-mathb:#ff9a66; --c-phys:#5cc3e6; --c-chem:#5ad08f; --c-inf:#a993ff; --c-bio:#8ed05c; --c-hist:#f2b24c; --c-soc:#f08ab5; --c-geo:#4fd1c9; --c-lit:#d68fec; --c-eng:#ff7d92; --c-deu:#b9b9cc; --c-fra:#88a8ff; --c-spa:#fb923c; --c-chi:#f87171; --lg-b:#d9955f; --lg-s:#b4bdcc; --lg-g:#f2c94c; --lg-p:#4fd1c0; --lg-d:#8fb0ff; --on-c:#0e1120; --ol:#cdd3ea; color-scheme:dark}}
:root[data-theme="dark"]{ --ol:#cdd3ea;
  --bg:#0e1120; --surface:#171b2c; --surface-2:#1f2438; --fg:#e9ebf5; --muted:#9ba2c0; --line:#283050;
  --ink:#93a5ff; --ink-2:#232a4b; --on-ink:#0e1120;
  --red:#ff6f63; --red-2:#3a1e23; --ok:#5ad08f; --ok-2:#15301f; --warn:#f2b24c; --warn-2:#33270f;
  --s1:#93a5ff; --s2:#d68fec; --s3:#5ccaac;
  --hero:#1c256c; --hero-line:rgba(255,255,255,.06);
  --shadow:0 0 0 1px var(--line); --navbg:rgba(23,27,44,.9); --scrim:rgba(0,0,0,.55); --c-rus:#93a5ff; --c-mathp:#ff7a6e; --c-mathb:#ff9a66; --c-phys:#5cc3e6; --c-chem:#5ad08f; --c-inf:#a993ff; --c-bio:#8ed05c; --c-hist:#f2b24c; --c-soc:#f08ab5; --c-geo:#4fd1c9; --c-lit:#d68fec; --c-eng:#ff7d92; --c-deu:#b9b9cc; --c-fra:#88a8ff; --c-spa:#fb923c; --c-chi:#f87171; --lg-b:#d9955f; --lg-s:#b4bdcc; --lg-g:#f2c94c; --lg-p:#4fd1c0; --lg-d:#8fb0ff; --on-c:#0e1120; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.18;letter-spacing:-.01em}
p{margin:0}
ul,ol{margin:0}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.num{font-variant-numeric:tabular-nums}
.caption{font-size:13px;color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.view-in{animation:viewIn .22s ease-out}
@keyframes viewIn{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}

/* заголовки экранов */
.apphead{display:flex;flex-direction:column;gap:2px;padding:6px 2px 0}
.apphead h1{font-size:25px}
.apphead .sub{font-size:13px;color:var(--muted)}
.brandline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0}
.mark{font-family:var(--f-hand);font-weight:700;font-size:26px;line-height:1;color:var(--red);transform:rotate(-4deg);display:inline-block}
.mark small{font-family:var(--f-body);font-size:13px;font-weight:600;color:var(--muted);margin-left:6px;transform:rotate(4deg);display:inline-block;letter-spacing:.02em}

/* карточки */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.card.tight{padding:2px 14px}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.card-title h2{font-size:18px}

/* герой: обложка тетради */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:14px 14px 8px 28px;color:var(--hero-fg);background-color:var(--hero);
  background-image:linear-gradient(var(--hero-line) 1px,transparent 1px),linear-gradient(90deg,var(--hero-line) 1px,transparent 1px);background-size:18px 18px}
.hero::before{content:"";position:absolute;top:0;bottom:0;left:16px;width:2px;background:var(--pen);opacity:.85}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hero-num{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:.95;letter-spacing:-.03em}
.hero-lbl{font-size:14px;font-weight:600;margin-top:3px}
.hero-lbl span{display:block;font-weight:400;color:var(--hero-mute);font-size:12px}
.ring{position:relative;width:62px;height:62px;flex:none}
.ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bgc{stroke:rgba(255,255,255,.16)}
.ring .fgc{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .5s ease}
.ring b{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display);font-size:16px;line-height:1}
.ring b small{display:block;font:500 10px/1.3 var(--f-body);color:var(--hero-mute)}
.track{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.track .stage{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.dot{border:0;background:none;padding:8px 0;display:block;min-width:0}
.dot i{display:block;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:transform .15s}
.dot.part i{background:rgba(255,255,255,.55)}
.dot.done i{background:#fff}
.dot.cur i{background:var(--pen);transform:scaleY(1.5)}
.dot.cur.done i{background:#fff;box-shadow:0 0 0 2px var(--pen)}
.dot.sel:not(.cur) i{outline:2px solid #fff;outline-offset:2px}
.track-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--hero-mute);font-weight:500}

/* урок дня */
.lesson{display:flex;flex-direction:column;gap:10px}
.lesson-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--ink-2);color:var(--ink);letter-spacing:.02em}
.pill.red{background:var(--red-2);color:var(--red)}
.pill.ok{background:var(--ok-2);color:var(--ok)}
.lesson-title{font-size:21px}
.lesson-title .daynum{display:block;font-family:var(--f-hand);color:var(--red);font-size:19px;font-weight:700;line-height:1.1;letter-spacing:0;transform:rotate(-2deg);transform-origin:left;margin-bottom:1px}
.prose{display:flex;flex-direction:column;gap:8px;font-size:15px}
.prose ul,.prose ol{padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prose.closed{max-height:170px;overflow:hidden;-webkit-mask-image:linear-gradient(#000 55%,transparent);mask-image:linear-gradient(#000 55%,transparent)}
.more{align-self:flex-start;margin-top:-4px}
.prose li::marker{color:var(--muted)}
.prose b{font-weight:600}
.note{background:var(--surface-2);border-radius:var(--r-s);padding:9px 12px;font-size:14px}
.note.red{background:var(--red-2)}
.example{position:relative;background:var(--surface-2);border-radius:var(--r-s);padding:26px 12px 10px;font-family:var(--f-display);font-style:italic;font-size:14.5px;line-height:1.55}
.example::before{content:"пример";position:absolute;top:3px;left:12px;font:700 19px/1.2 var(--f-hand);font-style:normal;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:9px 16px;min-height:42px;font-weight:600;background:var(--ink);color:var(--on-ink);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.soft{background:var(--ink-2);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.wide{flex:1}
.iconbtn{display:inline-grid;place-content:center;width:42px;height:42px;border-radius:12px;border:0;background:var(--surface-2);color:var(--fg);flex:none}
.link{background:none;border:0;padding:6px 0;color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:6px}

/* задания */
.tasks{position:relative}
.tasks-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.tasks-head h2{font-size:18px}
.count{font-weight:600;color:var(--muted);font-size:14px}
.minibar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin:8px 0 2px}
.minibar i{display:block;height:100%;background:var(--red);border-radius:3px;transition:width .35s ease}
.checklist{list-style:none;padding:0;display:flex;flex-direction:column}
.checklist li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.checklist li:first-child{border-top:0}
.checklist label{flex:1;min-width:0;cursor:pointer;padding-top:2px;transition:color .2s}
.checklist li.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:1.5px}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-content:center;transition:background .15s,border-color .15s}
.chk::after{content:"";width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:translateY(-1px) rotate(-45deg) scale(0);transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.chk:checked{background:var(--red);border-color:var(--red)}
.chk:checked::after{transform:translateY(-1px) rotate(-45deg) scale(1)}
.stamp{position:absolute;top:8px;right:14px;font:700 26px/1 var(--f-hand);color:var(--red);border:2.5px solid var(--red);border-radius:12px;padding:2px 12px 6px;transform:rotate(-9deg);animation:stamp .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp{from{transform:rotate(-20deg) scale(1.8);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
.daynav{display:flex;justify-content:space-between;gap:8px}

/* книги-подсказки и теги */
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px;color:var(--c,var(--ink));background:var(--surface-2);background:color-mix(in srgb,var(--c,var(--ink)) 13%,transparent)}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface-2);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:500;min-height:32px;text-align:left}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink));flex:none}
.subbooks{display:flex;flex-direction:column;gap:8px;padding-top:6px;border-top:1px solid var(--line)}
.subbooks .lbl{font-size:13px;font-weight:600;margin-bottom:6px}
.subbooks .lbl span{color:var(--muted);font-weight:500}

/* сегменты и фильтры */
.seg{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button .ic{width:17px;height:17px;vertical-align:-3px;margin-right:5px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(20,30,80,.12)}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-left,0px))}
.scroller::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600;min-height:34px;color:var(--muted)}
.fchip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}

/* план: лента */
.stagehead{display:flex;align-items:center;gap:14px}
.stagenum{width:36px;height:36px;border-radius:11px;display:grid;place-content:center;font-family:var(--f-display);font-weight:700;font-size:18px;background:var(--ink-2);color:var(--ink);flex:none}
.stagehead h2{font-size:17px}
.stagehead .caption{margin-top:2px}
.stagehead .count{margin-left:auto}
.timeline{position:relative;display:flex;flex-direction:column;margin-top:6px}
.timeline::before{content:"";position:absolute;left:14px;top:18px;bottom:18px;width:2px;background:var(--line)}
.tl{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:6px 0}
.tl-node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-content:center;font-weight:700;font-size:13px;background:var(--surface);border:2px solid var(--line);color:var(--muted)}
.tl.part .tl-node{border-color:var(--warn);color:var(--warn);background:var(--warn-2)}
.tl.done .tl-node{background:var(--ok);border-color:var(--ok);color:#fff}
.tl.done .tl-node .ic{width:15px;height:15px;stroke-width:3}
.tl.cur .tl-node{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 0 4px var(--red-2)}
.tl-body{flex:1;min-width:0;display:flex;flex-direction:column}
.tl-title{font-weight:600;line-height:1.3;font-size:14.5px}
.tl.done .tl-title{color:var(--muted)}
.tl-sub{font-size:12px;color:var(--muted)}

/* справка */
.formula{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fk{display:inline-grid;place-content:center;min-width:38px;height:38px;padding:0 8px;border-radius:12px;font-weight:700;font-family:var(--f-display);font-size:17px;background:var(--surface-2);color:var(--fg)}
.fk.m{background:var(--ink);color:var(--on-ink)}
.op{font-weight:700;color:var(--muted);font-size:18px}
.fgroup{display:inline-flex;align-items:center;gap:4px;padding:4px;border-radius:15px;border:1.5px dashed var(--muted)}
.fgroup .fk{min-width:36px;height:36px;font-size:15px}
.fgroup small{font-size:11px;color:var(--muted);padding:0 4px;line-height:1.2;max-width:52px}
.stampmini{font:700 26px/1 var(--f-hand);color:var(--red);border:2px solid var(--red);border-radius:10px;padding:1px 9px 5px;transform:rotate(-6deg)}
.rows{display:flex;flex-direction:column}
.rowi{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.rowi:first-child{border-top:0}
.rowi .fk{flex:none}
.rowi .fk.req{background:var(--red-2);color:var(--red)}
.rowi h3{font-family:var(--f-body);font-size:15px;font-weight:600;letter-spacing:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rowi p{color:var(--muted);font-size:14px;margin-top:1px}
.sbar{display:flex;gap:3px;height:30px;border-radius:10px;overflow:hidden}
.sbar span{display:grid;place-content:center;font-size:12px;font-weight:700;color:#fff;min-width:0}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.legend .li{display:flex;gap:12px}
.legend .sw{width:12px;height:12px;border-radius:4px;margin-top:6px;flex:none}
.secthead{display:flex;gap:12px;align-items:flex-start}
.secthead .bar{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.secthead h2{font-size:17px}
details.acc{border-top:1px solid var(--line)}
details.acc>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 0;font-size:14.5px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary .idx{flex:none;font-weight:700;font-size:13px;color:var(--c);background:var(--surface-2);background:color-mix(in srgb,var(--c) 13%,transparent);border-radius:8px;padding:3px 7px}
details.acc>summary .nm{flex:1;min-width:0;font-weight:500;line-height:1.35}
details.acc>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s;flex:none}
details.acc[open]>summary::after{transform:rotate(225deg);margin-bottom:-4px}
.acc-body{display:flex;flex-direction:column;gap:10px;padding:0 0 12px}
.kv .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}
.topic-list{display:flex;flex-direction:column;gap:6px}
.topic{display:flex;align-items:center;gap:10px;justify-content:space-between;text-align:left;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-weight:500;font-size:14px;width:100%}
.topic .ic{width:18px;height:18px;color:var(--ink)}
.phr{display:flex;flex-direction:column;gap:6px}
.phr button{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px;width:100%}
.phr button .ic{width:17px;height:17px;color:var(--muted)}
.qprog{display:flex;gap:4px}
.qprog i{flex:1;height:5px;border-radius:3px;background:var(--surface-2)}
.qprog i.on{background:var(--ink)}
.qopt{display:flex;align-items:center;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;width:100%;font-weight:500;min-height:46px}
.qopt .lt{flex:none;width:28px;height:28px;border-radius:9px;display:grid;place-content:center;background:var(--surface-2);font-weight:700;font-size:13px}
.qopt.right{border-color:var(--ok);background:var(--ok-2)}
.qopt.right .lt{background:var(--ok);color:#fff}
.qopt.wrong{border-color:var(--red);background:var(--red-2)}
.qopt.wrong .lt{background:var(--red);color:#fff}
.bigmark{font:700 52px/1 var(--f-hand);color:var(--red);transform:rotate(-6deg);display:inline-block}

/* книги */
.blist{display:flex;flex-direction:column}
.brow{display:flex;gap:12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:8px 0;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.spine{position:relative;width:34px;height:46px;border-radius:3px 7px 7px 3px;background:var(--c);flex:none;display:grid;place-content:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:17px;overflow:hidden}
.spine::before{content:"";position:absolute;left:4px;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
.brow-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.brow-title{font-family:var(--f-display);font-weight:700;font-size:15px;line-height:1.25}
.brow-author{font-size:12.5px;color:var(--muted)}
.brow .tagrow .tag{font-size:11px;padding:1px 6px}
.brow .mine{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-content:center}
.brow .mine .ic{width:15px;height:15px;stroke-width:3}
.empty{display:flex;flex-direction:column;gap:10px;align-items:flex-start;padding:10px 0}
.flash{display:flex;flex-direction:column;gap:10px;overflow:hidden;padding:0}
.flash-top{height:8px;background:var(--c)}
.flash-in{padding:4px 14px 14px;display:flex;flex-direction:column;gap:10px}
.flash-title{font-family:var(--f-display);font-weight:700;font-size:23px;line-height:1.15}
.flash .hint{background:var(--surface-2);border-radius:var(--r-s);padding:14px;color:var(--muted)}

/* выдвижная панель */
.sheet-wrap{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:var(--scrim);animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet-handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 4px}
.sheet-head{display:flex;gap:14px;align-items:flex-start}
.sheet-head .spine{width:42px;height:56px;font-size:20px}
.sheet-head .t{flex:1;min-width:0}
.sheet-title{font-size:21px;margin-top:2px}
.eps{list-style:none;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:ep}
.eps li{counter-increment:ep;display:flex;gap:10px;font-size:14px}
.eps li::before{content:counter(ep);flex:none;width:22px;height:22px;border-radius:8px;display:grid;place-content:center;background:var(--surface-2);font-weight:700;font-size:12px;color:var(--c,var(--ink));margin-top:1px}
.quote{font-family:var(--f-display);font-style:italic;font-size:15px;line-height:1.5;padding:2px 0 2px 12px;border-left:3px solid var(--red)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:var(--r-s);padding:9px 12px;font-weight:600;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;margin:0;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--ok)}
.switch input:checked::after{transform:translateX(20px)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* тренажёр */
.field{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--surface);font-size:16px;min-height:42px}
.field:focus{border-color:var(--ink);outline:none}
.topicrow{display:flex;gap:8px}
.timerbox{display:flex;align-items:center;gap:14px}
.timer{font-family:var(--f-display);font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em;color:var(--fg);flex:1;min-width:0}
.timer.run{color:var(--ink)}
.timer.over{color:var(--red)}
.play{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-content:center;flex:none}
.play .ic{width:20px;height:20px}
.sheetpaper{position:relative}
textarea.paper{display:block;width:100%;min-height:48vh;resize:vertical;border:0;border-radius:var(--r);padding:14px 14px 14px 42px;box-shadow:var(--shadow);
  background-color:var(--surface);
  background-image:linear-gradient(90deg,transparent 30px,var(--red) 30px,var(--red) 31.5px,transparent 31.5px),repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);
  background-attachment:local;background-position:0 14px;line-height:28px;font-size:16px;font-family:var(--f-body)}
textarea.paper:focus{outline:2px solid var(--ink);outline-offset:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.stat{background:var(--surface-2);border-radius:var(--r-s);padding:8px 4px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-size:21px;line-height:1.15}
.stat span{font-size:11px;color:var(--muted)}
.stat.bad b{color:var(--red)}
.stat.good b{color:var(--ok)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--surface-2);margin:6px 0 22px}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:5px;transition:width .25s}
.meter .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--muted);opacity:.5}
.meter .mk span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.hl{display:inline-block;background:var(--warn-2);color:var(--warn);border-radius:8px;padding:3px 8px;font-size:13px;font-weight:600}
.essay{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.essay:first-child{border-top:0}
.essay .meta{flex:1;min-width:0}
.essay b{display:block;font-weight:600;line-height:1.3}
.typebar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;align-items:center;gap:12px;background:var(--navbg);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));font-size:14px;font-weight:600}
.typebar .w{flex:1}
body.typing .typebar{display:flex}
body.typing nav.tabs{display:none}

/* нижняя панель */
nav.tabs{position:fixed;z-index:20;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  max-width:480px;margin:0 auto;height:var(--nav-h);border-radius:18px;background:var(--navbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(20,30,80,.14);display:grid;grid-template-columns:repeat(4,1fr);padding:0 4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600}
nav.tabs a .pi{display:grid;place-content:center;width:46px;height:26px;border-radius:13px;transition:background .2s}
nav.tabs a .ic{width:20px;height:20px}
nav.tabs a[aria-current="page"]{color:var(--fg)}
nav.tabs a[aria-current="page"] .pi{background:var(--ink-2);color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 22px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;white-space:nowrap;animation:toast .25s ease-out}
@keyframes toast{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition:none!important;animation:none!important}}
/* проверка сочинения из тетради */
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
.steps li::marker{color:var(--red);font-weight:700}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.shot{position:relative;aspect-ratio:3/4;max-width:100%;border-radius:10px;overflow:hidden;background:var(--surface-2)}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot b{position:absolute;left:5px;top:5px;background:var(--fg);color:var(--bg);font-size:11px;border-radius:6px;padding:0 5px}
.shot button{position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-content:center;padding:0}
.shot button .ic{width:14px;height:14px;stroke-width:2.5}
.pick{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:var(--r-s);padding:16px 12px;text-align:center;background:none;width:100%;color:var(--fg)}
.pick .ic{width:28px;height:28px;color:var(--ink)}
.pick b{font-weight:600}
.busy{display:flex;align-items:center;gap:12px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink-2);border-top-color:var(--ink);animation:spin .9s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.verdicts{display:flex;flex-direction:column;gap:6px}
.verdict{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:14px}
.verdict.ok{background:var(--ok-2)}.verdict.ok b{color:var(--ok)}
.verdict.warn{background:var(--warn-2)}.verdict.warn b{color:var(--warn)}
.verdict.bad{background:var(--red-2)}.verdict.bad b{color:var(--red)}
.ebars{display:flex;flex-direction:column;gap:6px}
.ebar{display:grid;grid-template-columns:96px 1fr 26px;gap:8px;align-items:center;font-size:13px}
.ebar .t{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.ebar .t i{display:block;height:100%;border-radius:4px}
.errs{display:flex;flex-direction:column}
.err{display:flex;flex-direction:column;gap:3px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.err:first-child{border-top:0}
.err .fx{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.err s{color:var(--red);text-decoration-thickness:1.5px}
.err ins{color:var(--ok);text-decoration:none;font-weight:600}
.err .why{color:var(--muted);font-size:13px}
.recog{white-space:pre-wrap;font-family:var(--f-display);font-size:14.5px;line-height:1.6;background:var(--surface-2);border-radius:var(--r-s);padding:10px 12px;max-height:320px;overflow:auto}
@media (min-width:600px){.hero{padding:18px 20px 10px 34px}.hero::before{left:20px}.lesson-title{font-size:24px}}

/* 2D-иллюстрации */

.lvlb .art{position:absolute;inset:0}
.lvlb b{position:relative;font-family:var(--f-display);font-size:22px;color:#1d2340;margin-top:-4px}
.lvl>b{display:none}
.hero-stats .art{width:18px;height:18px}
.qi .art{width:30px;height:30px}
.qi{background:var(--surface-2)!important;width:44px;height:44px;border-radius:13px}
.srow{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;width:100%}
.shead-top{align-items:center}
.onb{display:block}
.onb-owl{float:right;margin:-4px -2px 0 8px}
.qcard .fb{flex-direction:row;align-items:flex-start;gap:10px}

.phead .apphead{padding:0}
.league .art{margin:-2px 0}
.empty .owl{align-self:center}

/* ===== ЕГЭ ===== */

.rs b{font-family:var(--f-display);font-size:20px;color:var(--fg)}
.rs b.up{color:var(--ok)}.rs b.down{color:var(--red)}
.levelup{display:flex;align-items:center;gap:8px;background:var(--warn-2);color:var(--warn);font-weight:600;border-radius:12px;padding:8px 12px;margin-top:6px;font-size:14px;text-align:left}
.levelup.ach-up{background:var(--ok-2);color:var(--ok)}
.fcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:250px;border:0;border-top:4px solid var(--c);text-align:center;width:100%;color:var(--fg)}
.fcard .ff{font-family:var(--f-display);font-size:21px;font-weight:700;line-height:1.35}
.fcard.flip .ff{font-family:var(--f-body);font-size:16px;font-weight:500;text-align:left;align-self:stretch}
.league{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px 3px 6px;border-radius:99px;color:var(--lc);background:var(--surface-2);background:color-mix(in srgb,var(--lc) 15%,transparent)}
.league .ic{width:15px;height:15px}
.league.big{font-size:13px;padding:4px 11px 4px 7px}
.lg-b{--lc:var(--lg-b)}.lg-s{--lc:var(--lg-s)}.lg-g{--lc:var(--lg-g)}.lg-p{--lc:var(--lg-p)}.lg-d{--lc:var(--lg-d)}
.lrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.rows .lrow:first-child{border-top:0}
.lb{display:flex;flex-direction:column;gap:4px}
.lbrow{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px}
.lbrow.me{background:var(--ink-2)}
.pos{width:20px;text-align:center;font-weight:700;color:var(--muted)}
.ava{width:34px;height:34px;border-radius:50%;display:grid;place-content:center;font-weight:700;color:#fff;background:hsl(var(--h) 55% 45%);flex:none}
.sc{font-size:14px;white-space:nowrap}
.iconbtn.sm{width:30px;height:30px;border-radius:9px;background:transparent}
.iconbtn.sm .ic{width:16px;height:16px;color:var(--muted)}
.achs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px;padding:10px 6px;border-radius:12px;background:var(--surface-2);opacity:.55}
.ach.on{opacity:1;background:var(--warn-2)}
.ai{width:34px;height:34px;border-radius:50%;display:grid;place-content:center;background:var(--surface);color:var(--muted)}
.ach.on .ai{color:var(--warn)}
.ach b{font-size:12.5px;font-weight:600;line-height:1.2}
.ach span:last-child{font-size:10.5px;color:var(--muted);line-height:1.25}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mtile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:10px;text-align:left;min-width:0;color:var(--fg)}
.mtile b{font-weight:600;font-size:14px;margin-top:6px}
.mtile .caption{font-size:11.5px;line-height:1.3}
.mtile:disabled{opacity:.5}
.tlist{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;text-align:left;padding:10px 0;border-top:1px solid var(--line);color:var(--fg)}
.tlist .trow:first-child{border-top:0}
.trow>.ic{color:var(--muted);width:16px;height:16px}
.tk{flex:none;min-width:38px;height:30px;padding:0 6px;border-radius:9px;display:grid;place-content:center;font-weight:700;font-size:12px;color:var(--c);background:var(--surface-2);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.tb b{font-weight:600;font-size:14.5px;line-height:1.3}
.tb .sbar2{height:4px}
@media (max-width:359px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:359px){.quick{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr}.achs{grid-template-columns:repeat(2,minmax(0,1fr))}}

const P=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const term=(c,v,first)=>c===0?'':(c<0?(first?'−':' − '):(first?'':' + '))+(Math.abs(c)===1?'':Math.abs(c))+v;
function distract(ans,spread){const s=new Set([ans]);let g=0;while(s.size<4&&g++<50){const d=ans+P([-1,1])*R(1,spread);if(d!==ans)s.add(d)}return [...s]}
function mcqNum(q,ans,spread,extra){const opts=shuffle(distract(ans,spread||5));return Object.assign({q,o:opts.map(nf),a:opts.indexOf(ans)},extra)}

   return inp(`В сборнике ${n} билетов, в ${k} из них встречается вопрос по теме «Логарифмы». Найдите вероятность того, что в случайно выбранном билете есть этот вопрос.`,k/n,{t:'Теория вероятностей',k:'Задание 4',e:`P = ${k}/${n} = ${nf(k/n)}.`})},
 prob2:()=>{const p1=R(80,98),p2=R(40,p1-5);
   return inp(`Вероятность того, что чайник прослужит больше года, равна ${nf(p1/100)}, а больше двух лет — ${nf(p2/100)}. Найдите вероятность того, что он прослужит больше года, но меньше двух лет.`,(p1-p2)/100,{t:'Теория вероятностей',k:'Задание 5',e:`${nf(p1/100)} − ${nf(p2/100)} = ${nf((p1-p2)/100)}.`})},
 prob3:()=>{const p=P([.5,.6,.8,.9]),q=P([.5,.7,.8,.9]);
   return inp(`Два стрелка независимо стреляют по мишени. Вероятность попадания первого ${nf(p)}, второго ${nf(q)}. Найдите вероятность того, что оба попадут.`,p*q,{t:'Теория вероятностей',k:'Задание 5',e:`Независимые события: ${nf(p)} · ${nf(q)} = ${nf(p*q)}.`})},
 pyth:()=>{const t=P([[3,4,5],[5,12,13],[8,15,17],[7,24,25],[6,8,10]]),m=R(1,3);
   return inp(`Катеты прямоугольного треугольника равны ${t[0]*m} и ${t[1]*m}. Найдите гипотенузу.`,t[2]*m,{t:'Планиметрия',k:'Задание 1',e:`c = √(${t[0]*m}² + ${t[1]*m}²) = ${t[2]*m}.`})},
 triarea:()=>{const a=R(2,20),b=R(2,20)*2;
   return inp(`Катеты прямоугольного треугольника равны ${a} и ${b}. Найдите его площадь.`,a*b/2,{t:'Планиметрия',k:'Задание 1',e:`S = ½·${a}·${b} = ${a*b/2}.`})},
 vec:()=>{const a=R(-6,6),b=R(-6,6),c=R(-6,6),d=R(-6,6);
   return inp(`Даны векторы a(${a}; ${b}) и b(${c}; ${d}). Найдите скалярное произведение a·b.`,a*c+b*d,{t:'Векторы',k:'Задание 2',e:`${a}·${c} + ${b}·${d} = ${a*c+b*d}.`})},
 box:()=>{const t=P([[1,2,2,3],[2,3,6,7],[1,4,8,9],[2,6,9,11],[4,4,7,9],[2,10,11,15]]);
   return inp(`Рёбра прямоугольного параллелепипеда равны ${t[0]}, ${t[1]} и ${t[2]}. Найдите его диагональ.`,t[3],{t:'Стереометрия',k:'Задание 3',e:`d = √(${t[0]}² + ${t[1]}² + ${t[2]}²) = √${t[3]*t[3]} = ${t[3]}.`})},
 meet:()=>{const v1=R(4,12)*5,v2=R(4,12)*5,t=R(1,5);const S=(v1+v2)*t;
   return inp(`Из двух городов, расстояние между которыми ${S} км, одновременно навстречу друг другу выехали два автомобиля со скоростями ${v1} и ${v2} км/ч. Через сколько часов они встретятся?`,t,{t:'Текстовые задачи',k:'Задание 10',e:`Скорость сближения ${v1+v2} км/ч, t = ${S} / ${v1+v2} = ${t}.`})},
 arith:()=>{const a1=R(-10,10),d=R(-5,6)||2,n=R(5,15);
   return inp(`В арифметической прогрессии a₁ = ${a1}, d = ${d}. Найдите a${String(n).split('').map(x=>'₀₁₂₃₄₅₆₇₈₉'[x]).join('')}.`,a1+(n-1)*d,{t:'Прогрессии',e:`aₙ = a₁ + (n − 1)d = ${a1} + ${n-1}·${d} = ${a1+(n-1)*d}.`})},
 frac:()=>{const ds=[2,4,5,8,10,20,25];const b=P(ds),d=P(ds),a=R(1,b*2),c=R(1,d*2);
   return inp(`Найдите значение выражения: ${a}/${b} + ${c}/${d}`,a/b+c/d,{t:'Вычисления',e:`${a}/${b} = ${nf(a/b)}, ${c}/${d} = ${nf(c/d)}, сумма ${nf(a/b+c/d)}.`})},
 pctof:()=>{const n=R(2,40)*50,p=P([2,4,5,10,12,15,20,25,30,40,60,75]);
   return inp(`Найдите ${p}% от числа ${n}.`,n*p/100,{t:'Проценты',e:`${n} · ${p} / 100 = ${nf(n*p/100)}.`})},
 packs:()=>{const n=P([5,6,8,10,12,20]),k=R(2,9),m=R(3,12);const need=Math.ceil(k*m/n);
   return inp(`Ученик тратит ${k} тетрадей в неделю. Тетради продаются пачками по ${n} штук. Какое наименьшее число пачек нужно купить на ${m} недель?`,need,{t:'Текстовые задачи',e:`Нужно ${k*m} тетрадей. ${k*m} / ${n} = ${nf(k*m/n)} → округляем вверх: ${need}.`})},
 change:()=>{const price=R(12,95),cnt=R(2,6),pay=Math.ceil(price*cnt/500)*500;
   return inp(`Ручка стоит ${price} руб. Какую сдачу получит покупатель с ${pay} руб. при покупке ${cnt} ручек?`,pay-price*cnt,{t:'Текстовые задачи',e:`${cnt} · ${price} = ${price*cnt}; ${pay} − ${price*cnt} = ${pay-price*cnt}.`})},
 rectarea:()=>{const a=R(2,30),b=R(2,30);
   return inp(`Участок прямоугольной формы имеет размеры ${a} м × ${b} м. Найдите его площадь в квадратных метрах.`,a*b,{t:'Геометрия',e:`${a} · ${b} = ${a*b}.`})},

 /* ----- Физика (g = 10 м/с²) ----- */
 kin:()=>{const t=R(2,20),v=R(2,30);return inp(`Тело движется равномерно со скоростью ${v} м/с. Какой путь (в метрах) оно пройдёт за ${t} с?`,v*t,{t:'Кинематика',e:`s = v·t = ${v}·${t} = ${v*t} м.`})},
 accel:()=>{const a=R(1,5),t=R(2,10),v0=R(0,10);return inp(`Скорость тела за ${t} с выросла с ${v0} до ${v0+a*t} м/с. Найдите ускорение (м/с²).`,a,{t:'Кинематика',e:`a = (v − v₀)/t = ${a*t}/${t} = ${a}.`})},
 newton:()=>{const m=R(2,50),a=R(1,8);return inp(`На тело массой ${m} кг действует сила, сообщающая ускорение ${a} м/с². Найдите силу (Н).`,m*a,{t:'Динамика',e:`F = ma = ${m}·${a} = ${m*a} Н.`})},
 ek:()=>{const m=R(1,10)*2,v=R(1,10);return inp(`Найдите кинетическую энергию (Дж) тела массой ${m} кг, движущегося со скоростью ${v} м/с.`,m*v*v/2,{t:'Энергия',e:`Eк = mv²/2 = ${m}·${v*v}/2 = ${m*v*v/2} Дж.`})},
 ep:()=>{const m=R(1,20),h=R(1,30);return inp(`Тело массой ${m} кг подняли на высоту ${h} м. Найдите его потенциальную энергию (Дж), g = 10 м/с².`,m*10*h,{t:'Энергия',e:`Eп = mgh = ${m}·10·${h} = ${m*10*h} Дж.`})},
 ohm:()=>{const R0=P([2,4,5,10,20,25,50]),I=R(1,10);return inp(`Сопротивление проводника ${R0} Ом, сила тока ${I} А. Найдите напряжение (В).`,R0*I,{t:'Электричество',e:`U = IR = ${I}·${R0} = ${I*R0} В.`})},
 power:()=>{const U=P([12,24,110,220]),I=R(1,10);return inp(`Напряжение ${U} В, сила тока ${I} А. Найдите мощность (Вт).`,U*I,{t:'Электричество',e:`P = UI = ${U}·${I} = ${U*I} Вт.`})},
 pres:()=>{const S=P([.1,.2,.5,2,4]),F=R(1,20)*100;return inp(`Сила ${F} Н действует на площадь ${nf(S)} м². Найдите давление (Па).`,F/S,{t:'Давление',e:`p = F/S = ${F}/${nf(S)} = ${nf(F/S)} Па.`})},
 dens:()=>{const V=P([2,4,5,10]),r=P([800,1000,2700,7800]);return inp(`Тело объёмом ${nf(V/1000)} м³ имеет массу ${nf(r*V/1000)} кг. Найдите плотность (кг/м³).`,r,{t:'Давление',e:`ρ = m/V = ${r} кг/м³.`})},
 heat:()=>{const m=R(1,5),dt=R(5,50);return inp(`Какое количество теплоты (кДж) нужно, чтобы нагреть ${m} кг воды на ${dt} °C? c = 4200 Дж/(кг·°C).`,4.2*m*dt,{t:'Теплота',e:`Q = cmΔt = 4200·${m}·${dt} = ${4200*m*dt} Дж = ${nf(4.2*m*dt)} кДж.`})},
 impulse:()=>{const m=R(1,10),v=R(2,20);return inp(`Найдите импульс (кг·м/с) тела массой ${m} кг, движущегося со скоростью ${v} м/с.`,m*v,{t:'Импульс',e:`p = mv = ${m*v} кг·м/с.`})},

 /* ----- Химия ----- */
 molar:()=>{const f=P(CHEM_F);return inp(`Вычислите молярную массу ${fml(f)} (г/моль). Ar: ${arList(f)}.`,M(f),{t:'Расчёты',e:`M(${fml(f)}) = ${M(f)} г/моль.`})},
 moles:()=>{const f=P(CHEM_F),n=P([.5,1,2,3,4]);return inp(`Сколько моль вещества содержится в ${nf(M(f)*n)} г ${fml(f)}? Ar: ${arList(f)}.`,n,{t:'Расчёты',e:`n = m/M = ${nf(M(f)*n)}/${M(f)} = ${nf(n)} моль.`})},
 omega:()=>{const f=P(CHEM_F.filter(x=>/O/.test(x)));const w=Math.round(16*cnt(f,'O')/M(f)*100);return inp(`Найдите массовую долю кислорода в ${fml(f)} (в %, округлите до целых). Ar: ${arList(f)}.`,w,{t:'Расчёты',e:`ω(O) = ${16*cnt(f,'O')}/${M(f)}·100% ≈ ${w}%.`})},
 klass:()=>{const [f,c]=P(CHEM_CLASS);const o=['оксид','кислота','основание','соль'];return {q:`К какому классу относится ${fml(f)}?`,o,a:o.indexOf(c),t:'Классы веществ',e:`${fml(f)} — ${c}.`}},

 /* ----- Информатика ----- */
 d2b:()=>{const n=R(5,255);return inp(`Переведите число ${n} в двоичную систему.`,n.toString(2),{t:'Системы счисления',e:`${n}₁₀ = ${n.toString(2)}₂.`})},
 b2d:()=>{const n=R(5,255);return inp(`Переведите ${n.toString(2)}₂ в десятичную систему.`,n,{t:'Системы счисления',e:`${n.toString(2)}₂ = ${n}₁₀.`})},
 d2h:()=>{const n=R(16,255);return inp(`Переведите число ${n} в шестнадцатеричную систему (буквы — латинские заглавные).`,n.toString(16).toUpperCase(),{t:'Системы счисления',e:`${n}₁₀ = ${n.toString(16).toUpperCase()}₁₆.`})},
 ones:()=>{const n=R(20,1000);const c=n.toString(2).split('').filter(x=>x==='1').length;return inp(`Сколько единиц в двоичной записи числа ${n}?`,c,{t:'Системы счисления',e:`${n}₁₀ = ${n.toString(2)}₂ — единиц: ${c}.`})},
 hartley:()=>{const i=R(1,8);return inp(`Алфавит содержит ${2**i} символов. Сколько бит нужно для кодирования одного символа?`,i,{t:'Информация',e:`N = 2ⁱ: ${2**i} = 2<sup>${i}</sup>, i = ${i}.`})},
 msg:()=>{const i=R(3,8),K=R(1,8)*128;return inp(`Сообщение из ${K} символов записано алфавитом мощностью ${2**i}. Каков его объём в байтах?`,K*i/8,{t:'Информация',e:`I = K·i = ${K}·${i} = ${K*i} бит = ${K*i/8} байт.`})},
 img:()=>{const w=P([64,128,256]),h=P([64,128,256]),i=P([1,2,4,8]);return inp(`Изображение ${w}×${h} пикселей, палитра из ${2**i} цветов. Каков объём файла в Кбайтах (без сжатия)?`,w*h*i/8/1024,{t:'Информация',e:`${w}·${h}·${i} бит = ${w*h*i/8} байт = ${nf(w*h*i/8/1024)} Кбайт.`})},
 logic:()=>{const A=R(0,1),B=R(0,1),C=R(0,1);const ex=P([['¬A ∨ B ∧ C',(!A)||(B&&C)],['(A ∨ B) ∧ ¬C',(A||B)&&!C],['A → B',(!A)||B],['¬(A ∧ B) ∨ C',!(A&&B)||C],['A ≡ ¬B',A===(1-B)]]);
   return {q:`Чему равно значение выражения ${ex[0]} при A = ${A}, B = ${B}, C = ${C}?`,o:['0','1'],a:ex[1]?1:0,t:'Логика',e:`Подставляем значения: результат ${ex[1]?1:0}. ¬ — НЕ, ∧ — И, ∨ — ИЛИ, → — импликация, ≡ — эквивалентность.`}},

 /* ----- Биология ----- */
 dna:()=>{const s=Array.from({length:9},()=>P('ATGC'.split(''))).join('');const c=s.split('').map(x=>({A:'T',T:'A',G:'C',C:'G'})[x]).join('');
   return inp(`Цепь ДНК: ${s}. Запишите комплементарную цепь ДНК (латинскими буквами, без пробелов).`,c,{t:'Молекулярная биология',e:`A — T, G — C: ${c}.`})},
 rna:()=>{const s=Array.from({length:9},()=>P('ATGC'.split(''))).join('');const c=s.split('').map(x=>({A:'U',T:'A',G:'C',C:'G'})[x]).join('');
   return inp(`Матричная цепь ДНК: ${s}. Запишите последовательность иРНК (латинскими буквами, без пробелов).`,c,{t:'Молекулярная биология',e:`При транскрипции A → U, T → A, G → C, C → G: ${c}.`})},
 cross:()=>{const c=P([['AA × aa',0],['Aa × Aa',25],['Aa × aa',50],['aa × aa',100],['AA × Aa',0]]);
   return inp(`Признак рецессивный (a). Скрещивание ${c[0]}. Какой процент потомков будет с рецессивным признаком?`,c[1],{t:'Генетика',e:`Составь решётку Пеннета: доля aa — ${c[1]}%.`})},
 aminos:()=>{const n=R(10,90)*3;return inp(`Фрагмент иРНК содержит ${n} нуклеотидов. Сколько аминокислот закодировано в нём?`,n/3,{t:'Молекулярная биология',e:`Одна аминокислота кодируется триплетом: ${n} / 3 = ${n/3}.`})},

 /* ----- География ----- */
 natinc:()=>{const b=R(8,15),d=R(9,17);return inp(`Рождаемость в регионе ${b}‰, смертность ${d}‰. Найдите естественный прирост (‰). Если убыль, запишите с минусом.`,b-d,{t:'Население',e:`${b} − ${d} = ${b-d}‰.`})},
 natabs:()=>{const pop=R(5,40)*100000,b=R(8,14),d=R(9,16);const v=pop*(b-d)/1000;return inp(`Население региона ${pop.toLocaleString('ru-RU')} чел., рождаемость ${b}‰, смертность ${d}‰. Найдите естественный прирост за год (чел.). Убыль — с минусом.`,v,{t:'Население',e:`${pop} · (${b} − ${d}) / 1000 = ${v}.`})},
 density:()=>{const s=R(10,200)*1000,d=R(2,60);return inp(`Площадь региона ${s.toLocaleString('ru-RU')} км², население ${(s*d).toLocaleString('ru-RU')} чел. Найдите плотность населения (чел./км²).`,d,{t:'Население',e:`${s*d} / ${s} = ${d} чел./км².`})},
 scale:()=>{const N=P([10000,25000,50000,100000,200000]),cm=R(2,9);return inp(`Масштаб карты 1 : ${N.toLocaleString('ru-RU')}. Расстояние на карте ${cm} см. Каково расстояние на местности в метрах?`,N*cm/100,{t:'Карты',e:`В 1 см ${N/100} м; ${cm} · ${N/100} = ${N*cm/100} м.`})},

 /* ----- Русский язык ----- */
 stress:()=>{const w=P(STRESS);const lw=w.toLowerCase();const vs=[...lw].map((c,i)=>'аеёиоуыэюя'.includes(c)?i:-1).filter(i=>i>=0);
   const ci=[...w].findIndex(c=>'АЕЁИОУЫЭЮЯ'.includes(c));const show=i=>[...lw].map((c,j)=>j===i?c.toUpperCase():c).join('');
   const wrong=shuffle(vs.filter(i=>i!==ci)).slice(0,2);const opts=shuffle([ci,...wrong]);
   return {q:'Где правильно поставлено ударение?',o:opts.map(show),a:opts.indexOf(ci),t:'Ударения',k:'Задание 4',e:`Правильно: ${show(ci)}. Слово из орфоэпического словника ЕГЭ.`}},

 /* ----- История ----- */
 date2ev:()=>{const [y,ev]=P(HIST_DATES);const o=shuffle([ev,...shuffle(HIST_DATES.filter(d=>d[0]!==y)).slice(0,3).map(d=>d[1])]);return {q:`Какое событие произошло в <b>${y}</b> году?`,o,a:o.indexOf(ev),t:'Даты',e:`${y} — ${ev}.`}},
 ev2date:()=>{const [y,ev]=P(HIST_DATES);const near=HIST_DATES.filter(d=>d[0]!==y).sort((a,b)=>Math.abs(a[0]-y)-Math.abs(b[0]-y)).slice(0,6);const o=shuffle([y,...shuffle(near).slice(0,3).map(d=>d[0])]);return {q:`В каком году: <b>${ev}</b>?`,o,a:o.indexOf(y),t:'Даты',e:`${ev} — ${y} год.`}},
 person:()=>{const [p,ev]=P(HIST_PEOPLE);const o=shuffle([p,...shuffle(HIST_PEOPLE.filter(x=>x[0]!==p)).slice(0,3).map(x=>x[0])]);return {q:`С кем связано: <b>${ev}</b>?`,o,a:o.indexOf(p),t:'Личности',e:`${ev} — ${p}.`}},

 /* ----- Обществознание ----- */
 term:()=>{const [t,d]=P(SOC_TERMS);const o=shuffle([t,...shuffle(SOC_TERMS.filter(x=>x[0]!==t)).slice(0,3).map(x=>x[0])]);return {q:`Какому понятию соответствует определение: <i>${d}</i>?`,o,a:o.indexOf(t),t:'Понятия',e:`${t} — ${d}.`}},

 /* ----- Литература ----- */
 author:()=>{const b=P(BOOKS);const o=shuffle([b.a,...shuffle([...new Set(BOOKS.map(x=>x.a))].filter(a=>a!==b.a)).slice(0,3)]);return {q:`Кто автор произведения «${b.t}»?`,o,a:o.indexOf(b.a),t:'Произведения',e:`«${b.t}» — ${b.a}.`}},
 hero:()=>{const b=P(BOOKS.filter(x=>!['rya','chuk'].includes(x.id)));const h=b.heroes.split(',')[0].trim();const o=shuffle([b.t,...shuffle(BOOKS.filter(x=>x.id!==b.id)).slice(0,3).map(x=>x.t)]);return {q:`В каком произведении есть герой: <b>${h}</b>?`,o:o.map(x=>'«'+x+'»'),a:o.indexOf(b.t),t:'Произведения',e:`${h} — «${b.t}», ${b.a}.`}},
 lterm:()=>{const [t,d]=P(LIT_TERMS);const o=shuffle([t,...shuffle(LIT_TERMS.filter(x=>x[0]!==t)).slice(0,3).map(x=>x[0])]);return {q:`Как называется приём: <i>${d}</i>?`,o,a:o.indexOf(t),t:'Теория литературы',e:`${t} — ${d}.`}}
};

/* Химия: формулы и расчёт молярной массы */

  return `<svg class="owl" viewBox="0 0 64 70" width="${size||72}" height="${Math.round((size||72)*70/64)}" aria-hidden="true">
   <g class="o"><path d="M10 34c0-16 10-24 22-24s22 8 22 24v14c0 12-10 18-22 18S10 60 10 48z" fill="#8b6cf0"/><path d="M18 46c0-6 6-9 14-9s14 3 14 9-6 14-14 14-14-8-14-14z" fill="#e8ddff"/>
   <path d="M10 40c-6 3-7 12-2 16 3-4 4-9 4-14zM54 40c6 3 7 12 2 16-3-4-4-9-4-14z" fill="#6c4fd6"/><path d="M26 64l-3 4M38 64l3 4" fill="none"/>
   <path d="M30 37l2 4 2-4z" fill="#ffb02e"/><path d="M12 12l20-8 20 8-20 8z" fill="#1d2340"/><path d="M20 15v6c4 3 8 4 12 4s8-1 12-4v-6l-12 5z" fill="#2b3360"/></g>
   <path d="M52 12v12" stroke="#ffc531" stroke-width="2.4" stroke-linecap="round"/><circle cx="52" cy="25" r="2.4" fill="#ffc531"/>

Object.assign(GEN,{
 angles3:()=>{const a=R(20,80),b=R(20,150-a);return inp(`В треугольнике два угла равны ${a}° и ${b}°. Найдите третий угол (в градусах).`,180-a-b,{e:`Сумма углов треугольника 180°: 180 − ${a} − ${b} = ${180-a-b}.`})},
 inscribed:()=>{const d=R(10,85)*2;return inp(`Вписанный угол опирается на дугу ${d}°. Найдите этот угол (в градусах).`,d/2,{e:`Вписанный угол равен половине дуги: ${d}/2 = ${d/2}.`})},
 midline:()=>{const a=R(2,20),b=a+R(1,10)*2;return inp(`Основания трапеции равны ${a} и ${b}. Найдите её среднюю линию.`,(a+b)/2,{e:`(${a} + ${b})/2 = ${(a+b)/2}.`})},
 paral:()=>{const a=R(3,20),h=R(2,15);return inp(`Сторона параллелограмма равна ${a}, высота, проведённая к ней, — ${h}. Найдите площадь.`,a*h,{e:`S = a·h = ${a*h}.`})},
 cosrule:()=>{const t=P([[3,8,60,7],[5,8,60,7],[3,5,120,7],[5,3,120,7],[8,15,60,13],[7,8,120,13]]);return inp(`В треугольнике две стороны равны ${t[0]} и ${t[1]}, угол между ними ${t[2]}°. Найдите третью сторону.`,t[3],{e:`По теореме косинусов c² = ${t[0]}² + ${t[1]}² − 2·${t[0]}·${t[1]}·cos ${t[2]}° = ${t[3]*t[3]}, c = ${t[3]}.`})},
 veclen:()=>{const t=P([[3,4,5],[6,8,10],[5,12,13],[8,6,10],[9,12,15]]);const s=P([1,-1]);return inp(`Найдите длину вектора a(${t[0]*s}; ${t[1]}).`,t[2],{e:`|a| = √(${t[0]}² + ${t[1]}²) = ${t[2]}.`})},
 cubeV:()=>{const a=R(2,9);return inp(`Найдите объём куба с ребром ${a}.`,a**3,{e:`V = a³ = ${a**3}.`})},
 boxV:()=>{const a=R(2,9),b=R(2,9),c=R(2,9);return inp(`Найдите объём прямоугольного параллелепипеда с рёбрами ${a}, ${b} и ${c}.`,a*b*c,{e:`V = ${a}·${b}·${c} = ${a*b*c}.`})},
 pyrV:()=>{const S=R(2,20),h=R(1,6)*3;return inp(`Площадь основания пирамиды ${S}, высота ${h}. Найдите объём.`,S*h/3,{e:`V = ⅓·S·h = ${S*h/3}.`})},
 coins:()=>{const n=P([2,3]);return inp(`Монету бросают ${n} раза. Найдите вероятность того, что орёл выпадет все ${n} раза.`,1/2**n,{e:`(½)<sup>${n}</sup> = ${nf(1/2**n)}.`})},
 dice:()=>{const s=R(2,12);let c=0;for(let i=1;i<=6;i++)for(let j=1;j<=6;j++)if(i+j===s)c++;const p=Math.round(c/36*100)/100;
   return inp(`Игральный кубик бросают дважды. Найдите вероятность того, что сумма очков равна ${s}. Ответ округлите до сотых.`,p,{e:`Благоприятных исходов ${c} из 36: ${c}/36 ≈ ${nf(p)}.`})},
 atleast:()=>{const p=P([.5,.6,.8,.9]),q=P([.5,.7,.8,.9]);return inp(`Два стрелка независимо стреляют по мишени. Вероятность попадания первого ${nf(p)}, второго ${nf(q)}. Найдите вероятность того, что в мишень попадёт хотя бы один.`,1-(1-p)*(1-q),{e:`1 − (1 − ${nf(p)})·(1 − ${nf(q)}) = ${nf(1-(1-p)*(1-q))}.`})},
 sqrteq:()=>{const b=R(1,9),a=R(-10,10);return inp(`Решите уравнение √(x${sgn(a)}) = ${b}.`,b*b-a,{e:`x${sgn(a)} = ${b*b}, x = ${b*b-a}.`})},
 powers:()=>{const a=P([2,3,5,10]),m=R(2,6),n=R(2,6),k=R(2,m+n-1);const v=a**(m+n-k);return inp(`Найдите значение выражения: ${a}<sup>${m}</sup> · ${a}<sup>${n}</sup> : ${a}<sup>${k}</sup>`,v,{e:`${a}<sup>${m}+${n}−${k}</sup> = ${a}<sup>${m+n-k}</sup> = ${v}.`})},
 antider:()=>{const a=R(1,5),x=R(1,4);return inp(`F(x) — первообразная функции f(x) = ${2*a}x, F(0) = 0. Найдите F(${x}).`,a*x*x,{e:`F(x) = ${a}x², F(${x}) = ${a*x*x}.`})},
 ball:()=>{const v=R(1,6)*10;return inp(`Мяч брошен вертикально вверх, его высота меняется по закону h(t) = ${v}t − 5t² (м). Через сколько секунд мяч упадёт на землю?`,v/5,{e:`${v}t − 5t² = 0 ⇒ t = ${v}/5 = ${v/5} с.`})},
 fahr:()=>{const c=R(-4,8)*5;return inp(`Температура по Фаренгейту: F = 1,8·C + 32. Сколько градусов по Фаренгейту соответствует ${c} °C?`,1.8*c+32,{e:`1,8·${c} + 32 = ${nf(1.8*c+32)}.`})},
 pipes:()=>{const t=P([[3,6,2],[4,12,3],[6,12,4],[10,15,6],[12,24,8],[20,30,12]]);return inp(`Одна труба наполняет бассейн за ${t[0]} ч, другая — за ${t[1]} ч. За сколько часов наполнят бассейн обе трубы вместе?`,t[2],{e:`1/${t[0]} + 1/${t[1]} = 1/${t[2]}.`})},
 slope:()=>{const k=R(-5,5)||2,b=R(-9,9),x1=R(-4,0),x2=R(1,5);return inp(`Прямая проходит через точки (${x1}; ${k*x1+b}) и (${x2}; ${k*x2+b}). Найдите её угловой коэффициент.`,k,{e:`k = (${k*x2+b} − ${k*x1+b}) / (${x2} − ${x1}) = ${k}.`})},
 vertex:()=>{const a=P([1,2,-1]),x0=R(-5,5),c=R(-9,9);const b=-2*a*x0;return inp(`Найдите абсциссу вершины параболы y = ${term(a,'x²',true)}${term(b,'x')}${c?sgn(c):''}.`,x0,{e:`x₀ = −b/(2a) = ${x0}.`})},
 extr:()=>{const c=R(-10,10),mx=Math.random()<.5;return mx?inp(`Найдите наибольшее значение функции y = x³ − 3x²${sgn(c)} на отрезке [−1; 1].`,c,{e:`y′ = 3x² − 6x = 0 ⇒ x = 0 или 2. На [−1; 1]: y(−1) = ${c-4}, y(0) = ${c}, y(1) = ${c-2}. Наибольшее ${c}.`})
   :inp(`Найдите наименьшее значение функции y = x³ − 3x²${sgn(c)} на отрезке [1; 4].`,c-4,{e:`y′ = 3x² − 6x = 0 ⇒ x = 2. y(1) = ${c-2}, y(2) = ${c-4}, y(4) = ${c+16}. Наименьшее ${c-4}.`})},
 ineq:()=>{const a=R(2,7),x0=R(-5,8),b=R(-10,10);const c=a*x0+b;return inp(`Найдите наименьшее целое решение неравенства ${a}x${sgn(b)} > ${c}.`,x0+1,{e:`${a}x > ${c-b} ⇒ x > ${x0}. Наименьшее целое — ${x0+1}.`})},
 deposit:()=>{const S=R(1,10)*100000,p=P([5,10,20]),n=2;const v=Math.round(S*(1+p/100)**n);return inp(`Вклад ${S.toLocaleString('ru-RU')} руб. положили на ${n} года под ${p}% годовых с ежегодной капитализацией. Сколько рублей будет на счёте через ${n} года?`,v,{e:`${S}·${nf(1+p/100)}² = ${v}.`})},
 credit1:()=>{const S=R(1,20)*100000,p=P([10,12,15,20]);return inp(`Кредит ${S.toLocaleString('ru-RU')} руб. взят на год под ${p}% годовых и возвращается одним платежом в конце года. Сколько рублей нужно вернуть?`,S*(1+p/100),{e:`${S}·${nf(1+p/100)} = ${nf(S*(1+p/100))}.`})},
 gcd:()=>{const g=R(2,12),a=g*R(2,9),b=g*R(2,9);const G=(x,y)=>y?G(y,x%y):x;return inp(`Найдите наибольший общий делитель чисел ${a} и ${b}.`,G(a,b),{e:`НОД(${a}, ${b}) = ${G(a,b)}.`})},
 digsum:()=>{const n=R(100,9999);const s=String(n).split('').reduce((x,y)=>x+ +y,0);return {q:`Делится ли число ${n} на 3?`,o:['да','нет'],a:n%3===0?0:1,e:`Сумма цифр ${s}${s%3===0?' делится':' не делится'} на 3.`}},
 units:()=>{const c=P([['м','см',100],['км','м',1000],['ч','мин',60],['кг','г',1000],['т','кг',1000],['л','мл',1000]]),v=R(2,40)/2;return inp(`Сколько ${c[1]} в ${nf(v)} ${c[0]}?`,v*c[2],{e:`1 ${c[0]} = ${c[2]} ${c[1]}: ${nf(v)}·${c[2]} = ${nf(v*c[2])}.`})}
});

  ['Какое наименьшее число учеников нужно взять, чтобы двое точно родились в одном месяце?',['13','12','24','2'],'Принцип Дирихле: 12 месяцев + 1.']],['digsum'])

const NUCL=[['углерода','C',12,6],['азота','N',14,7],['кислорода','O',16,8],['натрия','Na',23,11],['алюминия','Al',27,13],['железа','Fe',56,26],['урана','U',235,92],['урана','U',238,92],['гелия','He',4,2],['кальция','Ca',40,20]];
Object.assign(GEN,{
 sacc:()=>{const a=R(1,6)*2,t=R(1,10);return inp(`Тело начинает движение из состояния покоя с ускорением ${a} м/с². Какой путь (м) оно пройдёт за ${t} с?`,a*t*t/2,{e:`s = at²/2 = ${a}·${t*t}/2 = ${a*t*t/2} м.`})},
 circ:()=>{const v=R(1,10)*2,r=P([1,2,4,5,10]);return inp(`Тело движется по окружности радиусом ${r} м со скоростью ${v} м/с. Найдите центростремительное ускорение (м/с²).`,v*v/r,{e:`a = v²/R = ${v*v}/${r} = ${nf(v*v/r)}.`})},
 hooke:()=>{const k=R(1,20)*50,x=P([.01,.02,.04,.05,.1]);return inp(`Жёсткость пружины ${k} Н/м, её растянули на ${nf(x*100)} см. Найдите силу упругости (Н).`,k*x,{e:`F = kx = ${k}·${nf(x)} = ${nf(k*x)} Н.`})},
 fric:()=>{const m=R(1,20),mu=P([.1,.2,.3,.4,.5]);return inp(`Брусок массой ${m} кг скользит по горизонтальной поверхности, коэффициент трения ${nf(mu)}. Найдите силу трения (Н), g = 10 м/с².`,mu*m*10,{e:`F = μmg = ${nf(mu)}·${m}·10 = ${nf(mu*m*10)} Н.`})},
 arch:()=>{const V=P([.001,.002,.005,.01,.02]),r=P([800,1000]);return inp(`Тело объёмом ${nf(V*1000)} л полностью погружено в ${r===1000?'воду':'керосин'} (ρ = ${r} кг/м³). Найдите силу Архимеда (Н), g = 10 м/с².`,r*10*V,{e:`F = ρgV = ${r}·10·${nf(V)} = ${nf(r*10*V)} Н.`})},
 hydro:()=>{const h=R(1,20);return inp(`Найдите давление воды (кПа) на глубине ${h} м. ρ = 1000 кг/м³, g = 10 м/с².`,h*10,{e:`p = ρgh = 1000·10·${h} = ${h*10000} Па = ${h*10} кПа.`})},
 moment:()=>{const F=R(2,50),l=P([.1,.2,.5,1,2]);return inp(`Сила ${F} Н действует на рычаг с плечом ${nf(l)} м. Найдите момент силы (Н·м).`,F*l,{e:`M = F·l = ${nf(F*l)} Н·м.`})},
 work:()=>{const F=R(2,50)*10,s=R(1,20);return inp(`Под действием силы ${F} Н тело переместилось на ${s} м в направлении силы. Найдите работу (Дж).`,F*s,{e:`A = F·s = ${F*s} Дж.`})},
 wave:()=>{const v=P([2,4,5,10,340]),f=P([2,5,10,20]);return inp(`Волна распространяется со скоростью ${v} м/с, частота колебаний ${f} Гц. Найдите длину волны (м).`,v/f,{e:`λ = v/ν = ${v}/${f} = ${nf(v/f)} м.`})},
 period:()=>{const n=R(2,20)*5,t=P([5,10,20]);return inp(`Маятник совершил ${n} колебаний за ${t} с. Найдите период колебаний (с).`,t/n,{e:`T = t/N = ${t}/${n} = ${nf(t/n)} с.`})},
 boyle:()=>{const p1=R(1,5)*100,V1=R(2,12),k=P([2,4]);return inp(`Газ при постоянной температуре сжали: давление было ${p1} кПа, объём ${V1} л. Каким станет давление (кПа), если объём уменьшится в ${k} раза?`,p1*k,{e:`pV = const: p₂ = ${p1}·${k} = ${p1*k} кПа.`})},
 kelvin:()=>{const c=R(-50,150);return inp(`Переведите ${c} °C в кельвины (T = t + 273).`,c+273,{e:`${c} + 273 = ${c+273} К.`})},
 eff:()=>{const Q=R(2,10)*100,A=R(1,Q/100-1)*50;return inp(`Тепловой двигатель получил ${Q} Дж теплоты и совершил работу ${A} Дж. Найдите КПД (%).`,A/Q*100,{e:`η = A/Q·100% = ${nf(A/Q*100)}%.`})},
 firstlaw:()=>{const dU=R(1,20)*10,A=R(1,20)*10;return inp(`Газ получил количество теплоты, его внутренняя энергия увеличилась на ${dU} Дж, при этом газ совершил работу ${A} Дж. Сколько теплоты (Дж) получил газ?`,dU+A,{e:`Q = ΔU + A = ${dU+A} Дж.`})},
 cap:()=>{const C=R(1,20),U=R(2,50);return inp(`Конденсатор ёмкостью ${C} мкФ заряжен до напряжения ${U} В. Найдите его заряд (мкКл).`,C*U,{e:`q = CU = ${C*U} мкКл.`})},
 series:()=>{const a=R(1,20),b=R(1,20),par=Math.random()<.5&&a===b;return par?inp(`Два одинаковых резистора по ${a} Ом соединены параллельно. Найдите общее сопротивление (Ом).`,a/2,{e:`R = R₁/2 = ${nf(a/2)} Ом.`}):inp(`Резисторы ${a} Ом и ${b} Ом соединены последовательно. Найдите общее сопротивление (Ом).`,a+b,{e:`R = R₁ + R₂ = ${a+b} Ом.`})},
 joule:()=>{const I=R(1,5),Rr=R(2,20),t=R(1,10)*10;return inp(`Через резистор ${Rr} Ом течёт ток ${I} А. Сколько теплоты (Дж) выделится за ${t} с?`,I*I*Rr*t,{e:`Q = I²Rt = ${I*I}·${Rr}·${t} = ${I*I*Rr*t} Дж.`})},
 charge:()=>{const I=R(1,10),t=R(2,60);return inp(`Сила тока ${I} А. Какой заряд (Кл) пройдёт через проводник за ${t} с?`,I*t,{e:`q = It = ${I*t} Кл.`})},
 ampere:()=>{const B=P([.1,.2,.5,1]),I=R(1,10),l=P([.1,.2,.5,1]);return inp(`Проводник длиной ${nf(l)} м с током ${I} А находится в магнитном поле с индукцией ${nf(B)} Тл перпендикулярно линиям поля. Найдите силу Ампера (Н).`,B*I*l,{e:`F = BIl = ${nf(B*I*l)} Н.`})},
 emf:()=>{const dF=R(1,20)/10,dt=P([.1,.2,.5]);return inp(`Магнитный поток через контур равномерно изменился на ${nf(dF)} Вб за ${nf(dt)} с. Найдите ЭДС индукции (В).`,dF/dt,{e:`ε = ΔΦ/Δt = ${nf(dF/dt)} В.`})},
 radio:()=>{const f=P([1,2,3,5,10,30,100,150,300]);return inp(`Радиостанция работает на частоте ${f} МГц. Найдите длину волны (м), c = 3·10⁸ м/с.`,300/f,{e:`λ = c/ν = 3·10⁸ / (${f}·10⁶) = ${nf(300/f)} м.`})},
 lens:()=>{const F=P([.1,.2,.25,.5,1,2]);return inp(`Фокусное расстояние собирающей линзы ${nf(F*100)} см. Найдите оптическую силу (дптр).`,1/F,{e:`D = 1/F = 1/${nf(F)} м = ${nf(1/F)} дптр.`})},
 refr:()=>{const n=P([1.5,2,1.25]);return inp(`Показатель преломления среды ${nf(n)}. Найдите скорость света в ней (·10⁸ м/с), c = 3·10⁸ м/с.`,3/n,{e:`v = c/n = 3/${nf(n)} = ${nf(3/n)}·10⁸ м/с.`})},
 neutrons:()=>{const [nm,s,A,Z]=P(NUCL);return inp(`Сколько нейтронов в ядре ${nm} <sup>${A}</sup>${s} (Z = ${Z})?`,A-Z,{e:`N = A − Z = ${A} − ${Z} = ${A-Z}.`})},
 halflife:()=>{const N0=P([800,1600,3200,6400]),T=R(1,10),k=R(1,4);return inp(`Период полураспада изотопа ${T} суток. Было ${N0} ядер. Сколько останется через ${T*k} суток?`,N0/2**k,{e:`Прошло ${k} периода: ${N0}/2<sup>${k}</sup> = ${N0/2**k}.`})},
 /* химия */
 atom:()=>{const [nm,s,A,Z]=P(NUCL);const w=P(['протонов','электронов','нейтронов']);return inp(`Сколько ${w} в атоме ${nm} <sup>${A}</sup>${s} (порядковый номер ${Z})?`,w==='нейтронов'?A-Z:Z,{e:`Протонов и электронов = Z = ${Z}, нейтронов = A − Z = ${A-Z}.`})},
 gasV:()=>{const n=P([.25,.5,1,2,3,5]);return inp(`Какой объём (л) при н. у. занимают ${nf(n)} моль газа? Vm = 22,4 л/моль.`,n*22.4,{e:`V = n·Vm = ${nf(n)}·22,4 = ${nf(n*22.4)} л.`})},
 solw:()=>{const m=R(1,10)*10,ms=R(1,9)*m/10*2;return inp(`В ${m+ms} г раствора содержится ${ms} г соли. Найдите массовую долю соли (%).`,ms/(m+ms)*100,{e:`ω = ${ms}/${m+ms}·100% = ${nf(ms/(m+ms)*100)}%.`})},
 alkane:()=>{const n=R(1,10);return inp(`Сколько атомов водорода в молекуле алкана с ${n} атомами углерода?`,2*n+2,{e:`CₙH₂ₙ₊₂: 2·${n} + 2 = ${2*n+2}.`})},
 /* биология */
 codon:()=>{const n=R(10,90);return inp(`Белок состоит из ${n} аминокислот. Сколько нуклеотидов в участке иРНК, кодирующем его (без стоп-кодона)?`,n*3,{e:`Каждая аминокислота — триплет: ${n}·3 = ${n*3}.`})},
 chargaff:()=>{const a=R(5,45);return inp(`В молекуле ДНК ${a}% нуклеотидов с аденином. Сколько процентов нуклеотидов с гуанином?`,50-a,{e:`A = T = ${a}%, G = C = (100 − 2·${a})/2 = ${50-a}%.`})},
 gametes:()=>{const n=R(1,4);return inp(`Сколько типов гамет образует организм, гетерозиготный по ${n} ${plural(n,'гену','генам','генам')} (гены в разных хромосомах)?`,2**n,{e:`2ⁿ = 2<sup>${n}</sup> = ${2**n}.`})}
});

 mask:()=>{const n=R(20,30);return inp(`Маска подсети /${n} (${n} единиц). Сколько всего адресов в такой сети (включая адрес сети и широковещательный)?`,2**(32-n),{e:`2<sup>32−${n}</sup> = ${2**(32-n)}.`})},
 rec:()=>{const n=R(3,10);const t=P(['sum','pow']);return t==='sum'?inp(`F(1) = 1, F(n) = F(n − 1) + n при n > 1. Чему равно F(${n})?`,n*(n+1)/2,{e:`F(n) = 1 + 2 + … + n = ${n*(n+1)/2}.`})
   :inp(`F(1) = 1, F(n) = 2·F(n − 1) + 1 при n > 1. Чему равно F(${n})?`,2**n-1,{e:`F(n) = 2ⁿ − 1 = ${2**n-1}.`})},
 digits:()=>{const n=R(100,99999);const s=String(n).split('').reduce((a,b)=>a+ +b,0);return inp(`Что выведет программа?<br><code>n = ${n}<br>s = 0<br>while n > 0:<br>&nbsp;&nbsp;s += n % 10<br>&nbsp;&nbsp;n //= 10<br>print(s)</code>`,s,{e:`Программа считает сумму цифр: ${s}.`})},
 divs:()=>{const n=R(6,120);let c=0;for(let i=1;i<=n;i++)if(n%i===0)c++;return inp(`Сколько натуральных делителей у числа ${n}?`,c,{e:`Делители: ${[...Array(n).keys()].map(i=>i+1).filter(i=>n%i===0).join(', ')}.`})},
 loopsum:()=>{const a=R(1,5),b=R(6,15),st=P([1,2,3]);let s=0;for(let i=a;i<b;i+=st)s+=i;return inp(`Что выведет программа?<br><code>s = 0<br>for i in range(${a}, ${b}, ${st}):<br>&nbsp;&nbsp;s += i<br>print(s)</code>`,s,{e:`Складываем ${[...Array(Math.ceil((b-a)/st)).keys()].map(k=>a+k*st).join(' + ')} = ${s}.`})},
 tz:()=>{const h=R(0,23),d=R(1,9);return inp(`В Москве ${h}:00. Который час (целое число от 0 до 23) в городе, где время опережает московское на ${d} ч?`,(h+d)%24,{e:`${h} + ${d} = ${h+d}${h+d>=24?' − 24 = '+((h+d)%24):''}.`})},
 lon:()=>{const d=R(1,8)*15;return inp(`На сколько часов различается местное солнечное время двух пунктов, если разница долгот ${d}°?`,d/15,{e:`Земля поворачивается на 15° за час: ${d}/15 = ${d/15} ч.`})},
 migr:()=>{const i=R(1,40)*100,o=R(1,40)*100;return inp(`В регион за год въехало ${i} человек, выехало ${o}. Найдите миграционный прирост (чел.). Убыль — с минусом.`,i-o,{e:`${i} − ${o} = ${i-o}.`})},
 tempH:()=>{const t0=R(10,30),h=R(1,5)*1000;return inp(`У подножия горы температура +${t0} °C. Какой будет температура (°C) на высоте ${h} м, если она понижается на 6 °C на каждый километр?`,t0-6*h/1000,{e:`${t0} − 6·${h/1000} = ${t0-6*h/1000}.`})},
 urban:()=>{const P0=R(2,20)*100000,u=P([40,50,60,70,75,80]);return inp(`В стране ${P0.toLocaleString('ru-RU')} жителей, ${u}% живут в городах. Сколько человек живёт в сельской местности?`,P0*(100-u)/100,{e:`${P0}·${100-u}/100 = ${P0*(100-u)/100}.`})}
});

 powers:()=>{const a=P([2,3,5,10]),m=R(2,6),n=R(2,6),e=R(1,Math.min(a>=5?3:6,m+n-2)),k=m+n-e;return inp(`Найдите значение выражения: ${a}<sup>${m}</sup> · ${a}<sup>${n}</sup> : ${a}<sup>${k}</sup>`,a**e,{e:`${a}<sup>${m}+${n}−${k}</sup> = ${a}<sup>${e}</sup> = ${a**e}.`})}

function runGen(g){const [name,arg]=g.split(':');return arg!=null?GEN[name](arg):GEN[name]()}
function makeQ(id,ti){
  const tops=topicsOf(id);if(!tops.length)return null;
  if(ti==null){const w=tops.map(t=>t.qs.length+t.g.length*4);let r=Math.random()*w.reduce((a,b)=>a+b,0);ti=0;while(ti<tops.length-1&&(r-=w[ti])>0)ti++}
  const t=tops[ti];const nq=t.qs.length,ng=t.g.length;
  let q;
  if(ng&&(!nq||Math.random()<ng*3/(ng*3+nq)))q=runGen(P(t.g));else q={...P(t.qs)};
  q=Object.assign({},q,{subj:id,ti,t:t.n,k:t.k||q.k||''});
  if(q.o&&!q.shuffled&&!q.keep&&q.o.length>2&&!/^(0|1)$/.test(q.o[0])){const idx=shuffle(q.o.map((_,i)=>i));q.o=idx.map(i=>q.o[i]);q.a=idx.indexOf(q.a);q.shuffled=1}
  else if(q.o&&q.o.length===2&&!q.shuffled&&Math.random()<.5&&!/^(да|нет|0|1)$/.test(q.o[0])){q.o=[q.o[1],q.o[0]];q.a=1-q.a;q.shuffled=1}
  return q;
}

const TITLES=[[25,'Легенда ЕГЭ'],[20,'Эксперт'],[16,'Мастер'],[12,'Отличник'],[8,'Знаток'],[5,'Старательный'],[3,'Ученик'],[1,'Новичок']];
const titleOf=L=>TITLES.find(t=>L>=t[0])[1];
const LEAGUES=[[1250,'Алмаз','lg-d'],[1150,'Платина','lg-p'],[1050,'Золото','lg-g'],[950,'Серебро','lg-s'],[-1e9,'Бронза','lg-b']];
const leagueOf=r=>LEAGUES.find(l=>r>=l[0]);
const rs=id=>S.r[id]||(S.r[id]={r:1000,n:0,c:0,h:[]});
const readiness=id=>{const h=rs(id).h;return h.length?Math.round(h.filter(Boolean).length/h.length*100):0};
function league(r,big){const l=leagueOf(r);return `<span class="league ${l[2]} ${big?'big':''}">${leagueArt(l[2],big?22:18)}${l[1]}</span>`}
const today=()=>iso(new Date());
function streak(){let d=new Date(),n=0;if(!S.days[iso(d)])d.setDate(d.getDate()-1);while(S.days[iso(d)]){n++;d.setDate(d.getDate()-1)}return n}
const todayCount=()=>S.days[today()]||0;
function daysToExam(){return Math.max(0,Math.round((dayStart(new Date(S.examDate+'T00:00:00'))-dayStart(new Date()))/864e5))}

const ACH=[
 ['first','Первый шаг','Реши первую задачу',s=>s.stat.answered>=1],
 ['c100','Сотня','100 верных ответов',s=>s.stat.correct>=100],
 ['c500','Пятьсот','500 верных ответов',s=>s.stat.correct>=500],
 ['goal','План выполнен','Дневная цель за день',s=>Object.values(s.days).some(v=>v>=s.goal)],
 ['streak3','Три дня подряд','Занимайся 3 дня без пропусков',s=>streak()>=3],
 ['streak7','Неделя','7 дней подряд',s=>streak()>=7],
 ['mock','Пробник','Пройди пробный вариант',s=>s.stat.mocks>=1],
 ['mock80','На высокий балл','Пробный вариант от 80%',s=>s.stat.mock80],
 ['blitz15','Молния','15 верных в блице',s=>s.stat.blitzBest>=15],
 ['multi3','Многостаночник','Занимайся по 3 предметам',s=>Object.values(s.r).filter(x=>x.n>0).length>=3],
 ['gold','Золотая лига','Лига «Золото» по предмету',s=>Object.values(s.r).some(x=>x.n>=20&&x.r>=1050)],
 ['diamond','Алмаз','Лига «Алмаз» по предмету',s=>Object.values(s.r).some(x=>x.n>=40&&x.r>=1250)],
 ['lvl5','Уровень 5','Набери 5-й уровень',s=>levelOf(s.xp)>=5],
 ['lvl10','Уровень 10','Набери 10-й уровень',s=>levelOf(s.xp)>=10],
 ['friend','Не один','Добавь друга в рейтинг',s=>s.friends.length>=1]
];
function checkAch(){const got=[];for(const [id,n,,f] of ACH){if(!S.ach[id]&&f(S)){S.ach[id]=today();S.xp+=50;got.push(n)}}return got}

/* ===================== ДРУЗЬЯ: КОД ДЛЯ ОБМЕНА ===================== */
function hashStr(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return (h%1679616).toString(36)}
function myCard(){const s={};for(const id of S.subjects){const x=rs(id);if(x.n)s[id]=Math.round(x.r)}return {u:S.uid,n:(S.name||'Ученик').slice(0,24),x:S.xp,s,st:streak(),d:today()}}
function myCode(){const j=JSON.stringify(myCard());const b=btoa(unescape(encodeURIComponent(j))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return 'ZCH1.'+b+'.'+hashStr(b)}
function parseCode(t){const m=String(t).match(/ZCH1\.([A-Za-z0-9_-]+)\.([a-z0-9]+)/);if(!m||hashStr(m[1])!==m[2])return null;
  try{const j=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));if(!j.u||typeof j.x!=='number')return null;return {u:String(j.u).slice(0,12),n:String(j.n||'Друг').slice(0,24),x:Math.max(0,Math.min(1e7,j.x|0)),s:j.s&&typeof j.s==='object'?j.s:{},st:j.st|0,d:String(j.d||'')}}catch(e){return null}}
function addFriend(t){const f=parseCode(t);if(!f){toast('Код не распознан. Скопируй его целиком');return false}
  if(f.u===S.uid){toast('Это твой собственный код');return false}
  const i=S.friends.findIndex(x=>x.u===f.u);if(i>=0)S.friends[i]=f;else S.friends.push(f);
  checkAch();save();toast(i>=0?`Результат ${f.n} обновлён`:`${f.n} добавлен(а) в рейтинг`);return true}
function shareText(){return `Я готовлюсь к ЕГЭ в «Зачёте»: уровень ${levelOf(S.xp)}, ${S.xp} XP. Добавь меня в рейтинг — скопируй код и вставь во вкладке «Рейтинг»:\n${myCode()}`}

/* ===================== ТЕСТЫ ===================== */
let Q=null;   // текущая сессия
const MODE_NAME={train:'Тренировка',test:'Тест',mock:'Пробный вариант',blitz:'Блиц',mist:'Работа над ошибками',cards:'Карточки',daily:'Задание дня'};
function startSession(code,topic){
  const [mode,arg]=code.split('-');const all=arg==='all';const subj=all?null:arg;
  const pool=subj?[subj]:S.subjects.filter(id=>SUB[id]);
  if(mode!=='mist'&&!pool.length){toast('Сначала выбери предметы');return}
  const n=topic!=null&&mode==='test'?10:({train:10,test:15,mock:25,daily:10,blitz:999,mist:15}[mode]||10);
  Q={mode,subj,pool,topic:topic||null,i:0,list:[],res:[],xp:0,r0:{},picked:null,checked:false,start:Date.now(),ach:[],combo:0,best:0};
  pool.forEach(id=>Q.r0[id]=rs(id).r);
  if(mode==='cards'){Q.list=shuffle((SUBJ_CARDS[subj]||[]).map(([f,b])=>({f,b})));Q.known=0;if(!Q.list.length){Q=null;return}}
  else if(mode==='mist'){const src=S.mistakes.filter(q=>!subj||q.subj===subj);if(!src.length){toast('Ошибок нет — так держать!');Q=null;return}Q.list=shuffle(src).slice(0,n).map(q=>({...q,fromMist:1}))}
  else if(mode==='mock'){Q.list=makeMock(subj)}
  else{const k=mode==='blitz'?40:n;for(let j=0;j<k;j++){const id=pool[j%pool.length];Q.list.push(makeQ(id,topic))}if(mode!=='test')Q.list=shuffle(Q.list)}
  Q.list=Q.list.filter(Boolean);
  Q.n=mode==='blitz'?Q.list.length:Q.list.length;
  if(mode==='mock')Q.end=Date.now()+Math.round(Q.list.length*1.6)*60*1000;
  if(mode==='blitz')Q.end=Date.now()+60*1000;
  nav('quiz');
}
const instant=()=>['train','mist','daily','blitz'].includes(Q.mode);
function norm(s){return String(s).trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,'').replace(',', '.')}
function isRight(q,ans){if(q.o)return ans===q.a;const a=norm(ans),b=norm(q.a);if(a===b)return true;const x=parseFloat(a),y=parseFloat(b);return /^-?[\d.]+$/.test(a)&&!isNaN(x)&&!isNaN(y)&&Math.abs(x-y)<1e-6}
function viewQuiz(){
  if(!Q)return viewHome();
  if(Q.mode==='cards')return viewCards();
  if(Q.done)return viewResult();
  const q=Q.list[Q.i];const s=SUB[q.subj];const timed=!!Q.end;
  const prog=Q.mode==='blitz'?'':`<div class="qprog2"><i style="width:${(Q.i)/Q.n*100}%"></i></div>`;
  const right=Q.checked&&isRight(q,Q.picked);
  return `<div class="qtop"><button class="iconbtn" id="quitQ" aria-label="Выйти">${ic('close')}</button>
    <div class="qtop-mid"><b>${MODE_NAME[Q.mode]}${Q.topic!=null&&TOP[Q.subj]?' · '+esc(TOP[Q.subj][Q.topic].n):''}</b><span class="caption num">${Q.mode==='blitz'?`верно: ${Q.res.filter(x=>x.ok).length}`:`${Q.i+1} из ${Q.n}`}${Q.combo>=3?` · серия ${Q.combo}`:''}</span></div>
    ${timed?`<span class="qtimer num" id="qtimer">${fmtT(Math.max(0,Math.round((Q.end-Date.now())/1000)))}</span>`:`<span class="qxp num">+${Q.xp} XP</span>`}</div>
  ${prog}
  <section class="card qcard" style="--c:${sc(q.subj)}">
    <div class="tagrow"><span class="tag" style="--c:var(--c)">${s?s.short:''}</span>${q.k?`<span class="tag" style="--c:var(--muted)">${q.k}</span>`:''}<span class="tag" style="--c:var(--muted)">${esc(q.t||'')}</span></div>
    <div class="qtext">${q.q}</div>
    ${q.o?`<div class="opts">${q.o.map((o,k)=>{let c='';if(Q.checked&&instant()){if(k===q.a)c='right';else if(k===Q.picked)c='wrong'}else if(Q.picked===k)c='sel';
      return `<button class="qopt ${c}" data-pick="${k}" ${Q.checked?'disabled':''}><span class="lt">${'АБВГДЕ'[k]}</span><span>${o}</span></button>`}).join('')}</div>`
    :`<div class="ansrow"><input class="field ans" id="ansIn" autocomplete="off" inputmode="${/^-?[\d.,]+$/.test(String(q.a))?'decimal':'text'}" placeholder="Ответ" value="${Q.picked!=null?esc(Q.picked):''}" ${Q.checked?'disabled':''}>${Q.checked?'':`<button class="btn" id="ansBtn">Ответить</button>`}</div>`}
    ${Q.checked&&instant()?`<div class="fb ${right?'ok':'bad'}">${Q.mode==='blitz'?'':owl(right?'happy':'sad',46)}<div class="fbt"><b>${right?'Верно!':'Неверно'}</b>${right?'':`<span>Правильный ответ: <b>${q.o?q.o[q.a]:esc(q.a)}</b></span>`}${Q.mode!=='blitz'&&q.e?`<p>${q.e}</p>`:''}</div></div>`:''}
  </section>
  <div class="qnav">${instant()?(Q.checked?`<button class="btn wide" id="nextQ">${Q.i<Q.n-1||Q.mode==='blitz'?'Дальше':'Результат'}${ic('arrow')}</button>`:(q.o?'':''))
    :`${Q.i>0?`<button class="btn ghost" id="prevQ">${ic('left')}</button>`:''}<button class="btn wide" id="nextQ">${Q.i<Q.n-1?'Дальше':'Завершить'}${ic('arrow')}</button>`}</div>`;
}
function answer(val){
  const q=Q.list[Q.i];if(Q.checked)return;
  if(!instant()){Q.res[Q.i]={ok:isRight(q,val),ans:val};Q.picked=val;render(true);return}
  Q.picked=val;Q.checked=true;const ok=isRight(q,val);
  Q.res[Q.i]={ok,ans:val};record(q,ok);
  if(Q.mode==='blitz'){render(true);setTimeout(()=>{if(Q&&Q.mode==='blitz'&&Q.checked&&!Q.done)next()},ok?350:900);return}
  render(true);
}
function record(q,ok){
  const x=rs(q.subj);const d=q.d||2,Rq=800+100*d,E=1/(1+10**((Rq-x.r)/400));
  x.r=Math.round((x.r+24*((ok?1:0)-E))*10)/10;x.n++;if(ok)x.c++;x.h.push(ok?1:0);if(x.h.length>40)x.h.shift();
  if(q.ti!=null){const tk=q.subj+'|'+q.ti;const tt=S.tp[tk]||(S.tp[tk]={n:0,c:0});tt.n++;if(ok)tt.c++}
  S.stat.answered++;if(ok)S.stat.correct++;S.days[today()]=(S.days[today()]||0)+1;
  Q.combo=ok?Q.combo+1:0;Q.best=Math.max(Q.best,Q.combo);
  const gain=ok?({train:10,mist:10,daily:12,blitz:5,test:12,mock:15}[Q.mode]||10)+(Q.combo>=5?5:0):0;Q.xp+=gain;S.xp+=gain;
  const key=q.id||null;
  if(!ok&&Q.mode!=='blitz'){if(!S.mistakes.some(m=>key?m.id===key:m.q===q.q)){S.mistakes.unshift({...q});S.mistakes=S.mistakes.slice(0,120)}}
  if(ok&&q.fromMist){S.mistakes=S.mistakes.filter(m=>key?m.id!==key:m.q!==q.q)}
  if(todayCount()===S.goal){S.xp+=50;Q.xp+=50;toast('Дневная цель выполнена! +50 XP')}
  Q.ach.push(...checkAch());save();
}
function next(){
  if(!Q)return;
  if(Q.mode==='blitz'){if(Date.now()>=Q.end){finish();return}Q.i++;if(Q.i>=Q.list.length)Q.list.push(...Q.pool.map(id=>makeQ(id)));Q.picked=null;Q.checked=false;render(true);focusAns();return}
  if(!instant()&&Q.res[Q.i]==null){const v=Q.list[Q.i].o?null:($('#ansIn')||{}).value;if(v&&v.trim()){Q.res[Q.i]={ok:isRight(Q.list[Q.i],v),ans:v}}}
  if(Q.i>=Q.n-1){finish();return}
  Q.i++;Q.checked=false;Q.picked=Q.res[Q.i]?Q.res[Q.i].ans:null;render(true);focusAns();
}
function focusAns(){setTimeout(()=>{const a=$('#ansIn');if(a&&!a.disabled)a.focus()},30)}
function finish(){
  if(!Q||Q.done)return;
  if(!instant()){Q.list.forEach((q,i)=>{const r=Q.res[i]||{ok:false,ans:null};Q.res[i]=r;record(q,r.ok)})}
  const ok=Q.res.filter(x=>x&&x.ok).length,tot=Q.mode==='blitz'?Q.res.length:Q.n,pct=tot?Math.round(ok/tot*100):0;
  let bonus=0;
  if(Q.mode==='test')bonus=30;
  if(Q.mode==='mock'){bonus=80+(pct>=80?50:0);S.stat.mocks++;if(pct>=80)S.stat.mock80=true;(S.mocks=S.mocks||[]).unshift({subj:Q.subj,date:new Date().toLocaleDateString('ru-RU'),pct});S.mocks=S.mocks.slice(0,30)}
  if(Q.mode==='blitz'){S.stat.blitzBest=Math.max(S.stat.blitzBest,ok)}
  S.xp+=bonus;Q.xp+=bonus;Q.ach.push(...checkAch());Q.done=true;Q.pct=pct;Q.ok=ok;Q.tot=tot;save();render();
}

  const wrong=Q.list.map((q,i)=>({q,r:Q.res[i]})).filter(x=>x.r&&!x.r.ok).slice(0,30);

    <div class="rstats"><span class="rs"><b class="num">+${Q.xp}</b>XP</span>${rch.map(x=>`<span class="rs" style="--c:${sc(x.id)}"><b class="num ${x.d>=0?'up':'down'}">${x.d>=0?'+':''}${x.d}</b>${SUB[x.id].short}</span>`).join('')}</div>
    ${L>lvlBefore?`<div class="levelup">${art(numShield(L,'#ffd24a','#fff3c0'),30)}Новый уровень: ${L} — ${titleOf(L)}</div>`:''}

    <p class="caption">Эти задачи добавлены в «Работу над ошибками».</p></section>`:''}
  <div class="actions"><button class="btn ghost wide" id="quitQ">Готово</button><button class="btn wide" id="againQ">${ic('redo')}Ещё раз</button></div>`;
