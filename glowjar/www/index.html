<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="mobile-web-app-capable" content="yes">
<title>Glowjar</title>
<style>
:root{--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0820;color:#fff;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#probe{position:fixed;top:0;left:0;width:0;height:0;padding-top:var(--st);padding-bottom:var(--sb);visibility:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.rbtn{position:fixed;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.1);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22);font-size:19px;line-height:46px;padding:0;text-align:center}
.rbtn:active{background:rgba(255,255,255,.25)}
#bPause{top:calc(var(--st) + 14px);left:14px}
#bShake{position:fixed;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);
  height:48px;padding:0 22px;border-radius:24px;font-weight:700;font-size:16px;white-space:nowrap;
  background:linear-gradient(180deg,#8a5cff,#5b2fd6);box-shadow:0 4px 18px rgba(124,77,255,.55),inset 0 1px 0 rgba(255,255,255,.35)}
#bShake:active{transform:translateX(-50%) scale(.95)}
#bShake[disabled]{background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.15);color:rgba(255,255,255,.4)}
#bShake b{display:inline-block;min-width:22px;margin-left:8px;padding:1px 7px;border-radius:11px;background:rgba(0,0,0,.3);font-size:14px}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;text-align:center;background:rgba(8,5,24,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ov.on{display:flex;animation:fade .25s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
h1{margin:0;font-size:52px;font-weight:900;letter-spacing:-1px;
  background:linear-gradient(120deg,#ffe066,#ff7ac6 45%,#7cc4ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgba(255,150,220,.45))}
h2{margin:0;font-size:32px;font-weight:800}
.sub{margin:0 0 10px;max-width:300px;font-size:16px;line-height:1.4;color:rgba(255,255,255,.72)}
.big{font-size:64px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.rec{font-size:16px;color:rgba(255,255,255,.7)}
.new{font-size:17px;font-weight:800;color:#ffe066;animation:pulse .8s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.pbtn{min-width:230px;height:58px;border-radius:29px;font-size:20px;font-weight:800;
  background:linear-gradient(180deg,#ffd84d,#ff9f1c);color:#3a1d00;
  box-shadow:0 6px 24px rgba(255,170,40,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.pbtn:active{transform:scale(.96)}
.sbtn{min-width:230px;height:50px;border-radius:25px;font-size:17px;font-weight:700;
  background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.sbtn:active{background:rgba(255,255,255,.22)}
#chain{width:300px;height:44px;position:static;margin-bottom:6px}
</style>
</head>
<body>
<div id="probe"></div>
<canvas id="cv"></canvas>
<button id="bPause" class="rbtn" aria-label="pause">❚❚</button>
<button id="bShake"><span data-t="shake"></span><b id="shakeN">0</b></button>

<div id="ovMenu" class="ov on">
  <h1>Glowjar</h1>
  <canvas id="chain"></canvas>
  <p class="sub" data-t="how"></p>
  <button class="pbtn" id="bPlay" data-t="play"></button>
  <button class="sbtn" id="bSound1"></button>
  <div class="rec" id="menuBest"></div>
</div>

<div id="ovPause" class="ov">
  <h2 data-t="paused"></h2>
  <button class="pbtn" id="bResume" data-t="resume"></button>
  <button class="sbtn" id="bRestart1" data-t="restart"></button>
  <button class="sbtn" id="bSound2"></button>
</div>

<div id="ovOver" class="ov">
  <h2 data-t="over"></h2>
  <div class="big" id="overScore">0</div>
  <div class="new" id="overNew" data-t="newbest"></div>
  <div class="rec" id="overBest"></div>
  <button class="pbtn" id="bAgain" data-t="again"></button>
</div>

<script>
(function(){
'use strict';

/* ---------- Тексты ---------- */
var RU=/^(ru|uk|be|kk)/i.test(navigator.language||'');
var T=RU?{
  play:'Играть',cont:'Продолжить',how:'Веди пальцем и отпускай. Два одинаковых светлячка сливаются в одного побольше. Не дай банке переполниться!',
  paused:'Пауза',resume:'Продолжить',restart:'Начать заново',over:'Банка полна!',again:'Ещё раз',newbest:'Новый рекорд!',
  best:'Рекорд',next:'Дальше',shake:'Встряхнуть',soundOn:'Звук: вкл',soundOff:'Звук: выкл',combo:'КОМБО',hint:'Веди пальцем и отпусти',
  bonus:'+1 встряска'
}:{
  play:'Play',cont:'Continue',how:'Drag and release. Two matching fireflies merge into a bigger one. Don\'t let the jar overflow!',
  paused:'Paused',resume:'Resume',restart:'Restart',over:'The jar is full!',again:'Play again',newbest:'New best!',
  best:'Best',next:'Next',shake:'Shake',soundOn:'Sound: on',soundOff:'Sound: off',combo:'COMBO',hint:'Drag and release',
  bonus:'+1 shake'
};
document.documentElement.lang=RU?'ru':'en';
var $=function(id){return document.getElementById(id)};
[].forEach.call(document.querySelectorAll('[data-t]'),function(e){e.textContent=T[e.getAttribute('data-t')]});

/* ---------- Константы мира ---------- */
var W=360,H=540,LINE=96,DROP_Y=50,G=1500;
var R=[13,18,24,30,37,45,54,63,73,84,96];
var COL=[[50,100],[28,100],[350,95],[312,90],[268,95],[218,100],[186,100],[150,90],[88,90],[14,100],[45,100]];
var PTS=[1,3,6,10,15,21,28,36,45,55];
var MAXT=R.length-1,KEY='glowjar.v1';

/* ---------- Состояние ---------- */
var cv=$('cv'),cx=cv.getContext('2d');
var vw=0,vh=0,dpr=1,S=1,ox=0,oy=0,hudY=0;
var bodies=[],parts=[],texts=[],sprites=[];
var state='menu',score=0,shown=0,best=0,sound=true,hasSave=false;
var cur=0,next=0,aimX=W/2,cool=0,holding=false,drops=0;
var combo=0,comboT=0,dangerT=0,shakes=2,nextBonus=500,quake=0,flash=0;

/* ---------- Сохранение ---------- */
function load(){
  try{
    var d=JSON.parse(localStorage.getItem(KEY)||'{}');
    best=d.best|0;sound=d.sound!==false;
    if(d.g&&d.g.b&&d.g.b.length){
      var g=d.g;score=shown=g.s|0;cur=g.c|0;next=g.n|0;shakes=g.k|0;nextBonus=g.nb||500;drops=g.d|0;
      bodies=g.b.map(function(a){return mk(a[0],a[1],a[2],9)});
      hasSave=true;
    }
  }catch(e){}
}
function save(){
  try{
    var d={best:best,sound:sound};
    if(state==='play'||state==='pause')d.g={s:score,c:cur,n:next,k:shakes,nb:nextBonus,d:drops,
      b:bodies.map(function(b){return [Math.round(b.x*10)/10,Math.round(b.y*10)/10,b.t]})};
    localStorage.setItem(KEY,JSON.stringify(d));
  }catch(e){}
}

/* ---------- Звук ---------- */
var ac=null;
function audio(){
  if(!sound)return null;
  try{
    if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
  }catch(e){ac=null}
  return ac;
}
function tone(f,dur,type,vol,slide,delay){
  var a=audio();if(!a)return;
  var t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+.02);
}
var SCALE=[0,2,4,7,9,12,14,16,19,21,24,26];
function sMerge(t,c){
  var f=262*Math.pow(2,SCALE[Math.min(SCALE.length-1,t+Math.min(c-1,3))]/12);
  tone(f,.22,'triangle',.22);tone(f*2,.16,'sine',.1,1,.04);
}
function sDrop(){tone(190,.09,'sine',.14,.55)}
function sShake(){tone(90,.3,'sawtooth',.12,.4);tone(140,.25,'square',.05,.5,.05)}
function sOver(){tone(392,.25,'triangle',.2,.9);tone(311,.25,'triangle',.2,.9,.2);tone(233,.5,'triangle',.2,.7,.4)}
function buzz(ms){try{if(sound&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ---------- Отрисовка светлячка ---------- */
function drawOrb(c,t,r){
  var h=COL[t][0],s=COL[t][1],g;
  g=c.createRadialGradient(0,0,r*.85,0,0,r*1.4);
  g.addColorStop(0,'hsla('+h+','+s+'%,62%,.5)');g.addColorStop(1,'hsla('+h+','+s+'%,62%,0)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r*1.4,0,7);c.fill();
  g=c.createRadialGradient(-r*.3,-r*.35,r*.08,0,0,r);
  g.addColorStop(0,'hsl('+h+','+s+'%,'+(t===MAXT?97:90)+'%)');
  g.addColorStop(.5,'hsl('+h+','+s+'%,'+(t===MAXT?74:63)+'%)');
  g.addColorStop(1,'hsl('+((h+340)%360)+','+(s-10)+'%,'+(t===MAXT?52:40)+'%)');
  c.fillStyle=g;c.beginPath();c.arc(0,0,r,0,7);c.fill();
  c.lineWidth=Math.max(1,r*.06);c.strokeStyle='hsla('+h+',100%,88%,.55)';
  c.beginPath();c.arc(0,0,r-c.lineWidth/2,0,7);c.stroke();
  c.save();c.translate(-r*.36,-r*.48);c.rotate(-.6);c.fillStyle='rgba(255,255,255,.55)';
  c.beginPath();c.ellipse(0,0,r*.26,r*.13,0,0,7);c.fill();c.restore();
  var er=r*.105,ex=r*.3,ey=r*.02;
  c.fillStyle='#1c1033';
  c.beginPath();c.arc(-ex,ey,er,0,7);c.arc(ex,ey,er,0,7);c.fill();
  c.fillStyle='#fff';
  c.beginPath();c.arc(-ex-er*.3,ey-er*.35,er*.38,0,7);c.arc(ex-er*.3,ey-er*.35,er*.38,0,7);c.fill();
  c.strokeStyle='#1c1033';c.lineWidth=Math.max(1,r*.065);c.lineCap='round';
  c.beginPath();c.arc(0,ey+r*.1,r*.2,.2*Math.PI,.8*Math.PI);c.stroke();
}
function buildSprites(){
  sprites=R.map(function(r,t){
    var px=Math.ceil(r*1.45*S*dpr),c=document.createElement('canvas');
    c.width=c.height=px*2;var g=c.getContext('2d');
    g.translate(px,px);drawOrb(g,t,r*S*dpr);return c;
  });
}
function orb(t,x,y,r,a,alpha){
  var sp=sprites[t],k=r/R[t],w=sp.width/dpr*k;
  cx.save();cx.translate(ox+x*S,oy+y*S);if(a)cx.rotate(a);
  if(alpha!=null)cx.globalAlpha=alpha;
  cx.drawImage(sp,-w/2,-w/2,w,w);cx.restore();
}

/* ---------- Раскладка ---------- */
function resize(){
  var cs=getComputedStyle($('probe')),st=parseFloat(cs.paddingTop)||0,sb=parseFloat(cs.paddingBottom)||0;
  vw=window.innerWidth;vh=window.innerHeight;dpr=Math.min(window.devicePixelRatio||1,2.5);
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  var top=st+78,bot=sb+76;
  S=Math.min((vw-20)/W,(vh-top-bot)/H);
  ox=(vw-W*S)/2;oy=top+(vh-top-bot-H*S)/2;hudY=st;
  buildSprites();drawChain();
}
function drawChain(){
  var c=$('chain'),g=c.getContext('2d'),n=8,w=300,h=44;
  c.width=w*dpr;c.height=h*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  for(var i=0;i<n;i++){g.save();g.translate(20+i*(w-40)/(n-1),h/2);drawOrb(g,i,7+i*1.3);g.restore()}
}

/* ---------- Физика ---------- */
function mk(x,y,t,age){return {x:x,y:y,vx:0,vy:0,t:t,r:R[t],a:0,age:age||0,born:0,dead:false}}
function pick(){var x=Math.random()*100;return x<34?0:x<64?1:x<84?2:x<95?3:4}
function step(h){
  var i,j,a,b,n=bodies.length,it,merged=null;
  for(i=0;i<n;i++){
    b=bodies[i];b.age+=h;
    if(b.born>0){b.born-=h;b.r=R[b.t]*(1-.35*Math.max(0,b.born)/.14)}else b.r=R[b.t];
    b.vy+=G*h;b.vx*=.9985;b.vy*=.9995;
    b.px=b.x;b.x+=b.vx*h;b.y+=b.vy*h;
  }
  for(it=0;it<4;it++){
    for(i=0;i<n;i++){
      b=bodies[i];
      if(b.x<b.r){b.x=b.r;if(b.vx<0)b.vx*=-.25}
      else if(b.x>W-b.r){b.x=W-b.r;if(b.vx>0)b.vx*=-.25}
      if(b.y>H-b.r){b.y=H-b.r;if(b.vy>0)b.vy*=-.12;b.vx*=.985}
    }
    for(i=0;i<n;i++){
      a=bodies[i];if(a.dead)continue;
      for(j=i+1;j<n;j++){
        b=bodies[j];if(b.dead)continue;
        var dx=b.x-a.x,dy=b.y-a.y,min=a.r+b.r,d2=dx*dx+dy*dy;
        if(d2>=min*min)continue;
        if(a.t===b.t){a.dead=b.dead=true;(merged||(merged=[])).push(a,b);break}
        var d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d,ov=(min-d)*.9;
        var ma=a.r*a.r,mb=b.r*b.r,tot=ma+mb;
        a.x-=nx*ov*mb/tot;a.y-=ny*ov*mb/tot;b.x+=nx*ov*ma/tot;b.y+=ny*ov*ma/tot;
        var rx=b.vx-a.vx,ry=b.vy-a.vy,vn=rx*nx+ry*ny;
        if(vn<0){
          var im=1/ma+1/mb,jn=-(1.08)*vn/im;
          a.vx-=jn*nx/ma;a.vy-=jn*ny/ma;b.vx+=jn*nx/mb;b.vy+=jn*ny/mb;
          var tx=-ny,ty=nx,vt=rx*tx+ry*ty,jt=-vt*.06/im;
          a.vx-=jt*tx/ma;a.vy-=jt*ty/ma;b.vx+=jt*tx/mb;b.vy+=jt*ty/mb;
        }
      }
    }
  }
  for(i=0;i<n;i++){b=bodies[i];b.a+=(b.x-b.px)/b.r}
  if(merged){
    for(i=0;i<merged.length;i+=2)merge(merged[i],merged[i+1]);
    bodies=bodies.filter(function(q){return !q.dead});
  }
}
function merge(a,b){
  var x=(a.x+b.x)/2,y=(a.y+b.y)/2,t=a.t,pts,nb;
  if(comboT>0)combo++;else combo=1;comboT=1.4;
  if(t<MAXT){
    nb=mk(Math.max(R[t+1],Math.min(W-R[t+1],x)),y,t+1,1);
    nb.vx=(a.vx+b.vx)/2;nb.vy=(a.vy+b.vy)/2;nb.a=a.a;nb.born=.14;bodies.push(nb);
    pts=PTS[t]*combo;
  }else{pts=200*combo;flash=1;quake=14}
  score+=pts;
  burst(x,y,t,10+t*3);
  texts.push({x:x,y:y-R[t],s:'+'+pts,life:1,size:15+Math.min(14,t*1.6+combo*2),c:'#fff'});
  if(combo>=2)texts.push({x:W/2,y:LINE+46,s:T.combo+' x'+combo,life:1.1,size:26+Math.min(14,combo*2),c:'#ffe066',big:1});
  quake=Math.max(quake,Math.min(10,1.5+t+combo));
  sMerge(t,combo);buzz(8+Math.min(30,t*4));
  while(score>=nextBonus){
    nextBonus+=500+Math.floor(nextBonus/2000)*250;
    if(shakes<3){shakes++;texts.push({x:W/2,y:H-40,s:T.bonus,life:1.6,size:20,c:'#c9b3ff',big:1});ui()}
  }
}
function burst(x,y,t,n){
  var c='hsl('+COL[t][0]+','+COL[t][1]+'%,72%)';
  for(var i=0;i<n;i++){
    var an=Math.random()*6.283,sp=60+Math.random()*220;
    parts.push({x:x,y:y,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp-60,life:.5+Math.random()*.4,r:1.5+Math.random()*3,c:c});
  }
  if(parts.length>260)parts.splice(0,parts.length-260);
}

/* ---------- Игровой цикл ---------- */
function update(dt){
  if(state!=='play')return;
  var acc=dt,h=1/120,k=0;
  while(acc>1e-6&&k++<5){step(h);acc-=h}
  if(cool>0)cool-=dt;
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}
  var danger=false;
  for(var i=0;i<bodies.length;i++){var b=bodies[i];if(b.age>1.1&&b.y-b.r<LINE){danger=true;break}}
  dangerT=danger?dangerT+dt:Math.max(0,dangerT-dt*2);
  if(dangerT>2.6)gameOver();
}
function fx(dt){
  var i,p;
  for(i=parts.length;i--;){p=parts[i];p.life-=dt;if(p.life<=0){parts.splice(i,1);continue}
    p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}
  for(i=texts.length;i--;){p=texts[i];p.life-=dt;if(p.life<=0){texts.splice(i,1);continue}p.y-=(p.big?14:38)*dt}
  if(quake>0)quake=Math.max(0,quake-dt*40);
  if(flash>0)flash=Math.max(0,flash-dt*1.5);
  shown+=(score-shown)*Math.min(1,dt*12);if(score-shown<.5)shown=score;
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
var stars=[];for(var si=0;si<46;si++)stars.push([Math.random(),Math.random(),Math.random()*1.3+.4,Math.random()*6.28]);
function render(now){
  cx.setTransform(dpr,0,0,dpr,0,0);
  var g=cx.createLinearGradient(0,0,0,vh);g.addColorStop(0,'#140c36');g.addColorStop(.6,'#0b0820');g.addColorStop(1,'#07051a');
  cx.fillStyle=g;cx.fillRect(0,0,vw,vh);
  var i,p;
  for(i=0;i<stars.length;i++){p=stars[i];cx.globalAlpha=.25+.3*Math.sin(now/900+p[3]);cx.fillStyle='#cfd6ff';
    cx.beginPath();cx.arc(p[0]*vw,p[1]*vh,p[2],0,7);cx.fill()}
  cx.globalAlpha=1;

  /* шапка */
  cx.textAlign='center';cx.textBaseline='middle';cx.fillStyle='#fff';
  cx.font='900 38px system-ui,sans-serif';cx.fillText(Math.round(shown),vw/2,hudY+34);
  cx.font='600 13px system-ui,sans-serif';cx.fillStyle='rgba(255,255,255,.6)';
  cx.fillText(T.best+' '+Math.max(best,score),vw/2,hudY+62);
  cx.fillText(T.next,vw-40,hudY+16);
  cx.fillStyle='rgba(255,255,255,.08)';cx.beginPath();cx.arc(vw-40,hudY+48,21,0,7);cx.fill();
  var nr=Math.min(17,R[next]*.62),sp=sprites[next],nw=sp.width/dpr*(nr/R[next])/S;
  cx.drawImage(sp,vw-40-nw/2,hudY+48-nw/2,nw,nw);

  /* банка */
  var qx=quake?(Math.random()-.5)*quake*.5:0,qy=quake?(Math.random()-.5)*quake*.5:0;
  cx.save();cx.translate(qx,qy);
  var jx=ox-5,jy=oy+LINE-70,jw=W*S+10,jh=(H-LINE+70)*S+5;
  rr(jx,jy,jw,jh,22);
  g=cx.createLinearGradient(0,jy,0,jy+jh);g.addColorStop(0,'rgba(255,255,255,.015)');g.addColorStop(1,'rgba(150,130,255,.09)');
  cx.fillStyle=g;cx.fill();
  cx.lineWidth=2.5;cx.strokeStyle='rgba(200,190,255,.32)';cx.stroke();

  /* линия опасности */
  var dz=Math.min(1,dangerT/2.6),bl=dangerT>.25?(.55+.45*Math.sin(now/(110-60*dz))):0;
  cx.setLineDash([8,8]);cx.lineWidth=2;
  cx.strokeStyle=bl?'rgba(255,80,90,'+(.4+.6*bl)+')':'rgba(255,255,255,.16)';
  cx.beginPath();cx.moveTo(ox+4,oy+LINE*S);cx.lineTo(ox+W*S-4,oy+LINE*S);cx.stroke();cx.setLineDash([]);
  if(bl){g=cx.createLinearGradient(0,oy+(LINE-70)*S,0,oy+(LINE+40)*S);
    g.addColorStop(0,'rgba(255,60,80,0)');g.addColorStop(.6,'rgba(255,60,80,'+(.22*dz*bl)+')');g.addColorStop(1,'rgba(255,60,80,0)');
    cx.fillStyle=g;cx.fillRect(ox,oy+(LINE-70)*S,W*S,110*S)}

  /* прицел и светлячок в руке */
  if(state==='play'&&cool<=0){
    var r=R[cur],x=Math.max(r,Math.min(W-r,aimX));
    cx.setLineDash([3,9]);cx.lineWidth=2;cx.strokeStyle='rgba(255,255,255,'+(holding?.4:.18)+')';
    cx.beginPath();cx.moveTo(ox+x*S,oy+(DROP_Y+r)*S);cx.lineTo(ox+x*S,oy+H*S);cx.stroke();cx.setLineDash([]);
    orb(cur,x,DROP_Y+Math.sin(now/260)*2,r,0);
    if(!drops){cx.font='600 15px system-ui,sans-serif';cx.fillStyle='rgba(255,255,255,'+(.6+.3*Math.sin(now/300))+')';
      cx.fillText('↔  '+T.hint,vw/2,oy+(LINE+26)*S)}
  }
  for(i=0;i<bodies.length;i++){p=bodies[i];orb(p.t,p.x,p.y,p.r,p.a)}
  for(i=0;i<parts.length;i++){p=parts[i];cx.globalAlpha=Math.min(1,p.life*2.2);cx.fillStyle=p.c;
    cx.beginPath();cx.arc(ox+p.x*S,oy+p.y*S,p.r*S,0,7);cx.fill()}
  for(i=0;i<texts.length;i++){p=texts[i];cx.globalAlpha=Math.min(1,p.life*2.5);
    var sc=p.big?1+.25*Math.max(0,p.life-.85)/.25:1;
    cx.font='900 '+Math.round(p.size*S*sc)+'px system-ui,sans-serif';
    cx.lineWidth=4;cx.strokeStyle='rgba(20,10,50,.7)';cx.strokeText(p.s,ox+p.x*S,oy+p.y*S);
    cx.fillStyle=p.c;cx.fillText(p.s,ox+p.x*S,oy+p.y*S)}
  cx.globalAlpha=1;cx.restore();
  if(flash>0){cx.fillStyle='rgba(255,240,200,'+flash*.5+')';cx.fillRect(0,0,vw,vh)}
}
var last=0,saveT=0;
function frame(now){
  var dt=Math.min(.034,(now-last)/1000||0);last=now;
  update(dt);fx(dt);render(now);
  saveT+=dt;if(saveT>4){saveT=0;save()}
  requestAnimationFrame(frame);
}

/* ---------- Управление игрой ---------- */
function ui(){
  $('ovMenu').classList.toggle('on',state==='menu');
  $('ovPause').classList.toggle('on',state==='pause');
  $('ovOver').classList.toggle('on',state==='over');
  $('bPause').style.display=$('bShake').style.display=state==='play'?'':'none';
  $('shakeN').textContent=shakes;$('bShake').disabled=shakes<=0;
  $('bSound1').textContent=$('bSound2').textContent=sound?T.soundOn:T.soundOff;
  $('bPlay').textContent=hasSave?T.cont:T.play;
  $('menuBest').textContent=best?T.best+': '+best:'';
}
function newGame(){
  bodies=[];parts=[];texts=[];score=shown=0;combo=comboT=dangerT=0;shakes=2;nextBonus=500;drops=0;
  cur=pick();next=pick();cool=0;aimX=W/2;hasSave=false;state='play';ui();save();
}
function start(){audio();if(hasSave){state='play';hasSave=false;ui()}else newGame()}
function pause(){if(state==='play'){state='pause';holding=false;ui();save()}}
function resume(){if(state==='pause'){state='play';ui()}}
function gameOver(){
  var rec=score>best&&score>0;
  for(var i=0;i<bodies.length;i++)burst(bodies[i].x,bodies[i].y,bodies[i].t,6);
  state='over';if(rec)best=score;
  $('overScore').textContent=score;$('overNew').style.display=rec?'':'none';
  $('overBest').textContent=T.best+': '+best;
  sOver();buzz([40,60,120]);ui();save();
}
function drop(){
  if(state!=='play'||cool>0)return;
  var r=R[cur],b=mk(Math.max(r,Math.min(W-r,aimX)),DROP_Y,cur,0);
  b.vy=120;bodies.push(b);combo=0;comboT=0;cur=next;next=pick();cool=.42;drops++;sDrop();
}
function shake(){
  if(state!=='play'||shakes<=0)return;
  shakes--;quake=16;
  bodies.forEach(function(b){b.vy-=420+Math.random()*320;b.vx+=(Math.random()-.5)*520});
  sShake();buzz(60);ui();
}
function toggleSound(){sound=!sound;if(sound)tone(523,.12,'triangle',.18);ui();save()}

/* ---------- Ввод ---------- */
function aim(e){aimX=(e.clientX-ox)/S}
cv.addEventListener('pointerdown',function(e){if(state!=='play')return;audio();holding=true;aim(e);e.preventDefault()});
cv.addEventListener('pointermove',function(e){if(holding||e.pointerType==='mouse')aim(e)});
window.addEventListener('pointerup',function(e){if(!holding)return;holding=false;if(e.target===cv||state==='play'){aim(e);drop()}});
window.addEventListener('pointercancel',function(){holding=false});
document.addEventListener('contextmenu',function(e){e.preventDefault()});
window.addEventListener('keydown',function(e){
  if(e.key===' '||e.key==='ArrowDown'){drop();e.preventDefault()}
  else if(e.key==='ArrowLeft')aimX=Math.max(0,aimX-14);
  else if(e.key==='ArrowRight')aimX=Math.min(W,aimX+14);
  else if(e.key==='Escape'||e.key==='p'){if(state==='play')pause();else resume()}
});
$('bPlay').onclick=start;$('bAgain').onclick=newGame;$('bResume').onclick=resume;
$('bRestart1').onclick=newGame;$('bPause').onclick=pause;$('bShake').onclick=shake;
$('bSound1').onclick=$('bSound2').onclick=toggleSound;
document.addEventListener('visibilitychange',function(){if(document.hidden){pause();save();if(ac)try{ac.suspend()}catch(e){}}});
window.addEventListener('pagehide',save);
window.addEventListener('resize',resize);

/* Кнопка «Назад» на Android: 'handled' — остаёмся в игре, 'exit' — можно закрывать. */
window.__back=function(){if(state==='play'){pause();return 'handled'}if(state==='pause'){resume();return 'handled'}save();return 'exit'};
window.__gj={drawOrb:drawOrb,R:R,dbg:function(){return {state:state,score:score,n:bodies.length,best:best,shakes:shakes,bodies:bodies}}};

load();resize();ui();requestAnimationFrame(frame);
})();
</script>
