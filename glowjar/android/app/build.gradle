plugins {
    id 'com.android.application'
}

// Ключ подписи лежит вне репозитория: android/keystore.properties
// (storeFile, storePassword, keyAlias, keyPassword). Без него release собирается неподписанным.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.chikizis.glowjar'
    compileSdk 36

    defaultConfig {
        applicationId 'com.chikizis.glowjar'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    // Игра — один файл в ../www, он же попадает в assets приложения.
    sourceSets {
        main.assets.srcDirs = ['../../www']
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
