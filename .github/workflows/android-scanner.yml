name: Android 3D Scanner APK

on:
  push:
    paths:
      - "scanner3d-android/**"
      - ".github/workflows/android-scanner.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scanner3d-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build APK
        run: ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: 3d-scanner-apk
          path: scanner3d-android/app/build/outputs/apk/release/*.apk
