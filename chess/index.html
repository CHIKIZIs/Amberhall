<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Шах и Хаос</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Минимализм: тёплый светлый фон и чёрные линии; один акцент — коралловый (враг, выбор, тревоги).
   Никаких рамок и теней, кроме карточки поверх игры. */
:root{
  --bg:#f5f4f0; --surface:#ffffff; --ink:#1c1c1e; --muted:#85848a; --line:#e3e1da;
  --accent:#ee5230; --accent-soft:rgba(238,82,48,.13); --good:#1f9d55;
  --sq-light:#ecebe5; --sq-dark:#d5d2c8; --piece:#ffffff; --piece-line:#1c1c1e;
  --last:rgba(28,28,30,.07); --dot:rgba(28,28,30,.22);
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1d1d20; --ink:#f2f2f3; --muted:#8d8d93; --line:#2d2d32;
  --accent:#ff6a45; --accent-soft:rgba(255,106,69,.16); --good:#3ecf7e;
  --sq-light:#3b3b41; --sq-dark:#2c2c31; --piece:#f4f4f5; --piece-line:#0d0d0f;
  --last:rgba(255,255,255,.07); --dot:rgba(255,255,255,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1d1d20; --ink:#f2f2f3; --muted:#8d8d93; --line:#2d2d32;
  --accent:#ff6a45; --accent-soft:rgba(255,106,69,.16); --good:#3ecf7e;
  --sq-light:#3b3b41; --sq-dark:#2c2c31; --piece:#f4f4f5; --piece-line:#0d0d0f;
  --last:rgba(255,255,255,.07); --dot:rgba(255,255,255,.25); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
img.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
button{font-family:inherit;font-size:inherit;color:inherit}

.btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 16px;
  cursor:pointer;font-weight:500;line-height:1.2;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.35;cursor:default}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.warn{color:var(--accent);border-color:var(--accent-soft)}
.btn.sm{padding:6px 4px;font-size:13px;border:0;background:transparent;color:var(--muted)}
.btn.sm:hover{color:var(--ink)}

#game{position:fixed;inset:0;display:grid;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  gap:12px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto minmax(0,1fr) auto;
  grid-template-areas:"top" "boss" "relics" "board" "side"}
#top{grid-area:top;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
#stageLbl{font-weight:600;font-size:15px}
#hearts{color:var(--accent);letter-spacing:2px;font-size:14px}
#money{font-weight:600}
#top .spacer{flex:1}
#boss{grid-area:boss;padding:10px 12px;font-size:13px;background:var(--accent-soft);border-radius:12px;color:var(--ink)}
#boss b{color:var(--accent);font-weight:600}
#relicBar{grid-area:relics;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#relicBar:empty{display:none}
.chip{width:30px;height:30px;display:grid;place-items:center;cursor:pointer;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.chip img{width:16px;height:16px}
#boardwrap{grid-area:board;display:grid;place-items:center;min-height:0;min-width:0;position:relative}
#board{display:block;touch-action:none}
#side{grid-area:side;display:flex;flex-direction:column;gap:12px}
#info{min-height:42px;font-size:14px;color:var(--muted)}
#info b{color:var(--ink);font-weight:600}
#info .no{color:var(--accent)}
#actions{display:flex;align-items:stretch;gap:8px}
#actions .btn{flex:1;min-width:0;font-size:14px;padding:10px 6px}
.pips{display:block;margin-top:2px;font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:400}
#turnLbl{flex:1;display:grid;place-items:center;font-size:14px;font-weight:600;text-align:center;border-radius:12px;padding:8px 6px}
#turnLbl.p{background:var(--ink);color:var(--bg)}
#turnLbl.p .pips{color:inherit;opacity:.6}
#turnLbl.e{background:var(--accent-soft);color:var(--accent)}
#btnBolt.ready{background:var(--accent);border-color:var(--accent);color:#fff}
#btnBolt.ready .pips{color:#fff;opacity:.8}

@media (min-aspect-ratio: 5/4){
  #game{grid-template-columns:minmax(170px,1fr) auto minmax(190px,1fr);grid-template-rows:auto auto 1fr;
    grid-template-areas:"top board side" "boss board side" "relics board side";column-gap:28px}
  #top{flex-direction:column;align-items:flex-start;gap:6px}
  #top .spacer{display:none}
  #relicBar{align-content:flex-start}
  #side{justify-content:center}
  #actions{flex-direction:column}
  #boardwrap{width:var(--bw,60vh)}
}

#ov{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:grid;place-items:center;z-index:10;padding:16px;overflow:auto}
#panel{width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;padding:28px 22px 22px;background:var(--surface);color:var(--ink);
  border-radius:20px;border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.14)}
#panel h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:10px 0 4px;text-align:center;text-wrap:balance}
#panel h2{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0 0 14px;text-align:center}
#panel h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:22px 0 10px}
#panel p{margin:8px 0}
#panel b{font-weight:600}
.center{text-align:center}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.shopgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:var(--bg);padding:12px 4px 10px;text-align:center;cursor:pointer;position:relative;font-size:12px;border-radius:14px;border:1.5px solid transparent}
.card img{height:44px;width:auto;display:block;margin:0 auto 8px}
.card img.ic{width:28px;height:28px;margin:8px auto 16px}
.card .pr{display:block;margin-top:4px;font-weight:600;font-size:13px}
.card .tag{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.card.sel{border-color:var(--ink)}
.card.sold{opacity:.25;pointer-events:none}
.roster{display:flex;flex-wrap:wrap;gap:6px}
.rp{width:46px;height:52px;background:var(--bg);display:grid;place-items:center;cursor:pointer;position:relative;border-radius:10px;border:1.5px solid transparent}
.rp img{height:38px;width:auto}
.rp img.ic{width:22px;height:22px}
.rp.bench{opacity:.35}
.rp.sel{border-color:var(--ink)}
.rp .z{position:absolute;bottom:1px;right:3px;font-size:9px;color:var(--muted)}
#sdesc{min-height:72px;background:var(--bg);padding:12px 14px;margin-top:14px;font-size:14px;border-radius:14px}
.mrow{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
#mini{cursor:pointer;border-radius:8px}
.bigmoney{font-size:28px;font-weight:700;text-align:center;letter-spacing:-.02em}
.ok{color:var(--good)}.no{color:var(--accent)}
.lines{background:var(--bg);border-radius:14px;padding:12px 14px;margin:12px 0}
.lines div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.helpgrid{display:grid;grid-template-columns:auto 1fr;gap:10px 12px;align-items:center;font-size:13px}
.helpgrid img{width:20px;height:20px}
.logo{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:4px}
.logo img{height:48px;width:auto}
</style>
</head>

<div id="ov"><div id="panel" class="pnl"></div></div>

function bitmap(rows,wd,ht,colorOf,outline){
  const c=document.createElement('canvas');c.width=wd+2;c.height=ht+2;const g=c.getContext('2d');
  const at=(x,y)=>{const ch=(rows[y]||'')[x];return ch&&ch!=='.'?ch:null};
  for(let y=-1;y<=ht;y++)for(let x=-1;x<=wd;x++){
    const ch=at(x,y);let col=null;
    if(ch)col=colorOf(ch,x,y,at);
    else if(outline&&(at(x-1,y)||at(x+1,y)||at(x,y-1)||at(x,y+1)))col=outline;
    if(col){g.fillStyle=col;g.fillRect(x+1,y+1,1,1)}
  }
  return c;
}
/* Объёмная заливка: свет слева-сверху. Для каждого пикселя считаем положение внутри горизонтального «среза» фигуры
   и красим как цилиндр: блик → светлый → основной → полутень (дизеринг) → тень. */
function pieceSprite(t,side){
  const P=PAL[side];
  return bitmap(SPR[t].concat(PED),16,24,ch=>ch==='x'?P.line:P.fill,P.line);
}
function iconSprite(key,col){
  return bitmap(ICONS[key],8,8,(ch,x,y,at)=>ch==='+'?shade(col,.55):(!at(x,y-1)&&!at(x-1,y))?shade(col,.3):(!at(x+1,y)||!at(x,y+1))?shade(col,-.25):col,'#1c1418');
}
const SP={P:{},E:{}},SPURL={P:{},E:{}},ICO={},ICOURL={};
function buildSprites(){for(const t in SPR)for(const s of ['P','E']){SP[s][t]=pieceSprite(t,s);SPURL[s][t]=SP[s][t].toDataURL()}}

let AC=null,sndOn=true;
function beep(f,d,type='square',v=.045,slide=0,delay=0){
  if(!sndOn)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
const SFX={
  sel:()=>beep(520,.04,'square',.03),
  move:()=>beep(300,.07,'triangle',.08),
  emove:()=>beep(200,.07,'triangle',.08),
  cap:()=>{beep(220,.12,'square',.05,-150);beep(80,.18,'triangle',.09)},
  bolt:()=>{beep(1400,.3,'sawtooth',.04,-1300);beep(60,.4,'square',.05,0,.05)},
  buy:()=>{beep(660,.06);beep(990,.09,'square',.045,0,.06)},
  coin:()=>beep(1200,.08,'square',.03,300),
  err:()=>beep(110,.12,'square',.04),
  win:()=>[523,659,784,1046].forEach((f,i)=>beep(f,.14,'square',.045,0,i*.1)),
  lose:()=>[392,330,262,196].forEach((f,i)=>beep(f,.18,'triangle',.08,0,i*.13)),
  crack:()=>beep(90,.25,'sawtooth',.05,-40),
};

/* ================= RULES ENGINE ================= */
const ORTH=[[1,0],[-1,0],[0,1],[0,-1]],DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]],ALL8=ORTH.concat(DIAG);
const KN=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]];
const CM=[[1,3],[3,1],[-1,3],[-3,1],[1,-3],[3,-1],[-1,-3],[-3,-1]];
const NONE={};
function capturable(s,ti,q){return !(q.side==='P'&&q.type!=='K'&&s.tiles[ti]==='fort')}
function pieceMoves(s,i,out){
  const w=s.w,h=s.h,cells=s.cells,holes=s.holes,p=cells[i],x=i%w,y=(i/w)|0,R=p.side==='P'?s.relics:NONE;
  const step=(dx,dy,mode)=>{ // mode 0 any, 1 move-only, 2 capture-only
    const tx=x+dx,ty=y+dy;if(tx<0||ty<0||tx>=w||ty>=h)return false;const ti=ty*w+tx;if(holes[ti])return false;
    const q=cells[ti];if(!q){if(mode!==2)out.push(i,ti);return true}
    if(mode!==1&&q.side!==p.side&&capturable(s,ti,q))out.push(i,ti);return false;
  };
  const steps=d=>{for(const v of d)step(v[0],v[1],0)};
  const slide=(dirs,max,jump)=>{
    for(const [dx,dy] of dirs){let jumped=false;
      for(let k=1;k<=max;k++){const tx=x+dx*k,ty=y+dy*k;if(tx<0||ty<0||tx>=w||ty>=h)break;const ti=ty*w+tx;if(holes[ti])break;
        const q=cells[ti];if(!q){out.push(i,ti);continue}
        if(q.side!==p.side&&capturable(s,ti,q))out.push(i,ti);
        if(jump&&!jumped){jumped=true;continue}break;}
    }
  };
  switch(p.type){
    case 'P':{const d=p.side==='P'?-1:1;
      if(step(0,d,1)&&(!p.moved||R.pawnrush))step(0,2*d,1);
      step(-1,d,2);step(1,d,2);if(R.pawnrush)step(0,d,2);break}
    case 'G':steps(ALL8);break;
    case 'K':if(R.kingstep)slide(ALL8,2);else steps(ALL8);break;
    case 'N':steps(KN);if(R.horseshoe)steps(ALL8);break;
    case 'C':steps(CM);if(R.horseshoe)steps(ALL8);break;
    case 'B':slide(DIAG,99);if(R.staff)steps(ORTH);break;
    case 'R':slide(ORTH,99,!!R.ram);break;
    case 'Q':slide(ALL8,99);break;
    case 'A':slide(DIAG,99);steps(KN);break;
    case 'H':slide(ORTH,99,!!R.ram);steps(KN);break;
  }
  if(p.side==='P'&&s.tiles[i]==='spring'&&p.type!=='N')steps(KN);
}
function genMoves(s,side){const out=[];for(let i=0;i<s.cells.length;i++){const p=s.cells[i];if(p&&p.side===side)pieceMoves(s,i,out)}return out}
function movesFrom(s,i){const out=[];pieceMoves(s,i,out);const r=[];for(let k=1;k<out.length;k+=2)if(!r.includes(out[k]))r.push(out[k]);return r}
function respawnSquare(s,cells,avoid){
  const w=s.w;const order=[...Array(w).keys()].sort((a,b)=>Math.abs(a-(w-1)/2)-Math.abs(b-(w-1)/2));
  for(let y=0;y<s.h;y++)for(const x of order){const i=y*w+x;if(i!==avoid&&!cells[i]&&!s.holes[i])return i}
  return -1;
}
function apply(s,f,t){
  const cells=s.cells.slice();const p=cells[f],cap=cells[t];
  const ns={w:s.w,h:s.h,cells,tiles:s.tiles,holes:s.holes,relics:s.relics,kingLives:s.kingLives,winner:null};
  let np={id:p.id,type:p.type,side:p.side,moved:true};
  cells[f]=null;cells[t]=np;
  if(cap&&cap.type==='K'){
    if(cap.side==='E'&&s.kingLives>1){ns.kingLives=s.kingLives-1;const r=respawnSquare(s,cells,t);if(r>=0)cells[r]={id:cap.id,type:'K',side:'E',moved:true};else ns.winner='P'}
    else ns.winner=cap.side==='E'?'P':'E';
  }
  if(np.side==='E'&&s.tiles[t]==='trap')cells[t]=null;
  else if(np.type==='P'){const ty=(t/s.w)|0;
    if(np.side==='P'?ty<=(s.relics.crown?1:0):ty>=s.h-1)cells[t]={id:np.id,type:'Q',side:np.side,moved:true};}
  return ns;
}
function evalS(s){
  let v=0;const w=s.w,h=s.h,cx=(w-1)/2,cy=(h-1)/2;
  for(let i=0;i<s.cells.length;i++){const p=s.cells[i];if(!p)continue;const x=i%w,y=(i/w)|0;
    let val=VAL[p.type];
    if(p.type==='P')val+=0.12*(p.side==='E'?y:h-1-y);
    else if(p.type!=='K')val+=0.04*(4-Math.abs(x-cx)-Math.abs(y-cy));
    v+=p.side==='E'?val:-val;}
  return v+(s.kingLives-1)*5;
}
function orderMoves(s,mv){
  const n=mv.length/2,keys=new Array(n),idx=new Array(n);
  for(let k=0;k<n;k++){const q=s.cells[mv[2*k+1]];idx[k]=k;keys[k]=q?(q.type==='K'?1000:VAL[q.type]*10-VAL[s.cells[mv[2*k]].type]):0}
  idx.sort((a,b)=>keys[b]-keys[a]);return idx;
}
let NODES=0;
function negamax(s,depth,alpha,beta,side){
  NODES++;
  if(s.winner)return (s.winner===side?1:-1)*(100000+depth);
  if(depth===0){const e=evalS(s);return side==='E'?e:-e}
  const mv=genMoves(s,side);
  if(!mv.length){const e=evalS(s);return side==='E'?e:-e}
  const o=side==='E'?'P':'E';let best=-1e9;
  for(const k of orderMoves(s,mv)){
    const v=-negamax(apply(s,mv[2*k],mv[2*k+1]),depth-1,-beta,-alpha,o);
    if(v>best)best=v;if(v>alpha)alpha=v;if(alpha>=beta)break;
  }
  return best;
}
function aiChoose(s,depth,noise){
  const mv=genMoves(s,'E');if(!mv.length)return null;
  NODES=0;let best=null,bv=-1e12;
  for(const k of orderMoves(s,mv)){
    const v=-negamax(apply(s,mv[2*k],mv[2*k+1]),depth-1,-1e9,1e9,'P')+Math.random()*noise;
    if(v>bv){bv=v;best=[mv[2*k],mv[2*k+1]]}
  }
  return best;
}

/* ================= BATTLE SETUP ================= */
function deploy(s,types,side){
  const w=s.w,h=s.h,rows=side==='P'?[h-1,h-2,h-3]:[0,1,2];
  const order=[...Array(w).keys()].sort((a,b)=>Math.abs(a-(w-1)/2)-Math.abs(b-(w-1)/2)||(side==='P'?a-b:b-a));
  const put=(t,pref)=>{for(const y of pref)for(const x of order){const i=y*w+x;if(!s.cells[i]&&!s.holes[i]){s.cells[i]={id:PID++,type:t,side,moved:false};return}}};
  put('K',[rows[0]]);
  types.filter(t=>t!=='K'&&t!=='P').sort((a,b)=>VAL[b]-VAL[a]).forEach(t=>put(t,[rows[0],rows[1],rows[2]]));
  types.filter(t=>t==='P').forEach(t=>put(t,[rows[1],rows[2],rows[0]]));
}
function enemyArmy(st,m,boss,w){
  const pool=st===1?['G','N','B','N','B','G']:st===2?['N','B','C','R','G','R','A']:['R','B','N','A','H','Q','C','R'];
  let budget=3+st*4+m*2+(boss?4:0);
  const pawns=Math.min(w,2+st+(m>1?1:0));
  const list=['K'];for(let i=0;i<pawns;i++)list.push('P');budget-=pawns;
  let off=0;
  while(budget>=2&&off<w-1){const c=pool.filter(t=>VAL[t]<=budget);if(!c.length)break;const t=pick(c);list.push(t);budget-=VAL[t];off++}
  return list;
}
function prepareBattle(){
  const st=RUN.stage,m=RUN.match,boss=m===3?BOSSES[st-1]:null;
  if(boss){showBossIntro(boss);return}
  startBattle();
}
function startBattle(){
  BATTLE_TOKEN++;
  const st=RUN.stage,m=RUN.match,boss=m===3?BOSSES[st-1]:null;
  const w=[6,7,8][st-1],h=w;
  const s={w,h,cells:new Array(w*h).fill(null),tiles:new Array(w*h).fill(null),holes:new Array(w*h).fill(0),relics:relicObj(),kingLives:boss&&boss.id==='bone'?3:1,winner:null};
  const off=Math.floor((w-6)/2);
  for(const t of RUN.tiles)s.tiles[(h-1-t.r)*w+t.c+off]=t.kind;
  const mine=[];let cnt=0;
  for(const r of RUN.roster){if(r.type==='K')continue;if(!r.bench&&cnt<RUN.cap){mine.push(r.type);cnt++}}
  deploy(s,['K',...mine],'P');
  deploy(s,enemyArmy(st,m,boss,w),'E');
  B={s,boss,skips:3+(hasR('hourglass')?2:0),skipsMax:3+(hasR('hourglass')?2:0),charge:0,turn:'P',pTurns:1,eTurns:0,
     extra:hasR('sword')?1:0,sel:-1,moves:[],peek:-1,peekMoves:[],mode:null,last:null,warn:-1,over:false,kills:0,earned:0,threat:new Set()};
  if(hasR('bomb')){const ps=[];s.cells.forEach((p,i)=>{if(p&&p.side==='E'&&p.type==='P')ps.push(i)});
    if(ps.length){const i=pick(ps);s.cells[i]=null;setTimeout(()=>{boom(i,'#ffb347',22);floatText(i,'Бабах!','#ffcf6a')},300)}}
  FX.parts.length=0;FX.texts.length=0;ANIM.clear();
  $('#ov').classList.add('hidden');$('#game').classList.remove('hidden');
  recalcThreat();resize();updateUI();
  setInfo(boss?`<b>${boss.n}</b>: ${boss.d}`:(B.extra?'Первый удар: у вас два хода подряд! Возьмите вражеского короля.':'Ваш ход. Цель — взять вражеского короля. Шаха нет: короля просто бьют!'));
}

const FX={parts:[],texts:[],flash:0,shake:0,bolt:null};
const ANIM=new Map();
function cellCenter(i){const w=B.s.w;return [(i%w+.5)*T,(((i/w)|0)+.5)*T]}

/* ================= BOARD RENDER ================= */
const cv=$('#board'),g=cv.getContext('2d');let T=48,DPR=1,OX=0,OY=8,PU=1,PSC=2;
let BC={};
function resize(){
  if(!B)return;
  const wrap=$('#boardwrap');const land=matchMedia('(min-aspect-ratio: 5/4)').matches;
  let W,H;
  if(land){H=wrap.clientHeight;W=Math.min(window.innerWidth*.55,H);document.documentElement.style.setProperty('--bw',Math.floor(W)+'px')}
  else{W=wrap.clientWidth;H=wrap.clientHeight}
  const w=B.s.w,h=B.s.h;
  T=Math.max(22,Math.floor(Math.min(W/w,(H-4)/(h+.2))));
  DPR=Math.min(3,window.devicePixelRatio||1);
  PU=Math.max(1,Math.round(T/26));
  PSC=Math.max(1,Math.floor(T*DPR*.92/26))/DPR;
  OX=0;OY=Math.round(T*.18);
  const CW=w*T,CH=OY+h*T;
  cv.width=Math.round(CW*DPR);cv.height=Math.round(CH*DPR);cv.style.width=CW+'px';cv.style.height=CH+'px';
}
addEventListener('resize',()=>{resize()});
function drawTileDeco(ctx,kind,x,y,S){
  const col=TILES[kind].col;ctx.fillStyle=col+'38';ctx.fillRect(x,y,S,S);
  const dp=(typeof DPR==='number'?DPR:1),ic=ICO[kind],sc=Math.max(1,Math.floor(S*dp*.3/10))/dp,z=10*sc;
  ctx.globalAlpha=.85;ctx.drawImage(ic,Math.round((x+S*.08)*dp)/dp,Math.round((y+S-z-S*.06)*dp)/dp,z,z);ctx.globalAlpha=1;
}
const snap=v=>Math.round(v*DPR)/DPR;
function circle(x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2)}
function draw(now){
  requestAnimationFrame(draw);
  if(!B||$('#game').classList.contains('hidden'))return;
  const s=B.s,w=s.w,h=s.h;
  const dt=Math.min(.05,(now-(draw.last||now))/1000);draw.last=now;
  let sx=0,sy=0;if(FX.shake>0){FX.shake-=dt;sx=(Math.random()-.5)*5;sy=(Math.random()-.5)*5}
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,cv.width,cv.height);
  g.setTransform(DPR,0,0,DPR,sx*DPR,sy*DPR);g.imageSmoothingEnabled=false;
  g.translate(OX,OY);
  // доска со скруглёнными углами
  g.save();g.beginPath();if(g.roundRect)g.roundRect(0,0,w*T,h*T,Math.round(T*.14));else g.rect(0,0,w*T,h*T);g.clip();
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const i=y*w+x,px=x*T,py=y*T;
    if(s.holes[i]){g.fillStyle=BC.bg;g.fillRect(px,py,T,T);continue}
    g.fillStyle=(x+y)%2===0?BC.light:BC.dark;g.fillRect(px,py,T,T);
    if(s.tiles[i])drawTileDeco(g,s.tiles[i],px,py,T);
  }
  if(B.last)for(const i of B.last){g.fillStyle=BC.last;g.fillRect((i%w)*T,((i/w)|0)*T,T,T)}
  if(B.warn>=0){g.globalAlpha=.25+.25*Math.sin(now/140);g.fillStyle=BC.accent;g.fillRect((B.warn%w)*T,((B.warn/w)|0)*T,T,T);g.globalAlpha=1}
  if(B.sel>=0){g.fillStyle=BC.soft;g.fillRect((B.sel%w)*T,((B.sel/w)|0)*T,T,T)}
  g.restore();
  const list=[];
  for(let i=0;i<s.cells.length;i++){const p=s.cells[i];if(!p)continue;
    let x=i%w,y=(i/w)|0,hop=0;const a=ANIM.get(p.id);
    if(a){const k=clamp((now-a.t0)/a.d,0,1);if(k>=1)ANIM.delete(p.id);else{const e=1-(1-k)*(1-k);x=a.fx+(x-a.fx)*e;y=a.fy+(y-a.fy)*e;hop=Math.sin(k*Math.PI)*T*.15}}
    list.push({p,i,x,y,hop});}
  list.sort((a,b)=>a.y-b.y);
  // точки ходов
  const dots=(lst,col)=>{g.fillStyle=col;for(const t of lst){if(s.cells[t])continue;circle((t%w+.5)*T,(((t/w)|0)+.5)*T,T*.12);g.fill()}};
  dots(B.moves,BC.dot);dots(B.peekMoves,BC.accent+'99');
  const SW=18*PSC,SH=26*PSC;
  for(const o of list){const px=o.x*T,py=o.y*T;
    const lift=(o.i===B.sel&&!o.hop)?T*.06:0;
    o.top=py+T*.93-SH-lift-o.hop;
    g.drawImage(SP[o.p.side][o.p.type],snap(px+(T-SW)/2),snap(o.top),SW,SH)}
  const rings=(lst,col)=>{g.strokeStyle=col;g.lineWidth=Math.max(2,T*.06);for(const t of lst){if(!s.cells[t])continue;circle((t%w+.5)*T,(((t/w)|0)+.5)*T,T*.44);g.stroke()}};
  rings(B.moves,BC.dot);rings(B.peekMoves,BC.accent+'aa');
  if(B.mode==='bolt'){g.strokeStyle=BC.accent;g.lineWidth=2;g.globalAlpha=.6+.4*Math.sin(now/150);
    for(const o of list)if(o.p.side==='E'&&o.p.type!=='K'){circle((o.x+.5)*T,(o.y+.5)*T,T*.44);g.stroke()}g.globalAlpha=1}
  for(const o of list){
    if(o.p.side==='P'&&B.threat.has(o.i)&&B.turn==='P'){const r=Math.max(3.5,T*.075),cx=(o.x+.82)*T,cy=Math.max(-OY+r+1,o.top+SH*.28);
      g.fillStyle=BC.bg;circle(cx,cy,r+2);g.fill();g.fillStyle=BC.accent;circle(cx,cy,r);g.fill()}
    if(o.p.side==='E'&&o.p.type==='K'&&s.kingLives>1){const r=Math.max(2,T*.04),gap=r*3.2,x0=(o.x+.5)*T-(s.kingLives-1)*gap/2,cy=Math.max(-OY+r+1,o.top-r*2);
      g.fillStyle=BC.ink;for(let k=0;k<s.kingLives;k++){circle(x0+k*gap,cy,r);g.fill()}}}
  if(FX.bolt){FX.bolt.t+=dt;const b=FX.bolt;if(b.t>.3)FX.bolt=null;else{g.strokeStyle=BC.accent;g.lineWidth=2.5;g.lineJoin='round';g.beginPath();
    for(const [x,y] of b.pts)g.lineTo(x,y);g.stroke()}}

    p.vy+=300*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;g.globalAlpha=clamp(1-p.t/p.life,0,1);g.fillStyle=p.col==='#2a1f27'?BC.ink:BC.accent;circle(p.x,p.y,p.sz*.6);g.fill();g.globalAlpha=1}
  g.font=`600 ${Math.max(12,Math.floor(T/4))}px Inter, system-ui, sans-serif`;g.textAlign='center';

}

  PAL.P={fill:v('--piece'),line:v('--piece-line')};PAL.E={fill:v('--accent'),line:v('--piece-line')};

function recalcThreat(){B.threat=new Set();const mv=genMoves(B.s,'E');for(let k=1;k<mv.length;k+=2){const q=B.s.cells[mv[k]];if(q&&q.side==='P')B.threat.add(mv[k])}}

cv.addEventListener('pointerdown',e=>{

  const x=Math.floor((e.clientX-r.left-OX)/T),y=Math.floor((e.clientY-r.top-OY)/T);
  if(x<0||y<0||x>=B.s.w||y>=B.s.h)return;onCell(y*B.s.w+x);
});
function describe(i){
  const s=B.s,p=s.cells[i],t=s.tiles[i];let txt='';
  if(p)txt=`<b>${PNAME[p.type]}</b>${p.side==='E'?' (враг)':''}: ${PDESC[p.type]}`;
  if(t)txt+=`${txt?'<br>':''}<b>${TILES[t].n}</b>: ${TILES[t].d}`;
  if(s.holes[i])txt='Бездна. Сюда нельзя ходить.';

}
function onCell(i){
  const s=B.s,p=s.cells[i];
  if(B.over)return;
  if(B.turn!=='P'){if(p){B.peek=i;setInfo(describe(i))}return}
  if(B.mode==='bolt'){if(p&&p.side==='E'&&p.type!=='K')doBolt(i);else{B.mode=null;setInfo('Молния отменена.');updateUI()}return}
  if(B.sel>=0&&B.moves.includes(i)){const f=B.sel;B.sel=-1;B.moves=[];B.peekMoves=[];playerMove(f,i);return}
  B.peekMoves=[];
  if(p&&p.side==='P'){if(B.sel===i){B.sel=-1;B.moves=[];setInfo(describe(i));return}
    B.sel=i;B.moves=movesFrom(s,i);SFX.sel();setInfo(describe(i)+(B.moves.length?'':'<br><i>Ходов нет.</i>'))}
  else{B.sel=-1;B.moves=[];if(p){B.peekMoves=movesFrom(s,i);setInfo(describe(i)+'<br><span class="sub">Красным — куда она может пойти.</span>')}else setInfo(describe(i)||'Выберите свою фигуру.')}
}

  B.mode='bolt';B.sel=-1;B.moves=[];B.peekMoves=[];setInfo('Выберите вражескую фигуру (не короля) — молния уничтожит её. Ход не тратится.');updateUI()};
$('#btnSkip').onclick=()=>{if(!B||B.turn!=='P'||B.over||B.skips<=0)return;

  const k=B.s.cells.findIndex(p=>p&&p.side==='P'&&p.type==='K');if(k>=0)floatText(k,'+1 заряд','#c9b4ff');

function gainCharge(n){B.charge=Math.min(boltMax(),B.charge+n)}
function addMoney(n,i,label){RUN.money+=n;B.earned+=n;if(i!=null)floatText(i,`+$${n}`,'#ffd65a');SFX.coin()}

/* ================= TURN FLOW ================= */
function doMove(f,t,side){
  const s=B.s,p=s.cells[f],cap=s.cells[t];
  const ns=apply(s,f,t);
  animate(p.id,f,t,side==='P'?180:240);
  B.s=ns;B.last=[f,t];
  side==='P'?SFX.move():SFX.emove();
  if(cap){
    setTimeout(()=>{boom(t,cap.side==='E'?'#e06a6e':'#f1e5c8');SFX.cap();FX.shake=.12},120);
    if(cap.side==='E'){B.kills++;RUN.kills++;gainCharge(1);if(hasR('bounty'))addMoney(1,t)}
    else if(hasR('martyr')&&cap.type!=='K'){addMoney(2,t);gainCharge(1)}
    if(cap.type==='K'&&ns.kingLives<s.kingLives){const r=ns.cells.findIndex(q=>q&&q.side==='E'&&q.type==='K');
      setTimeout(()=>{floatText(t,'Он восстаёт!','#f3ead4');if(r>=0){boom(r,'#f3ead4',20);}},250)}
  }
  const np=ns.cells[t];
  if(!np){setTimeout(()=>{boom(t,'#d9534f',18);floatText(t,'Шипы!','#ff8a7a');SFX.cap()},200);if(p.side==='E'){B.kills++;if(hasR('bounty'))addMoney(1,t)}}
  else if(np.type!==p.type){setTimeout(()=>floatText(t,'Коронация!','#ffe27a'),200)}
  if(np&&side==='P'){
    if(s.tiles[t]==='gold')addMoney(1,t);
    if(s.tiles[t]==='altar'){gainCharge(1);floatText(t,'+заряд','#c9b4ff')}
  }
  recalcThreat();
  if(ns.winner){endBattle(ns.winner==='P');return true}
  return false;
}
function playerMove(f,t){
  if(doMove(f,t,'P'))return;
  updateUI();
  if(B.extra>0){B.extra--;setInfo('Ещё один ход!');return}
  enemyPhase();
}
function doBolt(i){
  const s=B.s,cells=s.cells.slice(),w=s.w,targets=[i];
  if(hasR('chain')){const x=i%w,y=(i/w)|0,nb=[];for(const [dx,dy] of ALL8){const tx=x+dx,ty=y+dy;if(tx<0||ty<0||tx>=w||ty>=s.h)continue;const j=ty*w+tx,q=cells[j];if(q&&q.side==='E'&&q.type!=='K')nb.push(j)}if(nb.length)targets.push(pick(nb))}
  const [bx,by]=cellCenter(i);const pts=[];let yy=-10;let xx=bx+(Math.random()-.5)*T;while(yy<by){pts.push([xx,yy]);yy+=T*.4;xx+=(Math.random()-.5)*T*.6+(bx-xx)*.3}pts.push([bx,by]);
  FX.bolt={pts,t:0};FX.flash=.35;FX.shake=.25;SFX.bolt();
  for(const t of targets){cells[t]=null;boom(t,'#b49bf5',20);B.kills++;RUN.kills++;if(hasR('bounty'))addMoney(1,t)}
  B.s={...s,cells};B.charge=0;B.mode=null;recalcThreat();
  setInfo(targets.length>1?'Цепная молния поразила две фигуры!':'Молния! Фигура уничтожена. Ваш ход продолжается.');updateUI();
}
async function enemyPhase(){
  const tok=BATTLE_TOKEN;
  B.turn='E';B.sel=-1;B.moves=[];B.peekMoves=[];updateUI();
  await sleep(380);if(tok!==BATTLE_TOKEN||B.over)return;
  B.eTurns++;
  const n=(B.boss&&B.boss.id==='clock'&&B.eTurns%3===0)?2:1;
  const depth=(RUN.stage>=3||(B.boss&&RUN.stage>=2))?3:2;
  const noise=[1.3,.7,.3][RUN.stage-1]*(B.boss?.5:1);
  for(let k=0;k<n;k++){
    if(k>0){const ki=B.s.cells.findIndex(p=>p&&p.side==='E'&&p.type==='K');if(ki>=0)floatText(ki,'Тик-так!','#ffb35c');await sleep(420);if(tok!==BATTLE_TOKEN||B.over)return}
    let d=depth;const mvE=genMoves(B.s,'E').length/2,mvP=genMoves(B.s,'P').length/2;if(d===3&&mvE*mvP*mvE>60000)d=2;
    const m=aiChoose(B.s,d,noise);
    if(m){if(doMove(m[0],m[1],'E'))return}
    await sleep(260);if(tok!==BATTLE_TOKEN||B.over)return;
  }
  if(B.boss&&B.boss.id==='quake')quakeTick();
  if(B.over)return;
  B.turn='P';B.pTurns++;
  if(B.pTurns>TURN_LIMIT){endBattle(false,'Время вышло: вы не успели взять короля.');return}
  if(!genMoves(B.s,'P').length){setInfo('У вас нет ходов — ход пропущен.');updateUI();await sleep(500);return enemyPhase()}
  if(!B.extra&&B.threat.size)setInfo(`Ваш ход. <span class="no">Под ударом: ${B.threat.size}</span> (красный значок).`);
  else setInfo('Ваш ход.');
  updateUI();
}
function quakeTick(){
  const s=B.s;
  if(B.warn>=0){const i=B.warn;B.warn=-1;const holes=s.holes.slice();holes[i]=1;const cells=s.cells.slice();const p=cells[i];
    SFX.crack();FX.shake=.3;boom(i,'#463c78',22);
    if(p&&p.type!=='K'){cells[i]=null;floatText(i,'Провал!','#ff8a7a')}else if(p&&p.type==='K'){holes[i]=0;floatText(i,'Устоял!','#ffe27a')}
    B.s={...s,cells,holes};recalcThreat();return}
  if(B.eTurns%2===0){
    const mine=[],empty=[];s.cells.forEach((p,i)=>{if(s.holes[i])return;if(p&&p.side==='P'&&p.type!=='K')mine.push(i);else if(!p)empty.push(i)});
    const c=mine.length?mine:empty;if(c.length){B.warn=pick(c);SFX.crack();floatText(B.warn,'Трещина!','#ff8a7a')}
  }
}
function endBattle(win,reason){
  B.over=true;B.turn='-';updateUI();const tok=BATTLE_TOKEN;
  setTimeout(()=>{if(tok!==BATTLE_TOKEN)return;win?onWin():onLose(reason)},900);
  (win?SFX.win:SFX.lose)();
  setInfo(win?'<b>Король пал!</b> Победа!':'<b>Ваш король пал…</b>');
}

  for(let k=0;k<3;k++){const t=pick(pool);items.push({kind:'piece',t,c:COST[t]})}
  const avail=shuffle(Object.keys(RELICS).filter(r=>!RUN.relics.includes(r)));
  for(const r of avail.slice(0,2))items.push({kind:'relic',t:r,c:RELICS[r].c});
  const tk=pick(Object.keys(TILES));items.push({kind:'tile',t:tk,c:TILES[tk].c});
  return {items,reroll:SHOP?SHOP.reroll:2,sel:null,placing:null};
}
function openShop(){B=null;$('#game').classList.add('hidden');SHOP=genShop();SHOP.reroll=2;renderShop()}
function itemIcon(it){return it.kind==='piece'?SPURL.P[it.t]:ICOURL[it.t]}
function itemName(it){return it.kind==='piece'?PNAME[it.t]:it.kind==='relic'?RELICS[it.t].n:TILES[it.t].n}
function itemDesc(it){return it.kind==='piece'?PDESC[it.t]:it.kind==='relic'?RELICS[it.t].d:TILES[it.t].d}
function renderShop(){
  const S=SHOP,nextBoss=RUN.match===3?BOSSES[RUN.stage-1]:null;
  const tag={piece:'фигура',relic:'талисман',tile:'клетка'};
  let desc='<span class="sub">Нажмите на товар или свою фигуру, чтобы узнать подробности.</span>';
  if(S.placing)desc=`<b>${TILES[S.placing].n}</b>: выберите клетку на мини-доске ниже (это три нижних ряда вашей стороны).`;
  else if(S.sel){
    if(S.sel.type==='item'){const it=S.items[S.sel.k];const pr=price(it.c);const can=RUN.money>=pr;
      let block='';if(it.kind==='piece'&&RUN.roster.length>=MAX_ROSTER)block='Армия заполнена.';if(it.kind==='relic'&&RUN.relics.length>=MAX_RELICS)block='Нет места для талисманов (продайте один).';
      desc=`<b>${itemName(it)}</b> — ${itemDesc(it)}${it.kind==='piece'?`<br><span class="sub">Ценность: ${VAL[it.t]}</span>`:''}<div class="row" style="justify-content:flex-start">${block?`<span class="no">${block}</span>`:`<button class="btn go" data-a="buy" ${can?'':'disabled'}>Купить за $${pr}</button>${can?'':'<span class="no" style="align-self:center">Не хватает денег</span>'}`}</div>`}
    else if(S.sel.type==='roster'){const r=RUN.roster.find(x=>x.id===S.sel.id);
      if(r){const sell=Math.max(1,Math.floor(COST[r.type]/2));
        desc=`<b>${PNAME[r.type]}</b> — ${PDESC[r.type]}<br>${r.type==='K'?'<span class="sub">Король всегда на доске.</span>':r.bench?'<span class="sub">Сейчас в запасе.</span>':'<span class="sub">Выходит на доску.</span>'}
        ${r.type==='K'?'':`<div class="row" style="justify-content:flex-start"><button class="btn" data-a="bench">${r.bench?'В бой':'В запас'}</button><button class="btn warn" data-a="sell">Продать за $${sell}</button></div>`}`}}
    else if(S.sel.type==='relic'){const r=RELICS[S.sel.id];desc=`<b>${r.n}</b> — ${r.d}<div class="row" style="justify-content:flex-start"><button class="btn warn" data-a="sellrelic">Продать за $${Math.floor(r.c/2)}</button></div>`}
  }
  const ob=onBoardCount();
  const capMax=RUN.cap>=10;
  showPanel(`<h2>Магазин</h2>
    <div class="bigmoney">$${RUN.money}</div>
    <h3>Товары</h3>
    <div class="shopgrid">${S.items.map((it,k)=>`<div class="card ${it.sold?'sold':''} ${S.sel&&S.sel.type==='item'&&S.sel.k===k?'sel':''}" data-item="${k}"><span class="tag">${tag[it.kind]}</span>${img(itemIcon(it),it.kind==='piece'?'px':'px ic')}${itemName(it)}<br><span class="pr">$${price(it.c)}</span></div>`).join('')}</div>
    <div class="row"><button class="btn" data-a="reroll" ${RUN.money>=S.reroll?'':'disabled'}>Обновить товары $${S.reroll}</button>
      <button class="btn" data-a="cap" ${!capMax&&RUN.money>=RUN.capCost?'':'disabled'}>${capMax?'Мест на доске: максимум':`Ещё место на доске $${RUN.capCost}`}</button></div>
    <div id="sdesc">${desc}</div>
    <h3>Армия — на доске ${ob}/${RUN.cap} (+ король)</h3>
    <div class="roster">${RUN.roster.map(r=>`<div class="rp ${r.bench?'bench':''} ${S.sel&&S.sel.type==='roster'&&S.sel.id===r.id?'sel':''}" data-ros="${r.id}">${img(SPURL.P[r.type])}${r.bench?'<span class="z">запас</span>':''}</div>`).join('')}</div>
    <div class="mrow">
      <div><h3>Ваша сторона доски</h3><canvas id="mini"></canvas></div>
      <div style="flex:1;min-width:180px"><h3>Талисманы ${RUN.relics.length}/${MAX_RELICS}</h3><div class="roster">${RUN.relics.map(r=>`<div class="rp ${S.sel&&S.sel.type==='relic'&&S.sel.id===r?'sel':''}" data-rel="${r}">${img(ICOURL[r],'px ic')}</div>`).join('')||'<span class="sub">Пока нет.</span>'}</div></div>
    </div>
    <div class="row" style="margin-top:16px"><button class="btn go" data-a="next" ${S.placing?'disabled':''} style="font-size:17px;padding:10px 18px">Далее ▶ Этап ${RUN.stage} · Партия ${RUN.match}${nextBoss?' — БОСС: '+nextBoss.n:''}</button></div>`);
  drawMini();
}
const MT=40;
function drawMini(){
  const c=$('#mini');if(!c)return;const d=Math.min(3,window.devicePixelRatio||1);
  c.width=6*MT*d;c.height=3*MT*d;c.style.width=6*MT+'px';c.style.height=3*MT+'px';const m=c.getContext('2d');m.setTransform(d,0,0,d,0,0);m.imageSmoothingEnabled=false;
  for(let r=0;r<3;r++)for(let x=0;x<6;x++){const y=2-r;const light=(x+r)%2===1;m.fillStyle=light?BC.light:BC.dark;m.fillRect(x*MT,y*MT,MT,MT);
    const t=RUN.tiles.find(q=>q.c===x&&q.r===r);if(t)drawTileDeco(m,t.kind,x*MT,y*MT,MT);
    if(SHOP.placing){m.strokeStyle='#ffd65a';m.lineWidth=2;m.setLineDash([4,3]);m.strokeRect(x*MT+2,y*MT+2,MT-4,MT-4);m.setLineDash([])}}
  c.onclick=e=>{const rc=c.getBoundingClientRect();const x=Math.floor((e.clientX-rc.left)/MT),y=Math.floor((e.clientY-rc.top)/MT);
    if(x<0||x>5||y<0||y>2)return;const r=2-y;
    if(SHOP.placing){RUN.tiles=RUN.tiles.filter(q=>!(q.c===x&&q.r===r));RUN.tiles.push({kind:SHOP.placing,c:x,r});SHOP.placing=null;SFX.buy();renderShop()}
    else{const t=RUN.tiles.find(q=>q.c===x&&q.r===r);if(t){SHOP.sel=null;renderShop();$('#sdesc').innerHTML=`<b>${TILES[t.kind].n}</b> — ${TILES[t.kind].d}`}}};
}
function shopAction(a){
  const S=SHOP;
  if(a==='buy'){const it=S.items[S.sel.k];const pr=price(it.c);if(RUN.money<pr||it.sold){SFX.err();return}
    if(it.kind==='piece'){if(RUN.roster.length>=MAX_ROSTER)return;const r=mkR(it.t);r.bench=onBoardCount()>=RUN.cap;RUN.roster.push(r)}
    if(it.kind==='relic'){if(RUN.relics.length>=MAX_RELICS)return;RUN.relics.push(it.t)}
    if(it.kind==='tile')S.placing=it.t;
    RUN.money-=pr;it.sold=true;S.sel=null;SFX.buy();renderShop();return}
  if(a==='reroll'){if(RUN.money<S.reroll)return;RUN.money-=S.reroll;const rr=S.reroll+1;SHOP=genShop();SHOP.reroll=rr;SFX.buy();renderShop();return}
  if(a==='cap'){if(RUN.money<RUN.capCost||RUN.cap>=10)return;RUN.money-=RUN.capCost;RUN.cap++;RUN.capCost+=4;
    const b=RUN.roster.find(r=>r.bench&&r.type!=='K');if(b)b.bench=false;SFX.buy();renderShop();return}
  if(a==='bench'){const r=RUN.roster.find(x=>x.id===S.sel.id);if(!r)return;
    if(r.bench&&onBoardCount()>=RUN.cap){$('#sdesc').insertAdjacentHTML('beforeend','<div class="no">Нет свободных мест на доске — сначала уберите кого-нибудь в запас.</div>');SFX.err();return}
    r.bench=!r.bench;SFX.sel();renderShop();return}
  if(a==='sell'){const r=RUN.roster.find(x=>x.id===S.sel.id);if(!r||r.type==='K')return;RUN.money+=Math.max(1,Math.floor(COST[r.type]/2));RUN.roster=RUN.roster.filter(x=>x!==r);S.sel=null;SFX.coin();renderShop();return}
  if(a==='sellrelic'){const id=S.sel.id;RUN.money+=Math.floor(RELICS[id].c/2);RUN.relics=RUN.relics.filter(x=>x!==id);S.sel=null;SFX.coin();renderShop();return}
  if(a==='next'){if(S.placing)return;SHOP=null;prepareBattle();return}
}
$('#panel').addEventListener('click',e=>{
  const a=e.target.closest('[data-a]');
  if(a&&!a.disabled){const act=a.dataset.a;
    if(act==='new'){newRun();return}
    if(act==='help'){showHelp(false);return}
    if(act==='title'){showTitle();return}
    if(act==='closehelp'){$('#ov').classList.add('hidden');return}
    if(act==='quit'){BATTLE_TOKEN++;showTitle();return}
    if(act==='fight'){startBattle();return}
    if(act==='shop'){openShop();return}
    if(SHOP){shopAction(act);return}
  }
  if(!SHOP||SHOP.placing)return;
  const it=e.target.closest('[data-item]');if(it){SHOP.sel={type:'item',k:+it.dataset.item};SFX.sel();renderShop();return}
  const ro=e.target.closest('[data-ros]');if(ro){SHOP.sel={type:'roster',id:+ro.dataset.ros};SFX.sel();renderShop();return}
  const rl=e.target.closest('[data-rel]');if(rl){SHOP.sel={type:'relic',id:rl.dataset.rel};SFX.sel();renderShop();return}
});

window.__G={get RUN(){return RUN},get B(){return B},get SHOP(){return SHOP},newRun,onCell,genMoves,apply,aiChoose,openShop,shopAction,startBattle,endBattle};
readTheme();
showTitle();
</script>
