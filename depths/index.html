<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Янтарные глубины</title>
<meta name="theme-color" content="#0b0f24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060d;--amber:#ffb238;--amber2:#d9761e;--ember:#7a3412;--ink:#f4e6c4;--dim:#9a8468;--blood:#ff3a1a;--panel:#1b1420;--panel2:#2c2232;--edge:#0a0710}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body{font-family:'Press Start 2P',ui-monospace,monospace;color:var(--ink);font-size:10px;line-height:1.6}
canvas#c{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges}
.hide{display:none!important}
img.px{image-rendering:pixelated;image-rendering:crisp-edges}

/* ---- HUD: плашки как инвентарные ячейки ---- */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 8px) 0 calc(env(safe-area-inset-left) + 8px);
  display:flex;align-items:flex-start;gap:8px;pointer-events:none;text-shadow:2px 2px 0 #000}
.slot{display:flex;align-items:center;gap:6px;background:rgba(27,20,32,.78);padding:5px 7px;
  box-shadow:inset 0 0 0 2px var(--panel2),0 0 0 2px var(--edge)}
.slot img{width:16px;height:16px}
#oilbar{display:flex;gap:2px}
#oilbar i{width:5px;height:12px;background:#2a1e18}
#oilbar i.on{background:var(--amber);box-shadow:inset 0 -3px 0 var(--amber2)}
#oilbar.low i.on{background:var(--blood);box-shadow:inset 0 -3px 0 #8a1a0a;animation:blink .5s steps(2) infinite}
#depth{flex:1;text-align:center;color:var(--dim);font-size:8px;padding-top:9px}
#pauseBtn{pointer-events:auto;font:inherit;font-size:10px;color:var(--ink);background:rgba(27,20,32,.85);border:0;width:32px;height:32px;
  box-shadow:inset 0 0 0 2px var(--panel2),0 0 0 2px var(--edge)}
#hudR{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#hudL{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
@keyframes blink{50%{opacity:.35}}

#msg{position:fixed;left:0;right:0;top:27%;text-align:center;padding:0 24px;pointer-events:none;
  font-size:10px;line-height:2;color:var(--amber);text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .4s}
#msg.on{opacity:1}

/* ---- сенсорное управление ---- */
#ctl{position:fixed;inset:0;touch-action:none}
#joy{position:fixed;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;
  box-shadow:0 0 0 2px rgba(244,230,196,.18);background:rgba(244,230,196,.04);pointer-events:none;opacity:0;transition:opacity .15s}
#joy.on{opacity:1}
#knob{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;background:rgba(244,230,196,.22);box-shadow:0 0 0 2px rgba(244,230,196,.45)}
#joyHint{position:fixed;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 30px);
  color:rgba(244,230,196,.3);font-size:8px;line-height:2;pointer-events:none}
.cbtn{position:fixed;font:inherit;color:var(--ink);border:0;touch-action:none;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;
  text-shadow:2px 2px 0 #000;background:rgba(27,20,32,.82);box-shadow:inset 0 0 0 3px var(--panel2),0 0 0 3px var(--edge)}
.cbtn img{width:20px;height:20px}
.cbtn small{font-size:7px;color:var(--dim)}
#bJump{right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:84px;height:84px;font-size:10px}
#bFlash{right:calc(env(safe-area-inset-right) + 112px);bottom:calc(env(safe-area-inset-bottom) + 22px);width:66px;height:66px;font-size:8px;
  box-shadow:inset 0 0 0 3px var(--amber2),0 0 0 3px var(--edge)}
#bTorch{right:calc(env(safe-area-inset-right) + 18px);bottom:calc(env(safe-area-inset-bottom) + 118px);width:66px;height:66px;font-size:8px}
#bFlash.cd{filter:brightness(.45)}
#bFlash.urge{animation:urge .25s steps(2) infinite}
@keyframes urge{50%{box-shadow:inset 0 0 0 3px var(--blood),0 0 0 3px var(--edge);background:rgba(90,16,8,.85)}}
.cbtn.dn{transform:translateY(3px);filter:brightness(1.35)}

/* ---- экраны ---- */
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);gap:16px}
#title{background:linear-gradient(rgba(7,6,13,0) 0,rgba(7,6,13,.15) 40%,rgba(7,6,13,.92) 100%)}
#title h1{margin:0;font-size:24px;line-height:1.4;font-weight:400;color:var(--amber);
  text-shadow:3px 3px 0 var(--ember),6px 6px 0 #000}
#title .tag{color:var(--dim);font-size:8px;letter-spacing:2px;text-shadow:2px 2px 0 #000}
#title p{max-width:360px;margin:0;font-size:9px;color:#d8c4a0;line-height:2;text-shadow:2px 2px 0 #000}
.btn{font:inherit;font-size:11px;color:var(--ink);background:#3a2a3e;border:0;padding:15px 22px;cursor:pointer;text-shadow:2px 2px 0 #000;
  box-shadow:inset 0 0 0 3px #5a4560,inset 0 -6px 0 3px #241a28,0 0 0 3px var(--edge)}
.btn.main{background:#7a4a1a;box-shadow:inset 0 0 0 3px var(--amber2),inset 0 -6px 0 3px #4a2a10,0 0 0 3px var(--edge)}
.btn:active{transform:translateY(3px)}
.small{font-size:8px;color:var(--dim);line-height:2.2;text-shadow:2px 2px 0 #000}
.spacer{flex:1}
#over{background:rgba(7,6,13,.86)}
#over h2,#pause h2{margin:0;font-size:18px;font-weight:400;line-height:1.5;color:var(--blood);text-shadow:3px 3px 0 #3a0a04}
#pause h2{color:var(--amber);text-shadow:3px 3px 0 var(--ember)}
#over .stats{font-size:10px;line-height:2.4;color:#d8c4a0}
#pause{background:rgba(7,6,13,.8)}
#fade{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;
  font-size:16px;color:var(--amber);text-shadow:3px 3px 0 var(--ember)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hide">
  <div id="hudL">
    <div class="slot"><img class="px" id="icoLamp" alt=""><div id="oilbar"></div></div>
    <div class="slot"><img class="px" id="icoTorch" alt=""><span id="torchN">0</span></div>
  </div>
  <div id="depth">ГЛУБИНА 1</div>
  <div id="hudR">
    <div style="display:flex;gap:8px"><div class="slot"><img class="px" id="icoAmber" alt=""><span id="amberN">0/0</span></div><button id="pauseBtn" aria-label="Пауза">II</button></div>
  </div>
</div>
<div id="msg"></div>

<div id="ctl" class="hide">
  <div id="joy"><div id="knob"></div></div>
  <div id="joyHint">ДЖОЙСТИК<br>ЗДЕСЬ<br><br>ТАП ПО БЛОКУ —<br>КОПАТЬ</div>
  <button class="cbtn" id="bTorch"><img class="px" id="icoTorch2" alt="">ФАКЕЛ</button>
  <button class="cbtn" id="bFlash"><img class="px" id="icoLamp2" alt="">СВЕТ</button>
  <button class="cbtn" id="bJump">ПРЫЖОК</button>
</div>

<div id="title" class="scr">
  <div class="spacer"></div>
  <div class="tag">ПИКСЕЛЬНЫЙ ХОРРОР-ПЕСОЧНИЦА</div>
  <h1>ЯНТАРНЫЕ<br>ГЛУБИНЫ</h1>
  <p>Ночью под деревней проснулось Оно. Копай вниз, добывай светящийся янтарь и пробуди древний алтарь. Оно ползёт сквозь камень и боится только огня.</p>
  <button class="btn main" id="startBtn">СПУСТИТЬСЯ</button>
  <div class="small" id="howto"></div>
  <div class="small" id="bestTxt"></div>
</div>

<div id="over" class="scr hide">
  <h2>ОНО НАШЛО<br>ТЕБЯ</h2>
  <div class="stats" id="overStats"></div>
  <button class="btn main" id="againBtn">ЕЩЁ РАЗ</button>
  <button class="btn" id="menuBtn">В МЕНЮ</button>
</div>

<div id="pause" class="scr hide">
  <h2>ПАУЗА</h2>
  <div class="small">Оно ждёт в темноте.</div>
  <button class="btn main" id="resumeBtn">ДАЛЬШЕ</button>
  <button class="btn" id="soundBtn">ЗВУК: ВКЛ</button>
  <button class="btn" id="quitBtn">В МЕНЮ</button>
</div>
<div id="fade"></div>

<script>
'use strict';
/* =====================================================================
   ЯНТАРНЫЕ ГЛУБИНЫ — пиксельный хоррор-платформер с копанием.
   Мир из блоков 8×8 «арт-пикселей» (как в песочницах: земля, камень,
   трава, фоновые стены), освещение по тайлам с цветным светом.
   ===================================================================== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* ---------- экран ---------- */
const cv = $('c'), dctx = cv.getContext('2d');
const off = document.createElement('canvas'), cx = off.getContext('2d');
let W = 200, H = 300, S = 3;
function resize() {
  const iw = innerWidth, ih = innerHeight;
  S = Math.max(2, Math.round(Math.min(iw, ih) / 135));
  W = Math.ceil(iw / S); H = Math.ceil(ih / S);
  cv.width = off.width = W; cv.height = off.height = H;
  cv.style.width = W * S + 'px'; cv.style.height = H * S + 'px';
  cx.imageSmoothingEnabled = false; dctx.imageSmoothingEnabled = false;
  skyGrad = null;
}
addEventListener('resize', resize);

/* ---------- сохранение ---------- */
const SAVE = 'amberdepths_v1';
let best = { depth: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE)); if (s && typeof s.depth === 'number') best = s; } catch (e) {}
const saveBest = () => { try { localStorage.setItem(SAVE, JSON.stringify(best)); } catch (e) {} };

/* ---------- шум ---------- */
let seed = 1;
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(seed, 144665) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 3) { let s = 0, a = 0.5, f = 1, n = 0; for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f + i * 9.1); n += a; a *= 0.5; f *= 2; } return s / n; }

/* ---------- спрайты ---------- */
function bake(rows, pal) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) { const ch = rows[y][x]; if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }
  return c;
}
function flip(c) { const f = document.createElement('canvas'); f.width = c.width; f.height = c.height; const g = f.getContext('2d'); g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); return f; }
const pair = (rows, pal) => { const r = bake(rows, pal); return [r, flip(r)]; };

/* герой: крупная голова, причёска, белки глаз — пропорции песочниц */
const HPAL = { h: '#6a4024', H: '#4a2a16', s: '#e8b088', S: '#c48a64', w: '#ffffff', i: '#2f5aa8', c: '#3f6aa0', C: '#2c4c78', b: '#5a3a1e', p: '#5a4632', P: '#3e3022', k: '#2a1c12' };
const HTOP = [
  '..hhhhh...',
  '.hhhhhhhh.',
  'hhhhhhhhh.',
  'hHhhssshh.',
  'hHssswiss.',
  'hHssswiss.',
  '.Hssssss..',
  '..Sssss...',
  '...SS.....',
  '..ccccc...',
  '.Cccccccs.',
  '.Cccccc.s.',
  '.Cccccc...',
  '.bbbbbb...',
  '..Pppp....',
];
const HLEG = {
  stand: ['..pp.pp...', '..pp.pp...', '..pp.pp...', '..PP.PP...', '..kk.kk...', '.kkk.kkk..'],
  w1: ['..pp..pp..', '.pp....p..', '.pp....pp.', '.PP....PP.', '.kk....kk.', 'kkk....kkk'],
  w2: ['..ppp.....', '...pp.....', '...pp.....', '...PP.....', '...kk.....', '..kkkk....'],
  w3: ['..pp.pp...', '..p..pp...', '.pp...pp..', '.PP...PP..', '.kk...kk..', 'kkk...kkk.'],
  jump: ['..pp.pp...', '.pp..pp...', '.pp.pp....', '.PP.PP....', 'kkk.kk....', '..........'],
};
const HSPR = {}; for (const k in HLEG) HSPR[k] = pair(HTOP.concat(HLEG[k]), HPAL);
const HWALK = ['w1', 'w2', 'w3', 'w2'];

/* чудовище: собирается из пиксельной сетки, потом обводка */
const MWID = 44, MHEI = 28, MEYE = { x: 36, y: 10 };
function monsterFrame(ph, open) {
  const g = []; for (let y = 0; y < MHEI; y++) g.push(new Array(MWID).fill(null));
  const P = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < MWID && y < MHEI) g[y][x] = c; };
  const A = '#3a1a12', B = '#6a3020', C = '#94502c', D = '#b8693a', Sp = '#c47a3a', St = '#ecc08a', T = '#f2dcae', Mw = '#1a0505', R = '#8a2418';
  // лапы (сзади тела)
  for (let k = 0; k < 4; k++) {
    const bx = 9 + k * 7, a = ph + k * 1.7;
    const kx = bx + Math.cos(a) * 2.5, ky = 22 + Math.sin(a) * 1;
    const fx = bx + Math.cos(a) * 4.5 - 1, fy = 27 - Math.max(0, Math.sin(a)) * 2;
    for (let t = 0; t <= 1; t += 0.12) { P(bx + (kx - bx) * t, 17 + (ky - 17) * t, B); P(bx + 1 + (kx - bx) * t, 17 + (ky - 17) * t, A); }
    for (let t = 0; t <= 1; t += 0.15) P(kx + (fx - kx) * t, ky + (fy - ky) * t, A);
    P(fx - 1, fy, A); P(fx + 1, fy, A);
  }
  // тело
  for (let y = 0; y < MHEI; y++) for (let x = 0; x < MWID; x++) {
    const e = ((x - 18) / 15) ** 2 + ((y - 14) / 6.5) ** 2;
    if (e < 1) P(x, y, y < 10 ? D : y < 13 ? C : y < 17 ? B : A);
  }
  // шипы на спине, загнуты назад
  [5, 10, 15, 20, 25].forEach((s, n) => {
    const h = 7 + (n % 2) * 3;
    for (let i = 0; i < h; i++) { const w = Math.max(1, Math.round(3 - i * 2.5 / h)); const x0 = s - i * 0.45; for (let j = 0; j < w; j++) P(x0 + j, 9 - i, i > h - 3 ? St : Sp); }
  });
  // голова
  for (let y = 0; y < MHEI; y++) for (let x = 0; x < MWID; x++) {
    const e = ((x - 34) / 8.5) ** 2 + ((y - 12) / 5.5) ** 2;
    if (e < 1) P(x, y, y < 9 ? D : y < 12 ? C : B);
  }
  P(MEYE.x, MEYE.y, Mw); P(MEYE.x + 1, MEYE.y, Mw); P(MEYE.x - 1, MEYE.y - 1, A); P(MEYE.x, MEYE.y - 1, A);
  // пасть
  const jy = open ? 19 : 16;
  for (let x = 28; x < 44; x++) { P(x, 15, x > 42 ? null : B); }
  if (open) for (let y = 15; y < jy; y++) for (let x = 29; x < 43; x++) P(x, y, y === 15 || y === jy - 1 ? R : Mw);
  for (let x = 29; x < 43; x += 2) { P(x, 15, T); P(x, 16, open ? T : B); }
  for (let y = jy; y < jy + 3; y++) for (let x = 27 + (y - jy); x < 43 - (y - jy) * 2; x++) P(x, y, y === jy ? B : A);
  for (let x = 30; x < 42; x += 2) P(x, jy - (open ? 1 : 0), T);
  // обводка
  const c = document.createElement('canvas'); c.width = MWID; c.height = MHEI; const gg = c.getContext('2d');
  for (let y = 0; y < MHEI; y++) for (let x = 0; x < MWID; x++) {
    let col = g[y][x];
    if (!col) { const n = (yy, xx) => yy >= 0 && xx >= 0 && yy < MHEI && xx < MWID && g[yy][xx]; if (n(y - 1, x) || n(y + 1, x) || n(y, x - 1) || n(y, x + 1)) col = '#120606'; }
    if (col) { gg.fillStyle = col; gg.fillRect(x, y, 1, 1); }
  }
  return [c, flip(c)];
}
const MSPR = [0, 1, 2, 3].map(k => monsterFrame(k * Math.PI / 2, false));
const MOPEN = monsterFrame(0.5, true);

const ICON = {
  lamp: bake(['...kk...', '..k..k..', '.kkkkkk.', '.kLYYLk.', '.kLYYLk.', '.kLLLLk.', '.kkkkkk.', '..kkkk..'], { k: '#4a3524', L: '#ffb238', Y: '#fff0b0' }),
  torch: bake(['...yy...', '..yYYy..', '..yYYo..', '...oo...', '...ww...', '...ww...', '...Ww...', '...Ww...'], { y: '#ffb238', Y: '#fff4c0', o: '#e0601a', w: '#8a5a32', W: '#5e3a1e' }),
  amber: bake(['...yy...', '..yYYy..', '.yYYyyo.', '.yYyyoo.', 'yyyyoooo', '.yyoooO.', '..yooO..', '...oO...'], { y: '#ffb238', Y: '#fff0b0', o: '#d9761e', O: '#8a3a12' }),
  oil: bake(['..kk....', '...g....', '..ggg...', '.goooG..', '.goooG..', '.goooG..', '..ggg...'], { g: '#5a7480', G: '#b0d8e0', o: '#e09a30', k: '#7a5a3a' }),
};
const POT = bake(['.aaaaa.', 'aCCCCCa', '.aCcca.', 'aCccccA', 'aCcbccA', 'aCccccA', 'aACcAAA', '.aAAAa.'], { a: '#3a1e12', A: '#5a2e1a', c: '#a8573a', C: '#c8784c', b: '#e0a070' });
const SHROOM = bake(['.ccc.', 'cCCCc', '..s..', '..s..'], { c: '#2a5ad8', C: '#6aa0ff', s: '#c8c0b0' });
$('icoLamp').src = $('icoLamp2').src = ICON.lamp.toDataURL();
$('icoTorch').src = $('icoTorch2').src = ICON.torch.toDataURL();
$('icoAmber').src = ICON.amber.toDataURL();
const oilbar = $('oilbar'); for (let i = 0; i < 10; i++) oilbar.appendChild(document.createElement('i'));

/* ---------- звук ---------- */
const A = {
  ctx: null, out: null, on: true, nb: null, tense: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
    const ctx = this.ctx = new C();
    const comp = ctx.createDynamicsCompressor(); comp.connect(ctx.destination);
    this.out = ctx.createGain(); this.out.gain.value = this.on ? 0.9 : 0; this.out.connect(comp);
    const len = ctx.sampleRate * 2, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this.nb = buf;
    const dg = ctx.createGain(); dg.gain.value = 0.045; dg.connect(this.out);
    [41, 41.7, 61.9].forEach((f, i) => { const o = ctx.createOscillator(); o.frequency.value = f; const g = ctx.createGain(); g.gain.value = i === 2 ? 0.35 : 1; o.connect(g); g.connect(dg); o.start(); });
    const wn = ctx.createBufferSource(); wn.buffer = buf; wn.loop = true;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 0.8;
    const wg = ctx.createGain(); wg.gain.value = 0.045;
    const lfo = ctx.createOscillator(); lfo.frequency.value = 0.06; const lg = ctx.createGain(); lg.gain.value = 170; lfo.connect(lg); lg.connect(bp.frequency); lfo.start();

  M.vx += (bx * s - M.vx) * Math.min(1, dt * 5); M.vy += (by * s - M.vy) * Math.min(1, dt * 5);
}
function updMonster(dt, demo) {
  const c = pc(), dx = c.x - M.x, dy = c.y - M.y, d = Math.hypot(dx, dy);
  const sp = 1 + (depth - 1) * 0.08;
  const keep = (P.oil <= 0 ? 6 : 14 + 40 * Math.sqrt(P.oil)) + 12;
  const pTorch = lightAt(c.x, c.y, LT), mTorch = lightAt(M.x, M.y, LT);
  M.t -= dt;
  switch (M.state) {
    case 'lurk':
      if (Math.hypot(M.wx - M.x, M.wy - M.y) < 10 || Math.random() < dt * 0.2) { M.wx = M.x + rnd(-120, 120); M.wy = clamp(M.y + rnd(-80, 80), 40, WH * T - 30); }
      steer(M.wx, M.wy, 22, dt, true);
      if (M.t <= 0) M.state = 'stalk';
      break;
    case 'stalk':
      steer(c.x, c.y, (d > 180 ? 42 : 30) * sp, dt, true);
      if (d < keep + 12) M.state = 'hover';
      break;
    case 'hover': {
      if (!demo) {
        let g = 0.07 + (depth - 1) * 0.018 + (1 - P.oil) * 0.1;
        if (P.oil <= 0) g += 0.5;
        if (pTorch > 0.45) g = -0.15; // у факела можно перевести дух
        M.agg = clamp(M.agg + g * dt, 0, 1.2);
      }
      const ang = Math.atan2(M.y - c.y, M.x - c.x) + Math.sin(time * 0.7) * 0.012;
      steer(c.x + Math.cos(ang) * keep, c.y + Math.sin(ang) * keep, 34 * sp, dt, true);
      if (d > keep + 70) M.state = 'stalk';
      if (M.agg >= 1 && !M.rock) {
        M.state = 'windup'; M.t = Math.max(0.5, 0.85 - depth * 0.04); M.agg = 0;
        A.roar(clamp(-dx / 120, -1, 1)); shake = 0.6; buzz([60, 40, 60]);
        if (depth <= 1 && !M.seen) { msg('ОНО БРОСАЕТСЯ!<br>ЖМИ «СВЕТ»!', 2.2); M.seen = true; }
      }
      break;
    }
    case 'windup': M.vx *= 0.8; M.vy *= 0.8; break;
    case 'charge': steer(c.x, c.y, 92 * sp, dt, false); if (M.t <= 0) { M.state = 'hover'; M.agg = 0.3; } break;
    case 'flee': steer(M.x - dx * 3, M.y - dy * 3, 100, dt, false); if (M.t <= 0) { M.state = 'lurk'; M.t = rnd(3, 6); } break;
  }
  if (M.state === 'windup' && M.t <= 0) { M.state = 'charge'; M.t = 3; }
  // пламя факела обжигает
  if (mTorch > 0.55 && M.state !== 'flee') { scare(); A.shriek(clamp(-dx / 120, -1, 1)); }
  M.x += M.vx * dt; M.y += M.vy * dt;
  M.x = clamp(M.x, 20, WW * T - 20); M.y = clamp(M.y, hasSky ? 0 : 20, WH * T - 20);
  if (Math.abs(M.vx) > 2) M.face = M.vx > 0 ? 1 : -1;
  M.anim += Math.hypot(M.vx, M.vy) * dt * 0.18;
  const wasRock = M.rock;
  M.rock = solidPx(M.x, M.y) && solidPx(M.x - 10, M.y) && solidPx(M.x + 10, M.y);
  const pan = clamp(-dx / 140, -1, 1);
  if (M.rock) {
    M.dustT -= dt;
    if (M.dustT <= 0 && d < 200) { M.dustT = 0.25; parts.push({ x: M.x + rnd(-10, 10), y: M.y + rnd(-6, 6), vx: rnd(-10, 10), vy: rnd(-10, 10), life: 0.7, c: '#6a5a50', g: 0 }); }
    if (d < 170 && Math.random() < dt * 1.3) A.rumble(1 - d / 170, pan);
  }
  if (wasRock && !M.rock && d < 200) { for (let i = 0; i < 12; i++) parts.push({ x: M.x + rnd(-12, 12), y: M.y + rnd(-6, 6), vx: rnd(-40, 40), vy: rnd(-60, -10), life: rnd(0.4, 0.8), c: '#7a6a5e', g: 1 }); }
  // поимка
  if (!demo && state === 'play' && d < 15 && (M.state === 'charge' || (P.oil <= 0 && pTorch < 0.4 && M.state !== 'flee'))) die();
  M.growlT -= dt; M.clickT -= dt;
  if (d < 200 && M.growlT <= 0 && M.state !== 'flee') { A.growl(clamp(1 - d / 200, 0.15, 1), pan); M.growlT = rnd(3, 6.5); }
  if (d < 130 && !M.rock && M.state !== 'windup' && M.clickT <= 0 && Math.hypot(M.vx, M.vy) > 8) { A.click(1 - d / 130, pan); M.clickT = M.state === 'charge' ? 0.09 : 0.2; }
}

/* ---------- кадр ---------- */
let skyGrad = null, stars = [];
for (let i = 0; i < 90; i++) stars.push({ x: Math.random(), y: Math.random() * 0.7, b: Math.random(), p: Math.random() * 6 });
function hill(x, s, f, a) { return vnoise(x * f + s, s) * a + vnoise(x * f * 2.3 + s * 2, s) * a * 0.4; }
function drawSky(ox, oy) {
  if (!hasSky) { cx.fillStyle = '#07060d'; cx.fillRect(0, 0, W, H); return; }
  if (!skyGrad) { skyGrad = cx.createLinearGradient(0, 0, 0, H); skyGrad.addColorStop(0, '#060818'); skyGrad.addColorStop(1, '#1a2448'); }
  cx.fillStyle = skyGrad; cx.fillRect(0, 0, W, H);
  for (const s of stars) { const a = 0.4 + 0.6 * Math.abs(Math.sin(time * 0.8 + s.p)) * s.b; cx.fillStyle = `rgba(220,226,255,${a})`; cx.fillRect(Math.round(((s.x * 400 - ox * 0.05) % W + W) % W), Math.round(s.y * H * 0.6 - oy * 0.05), 1, 1); }
  // луна
  const mx = Math.round(W * 0.72 - ox * 0.04), my = Math.round(26 - oy * 0.05);
  for (let y = -7; y <= 7; y++) for (let x = -7; x <= 7; x++) { const r = Math.hypot(x, y); if (r <= 7) { cx.fillStyle = r > 6 ? '#b8bcd0' : (hash(x + 50, y + 50) > 0.8 ? '#c8ccdc' : '#e8ecf6'); cx.fillRect(mx + x, my + y, 1, 1); } }
  // холмы вдали
  const base = 22 * T - oy;
  for (const [par, col, s, amp] of [[0.25, '#11183a', 3, 36], [0.5, '#0c1230', 9, 26]]) {
    cx.fillStyle = col;
    for (let x = 0; x < W; x += 2) { const h = hill(x + ox * par, s, 0.012, amp); const y = Math.round(base * (0.55 + par * 0.4) + 30 - h); cx.fillRect(x, y, 2, H - y); }
  }
}
function render() {
  let ox = Math.round(cam.x), oy = Math.round(cam.y);
  if (shake > 0) { ox += Math.round(rnd(-2, 2) * shake * 3); oy += Math.round(rnd(-2, 2) * shake * 3); }
  computeLight();
  drawSky(ox, oy);
  cx.drawImage(wallCv, -ox, -oy);
  cx.drawImage(tileCv, -ox, -oy);
  // трещины на копаемом блоке
  if (dig.t > 0 && dig.ok && solid(dig.tx, dig.ty)) {
    const st = Math.min(3, Math.floor(dig.t / HARD[tile(dig.tx, dig.ty)] * 4));
    cx.fillStyle = 'rgba(0,0,0,.55)';
    const bx = dig.tx * T - ox, by = dig.ty * T - oy;
    const cr = [[[3, 3], [4, 4], [4, 2]], [[2, 5], [5, 3], [6, 2], [1, 4]], [[1, 1], [6, 6], [2, 6], [5, 1], [3, 5]], [[6, 4], [1, 2], [4, 6], [2, 2], [5, 5]]];
    for (let k = 0; k <= st; k++) for (const [x, y] of cr[k]) cx.fillRect(bx + x, by + y, 1, 1);
  }
  // алтарь
  drawAltar(ox, oy);
  for (const p of pots) cx.drawImage(POT, p.x - 3 - ox, p.y - 8 - oy);
  for (const s of shrooms) cx.drawImage(SHROOM, s.x - ox, s.y - oy);
  for (const t of torches.values()) { cx.fillStyle = '#6e4826'; cx.fillRect(t.tx * T + 3 - ox, t.ty * T + 3 - oy, 2, 5); cx.fillStyle = '#4a3018'; cx.fillRect(t.tx * T + 3 - ox, t.ty * T + 6 - oy, 2, 2); }
  for (const it of items) { const ic = ICON[it.k]; const bob = it.t > 0.3 ? Math.round(Math.sin(time * 3 + it.x) * 1) : 0; cx.drawImage(ic, Math.round(it.x - 4 - ox), Math.round(it.y - 8 - oy + bob)); }
  // монстр
  if (state !== 'dead' && !M.rock) {
    const open = M.state === 'windup' || M.state === 'charge';
    const fr = open ? MOPEN : MSPR[Math.floor(M.anim) & 3];
    const jit = M.state === 'windup' ? Math.round(rnd(-1, 1)) : 0;
    cx.drawImage(fr[M.face > 0 ? 0 : 1], Math.round(M.x - MWID / 2 - ox + jit), Math.round(M.y - MHEI / 2 - oy));
  }
  // герой
  if (state !== 'dead') {
    const k = !P.ground ? 'jump' : Math.abs(P.vx) > 5 ? HWALK[Math.floor(P.anim) & 3] : 'stand';
    cx.drawImage(HSPR[k][P.face > 0 ? 0 : 1], Math.round(P.x - 5 - ox), Math.round(P.y - 21 - oy));
    // кирка при копании
    if (P.swing > 0) {
      const a = P.swing / 0.2, hx = Math.round(P.x + P.face * 3 - ox), hy = Math.round(P.y - 11 - oy);
      cx.fillStyle = '#8a5a32';
      for (let i = 0; i < 6; i++) cx.fillRect(hx + Math.round(P.face * i * Math.cos(a * 1.4 - 0.6)), hy - Math.round(i * Math.sin(a * 1.4 - 0.6)), 1, 1);
      const ex = hx + Math.round(P.face * 6 * Math.cos(a * 1.4 - 0.6)), ey = hy - Math.round(6 * Math.sin(a * 1.4 - 0.6));
      cx.fillStyle = '#b8b8c8'; cx.fillRect(ex - 2, ey - 1, 5, 2);
    }
  }
  for (const p of parts) if (!p.em) { cx.globalAlpha = clamp(p.life * 2, 0, 1); cx.fillStyle = p.c; cx.fillRect(Math.round(p.x - ox), Math.round(p.y - oy), 1, 1); }
  cx.globalAlpha = 1;

  // свет: умножаем кадр на сглаженную карту освещённости
  cx.save();
  cx.globalCompositeOperation = 'multiply';
  cx.imageSmoothingEnabled = true;
  cx.drawImage(lightCv, lx0 * T + T / 2 - ox, ly0 * T + T / 2 - oy, lw * T, lh * T);
  cx.restore();
  cx.imageSmoothingEnabled = false;

  // светящееся поверх
  for (const t of torches.values()) {
    const fx = t.tx * T + 4 - ox, fy = t.ty * T + 1 - oy, f = Math.floor(time * 10 + t.ph * 3) % 3;
    cx.fillStyle = '#ff7a1e'; cx.fillRect(fx - 1, fy + 1, 2, 2);
    cx.fillStyle = '#ffb238'; cx.fillRect(fx - 1 + (f === 1 ? 1 : 0), fy, 1, 2); cx.fillRect(fx - (f === 2 ? 1 : 0), fy - 1, 1, 2);
    cx.fillStyle = '#fff4c0'; cx.fillRect(fx - 1 + (f & 1), fy + 1, 1, 1);
  }
  for (const s of shrooms) { cx.fillStyle = `rgba(120,170,255,${0.35 + 0.25 * Math.sin(time * 1.6 + s.ph)})`; cx.fillRect(s.x + 1 - ox, s.y - oy, 3, 1); }
  for (let ty = Math.floor(oy / T); ty <= Math.floor((oy + H) / T); ty++) for (let tx = Math.floor(ox / T); tx <= Math.floor((ox + W) / T); tx++) {
    if (tile(tx, ty) !== AMBER) continue;
    const ph = hash(tx, ty) * 6, a = Math.max(0, Math.sin(time * 2.2 + ph));
    if (a > 0.3) { cx.fillStyle = `rgba(255,240,176,${a})`; cx.fillRect(tx * T + 2 + ((hash(ty, tx) * 4) | 0) - ox, ty * T + 2 + ((ph * 0.6) | 0) - oy, 1, 1); }
  }
  for (const it of items) if (it.k === 'amber' && Math.sin(time * 6 + it.x) > 0.5) { cx.fillStyle = '#fff0b0'; cx.fillRect(Math.round(it.x - 1 - ox), Math.round(it.y - 7 - oy), 1, 1); }
  if (state !== 'dead') {
    const lx = Math.round(P.x + 4 * P.face - ox), ly = Math.round(P.y - 10 - oy);
    cx.fillStyle = '#4a3524'; cx.fillRect(lx - 1, ly - 1, 3, 1); cx.fillRect(lx - 1, ly + 3, 3, 1);
    cx.fillStyle = P.oil > 0 || state === 'title' ? '#ffe08a' : '#6a2a10'; cx.fillRect(lx - 1, ly, 3, 3);
    if (P.oil > 0) { cx.fillStyle = '#fff6d0'; cx.fillRect(lx, ly + 1, 1, 1); }
    // глаза в темноте
    const md = Math.hypot(M.x - P.x, M.y - P.y);
    if (!M.rock && md < 240 && M.state !== 'flee') {
      const ex = Math.round(M.x - MWID / 2 + (M.face > 0 ? MEYE.x : MWID - 2 - MEYE.x) - ox), ey = Math.round(M.y - MHEI / 2 + MEYE.y - oy);
      const red = M.state === 'windup' || M.state === 'charge';
      if (red || Math.sin(time * 0.9 + 2) < 0.985) {
        cx.fillStyle = red ? 'rgba(255,58,26,.35)' : 'rgba(255,216,74,.25)'; cx.fillRect(ex - 1, ey - 1, 4, 3);
        cx.fillStyle = red ? '#ff3a1a' : '#ffd84a'; cx.fillRect(ex, ey, 2, 1);
      }
    }
  }
  for (const p of parts) if (p.em) { cx.globalAlpha = clamp(p.life * 2, 0, 1); cx.fillStyle = p.c; cx.fillRect(Math.round(p.x - ox), Math.round(p.y - oy), 1, 1); }
  cx.globalAlpha = 1;
  if (altar.open) {
    for (let k = 0; k < 6; k++) { const a = time * 0.9 + k * 1.047; cx.fillStyle = `rgba(255,178,56,${0.6 + 0.4 * Math.sin(time * 3 + k)})`; cx.fillRect(Math.round(altar.x + Math.cos(a) * 9 - ox), Math.round(altar.y - 14 + Math.sin(a) * 5 - oy), 1, 1); }
    cx.fillStyle = `rgba(255,214,120,${0.7 + 0.3 * Math.sin(time * 4)})`; cx.fillRect(altar.x - 1 - ox, altar.y - 15 - oy, 3, 3);

    cx.strokeRect(dig.tx * T - ox + 0.5, dig.ty * T - oy + 0.5, T - 1, T - 1);
  }

  if (state === 'play' && altar.open) {
    const dx = altar.x - P.x, dy = altar.y - 8 - (P.y - 10), dd = Math.hypot(dx, dy);
    if (dd > 60) {
      const ax = P.x - ox + dx / dd * 22, ay = P.y - 10 - oy + dy / dd * 22;
      cx.fillStyle = `rgba(255,178,56,${0.55 + 0.3 * Math.sin(time * 4)})`;
      for (let k = 0; k < 3; k++) cx.fillRect(Math.round(ax - dx / dd * k * 2), Math.round(ay - dy / dd * k * 2), 1 + (k === 0), 1 + (k === 0));
    }
  }
  if (flashT > 0.3) { cx.fillStyle = `rgba(255,240,200,${(flashT - 0.3) * 2})`; cx.fillRect(0, 0, W, H); }
  if (state === 'dead') drawScare();
  dctx.drawImage(off, 0, 0);
}
function drawAltar(ox, oy) {
  const x = altar.x - 12 - ox, y = altar.y - 16 - oy;
  const st = (a, b, w, h, c) => { cx.fillStyle = c; cx.fillRect(x + a, y + b, w, h); };
  st(0, 12, 24, 4, '#2a2632'); st(1, 12, 22, 1, '#6a6474');
  st(3, 5, 18, 7, '#4a4656'); st(3, 5, 18, 1, '#7a7488'); st(3, 5, 1, 7, '#5a5668');
  st(1, 2, 22, 3, '#3a3644'); st(1, 2, 22, 1, '#8a8498');
  st(10, 7, 4, 3, altar.open ? '#ffb238' : '#2a1e18'); st(11, 8, 2, 1, altar.open ? '#fff0b0' : '#1a1210');
}
function drawScare() {
  const t = stateT;
  cx.fillStyle = t < 0.08 ? '#ff3a1a' : '#07060d'; cx.fillRect(0, 0, W, H);
  if (t > 1.1) return;
  const sp = MOPEN[0], sx0 = 24, sw = 20, sh = 26;
  const sc = Math.max(2, Math.floor(Math.min(W / 14, H / 18) * (0.85 + t * 0.5)));
  const dw = sw * sc, dh = sh * sc, jx = (Math.random() - 0.5) * sc * 2, jy = (Math.random() - 0.5) * sc * 2;
  cx.drawImage(sp, sx0, 0, sw, sh, Math.round(W / 2 - dw / 2 + jx), Math.round(H / 2 - dh / 2 + jy), dw, dh);
  const ex = Math.round(W / 2 - dw / 2 + jx + (MEYE.x - sx0) * sc), ey = Math.round(H / 2 - dh / 2 + jy + MEYE.y * sc);
  cx.fillStyle = '#ff3a1a'; cx.fillRect(ex, ey, sc * 2, sc);
  if (Math.random() < 0.3) { cx.fillStyle = 'rgba(255,58,26,.25)'; cx.fillRect(0, 0, W, H); }
  cx.fillStyle = 'rgba(7,6,13,.6)'; for (let k = 0; k < 6; k++) cx.fillRect(0, (Math.random() * H) | 0, W, (Math.random() * 3 + 1) | 0);
}

/* ---------- HUD ---------- */
let lastSeg = -1;
function updHUD(force) {
  const seg = Math.ceil(P.oil * 10);
  if (seg !== lastSeg || force) { lastSeg = seg; [...oilbar.children].forEach((e, i) => e.classList.toggle('on', i < seg)); oilbar.classList.toggle('low', P.oil < 0.25); }
  if (force) { $('torchN').textContent = P.torches; $('amberN').textContent = `${got}/${need}`; }
}

/* ---------- состояния ---------- */
const show = (id, on) => $(id).classList.toggle('hide', !on);
const setPlayUI = on => { show('hud', on); show('ctl', on && isTouch); };
function newGame() {
  depth = 1; P = null; stats = { amber: 0, flashes: 0, saves: 0, blocks: 0, torches: 0, t0: performance.now() };
  genWorld(); tipT = 0;
  $('depth').textContent = 'ГЛУБИНА 1';
  state = 'play'; stateT = 0;
  show('title', false); show('over', false); $('over').classList.remove('shown'); setPlayUI(true); updHUD(true);
  $('joyHint').classList.remove('hide');
  msg(`Добудь ${need} янтаря — он светится в камне.<br><br>${isTouch ? 'Тапай по блоку, чтобы копать' : 'Зажми мышь на блоке, чтобы копать'}`, 4.5);
  fadeIn('ГЛУБИНА 1');
}
function nextLevel() {
  state = 'trans'; A.descend(); buzz(40);
  const f = $('fade'); f.style.transition = 'opacity .7s'; f.textContent = ''; f.style.opacity = 1;
  setTimeout(() => {
    depth++; genWorld();
    $('depth').textContent = 'ГЛУБИНА ' + depth;
    if (depth > best.depth) { best.depth = depth; saveBest(); }
    state = 'play'; stateT = 0; updHUD(true);
    msg(`Добудь ${need} янтаря`, 2.5); fadeIn('ГЛУБИНА ' + depth);
  }, 750);
}
function fadeIn(text) {
  const f = $('fade'); f.style.transition = 'none'; f.textContent = text; f.style.opacity = 1;
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = 'opacity 1.4s ease-in .6s'; f.style.opacity = 0; }));
}
function die() {
  state = 'dead'; stateT = 0; shake = 1; digP = null;
  A.scream(); A.setTension(0); buzz([300, 60, 500]);
  setPlayUI(false); $('msg').classList.remove('on');
}
function showOver() {
  state = 'over';
  if (depth > best.depth) best.depth = depth; saveBest();
  const secs = Math.round((performance.now() - stats.t0) / 1000);
  $('overStats').innerHTML = `Глубина: ${depth}<br>Янтаря: ${stats.amber}<br>Блоков вскопано: ${stats.blocks}<br>Спасён вспышкой: ${stats.saves}<br>Во тьме: ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}<br><span style="color:var(--dim)">Рекорд: глубина ${best.depth}</span>`;
  $('over').classList.add('shown'); show('over', true);
}
function startDemo() {
  depth = 1; P = null; stats = { amber: 0, flashes: 0, saves: 0, blocks: 0, torches: 0, t0: 0 };
  genWorld();
  torches.set((Math.floor(P.y / T) - 1) * WW + Math.floor(P.x / T) - 2, { tx: Math.floor(P.x / T) - 2, ty: Math.floor(P.y / T) - 1, ph: 0 });
  M.state = 'hover'; M.x = P.x + 70; M.y = P.y + 30; M.rock = false;
  state = 'title'; stateT = 0; show('title', true);
  $('bestTxt').textContent = best.depth > 1 ? `Рекорд: глубина ${best.depth}` : '';
}
function toMenu() { show('over', false); show('pause', false); $('over').classList.remove('shown'); setPlayUI(false); startDemo(); }
function togglePause() {
  if (state === 'play') { state = 'pause'; show('pause', true); if (A.ctx) A.ctx.suspend(); }
  else if (state === 'pause') { state = 'play'; show('pause', false); if (A.ctx) A.ctx.resume(); }
}
$('howto').innerHTML = isTouch
  ? 'Джойстик слева · тап по блоку — копать<br>ФАКЕЛ — поставить · СВЕТ — вспышка'
  : 'A/D — идти · W/Пробел — прыжок · мышь — копать<br>T — факел · F — вспышка · P — пауза';
$('startBtn').onclick = () => { A.init(); newGame(); };
$('againBtn').onclick = () => { A.init(); newGame(); };
$('menuBtn').onclick = toMenu;
$('pauseBtn').onclick = togglePause;
$('resumeBtn').onclick = togglePause;
$('quitBtn').onclick = () => { if (A.ctx) A.ctx.resume(); toMenu(); };
$('soundBtn').onclick = () => { A.setOn(!A.on); $('soundBtn').textContent = 'ЗВУК: ' + (A.on ? 'ВКЛ' : 'ВЫКЛ'); };
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

let last = performance.now();
function frame(now) {
  const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
  update(dt);
  if (state !== 'pause') render();
  requestAnimationFrame(frame);
}
resize();
startDemo();
requestAnimationFrame(frame);
</script>
