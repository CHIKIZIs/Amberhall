<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Зачёт за 15 дней</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Тетрадь в клетку: синие чернила для текста, красная ручка учителя для отметок. Одна колонка под телефон, нижняя панель вкладок. */
:root{
  --paper:#fafbff; --grid:rgba(43,71,201,.07); --card:#ffffff; --fg:#1a1f36; --muted:#5d6482;
  --line:#dde2f1; --ink:#2b47c9; --ink-soft:#e8ecfc; --red:#cf3027; --red-soft:#fde9e7;
  --ok:#1f8a4c; --ok-soft:#e2f4ea; --warn:#b26a00; --warn-soft:#fff2dc;
  --f-display:"Literata",Georgia,"Times New Roman",serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-hand:"Caveat","Comic Sans MS",cursive;
  --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11141f; --grid:rgba(142,162,255,.05); --card:#191d2c; --fg:#e8eaf4; --muted:#9ca3bf;
  --line:#2b3149; --ink:#8ea2ff; --ink-soft:#232a48; --red:#ff6f62; --red-soft:#3a1f22;
  --ok:#5cd08e; --ok-soft:#173327; --warn:#f0b04a; --warn-soft:#352a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11141f; --grid:rgba(142,162,255,.05); --card:#191d2c; --fg:#e8eaf4; --muted:#9ca3bf;
  --line:#2b3149; --ink:#8ea2ff; --ink-soft:#232a48; --red:#ff6f62; --red-soft:#3a1f22;
  --ok:#5cd08e; --ok-soft:#173327; --warn:#f0b04a; --warn-soft:#352a14; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;background-attachment:fixed;
  color:var(--fg);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:var(--ink)}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
/* красная линия полей тетради */
.margin{position:relative;padding-left:14px;border-left:2px solid var(--red)}

h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:26px;font-weight:700}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hand{font-family:var(--f-hand);color:var(--red);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.num{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .hand{font-size:30px;line-height:1;transform:rotate(-4deg);display:inline-block}
.brand b{font-family:var(--f-display);font-size:18px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card.flat{background:transparent;border:0;padding:0}

/* отсчёт */
.count{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.count .big{font-family:var(--f-display);font-size:52px;font-weight:700;line-height:1;color:var(--ink)}
.bar{height:8px;border-radius:99px;background:var(--ink-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}

/* задачи */
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px dashed var(--line)}
.task:first-child{border-top:0}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--muted);border-radius:6px;background:var(--card);display:grid;place-content:center;cursor:pointer}
.chk:checked{border-color:var(--red);background:var(--red-soft)}
.chk:checked::after{content:"✓";color:var(--red);font:700 18px/1 var(--f-body)}
.task label{cursor:pointer;flex:1;min-width:0}
.task.done label{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--red)}

.theory{display:flex;flex-direction:column;gap:10px}
.theory ul,.theory ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.theory b{font-weight:600}
.note{background:var(--ink-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.note.red{background:var(--red-soft)}
.example{border-left:3px solid var(--ink);padding:4px 0 4px 12px;font-style:italic;color:var(--fg)}

.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;background:var(--ink);color:var(--paper);min-height:44px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.red{background:var(--red);color:var(--paper)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--ink-soft);color:var(--ink)}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}

.seg{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:transparent;padding:8px 12px;border-radius:99px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink-soft);color:var(--ink)}

/* план */
.week{display:flex;flex-direction:column;gap:10px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-weight:600;position:relative;padding:0}
.day small{font-size:10px;font-weight:500;color:var(--muted)}
.day.today{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink-soft)}
.day.part{background:var(--warn-soft);border-color:var(--warn)}
.day.done{background:var(--ok-soft);border-color:var(--ok)}
.day.done::after{content:"✓";position:absolute;top:1px;right:4px;font-size:11px;color:var(--ok)}
.dlist{display:flex;flex-direction:column}
.dlist button{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-top:1px dashed var(--line);padding:9px 0;width:100%}
.dlist button:first-child{border-top:0}
.dlist .n{flex:none;width:26px;font-weight:700;color:var(--muted)}
.dlist .t{flex:1;min-width:0}
.dlist .s{flex:none;font-size:12px}

details.acc{border-top:1px solid var(--line);padding:12px 0}
details.acc:first-of-type{border-top:0}
details.acc>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;justify-content:space-between}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"+";font-weight:700;color:var(--ink);font-size:20px;line-height:1}
details.acc[open]>summary::after{content:"–"}
.acc-body{padding-top:10px;display:flex;flex-direction:column;gap:10px}

table.crit{width:100%;border-collapse:collapse;font-size:14px}
table.crit td{border-top:1px solid var(--line);padding:9px 6px;vertical-align:top}
table.crit td:first-child{font-weight:700;color:var(--ink);white-space:nowrap;padding-left:0}

/* книги */
.book>summary .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.book .author{font-size:13px;color:var(--muted)}
.book .title{font-family:var(--f-display);font-weight:700;font-size:16px}
.kv{display:flex;flex-direction:column;gap:2px}
.kv>span:first-child{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.quote{font-family:var(--f-display);font-style:italic}

.flash{min-height:260px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.flash .title{font-family:var(--f-display);font-weight:700;font-size:22px}

/* тренажёр */
.timer{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;color:var(--ink)}
.timer.over{color:var(--red)}
textarea#essay{width:100%;min-height:52vh;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:14px;
  background:var(--card) repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);background-attachment:local;
  line-height:28px;font-size:16px;font-family:var(--f-body)}
input.text{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);font-size:16px}
.meter{position:relative;height:10px;border-radius:99px;background:var(--ink-soft);overflow:visible}
.meter>i{position:absolute;inset:0 auto 0 0;border-radius:99px;transition:width .2s}
.meter .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);opacity:.4}
.meter .mk span{position:absolute;top:16px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.stats b{display:block;font-family:var(--f-display);font-size:24px}
.hl{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:1px 6px;font-size:13px;font-weight:600}

.quiz-opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:11px 14px;width:100%}
.quiz-opt.right{border-color:var(--ok);background:var(--ok-soft)}
.quiz-opt.wrong{border-color:var(--red);background:var(--red-soft)}

/* нижняя панель */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600}
nav.tabs a svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--red)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--paper);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>

<nav class="tabs" aria-label="Разделы">
  <div class="in">
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M9 15l2 2 4-4"/></svg>Сегодня</a>
    <a href="#plan" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>План</a>
    <a href="#ref" data-tab="ref"><svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8 13h8M8 17h5"/></svg>Справка</a>
    <a href="#books" data-tab="books"><svg viewBox="0 0 24 24"><path d="M4 5c3-1 6-1 8 1 2-2 5-2 8-1v14c-3-1-6-1-8 1-2-2-5-2-8-1z"/><path d="M12 6v14"/></svg>Книги</a>
    <a href="#write" data-tab="write"><svg viewBox="0 0 24 24"><path d="M15 4l5 5L9 20H4v-5z"/><path d="M13 6l5 5"/></svg>Пишем</a>
  </div>
</nav>

<script>
/* ===================== ДАННЫЕ ===================== */
const EXAM = new Date(2026, 11, 2, 10, 0, 0);       // 2 декабря 2026, первая среда декабря
const EXAM_LABEL = '2 декабря 2026';

const SECTIONS = [
 {id:1, name:'Духовно-нравственные ориентиры в жизни человека', subs:[
  {id:'1.1', name:'Внутренний мир человека и его личностные качества',
   concepts:'сила характера, достоинство, гордость и гордыня, мужество, доброта, слабость, совесть',
   topics:['Что значит быть сильной личностью?','Какие качества помогают человеку не сломаться в трудных обстоятельствах?','Может ли гордость быть достоинством?']},
  {id:'1.2', name:'Отношение человека к другому человеку, нравственные идеалы и выбор между добром и злом',
   concepts:'милосердие, сострадание, предательство, верность, жестокость, равнодушие, нравственный выбор',
   topics:['Почему человек способен на предательство?','Всегда ли добро побеждает зло?','Как отношение к слабым характеризует человека?']},
  {id:'1.3', name:'Познание человеком самого себя',
   concepts:'смысл жизни, самоанализ, ошибка, раскаяние, взросление, поиск пути',
   topics:['Зачем человеку задумываться о смысле жизни?','Может ли ошибка помочь человеку понять себя?','Когда человек по-настоящему взрослеет?']},
  {id:'1.4', name:'Свобода человека и её ограничения',
   concepts:'внутренняя и внешняя свобода, ответственность, вседозволенность, выбор, зависимость',
   topics:['Что значит быть свободным?','Свобода — это вседозволенность?','Может ли человек быть свободным в несвободном обществе?']}
 ]},
 {id:2, name:'Семья, общество, Отечество в жизни человека', subs:[
  {id:'2.1', name:'Семья, род; семейные ценности и традиции',
   concepts:'отцы и дети, воспитание, родительская любовь, благодарность, традиции, родной дом',
   topics:['Чему родители должны учить детей?','Какие семейные традиции стоит сохранять?','Почему важно помнить свои корни?']},
  {id:'2.2', name:'Человек и общество',
   concepts:'личность и толпа, конформизм, равнодушие, одиночество, «маленький человек», служение людям',
   topics:['Должен ли человек подчиняться мнению большинства?','Как общество влияет на личность?','Почему опасно равнодушие?']},
  {id:'2.3', name:'Родина, государство, гражданская позиция человека',
   concepts:'патриотизм, долг, гражданская позиция, героизм, ответственность перед страной',
   topics:['Что значит быть патриотом?','Как проявляется гражданская позиция человека?','Чем человек обязан своей Родине?']},
  {id:'2.4', name:'Историческая память и преемственность поколений',
   concepts:'память о войне, подвиг, связь поколений, уроки истории, малая родина',
   topics:['Зачем помнить о войне?','Как прошлое помогает понять настоящее?','Что мы должны передать следующим поколениям?']}
 ]},
 {id:3, name:'Природа и культура в жизни человека', subs:[
  {id:'3.1', name:'Природа и человек',
   concepts:'гармония с природой, потребительство, экология, ответственность, природа как учитель',
   topics:['Чему природа может научить человека?','Почему человек должен беречь природу?','Может ли природа исцелить душу?']},
  {id:'3.2', name:'Наука и человек',
   concepts:'прогресс, ответственность учёного, знание, образование, эксперимент, учитель',
   topics:['Всегда ли научный прогресс — благо?','Какую ответственность несёт учёный за своё открытие?','Зачем человеку учиться всю жизнь?']},
  {id:'3.3', name:'Искусство и человек',
   concepts:'сила искусства, талант, книга, творчество, вечные ценности, массовая культура',
   topics:['Может ли книга изменить жизнь человека?','Зачем человеку искусство?','Можно ли потерять талант?']},
  {id:'3.4', name:'Язык и языковая культура',
   concepts:'родной язык, культура речи, слово как поступок, канцелярит, бережное отношение к языку',
   topics:['Что речь человека говорит о нём самом?','Почему важно беречь родной язык?','Может ли слово ранить или исцелить?']}
 ]}
];
const SUBS = SECTIONS.flatMap(s=>s.subs);
const ALL_TOPICS = SUBS.flatMap(s=>s.topics.map(t=>({t, sub:s.id})));

const BOOKS = [
 {id:'kd', a:'А. С. Пушкин', t:'Капитанская дочка', tags:['1.1','1.2','2.1','2.3'],
  heroes:'Пётр Гринёв, Маша Миронова, Швабрин, Пугачёв, Савельич',
  eps:['Отец напутствует сына: «Береги честь смолоду».','Гринёв дарит заячий тулуп вожатому — позже этот человек, Пугачёв, сохраняет ему жизнь.','В захваченной крепости Гринёв отказывается присягать Пугачёву, а Швабрин переходит на сторону бунтовщиков.','Маша сама едет к императрице просить за жениха и добивается помилования.'],
  idea:'Честь и верность слову сильнее страха смерти; добро возвращается.',
  q:'«Береги платье снову, а честь смолоду».'},
 {id:'eo', a:'А. С. Пушкин', t:'Евгений Онегин', tags:['1.1','1.2','1.3'],
  heroes:'Онегин, Татьяна Ларина, Ленский, Ольга',
  eps:['Татьяна пишет Онегину письмо-признание, он холодно её отвергает.','Из-за пустой обиды Онегин убивает Ленского на дуэли.','Спустя годы Онегин влюбляется в Татьяну, но она остаётся верна мужу.'],
  idea:'Верность долгу и чувство собственного достоинства; цена равнодушия и скуки.',
  q:'«Но я другому отдана; / Я буду век ему верна».'},
 {id:'gu', a:'А. С. Грибоедов', t:'Горе от ума', tags:['2.2','1.4','3.2'],
  heroes:'Чацкий, Фамусов, Софья, Молчалин, Скалозуб',
  eps:['Чацкий высмеивает чинопочитание московского общества.','Молчалин живёт по правилу «угождать всем людям без изъятья».','Общество объявляет Чацкого сумасшедшим, и он уезжает из Москвы.'],
  idea:'Честный и думающий человек вступает в конфликт с обществом, которое боится перемен и знаний.',

{t:'Как понять тему и построить сочинение', th:`
<ol><li>Подчеркни <b>ключевые слова</b>. В теме «Почему человек способен на предательство?» это <i>почему</i> и <i>предательство</i>.</li>
<li>Определи, <b>что спрашивают</b>: причину («почему»), способ («как»), оценку («всегда ли», «можно ли»), смысл понятия («что значит»).</li>
<li>Ответь на вопрос <b>одним предложением</b>. Это тезис, который ты будешь доказывать.</li></ol>
<div class="note red">Самая частая причина незачёта по К1 — подмена темы. Тема «Почему опасно равнодушие?» — не о доброте вообще, а именно о <b>последствиях</b> равнодушия.</div>
<p>Надёжная схема на 350–450 слов:</p>
<ol><li><b>Вступление</b> (50–70 слов): подводка → <b>тезис</b>.</li>
<li><b>Аргумент 1</b> (120–150): микротезис → эпизод → анализ → микровывод.</li>
<li><b>Аргумент 2</b> (120–150): другое произведение.</li>
<li><b>Заключение</b> (40–60): вывод, который отвечает на вопрос темы.</li></ol>`,
 tasks:['Разобрать 3 темы из банка: ключевые слова и ответ в одно предложение','Составить план к теме «Что значит быть сильной личностью?»','Записать своими словами определения: совесть, честь, свобода, память, милосердие'], act:{label:'Открыть структуру', go:'ref:struct'}},
{t:'Вступление и заключение', th:`
<p>Четыре рабочих способа начать: <b>через понятие</b>, <b>через вопрос</b>, <b>через цитату</b> (если точно помнишь её и автора), <b>через наблюдение</b> из жизни. Последняя фраза вступления — <b>тезис</b>.</p>
<div class="example">Предательство редко начинается с громкого поступка. Чаще оно вырастает из слабости, страха или желания получить выгоду. На мой взгляд, человек способен предать, когда ставит собственные интересы выше верности и чести.</div>
<p>Заключение: тезис <b>другими словами</b> → обобщение обоих аргументов → (по желанию) короткий личный вывод. Новых примеров в заключении не приводят.</p>
<div class="example">Таким образом, человек способен на предательство, когда страх или выгода оказываются для него важнее совести. Андрий и Швабрин сделали такой выбор и потеряли себя. Мне кажется, верность проверяется именно тогда, когда за неё приходится платить.</div>`,
 tasks:['Написать два вступления разными способами к одной теме (в тренажёре)','Написать к ним заключение','Выписать 5 связок из Справки → Фразы'], act:{label:'Открыть фразы', go:'ref:phr'}},
{t:'Твоя литературная база', th:`
<p>Выбери <b>6–8 произведений</b>, которые знаешь лучше всего, так, чтобы закрыть все 3 раздела. Для каждого нужно помнить:</p>
<ul><li>точное название и автора (с инициалами);</li><li>имена героев;</li><li>2–3 эпизода с деталями;</li><li>к каким подразделам подходит.</li></ul>
<div class="note">Лучше 7 книг, которые знаешь назубок, чем 20, о которых помнишь только название.</div>`,
 tasks:['Отметить во вкладке «Книги» 6–8 произведений, которые читал(а)','Пройти их в режиме карточек','Перечитать краткое содержание тех, что помнишь хуже'], act:{label:'Открыть книги', go:'books'}},
{t:'Аргумент, а не пересказ', th:`
<p>Пересказ сюжета — ошибка №1. Формула аргумента:</p>
<ol><li><b>Микротезис</b> — как произведение связано с темой.</li>
<li><b>Эпизод</b> — кто, что сделал, конкретная деталь.</li>
<li><b>Анализ</b> — почему это важно и что это говорит о герое и о теме.</li>
<li><b>Микровывод</b> — возврат к тезису.</li></ol>
<div class="example">Обратимся к повести А. С. Пушкина «Капитанская дочка». Пётр Гринёв попадает в плен к Пугачёву и может спасти жизнь ценой присяги самозванцу. Однако он отвечает, что присягал императрице и не может нарушить слово. Герой понимает, что его могут казнить, но страх смерти для него слабее страха потерять честь. Так отцовское «береги честь смолоду» становится его внутренним законом. Этот пример показывает, что сохранить честь — значит остаться верным себе даже тогда, когда это опасно.</div>`,
 tasks:['Написать 2 аргумента по формуле к одной теме','Отметить, где пересказ, а где анализ: анализа должно быть не меньше половины']},
/* ЭТАП 2: АРГУМЕНТЫ */
{t:'Пробное сочинение №1', th:`
<p>Первое сочинение пишем <b>без таймера</b>. Задача — пройти весь путь от темы до заключения и увидеть свои слабые места.</p>
<div class="note">Не бойся, что получится плохо. Это точка отсчёта: через неделю сравнишь.</div>`,
 tasks:['Взять случайную тему в тренажёре и написать сочинение','Проверить объём: от 350 слов','Пройти самопроверку по 5 критериям','Записать 3 главных недочёта'], act:{label:'В тренажёр', go:'write'}},
{t:'Раздел 1: духовно-нравственные ориентиры', sec:1, th:`
<p>Темы о характере, совести, выборе между добром и злом, самопознании и свободе.</p>
<p><b>Опорные произведения:</b> «Преступление и наказание», «Капитанская дочка», «Мастер и Маргарита», «Герой нашего времени», «Старуха Изергиль», «Маленький принц».</p>`,
 tasks:['Выучить 2 произведения для этого раздела (режим карточек)','Составить планы к 2 темам раздела','Написать 1 полный аргумент'], act:{label:'Темы раздела', go:'ref:bank'}},
{t:'Раздел 2: семья, общество, Отечество', sec:2, th:`
<p>Темы о семье и воспитании, человеке и обществе, патриотизме, памяти и связи поколений.</p>
<p><b>Опорные произведения:</b> «Война и мир», «Судьба человека», «А зори здесь тихие…», «Тарас Бульба», «Матрёнин двор», «Телеграмма», «Прощание с Матёрой».</p>`,
 tasks:['Выучить 2 произведения для этого раздела','Составить планы к 2 темам раздела','Написать 1 полный аргумент'], act:{label:'Темы раздела', go:'ref:bank'}},
{t:'Раздел 3: природа и культура', sec:3, th:`
<p>Темы о природе, науке и прогрессе, искусстве, языке.</p>
<p><b>Опорные произведения:</b> «Отцы и дети», «Царь-рыба», «Собачье сердце», «451° по Фаренгейту», «Портрет», «Франкенштейн», «Русский язык» Тургенева, «Живой как жизнь» Чуковского.</p>
<div class="note">Для подраздела «Язык» можно привлекать и нехудожественную литературу: публицистику, книги о языке. Главное — это литературный источник, а не фильм или сериал.</div>`,
 tasks:['Выучить 2 произведения для этого раздела','Составить планы к 2 темам раздела','Написать 1 полный аргумент'], act:{label:'Темы раздела', go:'ref:bank'}},
{t:'Чистая речь (критерий К4)', th:`
<ul><li><b>Повторы</b>: «герой… герой… герой» → он, юноша, Гринёв, молодой офицер.</li>
<li><b>Канцелярит</b>: «является», «данный», «имеет место» → проще.</li>
<li><b>Штампы</b>: «в наше время», «испокон веков», «красной нитью».</li>
<li><b>Разговорные слова</b>: «прикольно», «короче», «капец».</li>
<li><b>Времена в пересказе</b>: не прыгай между прошедшим и настоящим.</li></ul>`,
 tasks:['Открыть сочинение №1 в тренажёре и посмотреть «Проверку речи»','Переписать 5 неудачных предложений','Пересохранить исправленный вариант'], act:{label:'В тренажёр', go:'write'}},

 tasks:['Написать сочинение за 2 часа','Пройти самопроверку по 5 критериям','Сравнить с сочинением №1: что стало лучше?'], act:{label:'В тренажёр', go:'write'}},
{t:'Грамотность и оформление', th:`
<p>Для зачёта по К5 нужно не больше <b>5 ошибок на 100 слов</b> (орфография, пунктуация и грамматика вместе). На экзамене дают орфографический словарь.</p>
<ul><li>Вводные слова: <i>во-первых, например, к сожалению, конечно</i> выделяй запятыми.</li>
<li>Деепричастный оборот выделяется всегда: <i>Вернувшись домой, герой…</i></li>
<li>Причастный оборот после определяемого слова — запятые: <i>человек, потерявший честь,…</i></li>
<li>Запятая перед <i>что, который, потому что, чтобы, когда</i> в сложном предложении.</li>
<li><i>-тся / -ться</i>: «что делает?» — без ь, «что делать?» — с ь.</li></ul>
<p><b>Оформление:</b> название — в кавычках, автор — с инициалами (Л. Н. Толстой), жанр — точно («Шинель» — повесть, «Матрёнин двор» — рассказ). Цитату помнишь неточно — перескажи своими словами без кавычек.</p>`,
 tasks:['Выписать свои ошибки из сочинений №1 и №2 и повторить правила к ним','Выучить по одной цитате из 6–8 произведений своей базы','Проверить жанры всех своих произведений']},
{t:'Сочинение №3 — полная репетиция', th:`
<p>Таймер <b>3 часа 55 минут</b>. Распредели время так:</p>

<div class="note">Тема — из раздела, по которому ты ещё не писал(а).</div>`,
 tasks:['Написать сочинение с таймером 3:55','Пройти самопроверку по 5 критериям'], act:{label:'В тренажёр', go:'write'}},
{t:'Ошибки и быстрые планы', th:`

<p>Затем имитация выбора темы: возьми 6 случайных тем и для каждой за 10 минут составь тезис, 2 произведения с эпизодами и вывод.</p>
<div class="note">На экзамене выбирай не самую «красивую» тему, а ту, к которой у тебя есть два сильных аргумента. Если учитель может проверить сочинение — отдай ему №3.</div>`,
 tasks:['Перечитать сочинения №1–3 и записать 3 своих «риска»','Составить 6 быстрых планов по 10 минут','Закрыть пробелы: темы, к которым аргументы нашлись не сразу'], act:{label:'Справка → банк тем', go:'ref:bank'}},

const QUIZ = [
 {q:'При каком объёме работу не будут проверять?', o:['Меньше 150 слов','Меньше 250 слов','Меньше 350 слов','Меньше 450 слов'], a:1},
 {q:'Какой объём рекомендован?', o:['От 200 слов','От 250 слов','От 350 слов','От 500 слов'], a:2},
 {q:'Сколько длится итоговое сочинение?', o:['2 часа','3 часа','3 часа 55 минут','4 часа 30 минут'], a:2},
 {q:'Какие критерии обязательны для зачёта?', o:['К1 и К2','К1 и К5','К3 и К4','Все пять'], a:0},
 {q:'Сколько тем в комплекте на экзамене?', o:['3','4','6','10'], a:2},
 {q:'Сколько ошибок на 100 слов допустимо для зачёта по К5?', o:['Не больше 3','Не больше 5','Не больше 7','Ошибки не важны'], a:1},
 {q:'Что будет за сочинение, списанное из интернета?', o:['Снизят баллы','«Незачёт»','Попросят переписать на месте','Ничего'], a:1},
 {q:'Чем разрешено пользоваться?', o:['Телефоном','Распечаткой аргументов','Орфографическим словарём','Ничем, даже словарём'], a:2},
 {q:'Что важнее всего в аргументе?', o:['Подробный пересказ сюжета','Анализ эпизода и связь с темой','Больше цитат','Ссылка на фильм'], a:1},
 {q:'К1, К2 и К4 — «зачёт», К3 и К5 — «незачёт». Итог?', o:['«Незачёт»','«Зачёт»','Отправят на перепроверку','Нужно переписать'], a:1}
];

/* ===================== ХРАНИЛИЩЕ ===================== */
const KEY='zachet21:v1';
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const fresh = ()=>({plan:15, start:iso(new Date()), done:{}, books:{}, essays:[], draft:{topic:'',text:''}, timer:{dur:120*60, end:null, left:120*60}, check:{}, view:null, refTab:'crit', bookFilter:'all', bookMode:'list'});
let S = Object.assign(fresh(), load()||{});
if(S.plan!==15){S.plan=15;S.done={};S.view=null;save()}  // переход со старого плана на 21 день
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ===================== ПОМОЩНИКИ ===================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function plural(n,a,b,c){n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c}
function dayStart(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function currentDay(){const s=new Date(S.start+'T00:00:00');const n=Math.floor((dayStart(new Date())-s)/864e5)+1;return Math.min(15,Math.max(1,n))}
function daysLeft(){return Math.max(0,Math.round((dayStart(EXAM)-dayStart(new Date()))/864e5))}
function dayState(i){const d=S.done[i]||{};const n=DAYS[i-1].tasks.filter((_,k)=>d[k]).length;return n===0?'':(n===DAYS[i-1].tasks.length?'done':'part')}
function doneDays(){let c=0;for(let i=1;i<=15;i++)if(dayState(i)==='done')c++;return c}
function words(t){return (t.match(/[A-Za-zА-Яа-яЁё0-9]+(?:-[A-Za-zА-Яа-яЁё0-9]+)*/g)||[]).length}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function fmtDate(isoStr){const d=new Date(isoStr+'T00:00:00');return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function bookChip(id){const b=BOOK[id];return `<button class="chip" data-book="${id}">«${esc(b.t)}»</button>`}
function booksFor(sub){return BOOKS.filter(b=>b.tags.includes(sub))}

/* ===================== ЭКРАНЫ ===================== */
function header(sub){return `<div class="top"><div class="brand"><span class="hand">Зачёт</span><b>за 15 дней</b></div><span class="small muted">${sub||''}</span></div>`}

function viewToday(){
  const cur=currentDay(); const i=S.view||cur; const D=DAYS[i-1]; const left=daysLeft();
  const week=Math.ceil(i/5); const done=S.done[i]||{};
  const pct=Math.round(doneDays()/15*100);
  return `<div class="stack">
  ${header('до '+EXAM_LABEL)}
  <div class="card count">
    <div class="big num">${left}</div>
    <div class="stack-s"><b>${plural(left,'день','дня','дней')} до сочинения</b>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
      <span class="small muted num">Пройдено дней плана: ${doneDays()} из 15</span></div>
  </div>
  ${i!==cur?`<div class="row"><button class="link" data-goday="${cur}">← К сегодняшнему, день ${cur}</button></div>`:''}
  <div class="card stack">
    <div class="stack-s"><span class="eyebrow">Этап ${week} · День ${i} из 15</span><h1>${D.t}</h1></div>
    <div class="theory">${D.th}</div>
    ${D.sec?secBooks(D.sec):''}
    ${D.act?`<div class="row"><button class="btn ghost sm" data-go="${D.act.go}">${D.act.label}</button>${i===1?'<button class="btn ghost sm" data-go="quiz">Проверь себя</button>':''}</div>`:''}
  </div>
  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:6px"><h3>Задания дня</h3>${dayState(i)==='done'?'<span class="hand" style="font-size:24px">зачёт!</span>':''}</div>
    <div>${D.tasks.map((t,k)=>`<div class="task ${done[k]?'done':''}"><input type="checkbox" class="chk" id="t${i}_${k}" data-day="${i}" data-k="${k}" ${done[k]?'checked':''}><label for="t${i}_${k}">${t}</label></div>`).join('')}</div>
  </div>
  <div class="row" style="justify-content:space-between">
    ${i>1?`<button class="btn ghost sm" data-goday="${i-1}">← День ${i-1}</button>`:'<span></span>'}
    ${i<15?`<button class="btn ghost sm" data-goday="${i+1}">День ${i+1} →</button>`:''}
  </div></div>`;
}
function secBooks(sec){
  const subs=SECTIONS[sec-1].subs;
  return `<div class="stack-s">${subs.map(s=>`<div class="stack-s"><span class="small"><b>${s.id}</b> ${s.name}</span><div class="chips">${booksFor(s.id).slice(0,4).map(b=>bookChip(b.id)).join('')}</div></div>`).join('')}</div>`;
}

function viewPlan(){
  const cur=currentDay();
  const weeks=[['Основа','дни 1–5: правила, структура, аргумент'],['Аргументы','дни 6–10: три раздела банка, речь'],['Тренировка','дни 11–15: грамотность, репетиции']];
  return `<div class="stack">${header('старт: '+fmtDate(S.start))}
  ${weeks.map((w,wi)=>`<div class="card week">
    <div class="row" style="justify-content:space-between"><h2>Этап ${wi+1}: ${w[0]}</h2></div>
    <span class="small muted">${w[1]}</span>
    <div class="days">${[1,2,3,4,5].map(k=>{const i=wi*5+k;return `<button class="day ${i===cur?'today':''} ${dayState(i)}" data-goday="${i}" aria-label="День ${i}"><span class="num">${i}</span><small>${i===cur?'сегодня':''}</small></button>`}).join('')}</div>

let quiz={i:0,score:0,picked:null};
function viewQuiz(){
  if(quiz.i>=QUIZ.length){const ok=quiz.score>=8;return `<div class="card stack" style="text-align:center"><span class="hand" style="font-size:44px">${ok?'зачёт':'ещё раз'}</span><h2 class="num">${quiz.score} из ${QUIZ.length}</h2><p class="muted">${ok?'Правила знаешь. Двигаемся дальше.':'Перечитай «Критерии» и попробуй снова.'}</p><div class="row" style="justify-content:center"><button class="btn" id="quizAgain">Пройти заново</button></div></div>`}
  const Q=QUIZ[quiz.i];
  return `<div class="card stack"><span class="eyebrow num">Вопрос ${quiz.i+1} из ${QUIZ.length}</span><h3>${Q.q}</h3>
  <div class="stack-s">${Q.o.map((o,k)=>{let c='';if(quiz.picked!==null){if(k===Q.a)c='right';else if(k===quiz.picked)c='wrong'}return `<button class="quiz-opt ${c}" data-opt="${k}" ${quiz.picked!==null?'disabled':''}>${o}</button>`}).join('')}</div>
  ${quiz.picked!==null?`<button class="btn" id="quizNext">${quiz.i<QUIZ.length-1?'Дальше':'Итог'}</button>`:''}</div>`;
}

let flash={id:null,open:false};
function viewBooks(){
  const f=S.bookFilter, mode=S.bookMode;
  const list=f==='all'?BOOKS:f==='mine'?BOOKS.filter(b=>S.books[b.id]?.read):booksFor(f);
  const mine=BOOKS.filter(b=>S.books[b.id]?.read).length;
  const filters=[['all','Все'],['mine','Моя база · '+mine],...SUBS.map(s=>[s.id,s.id])];
  let body='';
  if(mode==='list'){
    body=`<div class="card">${list.length?list.map(b=>{const st=S.books[b.id]||{};return `<details class="acc book" id="b-${b.id}"><summary><span class="bt"><span class="author">${b.a}</span><span class="title">«${b.t}»</span><span class="row" style="gap:4px">${b.tags.map(t=>`<span class="tag">${t}</span>`).join('')}${st.known?'<span class="tag ok">помню</span>':''}</span></span></summary>
    <div class="acc-body">
      <div class="kv"><span>Герои</span><span>${b.heroes}</span></div>
      <div class="kv"><span>Эпизоды для аргументов</span><ul style="margin:4px 0 0;padding-left:18px">${b.eps.map(e=>`<li>${e}</li>`).join('')}</ul></div>
      <div class="kv"><span>Главная мысль</span><span>${b.idea}</span></div>
      <div class="kv"><span>Запомнить</span><span class="quote">${b.q}</span></div>
      <div class="row"><input type="checkbox" class="chk" id="read-${b.id}" data-read="${b.id}" ${st.read?'checked':''}><label for="read-${b.id}">Читал(а), беру в свою базу</label></div>
    </div></details>`}).join(''):`<p class="muted">Здесь пока пусто. Открой «Все» и отметь произведения, которые читал(а).</p>`}</div>`;
  } else {
    const pool=list.length?list:BOOKS;
    if(!flash.id||!pool.find(b=>b.id===flash.id)){flash.id=pickFlash(pool);flash.open=false}
    const b=BOOK[flash.id]; const known=pool.filter(x=>S.books[x.id]?.known).length;
    body=`<div class="card flash"><div class="stack-s"><span class="eyebrow num">Помню ${known} из ${pool.length}</span><span class="author muted">${b.a}</span><span class="title">«${b.t}»</span>
    ${flash.open?`<div class="stack-s" style="margin-top:8px"><div class="kv"><span>Герои</span><span>${b.heroes}</span></div><div class="kv"><span>Эпизоды</span><ul style="margin:4px 0 0;padding-left:18px">${b.eps.map(e=>`<li>${e}</li>`).join('')}</ul></div><div class="kv"><span>Подразделы</span><span>${b.tags.join(', ')}</span></div><div class="kv"><span>Цитата</span><span class="quote">${b.q}</span></div></div>`
    :`<p class="muted" style="margin-top:8px">Вспомни вслух: героев, 2–3 эпизода, к каким подразделам подходит. Потом открой ответ.</p>`}</div>
    ${flash.open?`<div class="row"><button class="btn ghost" data-fl="again" style="flex:1">Повторить</button><button class="btn" data-fl="know" style="flex:1">Помню</button></div>`:`<button class="btn" data-fl="open">Показать ответ</button>`}</div>`;
  }
  return `<div class="stack">${header(BOOKS.length+' произведений')}
  <div class="seg" role="group" aria-label="Режим"><button aria-pressed="${mode==='list'}" data-mode="list">Список</button><button aria-pressed="${mode==='cards'}" data-mode="cards">Карточки</button></div>
  <div class="chips">${filters.map(([k,l])=>`<button class="chip" aria-pressed="${f===k}" data-filter="${k}">${l}</button>`).join('')}</div>
  ${body}</div>`;
}
function pickFlash(pool){const unk=pool.filter(b=>!S.books[b.id]?.known);const src=unk.length?unk:pool;let p;do{p=src[Math.floor(Math.random()*src.length)].id}while(src.length>1&&p===flash.id);return p}

function viewWrite(){
  const d=S.draft;
  return `<div class="stack">${header('тренажёр')}
  <div class="card stack-s">
    <label class="eyebrow" for="topic">Тема</label>
    <input class="text" id="topic" value="${esc(d.topic)}" placeholder="Например: Что значит быть свободным?">
    <div class="row"><button class="btn ghost sm" id="rndTopic">Случайная тема</button></div>
  </div>
  <div class="card stack-s">
    <div class="row" style="justify-content:space-between"><span class="timer num" id="timer">${fmtT(S.timer.end?Math.round((S.timer.end-Date.now())/1000):S.timer.left)}</span>
      <div class="row"><button class="btn sm" id="tStart">${S.timer.end?'Пауза':'Старт'}</button><button class="btn ghost sm" id="tReset">Сброс</button></div></div>
    <div class="chips">${[[30,'30 мин'],[60,'1 час'],[120,'2 часа'],[235,'3:55']].map(([m,l])=>`<button class="chip" data-dur="${m}" aria-pressed="${S.timer.dur===m*60}">${l}</button>`).join('')}</div>
  </div>
  <textarea id="essay" placeholder="Пиши здесь. Текст сохраняется сам.">${esc(d.text)}</textarea>
  <div class="card stack" id="statsBox"></div>
  <div class="card stack-s">
    <h3>Самопроверка</h3>
    ${[['k1','К1: я отвечаю именно на вопрос темы, тезис есть во вступлении'],['k2','К2: есть хотя бы одно произведение (лучше два), и я анализирую эпизоды, а не пересказываю'],['k3','К3: вступление — аргументы — заключение, абзацы связаны'],['k4','К4: нет повторов и штампов, слова точные'],['k5','К5: перечитал(а) на ошибки, проверил(а) запятые']].map(([k,l])=>`<div class="task ${S.check[k]?'done':''}"><input type="checkbox" class="chk" id="c-${k}" data-check="${k}" ${S.check[k]?'checked':''}><label for="c-${k}">${l}</label></div>`).join('')}
    <div class="row" style="margin-top:6px"><button class="btn" id="saveEssay">Сохранить сочинение</button><button class="btn ghost" id="newEssay">Новое</button></div>
  </div>
  <div class="card stack-s"><h3>Мои сочинения</h3>${S.essays.length?S.essays.map((e,k)=>`<div class="task"><div style="flex:1;min-width:0"><b>${esc(e.topic||'Без темы')}</b><div class="small muted num">${e.date} · ${e.words} ${plural(e.words,'слово','слова','слов')}</div></div><div class="row" id="ed-${k}"><button class="btn ghost sm" data-open="${k}">Открыть</button><button class="link small" data-del="${k}">Удалить</button></div></div>`).join(''):'<p class="muted small">Сохранённые сочинения появятся здесь. Их удобно перечитывать на 14-й день.</p>'}</div>
  </div>`;
}
function fmtT(s){const neg=s<0;s=Math.abs(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (neg?'+':'')+(h?h+':':'')+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0')}

function renderStats(){
  const box=$('#statsBox'); if(!box) return;
  const t=S.draft.text; const w=words(t);
  const paras=t.split(/\n\s*\n|\n/).filter(p=>p.trim()).length;
  const col=w<250?'var(--red)':w<350?'var(--warn)':'var(--ok)';
  const status=w<250?`<span class="tag red">ещё ${250-w} до минимума</span>`:w<350?`<span class="tag">ещё ${350-w} до рекомендуемого</span>`:`<span class="tag ok">объём в норме</span>`;
  const low=t.toLowerCase();
  const found=CLICHES.map(c=>[c,(low.match(new RegExp(c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length]).filter(x=>x[1]);
  const freq={};(low.match(/[а-яё]{5,}/g)||[]).forEach(x=>{if(!STOP.has(x))freq[x]=(freq[x]||0)+1});
  const rep=Object.entries(freq).filter(x=>x[1]>=4).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max=Math.max(450,w);
  box.innerHTML=`<div class="stats num"><div><b>${w}</b><span class="small muted">${plural(w,'слово','слова','слов')}</span></div><div><b>${paras}</b><span class="small muted">абзацев</span></div><div><b>${Math.floor(w*5/100)}</b><span class="small muted">ошибок макс.</span></div></div>
  <div class="meter" aria-hidden="true"><i style="width:${Math.min(100,w/max*100)}%;background:${col}"></i><span class="mk" style="left:${250/max*100}%"><span class="muted">250</span></span><span class="mk" style="left:${350/max*100}%"><span class="muted">350</span></span></div>
  <div class="row" style="margin-top:14px">${status}${paras&&paras<4&&w>150?'<span class="tag">мало абзацев: нужно 4–5</span>':''}</div>
  <div class="stack-s"><span class="eyebrow">Проверка речи</span>
   ${found.length||rep.length?`<div class="row">${found.map(([c,n])=>`<span class="hl">штамп: ${c==='данн'?'данный':c}${n>1?' ×'+n:''}</span>`).join('')}${rep.map(([x,n])=>`<span class="hl">повтор: ${x} ×${n}</span>`).join('')}</div>`:`<span class="small muted">${w?'Штампов и частых повторов не найдено.':'Начни писать, и здесь появятся подсказки.'}</span>`}</div>`;
}

/* ===================== РОУТИНГ ===================== */
const VIEWS={today:viewToday,plan:viewPlan,ref:viewRef,books:viewBooks,write:viewWrite};
function route(){const h=(location.hash||'#today').slice(1);return VIEWS[h]?h:'today'}
function render(keepScroll){
  const r=route();
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.tab===r?'page':'false'));
  const y=window.scrollY; $('#app').innerHTML=VIEWS[r]();
  if(r==='write') renderStats();
  if(keepScroll) window.scrollTo(0,y);
}
function go(target){
  if(target.startsWith('ref:')){S.refTab=target.slice(4);save();nav('ref')}
  else if(target==='quiz'){S.refTab='quiz';quiz={i:0,score:0,picked:null};save();nav('ref')}
  else nav(target);
}
function nav(r){if(location.hash==='#'+r)render();else location.hash=r;window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});

/* ===================== СОБЫТИЯ ===================== */
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-go]'); if(!el) return;
  const d=el.dataset;
  if(d.goday){S.view=+d.goday===currentDay()?null:+d.goday;save();nav('today');return}
  if(d.go){go(d.go);return}
  if(d.ref){S.refTab=d.ref;if(d.ref==='quiz')quiz={i:0,score:0,picked:null};save();render(true);return}
  if(d.book){S.bookFilter='all';S.bookMode='list';save();nav('books');setTimeout(()=>{const b=document.getElementById('b-'+d.book);if(b){b.open=true;b.scrollIntoView({block:'start'})}},30);return}
  if(d.topic){S.draft.topic=d.topic;save();nav('write');toast('Тема в тренажёре');return}
  if(d.opt!==undefined){quiz.picked=+d.opt;if(+d.opt===QUIZ[quiz.i].a)quiz.score++;render(true);return}
  if(el.id==='quizNext'){quiz.i++;quiz.picked=null;render(true);return}
  if(el.id==='quizAgain'){quiz={i:0,score:0,picked:null};render(true);return}
  if(d.filter){S.bookFilter=d.filter;flash.id=null;save();render(true);return}
  if(d.mode){S.bookMode=d.mode;save();render(true);return}
  if(d.fl){if(d.fl==='open')flash.open=true;else{S.books[flash.id]=Object.assign({},S.books[flash.id],{known:d.fl==='know'});save();const f=S.bookFilter;const list=f==='all'?BOOKS:f==='mine'?BOOKS.filter(b=>S.books[b.id]?.read):booksFor(f);flash.id=pickFlash(list.length?list:BOOKS);flash.open=false}render(true);return}
  if(el.id==='setStart'){const v=$('#startDate').value;if(v){S.start=v;S.view=null;save();render(true);toast('Дата старта сохранена')}return}
  if(el.id==='askReset'){$('#resetZone').innerHTML='<span class="small">Удалить отметки, сочинения и черновик?</span><button class="btn red sm" id="doReset">Да, сбросить</button><button class="btn ghost sm" id="noReset">Отмена</button>';return}
  if(el.id==='noReset'){render(true);return}
  if(el.id==='doReset'){S=fresh();save();render();toast('Прогресс сброшен');return}
  if(el.id==='rndTopic'){const x=ALL_TOPICS[Math.floor(Math.random()*ALL_TOPICS.length)];S.draft.topic=x.t;save();$('#topic').value=x.t;toast('Подраздел '+x.sub);return}
  if(d.dur){const s=+d.dur*60;S.timer={dur:s,end:null,left:s};save();render(true);return}
  if(el.id==='tStart'){if(S.timer.end){S.timer.left=Math.round((S.timer.end-Date.now())/1000);S.timer.end=null}else{S.timer.end=Date.now()+S.timer.left*1000}save();render(true);return}
  if(el.id==='tReset'){S.timer={dur:S.timer.dur,end:null,left:S.timer.dur};save();render(true);return}
  if(el.id==='saveEssay'){const w=words(S.draft.text);if(!w){toast('Сначала напиши текст');return}S.essays.unshift({topic:S.draft.topic,text:S.draft.text,words:w,date:new Date().toLocaleDateString('ru-RU')});save();render(true);toast('Сочинение сохранено');return}
  if(el.id==='newEssay'){S.draft={topic:'',text:''};S.check={};S.timer={dur:S.timer.dur,end:null,left:S.timer.dur};save();render();return}
  if(d.open!==undefined){const x=S.essays[+d.open];S.draft={topic:x.topic,text:x.text};save();render();toast('Открыто в редакторе');return}
  if(d.del!==undefined){const k=+d.del;$('#ed-'+k).innerHTML=`<button class="btn red sm" data-delok="${k}">Удалить</button><button class="btn ghost sm" data-delno="1">Нет</button>`;return}
  if(d.delok!==undefined){S.essays.splice(+d.delok,1);save();render(true);return}
  if(d.delno){render(true);return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.day){const i=+el.dataset.day,k=+el.dataset.k;S.done[i]=S.done[i]||{};S.done[i][k]=el.checked;save();render(true);if(dayState(i)==='done')toast('День '+i+' — зачёт!');return}
  if(el.dataset.read){const id=el.dataset.read;S.books[id]=Object.assign({},S.books[id],{read:el.checked});save();return}
  if(el.dataset.check){S.check[el.dataset.check]=el.checked;el.closest('.task').classList.toggle('done',el.checked);save();return}
});
let tmr;
document.addEventListener('input',e=>{
  if(e.target.id==='essay'){S.draft.text=e.target.value;clearTimeout(tmr);tmr=setTimeout(()=>{save();renderStats()},250)}
  if(e.target.id==='topic'){S.draft.topic=e.target.value;save()}
});
setInterval(()=>{const t=$('#timer');if(!t||!S.timer.end)return;const s=Math.round((S.timer.end-Date.now())/1000);t.textContent=fmtT(s);t.classList.toggle('over',s<0)},1000);

render();
</script>

</body>
