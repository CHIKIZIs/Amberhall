#sleepo{position:fixed;inset:0;background:rgba(13,11,26,.55);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:calc(var(--u)*6);font-size:calc(var(--u)*9)}
#fps{position:fixed;left:50%;bottom:2px;font-size:10px;color:#7bd05a;transform:translateX(-50%);pointer-events:none}
#drag{position:fixed;pointer-events:none;z-index:50;width:calc(var(--u)*20);height:calc(var(--u)*20);margin:calc(var(--u)*-10) 0 0 calc(var(--u)*-10)}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fbe27a;background:#0d0b1a}
</style>
</head>
