:root{--u:1px;--ts:1;--ink:#0a0810;--stone:#1b1626;--stone2:#241d34;--edge:#453a64;--edge2:#2a2340;--gold:#ffd34d;--gold2:#a8741a;--txt:#efe6d2;--dim:#a89cc8}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;background:#07060d;overflow:hidden;font-family:EH,'Courier New',Consolas,monospace;color:var(--txt);touch-action:none;overscroll-behavior:none}
body{position:fixed;left:0;top:0}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#000;overflow:hidden;box-shadow:0 0 40px #000}
/* на телефоне открыта клавиатура: сцена прижата к верху, чтобы поле ввода не ушло под клавиши */
body.kb #stage{top:0;transform:translate(-50%,0)}
#c{position:absolute;left:0;top:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;cursor:crosshair;display:block}
#ui{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;font-size:calc(var(--u)*10);line-height:1.2;-webkit-font-smoothing:none;font-smooth:never}
.screen{position:absolute;left:0;top:0;width:100%;height:100%;display:none;pointer-events:auto;background:rgba(9,7,17,.9);flex-direction:column;align-items:center;padding:1.4em 2em;overflow-x:hidden;overflow-y:auto;text-align:center;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.screen.on{display:flex}
.screen.clear{background:linear-gradient(rgba(9,7,17,.25),rgba(9,7,17,.7))}
.screen.clear.bare{background:transparent;pointer-events:none}
.wrap{margin:auto;width:100%;display:flex;flex-direction:column;align-items:center}
body.kb .wrap{margin-top:0}
::-webkit-scrollbar{width:.8em;height:.8em}::-webkit-scrollbar-track{background:var(--ink)}::-webkit-scrollbar-thumb{background:var(--edge);border:.2em solid var(--ink)}
/* ---- заголовки ---- */
h1{font-size:4em;font-weight:normal;line-height:1;letter-spacing:.05em;color:var(--gold);text-shadow:calc(var(--u)*4) calc(var(--u)*4) 0 #b0560c,calc(var(--u)*8) calc(var(--u)*8) 0 #3a1400;margin:0 0 .25em .05em}
h2{font-size:2em;font-weight:normal;line-height:1;color:var(--gold);text-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 #5a2c00;margin-bottom:.5em;padding:.25em .8em .3em;position:relative}
h2::before,h2::after{content:'';position:absolute;top:50%;width:1.2em;height:.1em;background:var(--gold2);box-shadow:0 .2em 0 var(--gold2)}
h2::before{right:100%}h2::after{left:100%}
h3{font-size:1em;font-weight:normal;color:#cbbcff;margin:.9em 0 .5em;letter-spacing:.1em}
.sub{color:var(--dim);margin-bottom:.9em;max-width:60em}
.hint{color:#8c82c8;margin-top:.9em;max-width:64em}
.warn{color:#ff9a9a}
b{font-weight:normal;color:#fff}
/* ---- кнопка: деревянная дощечка ---- */
.btn{display:block;position:relative;background:#6a4424;border:.2em solid;border-color:#a06e3a #4a2c14 #3a2210 #8a5c30;color:#ffe9b0;padding:.5em 1.4em .6em;margin:.5em auto;cursor:pointer;min-width:18em;
  text-shadow:.1em .1em 0 #2a180a;pointer-events:auto;box-shadow:.2em 0 0 var(--ink),-.2em 0 0 var(--ink),0 .2em 0 var(--ink),0 -.2em 0 var(--ink),0 .6em 0 rgba(0,0,0,.4)}
@media(hover:hover){.btn:hover{background:#7e5430;color:#fff}.card:hover{background:#2e2540;border-color:#7a6aa8 #4a3f6a #4a3f6a #7a6aa8}}
.btn:active,.btn.hold{transform:translateY(.2em);box-shadow:.2em 0 0 var(--ink),-.2em 0 0 var(--ink),0 .2em 0 var(--ink),0 -.2em 0 var(--ink),0 .4em 0 rgba(0,0,0,.4);background:#56361c}
.btn.dis{filter:grayscale(.85);opacity:.5;pointer-events:none}
.btn.sm{min-width:9em;padding:.3em .9em .4em;margin:.3em auto}
.btn.red{background:#7a2430;border-color:#c0505e #4a121c #3a0e16 #a83c4a;color:#ffd8d8;text-shadow:.1em .1em 0 #2a0810}
.btn.grn{background:#2f6a2a;border-color:#62b452 #1c4418 #163612 #4a9440;color:#e8ffd0;text-shadow:.1em .1em 0 #0c2408}
.btn.blu{background:#2a3f7a;border-color:#5a78c8 #16244a #101c3a #4a64b0;color:#dce8ff;text-shadow:.1em .1em 0 #0a1028}
.btn.left{text-align:left;width:100%}
.row{display:flex;flex-wrap:wrap;gap:.8em 1em;justify-content:center;align-items:stretch;max-width:100%}
.row>.btn{margin:.3em 0}
/* ---- каменная плита и карточки ---- */
.panel{background:var(--stone);border:.2em solid;border-color:#52467a var(--edge2) var(--edge2) var(--edge);padding:.9em 1.3em;max-width:62em;width:100%;pointer-events:auto;text-align:left;
  box-shadow:.2em 0 0 var(--ink),-.2em 0 0 var(--ink),0 .2em 0 var(--ink),0 -.2em 0 var(--ink),0 .7em 0 rgba(0,0,0,.35)}
.panel.c{text-align:center}
.card{background:var(--stone2);border:.2em solid;border-color:#52467a var(--edge2) var(--edge2) var(--edge);padding:.7em .9em .8em;width:22em;text-align:left;cursor:pointer;pointer-events:auto;position:relative;
  box-shadow:.2em 0 0 var(--ink),-.2em 0 0 var(--ink),0 .2em 0 var(--ink),0 -.2em 0 var(--ink),0 .6em 0 rgba(0,0,0,.35)}
.card:active{transform:translateY(.2em)}
.card.sel{border-color:#ffe27a var(--gold2) var(--gold2) var(--gold);background:#332a1c}
.card.off{opacity:.45;pointer-events:none}
.card .t{margin-bottom:.4em;color:var(--gold)}
.card .d{color:#b8aed6}
.card .p{margin-top:.5em;color:var(--gold)}
.card img,.pix{image-rendering:pixelated;image-rendering:crisp-edges}
.tag{display:inline-block;padding:.1em .5em .2em;border:.1em solid currentColor;margin-bottom:.5em}
.lbl{display:flex;justify-content:space-between;align-items:center;gap:1.5em;margin:.6em 0}
.kv{display:flex;justify-content:space-between;margin:.3em 0;gap:2em}
.kv b{color:var(--gold)}
/* ---- поля ввода ---- */
input,textarea{font:inherit;color:inherit}
input[type=range]{-webkit-appearance:none;appearance:none;width:15em;height:2em;background:transparent;pointer-events:auto;touch-action:pan-y;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:.8em;background:var(--ink);border:.2em solid var(--edge)}

<script>
'use strict';
/* =====================================================================
   ЭМБЕРХОЛЛ: ХРАНИТЕЛЬ ТИШИНЫ — top-down roguelike shooter
   Часть 1: утилиты, CONFIG, сохранение, звук, ввод, спрайты, частицы, пули
   ===================================================================== */
const W=480,H=270,TS=16,RW=26,RH=15,RPX=RW*TS,RPY=RH*TS,OX=(W-RPX)/2,OY=(H-RPY)/2,TAU=Math.PI*2;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);

const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b,c,d)=>Math.hypot(c-a,d-b);
const ang=(x1,y1,x2,y2)=>Math.atan2(y2-y1,x2-x1);
const chance=p=>Math.random()<p;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- Баланс и настройки (всё в одном месте) ---------- */
const CONFIG={
  /* eRegen — энергии в секунду; eRegenFire — какая доля от этого идёт, пока герой стреляет оружием, которое тратит энергию */
  player:{speed:1.55,dashSpeed:4.4,dashFrames:11,dashCd:52,hitInv:55,armorDelay:240,armorTick:125,eRegen:2.4,eRegenFire:.4,r:5,dodgeInv:20,blockInv:40,shieldInv:25,swapT:10},

  /* забег: роли этажей внутри главы и главы по порядку.

  run:{floors:['normal','guard','normal','boss'],
    chapters:[{bio:['forest','swamp','grove','grave'],shards:['guard','boss']},{bio:['mines','ice','lava','flood'],shards:['guard','boss'],ach:'ch2'},{bio:['citadel','library','clock','voidg'],shards:['guard'],ach:'ch3'}],

  floor:{grid:5,rooms:[7,10],branch:.7,loop:.22,treasure:.5,event:.75,
    /* опасности боевой комнаты: шипы, огонь (с этажа scale.fireFrom), лужи */
    spike:{p:.55,n:[1,3]},fire:{p:.5},slow:{p:.5,n:[1,2],r:[18,28]}},

  haz:{gas:{cyc:240,warn:150,up:190,r:15,dmg:1.2,p:.7,n:[1,2]},grasp:{cyc:170,warn:110,up:140,r:9,dmg:1.5,p:.7,n:[2,3]},icefall:{cyc:200,warn:120,up:186,r:12,dmg:2,p:.75,n:[2,3]},
    lava:{cyc:210,warn:110,up:150,r:11,dmg:1.5,p:.75,n:[1,3]},spark:{cyc:150,warn:88,up:120,r:14,dmg:1.5,p:.7,n:[1,2]},rune:{cyc:260,warn:170,up:240,r:18,dmg:2,p:.7,n:[1,2]},

    hp:(f,ch)=>4.3*Math.pow(1.045,f),dmg:(f,ch)=>1.15+ch*.22,bossHp:(f,ch)=>Math.pow(1.16,f),

  combat:{critBase:.05,critMul:1.8,minCd:2,noEnergyCd:14,spawnT:38,
    fire:{t:170,every:20,dmg:1.6},poison:{t:260,every:15,dmg:.9},freeze:{t:150,slow:.4},stun:{t:60},
    guard:{arc:1.1,mul:.3,turn:.03},blast:{near:.5,far:.7,kb:3,obs:20},
    trap:{dmg:1.5,r:[8,9],spike:[150,90,110],fire:[180,80,100,150]},slow:.55,xbarrel:{r:46,dmg:30},
    laser:300,chain:{range:230,cone:1.1,near:150,hop:85,fall:.08},life:{gun:80,nade:46,boom:74},flamePierce:3,
    relic:{thornsR:38,auraR:52,auraEvery:20,orbitR:22,orbitEvery:12,orbitDmg:5,dashR:50,dashStun:.4,boomR:30,echoDelay:7,

const Save={
  /* key — ключ текущего сохранения: у гостя прежний, у аккаунта свой (его выставляет Acc) */

    /* дела дня, рекорды, коллекция, ранг (шаг Д): daily — серия входов, quests — задания дня (base — значение счётчика на начало дня),
       rec — рекорды забегов, codex.paid — сколько наград за коллекцию получено, rankPaid — до какого ранга выданы награды (0 — ещё не считали) */
    daily:{last:'',streak:0,best:0},quests:{day:'',list:[],claimed:[0,0,0],told:[0,0,0],bonus:0},rec:{kills:0,fast:0,streak:0,bestStreak:0},codex:{paid:0},rankPaid:0,
    story:{intro:false,seen:{},endA:false,endB:false,boss:{},camp:0,shards:0},
    opts:{music:.7,sfx:.8,shake:1,dmgnum:true,sens:1,layout:'both',muted:false,tsize:1,lefty:false,vib:true,lite:false}}},
  /* миграции старых сохранений: mig[v] переводит запись версии v в v+1.
     Выполняются до merge, потому что merge не сливает массивы, а заменяет их целиком */
  mig:{
    /* 1 → 2: победы над боссами хранятся по id босса, а не по номеру главы */
    1(o){const s=o.story;if(s&&Array.isArray(s.boss)){const b=s.boss;s.boss={};['tree','colossus','oren'].forEach((id,i)=>{if(b[i])s.boss[id]=true})}}
  },
  migrate(o){const top=this.def().v;let v=Math.floor(+o.v)||1;for(;v<top;v++)if(this.mig[v])this.mig[v](o);if(!(o.v>=v))o.v=v;return o},
  load(){let raw=null;try{raw=localStorage.getItem(this.key)}catch(e){this.ok=false}
    const d=this.def();
    if(raw){try{const o=this.migrate(JSON.parse(raw));this.d=this.merge(d,o);this.clean()}catch(e){this.d=this.def()}}else this.d=d;
    return this.d},
  merge(a,b){if(b===undefined||b===null)return a;if(typeof a!=='object'||Array.isArray(a)||a===null)return a===null||typeof a===typeof b?b:a;
    for(const k in b){if(k in a&&typeof a[k]==='object'&&!Array.isArray(a[k]))a[k]=this.merge(a[k],b[k]);else a[k]=b[k]}return a},
  /* после загрузки: чего в этой версии игры нет — сбрасываем к безопасным значениям */
  clean(){const d=this.d,s=d.story;if(!CHARS[d.char])d.char='knight';if(!PETS.some(p=>p.id===d.pet))d.pet=null;if(!CONFIG.diff[d.diff])d.diff='normal';
    if(!s.boss||typeof s.boss!=='object'||Array.isArray(s.boss))s.boss={};
    /* дела дня: испорченные записи — к значениям по умолчанию */
    const D=this.def(),q=d.quests;if(!q||!Array.isArray(q.list)||!Array.isArray(q.claimed)||!Array.isArray(q.told)||q.list.some(x=>!x||typeof x.k!=='string'||!(x.n>0)))d.quests=D.quests;
    if(!d.stats.bk||typeof d.stats.bk!=='object'||Array.isArray(d.stats.bk))d.stats.bk={};
    if(typeof d.daily.last!=='string'||!(d.daily.streak>=0))d.daily=D.daily;if(!(d.codex.paid>=0))d.codex=D.codex;if(!(d.rankPaid>=0))d.rankPaid=0},
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.d));this.ok=true}catch(e){this.ok=false}},
  reset(){const o=this.d.opts;this.d=this.def();this.d.opts=o;this.save()}
};

const SCALES={min:[0,2,3,5,7,8,10],maj:[0,2,4,5,7,9,11],phr:[0,1,3,5,7,8,10],hmin:[0,2,3,5,7,8,11]};
const TRACKS={

  ch0:{bpm:112,root:50,sc:'min',seed:11,dens:.6},ch1:{bpm:118,root:48,sc:'phr',seed:19,dens:.62},

  v_ice:{bpm:110,root:55,sc:'min',seed:67,dens:.52},v_lava:{bpm:128,root:45,sc:'phr',seed:71,dens:.68},v_flood:{bpm:108,root:50,sc:'min',seed:73,dens:.56},
  v_library:{bpm:100,root:52,sc:'hmin',seed:79,dens:.5},v_clock:{bpm:132,root:50,sc:'min',seed:83,dens:.7},v_void:{bpm:92,root:49,sc:'phr',seed:89,dens:.48}
};
class GameAudio{
  constructor(){this.ctx=null;this.muted=false;this.vm=.7;this.vs=.8;this.name=null;this.tr=null;this.step=0;this.nextT=0;this.last={};this.timer=null}
  init(){
    if(this.ctx)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      this.ctx=new AC();const c=this.ctx;
      this.master=c.createGain();this.sg=c.createGain();this.mg=c.createGain();
      this.sg.connect(this.master);this.mg.connect(this.master);this.master.connect(c.destination);
      const len=c.sampleRate*1,buf=c.createBuffer(1,len,c.sampleRate),da=buf.getChannelData(0);
      for(let i=0;i<len;i++)da[i]=Math.random()*2-1;this.nb=buf;
      this.apply();this.nextT=c.currentTime+.1;
      this.timer=setInterval(()=>this.tick(),30);
    }catch(e){this.ctx=null}
  }
  resume(){if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{})}
  apply(){if(!this.ctx)return;this.master.gain.value=this.muted?0:1;this.sg.gain.value=this.vs*.55;this.mg.gain.value=this.vm*.26}
  setMuted(m){this.muted=m;this.apply()}
  tone(f,d,type='square',v=.3,slide=0,at=0,dest=null){
    const c=this.ctx;if(!c)return;const t=at||c.currentTime;
    const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,f),t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
    o.connect(g);g.connect(dest||this.sg);o.start(t);o.stop(t+d+.02);
  }
  noise(d,v=.3,fc=2000,at=0,dest=null,hp=false){
    const c=this.ctx;if(!c)return;const t=at||c.currentTime;
    const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=fc;
    const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
    s.connect(f);f.connect(g);g.connect(dest||this.sg);s.start(t,Math.random()*.5);s.stop(t+d+.02);
  }
  sfx(n,loc){
    if(NET.rec&&!loc)NET.cos.push(['s',n]);
    if(!this.ctx||this.muted)return;const now=performance.now();
    if(this.last[n]&&now-this.last[n]<(n==='hit'||n==='shoot'?35:60))return;this.last[n]=now;
    switch(n){
      case 'shoot':this.tone(520+Math.random()*80,.07,'square',.16,-300);break;
      case 'shootBig':this.tone(180,.14,'sawtooth',.22,-110);this.noise(.1,.15,1600);break;
      case 'laser':this.tone(1100,.12,'sawtooth',.12,-800);break;
      case 'flame':this.noise(.08,.1,900);break;
      case 'swing':this.noise(.1,.18,3000,0,null,true);this.tone(300,.08,'triangle',.1,200);break;
      case 'zap':this.tone(900,.1,'square',.12,500);this.noise(.1,.12,4000,0,null,true);break;
      case 'eshoot':this.tone(330,.08,'triangle',.12,-120);break;
      case 'hit':this.tone(160,.05,'square',.12,-60);break;
      case 'crit':this.tone(700,.09,'square',.18,500);break;
      case 'kill':this.tone(240,.16,'sawtooth',.18,-190);this.noise(.14,.14,1200);break;
      case 'hurt':this.tone(140,.25,'sawtooth',.28,-100);this.noise(.2,.2,700);break;
      case 'coin':this.tone(988,.06,'square',.12);this.tone(1318,.12,'square',.12,0,this.ctx.currentTime+.06);break;
      case 'pick':this.tone(660,.08,'triangle',.2);this.tone(880,.1,'triangle',.2,0,this.ctx.currentTime+.08);break;
      case 'dash':this.noise(.14,.16,2500,0,null,true);break;
      case 'skill':this.tone(220,.3,'sawtooth',.2,500);break;
      case 'boom':this.noise(.5,.4,500);this.tone(90,.4,'sine',.35,-60);break;
      case 'door':this.tone(110,.3,'square',.2,-30);this.noise(.2,.12,400);break;
      case 'chest':this.tone(523,.1,'square',.15);this.tone(659,.1,'square',.15,0,this.ctx.currentTime+.1);this.tone(784,.2,'square',.15,0,this.ctx.currentTime+.2);break;
      case 'ui':this.tone(600,.05,'square',.1);break;
      case 'bossRoar':this.tone(70,.9,'sawtooth',.35,-30);this.noise(.8,.3,300);break;
      case 'tele':this.tone(1200,.2,'sine',.15,-900);break;
      case 'heal':this.tone(520,.1,'triangle',.18);this.tone(780,.2,'triangle',.18,0,this.ctx.currentTime+.1);break;
      case 'win':[523,659,784,1046].forEach((f,i)=>this.tone(f,.25,'square',.18,0,this.ctx.currentTime+i*.14));break;
      case 'lose':[392,330,262,196].forEach((f,i)=>this.tone(f,.35,'sawtooth',.2,0,this.ctx.currentTime+i*.22));break;
      case 'type':this.tone(900+Math.random()*200,.02,'square',.04);break;
      case 'ach':[784,988,1175].forEach((f,i)=>this.tone(f,.15,'triangle',.2,0,this.ctx.currentTime+i*.09));break;
      case 'empty':this.tone(120,.05,'square',.1);break;
    }
  }
  compile(name){
    const t=TRACKS[name];if(!t)return null;const r=mulberry(t.seed),sc=SCALES[t.sc];
    const prog=[[0,0,5,3],[0,5,3,4],[0,3,5,4],[0,5,2,4]][t.seed%4];
    const mel=[],bass=[];let deg=4;
    for(let s=0;s<64;s++){
      const ch=prog[Math.floor(s/16)];
      if(r()<t.dens&&(s%2===0||r()<.4)){deg=clamp(deg+Math.floor(r()*5)-2,0,10);mel.push(deg)}else mel.push(-1);
      bass.push(s%4===0?ch:(s%4===2&&r()<.5?ch+4:-1));
    }
    return{t,sc,mel,bass,prog};
  }
  play(name){
    if(this.name===name)return;this.name=name;this.tr=name?this.compile(name):null;this.step=0;
    if(this.ctx)this.nextT=this.ctx.currentTime+.08;
  }
  nf(root,sc,deg){const o=Math.floor(deg/7),d=((deg%7)+7)%7;return 440*Math.pow(2,(root+sc[d]+12*o-69)/12)}
  tick(){
    if(!this.ctx||!this.tr||this.ctx.state!=='running')return;
    const ct=this.ctx.currentTime;if(this.nextT<ct-.5)this.nextT=ct;
    while(this.nextT<ct+.14){this.pstep(this.step,this.nextT);this.nextT+=60/this.tr.t.bpm/4;this.step=(this.step+1)%64}
  }
  pstep(s,at){
    const T=this.tr,t=T.t,sd=60/t.bpm/4;
    const m=T.mel[s];if(m>=0)this.tone(this.nf(t.root+12,T.sc,m),sd*1.7,'square',.22,0,at,this.mg);
    const b=T.bass[s];if(b>=0)this.tone(this.nf(t.root-12,T.sc,b),sd*3,'triangle',.5,0,at,this.mg);
    const fast=t.bpm>140;
    if(s%8===0||(fast&&s%8===6))this.tone(120,.12,'sine',.6,-80,at,this.mg);
    if(s%8===4)this.noise(.1,.25,2500,at,this.mg);
    if(s%2===0)this.noise(.03,.07,7000,at,this.mg,true);
  }
}

  const full=!!def.full,w=full?mx:Math.max(hw*2,mx),g=[];
  for(const r of rows){const line=new Array(w).fill(null);
    if(full||r.length===w&&r.length!==hw){for(let x=0;x<r.length;x++)if(r[x]!=='.')line[x]=r[x]}
    else for(let x=0;x<hw;x++){const ch=r[x];if(ch==='.')continue;line[x]=ch;line[w-1-x]=ch}
    g.push(line)}

    while(g.length<p.y+p.r.length)g.push(new Array(W).fill(null));

  per(){return CONFIG.run.floors.length},
  n(){return CONFIG.run.chapters.length*this.per()},
  ch(f){return Math.floor(f/this.per())},
  pos(f){return f%this.per()},

  first(ch){return ch*this.per()},
  last(f){return f===this.n()-1},
  /* даёт ли этаж осколок; сколько осколков за весь забег (или до главы ch — столько «уже есть» при старте с неё) */
  shard(f){const c=CONFIG.run.chapters[this.ch(f)];return !!c&&c.shards.includes(this.role(f))},
  shards(ch){let n=0;const e=ch===undefined?this.n():this.first(ch);for(let f=0;f<e;f++)if(this.shard(f))n++;return n},

  /* биом каждого этажа забега: этаж босса — в основном биоме главы, остальные этажи — её разновидности в случайном порядке;

class Room{
  constructor(gx,gy,type){

    this.wave=0;this.waves=[];this.exit=false;this.items=[];this.dist=0;this.noHit=true;
  }
  doorTiles(){
    const t=[];
    if(this.doors.n)t.push([12,0,'n'],[13,0,'n']);if(this.doors.s)t.push([12,RH-1,'s'],[13,RH-1,'s']);
    if(this.doors.w)for(let y=6;y<=8;y++)t.push([0,y,'w']);if(this.doors.e)for(let y=6;y<=8;y++)t.push([RW-1,y,'e']);
    return t;
  }
  setLock(l){this.locked=l;for(const d of this.dt)this.grid[d[1]*RW+d[0]]=l?3:0}
  nearDoor(tx,ty){
    if(this.doors.n&&ty<=3&&tx>=10&&tx<=15)return true;if(this.doors.s&&ty>=RH-4&&tx>=10&&tx<=15)return true;
    if(this.doors.w&&tx<=3&&ty>=5&&ty<=9)return true;if(this.doors.e&&tx>=RW-4&&ty>=5&&ty<=9)return true;return false;
  }
  free(tx,ty){return tx>=1&&ty>=1&&tx<RW-1&&ty<RH-1&&this.grid[ty*RW+tx]===0&&!this.nearDoor(tx,ty)}
  addObs(tx,ty,k){if(!this.free(tx,ty))return false;this.grid[ty*RW+tx]=2;this.obs.push({tx,ty,k,hp:OBS_HP[k],flash:0});return true}
  build(theme,f){
    this.built=true;this.theme=theme;this.grid=new Uint8Array(RW*RH);
    for(let y=0;y<RH;y++)for(let x=0;x<RW;x++)if(x===0||y===0||x===RW-1||y===RH-1)this.grid[y*RW+x]=1;
    this.dt=this.doorTiles();for(const d of this.dt)this.grid[d[1]*RW+d[0]]=0;
    const combat=['combat','miniboss','boss'].includes(this.type);

      const lay=rndi(0,4);
      if(lay===0){const n=rndi(7,12);for(let i=0;i<n;i++)this.addObs(rndi(2,RW-3),rndi(2,RH-3),chance(.3)?solid:pick(dest))}
      else if(lay===1){[[7,4],[18,4],[7,10],[18,10]].forEach(p=>this.addObs(p[0],p[1],solid));for(let i=0;i<5;i++)this.addObs(rndi(3,RW-4),rndi(3,RH-4),pick(dest))}
      else if(lay===2){for(let x=11;x<=14;x++)for(let y=6;y<=8;y++)if((x+y)%2===0)this.addObs(x,y,solid);for(let i=0;i<4;i++)this.addObs(rndi(3,RW-4),rndi(3,RH-4),pick(dest))}
      else if(lay===3){for(let x=5;x<=20;x++){if(x%5!==0){this.addObs(x,4,pick(dest));this.addObs(x,10,pick(dest))}}this.addObs(12,7,solid);this.addObs(13,7,solid)}
      else{this.addObs(3,3,'xbarrel');this.addObs(22,3,'xbarrel');this.addObs(3,11,'xbarrel');this.addObs(22,11,'xbarrel');for(let i=0;i<4;i++)this.addObs(rndi(4,RW-5),rndi(3,RH-4),solid)}
      // ловушки
      const FL=CONFIG.floor,ns=chance(FL.spike.p)?rndi(FL.spike.n[0],FL.spike.n[1]):0;
      for(let i=0;i<ns;i++){const tx=rndi(3,RW-4),ty=rndi(3,RH-4);if(this.free(tx,ty))this.traps.push({k:'spike',x:tx*TS+8,y:ty*TS+8,ph:rndi(0,150)})}
      if(f>=CONFIG.scale.fireFrom&&chance(FL.fire.p)){const tx=rndi(3,RW-4),ty=rndi(3,RH-4);if(this.free(tx,ty))this.traps.push({k:'fire',x:tx*TS+8,y:ty*TS+8,ph:rndi(0,180)})}
      const nz=(chance(FL.slow.p)?rndi(FL.slow.n[0],FL.slow.n[1]):0)+(bio.slowN||0);
      for(let i=0;i<nz;i++)this.slows.push({x:rndi(60,RPX-60),y:rndi(50,RPY-50),r:rnd(FL.slow.r[0],FL.slow.r[1])});
      /* опасность пола биома (не ближе полутора тайлов к другой ловушке) */
      const HZ=bio.haz&&CONFIG.haz[bio.haz];
      if(HZ&&chance(HZ.p)){const n=rndi(HZ.n[0],HZ.n[1]);for(let i=0;i<n;i++){const tx=rndi(3,RW-4),ty=rndi(3,RH-4),hx=tx*TS+8,hy=ty*TS+8;
        if(this.free(tx,ty)&&!this.traps.some(t=>Math.abs(t.x-hx)<24&&Math.abs(t.y-hy)<24))this.traps.push({k:bio.haz,x:hx,y:hy,ph:rndi(0,HZ.cyc-1)})}}
    } else if(this.type==='boss'){
      [[4,3],[21,3],[4,11],[21,11]].forEach(p=>this.addObs(p[0],p[1],solid));
    } else if(this.type==='treasure'||this.type==='shop'||this.type==='event'||this.type==='rest'){
      [[3,3],[22,3],[3,11],[22,11]].forEach(p=>this.addObs(p[0],p[1],chance(.5)?'crate':'barrel'));
    }
    this.renderBG();
  }
  renderBG(){this.bg=paintRoom(this)}
}

/* ---------- Генерация этажа (сетка и число комнат — CONFIG.floor) ---------- */
function genFloor(f){
  const C=CONFIG.floor,N=rndi(C.rooms[0],C.rooms[1]),mid=Math.floor(C.grid/2),key=(x,y)=>x+','+y,map=new Map(),list=[];
  const start=new Room(mid,mid,'start');map.set(key(mid,mid),start);list.push(start);
  let guard=0;
  while(list.length<N&&guard++<500){
    const base=pick(list),d=pick(DIRS),nx=base.gx+d[0],ny=base.gy+d[1];
    if(nx<0||ny<0||nx>=C.grid||ny>=C.grid||map.has(key(nx,ny)))continue;
    let nb=0;for(const dd of DIRS)if(map.has(key(nx+dd[0],ny+dd[1])))nb++;
    if(nb>1&&chance(C.branch))continue;
    const r=new Room(nx,ny,'combat');map.set(key(nx,ny),r);list.push(r);base.doors[d[2]]=true;r.doors[d[3]]=true;
  }
  for(const r of list)for(const d of DIRS){const o=map.get(key(r.gx+d[0],r.gy+d[1]));if(o&&!r.doors[d[2]]&&chance(C.loop)){r.doors[d[2]]=true;o.doors[d[3]]=true}}
  // BFS по дверям
  const q=[start];start.dist=0;const seen=new Set([start]);
  while(q.length){const r=q.shift();for(const d of DIRS)if(r.doors[d[2]]){const o=map.get(key(r.gx+d[0],r.gy+d[1]));if(o&&!seen.has(o)){seen.add(o);o.dist=r.dist+1;q.push(o)}}}
  const deg=r=>DIRS.filter(d=>r.doors[d[2]]).length;
  const others=list.filter(r=>r!==start);
  others.sort((a,b)=>b.dist-a.dist||(deg(a)-deg(b)));
  const exit=others[0];exit.exit=true;
  exit.type={boss:'boss',guard:'miniboss'}[ROUTE.role(f)]||'combat';
  const cand=shuffle(others.filter(r=>r!==exit&&deg(r)===1).concat(shuffle(others.filter(r=>r!==exit&&deg(r)>1))));
  const specials=['shop','rest'];if(chance(C.treasure))specials.unshift('treasure');if(chance(C.event))specials.push('event');
  specials.forEach((t,i)=>{if(cand[i])cand[i].type=t});
  return{rooms:list,map,start,exit};
}

/* ---------- Оружие ---------- */
function rollRarity(def,f,luck){
  if(def.legend)return 5;
  const w=CONFIG.scale.rar(f,luck).map(v=>Math.max(.05,v));
  let s=w.reduce((a,b)=>a+b,0),r=Math.random()*s,i=0;for(;i<6;i++){r-=w[i];if(r<=0)break}
  return clamp(i,def.minR,def.maxR);
}
function randWeaponDef(f,exclude){
  if(f>=CONFIG.scale.legendFrom&&chance(CONFIG.scale.legendCh)){return pick(WP.filter(w=>w.legend))}
  const c=WP.filter(w=>!w.legend&&w.minR<=CONFIG.scale.minR(f)&&w.id!==exclude);return pick(c);
}
class Weapon{
  constructor(def,rar,nm){
    const WC=CONFIG.weapon;
    this.def=def;this.rar=rar;this.dmg=def.d*(1+WC.rarDmg*rar);this.rate=def.r*(1-WC.rarRate*rar);this.spread=def.s;this.cost=def.c;
    this.fx=Object.assign({},def.fx||{});this.pierce=def.pierce||0;this.bounce=def.bounce||0;this.homing=def.homing||0;this.np=def.np;
    this.life=def.life||0;this.crit=def.crit||0;this.cd=0;this.mods=[];this.swing=1;this.shots=0;
    /* am — запас метательного, heat/lock — нагрев и запертость луча, ch — накопленный заряд */
    this.am=def.am||0;this.amT=0;this.heat=0;this.lock=0;this.hT=0;this.ch=0;
    if(nm===undefined)nm=rar>=WC.modsFrom?2:chance(WC.modP[rar>=1?1:0])?1:0;
    const pool=shuffle(WMODS.slice());
    for(let i=0;i<nm&&i<pool.length;i++){const m=pool[i];if((def.nomod||WMOD_NO[def.k]||[]).includes(m.id)){nm++;continue}m.f(this);this.mods.push(m.n)}
    /* nm — название без закалки, d0 — урон без закалки */
    this.nm=def.n+(this.mods.length?' «'+this.mods.join(', ')+'»':'');this.d0=this.dmg;this.lvl=0;this.name=this.nm;
  }
  /* закалка: каждый уровень прибавляет урон; уровень пишется перед названием, чтобы не обрезался в интерфейсе */
  setLvl(l){this.lvl=l;this.dmg=this.d0*(1+CONFIG.weapon.lvl.dmg*l);this.name=(l?'+'+l+' ':'')+this.nm}
  static make(f,luck,id,rar){const def=id?WP_BY[id]:randWeaponDef(f,null);return new Weapon(def,rar!==undefined?rar:rollRarity(def,f,luck||0))}
}

/* все ключи mods (прибавки от реликвий, улучшений и питомцев). Новый ключ — сюда, иначе в расчётах будет NaN */
const MODS0={dmg:0,crit:0,rate:0,speed:0,hp:0,armor:0,gold:0,spread:0,lifesteal:0,fire:0,poison:0,freeze:0,stun:0,bounce:0,pierce:0,homing:0,echo:0,energy:0,eregen:0,

class Player{
  /* prof — профиль сетевого напарника {char,upg,pet}; у своего героя null (всё берётся из сохранения) */
  constructor(cid,prof){
    const c=CHARS[cid];this.cid=cid;this.c=c;this.x=RPX/2;this.y=RPY/2+20;this.r=CONFIG.player.r;this.vx=0;this.vy=0;
    this.prof=prof||null;this.remote=false;this.mirror=false;this.idx=0;this.pet=null;this.near=null;this.rev=0;this.pseq=0;this.linv=0;this.kdT=0;this.skLock=0;
    this.inp={mx:0,my:0,fire:false,dash:false,swap:false,skill:false,use:false};
    this.spr=mkSpr(c.sh,c.pal);this.relics=[];this.weapons=[null,null];this.cur=0;
    this.dashT=0;this.dashCd=0;this.dashA=0;this.inv=0;this.flash=0;this.face=1;this.aim=0;this.anim=0;this.moving=false;
    this.skillCd=0;this.skillT=0;this.skillBuff=0;this.armorT=0;this.armorTk=0;this.swapT=0;this.gold=0;this.cry=0;this.revived=false;
    this.sh=0;this.shTimer=0;this.revN=0;this.f2=0;this.gauge=0;this.recoil=0;this.mods={};this.hp=1;this.maxHp=1;this.armor=0;this.maxArmor=0;this.energy=0;this.maxEnergy=0;
    this.recalc();this.hp=this.maxHp;this.armor=this.maxArmor;this.energy=this.maxEnergy;this.dead=false;
  }
  get w(){return this.weapons[this.cur]}
  get upg(){return this.prof&&this.prof.upg?this.prof.upg:Save.d.upg}
  get petId(){return this.prof?(this.prof.pet||null):Save.d.pet}
  recalc(){
    if(this.mirror)return; /* у гостя параметры героя считает хост */
    const m=Object.assign({},MODS0);
    for(const r of this.relics)for(const k in r.m)m[k]+=r.m[k];
    const u=this.upg;for(const d of UPGR)if(d.m)for(const k in d.m)m[k]+=d.m[k]*(u[d.id]||0);
    const pd=this.petId&&PETS.find(q=>q.id===this.petId);if(pd&&pd.m)for(const k in pd.m)m[k]+=pd.m[k];
    if(this.relics.some(r=>r.syn==='steam')){const wf=this.weapons.some(w=>w&&w.fx.fire),wi=this.weapons.some(w=>w&&w.fx.freeze);if((m.fire>0||wf)&&(m.freeze>0||wi))m.dmg+=CONFIG.combat.relic.steam}
    const CP=CONFIG.caps;for(const k in CP)if(m[k]>CP[k])m[k]=CP[k];
    this.mods=m;const oh=this.maxHp,oa=this.maxArmor,oe=this.maxEnergy;
    this.maxHp=Math.max(2,this.c.hp+m.hp);this.maxArmor=Math.max(0,this.c.ar+m.armor);this.maxEnergy=Math.max(30,this.c.en+m.energy);
    if(this.hp>this.maxHp)this.hp=this.maxHp;if(this.hp<=0&&oh>0&&!this.dead)this.hp=1;
    if(this.maxHp>oh&&oh>0)this.hp+=this.maxHp-oh;if(this.maxArmor>oa&&oa>0)this.armor+=this.maxArmor-oa;if(this.maxEnergy>oe&&oe>0)this.energy+=this.maxEnergy-oe;
    this.armor=Math.min(this.armor,this.maxArmor);this.energy=Math.min(this.energy,this.maxEnergy);this.hp=Math.min(this.hp,this.maxHp);
  }
  heal(n){if(this.hp>=this.maxHp)return false;this.hp=Math.min(this.maxHp,this.hp+n);PT.text(this.x,this.y-14,'+'+(Math.round(n*10)/10),'#6aff8a',7);A.sfx('heal');
    PT.emit(this.x,this.y,{n:8,spd:1,col:'#6aff8a',life:30,add:true,grav:-.04});return true}
  /* восстановление «само по себе» (вампиризм, зона алхимика, дух-целитель): только пока идёт бой
     и не больше heal.roomCap за комнату и heal.floorCap за этаж — иначе здоровье можно набирать, просто выжидая */
  regen(n){
    const r=G.room,run=G.run,H=CONFIG.heal;if(!r||!run||!r.locked||this.dead||this.hp>=this.maxHp)return false;
    const k=this.idx,a=(r.hl=r.hl||{}),b=(run.hl=run.hl||{}),left=Math.min(H.roomCap-(a[k]||0),H.floorCap-(b[k]||0));
    if(left<=0)return false;n=Math.min(n,left);a[k]=(a[k]||0)+n;b[k]=(b[k]||0)+n;return this.heal(n);
  }
  addEnergy(n){this.energy=Math.min(this.maxEnergy,this.energy+n)}
  /* o.net — попадание сообщил сам сетевой напарник (он проверяет попадания у себя, с учётом своего рывка) */
  hurt(n,o){
    o=o||{};
    if(this.dead||G.state==='scene')return false;
    if(this.remote&&!o.net)return false;
    if(this.inv>(o.net?6:0))return false;
    if(this.dashT>0&&!o.net)return false;
    const m=this.mods,me=this===G.p,PC=CONFIG.player,RC=CONFIG.combat.relic;
    if(chance(m.dodge)){PT.text(this.x,this.y-14,'УКЛОН','#9ad8ff',7);this.inv=PC.dodgeInv;return false}
    if(this.shTimer<=0&&this.petId==='beetle'){this.shTimer=CONFIG.pet.beetle.cd;PT.text(this.x,this.y-14,'БЛОК','#a8a8b8',7);this.inv=PC.blockInv;A.sfx('hit');return false}
    /* щит Стража гасит столько урона, сколько в нём осталось; остаток удара проходит дальше */
    if(this.sh>0){const ab=Math.min(this.sh,n);this.sh-=ab;n-=ab;PT.emit(this.x,this.y,{n:6,spd:1.5,col:'#8ad8ff',add:true,life:20});if(n<=.001){this.inv=PC.shieldInv;A.sfx('hit');return false}}
    n*=(1+m.taken);
    let a=Math.min(this.armor,n);this.armor-=a;n-=a;this.hp-=n;
    this.inv=CONFIG.player.hitInv;this.armorT=CONFIG.player.armorDelay;this.flash=8;

    /* окно найденной записки открывается через 24 кадра, если в этот момент нет другого окна (кадровый счётчик вместо setTimeout) */
    if(this.noteT>0&&--this.noteT===0&&!this.modal&&!this.dlgOpen)UI.note(this.noteI);
    if(this.fadeDir!==0){this.fade=clamp(this.fade+this.fadeDir*.07,0,1);if(this.fade>=1&&this.fadeDir>0){this.fadeDir=0;this.fadeHold=0;const cb=this.fadeCb;this.fadeCb=null;if(cb)cb()}else if(this.fade<=0&&this.fadeDir<0)this.fadeDir=0}

  updatePlay(blocked){

    this.tgs=this.players.filter(q=>!q.dead&&!q.remote);
    for(const q of this.players.slice()){if(!q.remote)this.readInput(q,blocked);this.updatePlayer(q)}
    for(const e of this.enemies)e.update();
    this.enemies=this.enemies.filter(e=>!e.dead);
    this.updateBullets();this.updateZones();this.updateAreas();this.updateTraps();this.updateAllies();this.updatePets();this.updateItems();this.updateFx();

  /* ---------- твёрдые тайлы ---------- */

    /* призванные враги (миньоны шаманов, магов и боссов) добычи не дают: призыв бесконечен, и на нём можно было набивать золото и сердца.

          if(chance(GB.win)){const w=Weapon.make(this.floorIdx+CONFIG.scale.gambler,p.mods.luck,null,undefined);this.spawnItem('weapon',it.x,it.y+24,0,w);this.tell(p,'Повезло!');A.sfx('win')}else{this.tell(p,'Кости не легли...');this.sfxTo(p,'empty')}}},{t:'Отказаться',fn:()=>{}}]);break}

  /* закалка оружия в руках. Наковальня лавки (sure=false): сколько угодно попыток, но с уровнем растут цена и риск неудачи.
     Горн-событие (sure=true): один раз, наверняка и дешевле. Окно у сетевого напарника открывается через choiceFor */
  temper(it,p,sure){

    if(w.lvl>=L.max){this.tell(p,'Это оружие уже закалено до предела (+'+L.max+')');return}
    const cost=this.price(p,{raw:L.cost(w.lvl,w.rar)*CONFIG.scale.shop(this.floorIdx)*(sure?L.forge:1)}),ch=sure?1:L.chance[w.lvl];
    this.choiceFor(p,sure?'Горн':'Наковальня',(sure?'Раскалённый горн. Тень кузнеца закалит оружие наверняка — но только одно и только раз.':'Кузнец берётся закалить оружие. Чем выше закалка, тем дороже работа и тем чаще металл её не принимает.')+' В руках: '+w.name+'.',[
      {t:'Закалить до +'+(w.lvl+1)+' (+'+Math.round(L.dmg*100)+'% урона) — '+cost+' зол.'+(ch<1?', шанс '+Math.round(ch*100)+'%':''),fn:()=>{

        else{this.sfxTo(p,'empty');this.tell(p,'Металл не принял закалку. Золото потрачено.',true);PT.emit(p.x,p.y-6,{n:10,spd:1.6,col:'#888',life:22})}
        if(p===this.p)this.checkAch()}},
      {t:'Уйти',fn:()=>{}}]);

  pickWeapon(it,p){

    this.room.items=this.room.items.filter(i=>i!==it);this.sfxTo(p,'pick');this.tell(p,w.name,false);p.recalc();
    if(p===this.p){Save.d.stats.weapons[w.def.id]=1;this.checkAch()}else NET.send(['m','wpn',w.def.id]);
  }
  openChest(it,p){
    it.used=true;A.sfx('chest');PT.emit(it.x,it.y-6,{n:20,spd:2.4,col:'#ffd34d',life:30,add:true});this.shake(2);

    else if(k==='supply'){this.spawnItem('heart',it.x-10,it.y+14,SU.heart);this.spawnItem('armor',it.x+10,it.y+14,SU.armor);for(let i=0;i<SU.energy;i++)this.spawnItem('energy',it.x+rnd(-14,14),it.y+16,SU.energyV)}

  /* записки у каждого игрока свои: напарнику достаётся записка из его собственного набора */
  giveNote(quiet,loc){

  relicChoice(p){

    while(picks.length<3&&pool.length>picks.length){const r=pool.find(x=>!picks.includes(x));if(!r)break;picks.push(r)}
    if(p===this.p)UI.relics(picks,r=>{this.giveRelic(p,r)});
    else NET.ask(['relics',picks.map(r=>r.id)],i=>{if(picks[i]&&this.players.indexOf(p)>=0)this.giveRelic(p,picks[i])});

  buy(it,p){

  sphinx(it,p){
    const q=pick(RIDDLES),opts=shuffle(q.a.map((t,i)=>({t,ok:i===q.c})));
    this.choiceFor(p,'Сфинкс',q.q,opts.map(o=>({t:o.t,fn:()=>{if(it.used)return;it.used=true;
      if(o.ok){if(p===this.p){Save.d.stats.riddles++;this.ach('riddle')}else NET.send(['m','riddle']);this.tell(p,'Верно! Сфинкс одаривает тебя.',true);this.spawnItem('weapon',it.x,it.y+24,0,Weapon.make(this.floorIdx+CONFIG.scale.sphinx,p.mods.luck));const SX=CONFIG.event.sphinx;for(let i=0;i<SX.coins;i++)this.spawnItem('coin',it.x,it.y,rndi(SX.coinV[0],SX.coinV[1]));A.sfx('win')}
      else{this.tell(p,'Неверно. Сфинкс хохочет, и ты чувствуешь укол боли.');p.hp=Math.max(1,p.hp-CONFIG.heal.sphinxFail);p.flash=8;A.sfx('hurt')}}})));
  }
  /* =====================================================================
     Сторона гостя (сетевая игра): мир считает хост, а своего героя —
     движение, рывок и попадания по себе — гость считает сам, без задержки.
     ===================================================================== */
  clientStep(busy){
    const p=this.p;
    if(!p||!this.room){PT.update();return}
    if(this.state==='over'){this.overT++;PT.update();this.updateFx();if(this.overT===90&&this.summary)UI.death(this.summary);return}
    if(this.state!=='play'&&this.state!=='hub'){PT.update();return}
    this.wpaused=this.state==='play'&&(busy||NET.hbusy);
    if(!this.wpaused){
      if(this.warp&&this.warp.t<600)this.warp.t++;
      this.readInput(p,busy||!!this.warp);
      this.clientPlayer(p);
      this.clientWorld(p);
    }else{const i=p.inp;i.mx=i.my=0;i.fire=false;i.dash=i.swap=i.skill=i.use=false;p.moving=false}
    PT.update();this.updateFx();
    if(this.shk>0)this.shk*=.85;if(this.shk<.2)this.shk=0;if(this.redFlash>0)this.redFlash--;
    if(this.speech&&--this.speech.t<=0)this.speech=null;if(this.banner&&--this.banner.t<=0)this.banner=null;
    if(this.t%90===0)this.checkAch();
    const ax=(p.ax||p.x)-p.x,ay=(p.ay||p.y)-p.y,tx=clamp(ax*.07,-14,14),ty=clamp(ay*.07,-10,10);
    this.cam.x+=(tx-this.cam.x)*.08;this.cam.y+=(ty-this.cam.y)*.08;
    p.near=this.near=p.dead?null:this.nearestInter(p);
    const ub=document.getElementById('bUse');if(ub)ub.style.display=this.near?'flex':'none';
    if(p.inp.use&&this.near&&!this.wpaused)this.clientUse(this.near);
    p.inp.use=false;
  }
  clientPlayer(p){
    const m=p.mods,c=CONFIG.player,I=p.inp;
    if(p.linv>0)p.linv--;if(p.dashCd>0)p.dashCd--;if(p.skLock>0)p.skLock--;if(p.recoil>0)p.recoil*=.8;
    if(p.dead){p.moving=false;p.dashT=0;p.kdT=0;return}
    this.aimLocal(p);
    p.face=Math.cos(p.aim)>=0?1:-1;p.moving=!!(I.mx||I.my);
    if(I.dash){I.dash=false;
      if(p.dashCd<=0&&p.dashT<=0&&!(p.kdT>0)){
        this.dashGo(p);p.linv=Math.max(p.linv,c.dashFrames+4);A.sfx('dash');NET.csend(['dash']);
      }}
    if(I.swap){I.swap=false;NET.csend(['swap'])}
    if(I.skill){I.skill=false;
      if(p.skillCd<=0&&!(p.skLock>0)){
        const a=p.aim,sd={a};p.skLock=40;
        if(p.cid==='knight'){p.kdT=CONFIG.skill.knight.t;p.skillA=a}
        else if(p.cid==='assassin'){const L=this.blinkLen(p,a);sd.sx=p.x;sd.sy=p.y;p.x+=Math.cos(a)*L;p.y+=Math.sin(a)*L;sd.ex=p.x;sd.ey=p.y;p.linv=Math.max(p.linv,CONFIG.skill.assassin.inv)}
        NET.csend(['skill',sd]);
      }}
    const slow=this.footing(p);
    if(p.kdT>0){
      p.kdT--;this.rush(p);p.linv=Math.max(p.linv,3);p.vx=p.vy=0;
      if(this.t%2===0)PT.emit(p.x,p.y,{n:2,spd:.6,col:'#9ad8ff',life:16,add:true});
    }else if(p.dashT>0){
      this.dashStep(p);
      if(this.t%2===0)PT.emit(p.x,p.y+2,{n:2,spd:.4,col:p.c.pal.a,life:18,add:true});
    }else{
      this.walk(p,slow);
    }
    p.anim+=p.moving?.25:.05;
    if(m.orbit>0){const n=Math.floor(m.orbit);for(let i=0;i<n;i++){const a=this.t*.07+i*TAU/n,R=CONFIG.combat.relic.orbitR;if(this.t%3===0)PT.emit(p.x+Math.cos(a)*R,p.y-4+Math.sin(a)*R,{n:1,spd:.1,col:'#ffe66a',life:10,add:true})}}
  }
  /* гость сам проверяет, попали ли по нему, — по той картинке, что видит у себя */
  clientWorld(p){
    const hit=(n,k,id,g)=>{p.linv=Math.max(p.linv,18);NET.csend(['h',Math.round(n*100)/100,k||0,id||0,g||0])};
    const safe=()=>p.dead||p.linv>0||p.inv>0||p.dashT>0||this.state!=='play';
    // зоны-предупреждения срабатывают по своему таймеру
    for(let i=this.zones.length-1;i>=0;i--){const z=this.zones[i];
      if(z.t>=z.dur){this.zones.splice(i,1);if(z.dmg>0){PT.emit(z.x,z.y,{n:10,spd:2,col:'#ff5a5a',life:20,add:true});if(!safe()&&this.inZone(z,p))hit(z.dmg,4)}}}
    if(safe())return;
    for(let i=0;i<BL.b.length;i++){const b=BL.b[i];if(!b.a||b.own!==1||BOMBS[b.kind])continue;
      if(dist(b.x,b.y,p.x,p.y)<p.r+b.r-.5){b.a=false;hit(b.dmg,1,i,b.gen);return}}
    /* касание: те же touches/touchR/touchDmg, что у хоста */
    for(const e of this.enemies){if(e.dead||e.spawn>0||e.stun>0)continue;
      if(e.touches()&&dist(e.x,e.y,p.x,p.y)<e.touchR(p)){hit(e.touchDmg(),2,e.id);return}}
    const TC=CONFIG.combat.trap;
    for(const tr of this.room.traps){if(!tr.up)continue;const HZ=CONFIG.haz[tr.k];
      if(dist(p.x,p.y,tr.x,tr.y)<(HZ?HZ.r:TC.r[tr.k==='spike'?0:1])){hit(this.eDmg(HZ?HZ.dmg:TC.dmg),3);return}}
  }
  /* взрыв, пришедший от хоста: задел ли он меня */
  clientBlast(x,y,r,dmg){
    const p=this.p;if(!p||p.dead||p.linv>0||p.inv>0||p.dashT>0||this.state!=='play')return;
    if(dist(x,y,p.x,p.y)<r+p.r){p.linv=Math.max(p.linv,18);NET.csend(['h',Math.round(dmg*100)/100,5,0,0])}
  }
  clientUse(it){
    if(it.k==='camp'&&it.hub){PT.emit(it.x,it.y-6,{n:6,spd:1,col:'#ffb040',life:20,add:true});this.toast('Тепло и спокойно.');return}
    switch(it.k){
      case 'mentor':UI.mentorTalk();return;
      case 'plaque':UI.dialog(PLAQUE,()=>{});return;
      case 'totem':UI.upgrades();return;
      case 'charstone':UI.chars();return;
      case 'petkeeper':UI.pets();return;
      case 'hubportal':this.toast('Забег запускает хост — он откроет портал.');return;
    }
    NET.csend(['use',it.k==='weapon'?1:0,it.id]);
  }
}
/* ---------- новые классы оружия: заряд, луч с перегревом, мины, призыв, копьё, кнут, метательное, липкая бомба, колодец ----------
   Всё считает хост. От гостя приходит тот же один бит «огонь»: заряд, нагрев и запас выводятся из него здесь.
   Гость видит: пули (BKIND), мины и липучки (TRK), помощников (ALK), зоны (ARK), эффекты (addFx) и шкалу оружия (байт gauge в снимке героя) */
Object.assign(Game.prototype,{
  /* раз в кадр для каждого героя: запас метательного, остывание луча, отпускание заряда, шкала под иконкой оружия */
  weaponTick(p){
    const I=p.inp,WX=CONFIG.wx;
    for(const w of p.weapons){if(!w)continue;const d=w.def;
      if(d.k==='throw'){if(w.am<d.am&&++w.amT>=d.re/(1+p.mods.rate)){w.amT=0;w.am++}}
      else if(d.k==='beam'){
        if(w.lock>0){w.lock--;w.heat=w.lock/WX.beam.lock}
        else if(w.heat>0&&this.t-w.hT>WX.beam.wait)w.heat=Math.max(0,w.heat-d.cool)}
      else if(d.k==='charge'&&w.ch>0){if(w!==p.w||p.swapT>0)w.ch=0;else if(!I.fire)this.release(p,w)}
    }
    const w=p.w,d=w&&w.def;let g=0,f=0;
    if(d){
      if(d.k==='throw')g=Math.round(w.am/d.am*255);
      else if(d.k==='beam'){g=Math.round(clamp(w.heat,0,1)*255);if(w.lock>0)f=1}
      else if(d.k==='charge')g=Math.round(clamp(w.ch/d.ch,0,1)*255)}
    p.gauge=g;p.f2=(p.f2&~1)|f;
  },
  /* заряд копится, пока держишь огонь; энергия уходит по мере накопления, поэтому возвращать её не приходится */
  chargeUp(p,w){
    const d=w.def,WC=CONFIG.wx.charge,m=p.mods;
    if(!w.ch){
      if(w.cost>0&&p.energy<w.cost*WC.start){w.cd=CONFIG.combat.noEnergyCd;this.sfxTo(p,'empty');if(this.t%30===0)PT.text(p.x,p.y-14,'НЕТ ЭНЕРГИИ','#6aa8ff',6);return}
      p.energy-=w.cost*WC.start;w.ch=1;return}
    if(w.ch<d.ch){const st=Math.min(d.ch-w.ch,1+m.rate+(p.skillBuff>0&&p.cid==='ranger'?CONFIG.skill.ranger.rate:0)),e=w.cost*(1-WC.start)*st/d.ch;
      if(p.energy>=e){p.energy-=e;w.ch+=st;if(w.ch>=d.ch){w.ch=d.ch;this.sfxTo(p,'ui')}}}
    else if(this.t%5===0)PT.emit(p.x+Math.cos(p.aim)*10,p.y-4+Math.sin(p.aim)*10,{n:1,spd:.6,col:d.col,life:10,add:true});
  },
  release(p,w){
    const d=w.def,m=p.mods,RC=CONFIG.combat.relic,k=clamp(w.ch/d.ch,0,1);w.ch=0;
    if(p.dead||k<CONFIG.wx.charge.tap/d.ch)return;
    const rate=w.rate/(1+m.rate+(p.skillBuff>0&&p.cid==='ranger'?CONFIG.skill.ranger.rate:0));

  /* копьё (узкий выпад вперёд, шаг владельца) и кнут (широкая дуга на большой дальности, пули не сбивает) */
  reachHit(p,w,a,fx){

      if(spear){const t=(e.x-p.x)*ca+(e.y-p.y)*sa,off=Math.abs((e.y-p.y)*ca-(e.x-p.x)*sa);if(t<-e.r||off>def.wid+e.r)continue}

    for(const h of list){if(hit>=max)break;const rr=this.dmgRoll(p,w),e=h.e;

const WSPR_C={};
/* спрайт оружия с контуром: {c — холст, w, h, gx, gy — точка хвата} */
function wSpr(def){
  let s=WSPR_C[def.id];if(s)return s;
  const A=WART[def.id]||WART.rust,rows=A.r,h=rows.length,w=rows[0].length,c=document.createElement('canvas');c.width=w+2;c.height=h+2;
  const x=c.getContext('2d'),P=Object.assign({c:def.col,C:shade(def.col,1.4),q:shade(def.col,.6)},WCOL);
  x.fillStyle=OUTLINE;
  for(let j=0;j<h;j++)for(let i=0;i<w;i++)if(rows[j][i]!=='.'){x.fillRect(i,j+1,3,1);x.fillRect(i+1,j,1,3)}
  for(let j=0;j<h;j++)for(let i=0;i<w;i++){const ch=rows[j][i];if(ch==='.')continue;x.fillStyle=P[ch]||'#f0f';x.fillRect(i+1,j+1,1,1)}
  return WSPR_C[def.id]={c,w:w+2,h:h+2,gx:A.g[0]+1,gy:A.g[1]+1};
}
/* оружие в руке: (x,y) — точка хвата, a — угол прицела */
function drawWeaponGlyph(ctx,def,x,y,a,sc,flipY){
  const s=wSpr(def);ctx.save();ctx.translate(Math.round(x),Math.round(y));ctx.rotate(a);if(flipY)ctx.scale(1,-1);ctx.scale(sc,sc);ctx.drawImage(s.c,-s.gx,-s.gy);ctx.restore();
}
/* значок оружия: (x,y) — центр, вписывается в рамку maxW×maxH (в пикселях до масштаба sc) */
function drawWeaponIcon(ctx,def,x,y,sc,a,maxW){
  const s=wSpr(def);if(maxW&&s.w*sc>maxW)sc=maxW/s.w;
  ctx.save();ctx.translate(x,y);if(a)ctx.rotate(a);ctx.scale(sc,sc);ctx.drawImage(s.c,-Math.round(s.w/2),-Math.round(s.h/2));ctx.restore();
}
function drawHeart(h,x,y,fill){
  for(let j=0;j<6;j++)for(let i=0;i<8;i++){if(HEARTPX[j][i]!=='1')continue;
    h.fillStyle=fill==='full'?'#ee3a52':fill==='half'?(i<4?'#ee3a52':'#3a1a2a'):'#3a1a2a';h.fillRect(x+i,y+j,1,1)}
  h.fillStyle=fill==='empty'?'#1a0a14':'#ff9aa8';if(fill!=='empty')h.fillRect(x+1,y+1,1,1);
}
function drawShield(h,x,y,full){for(let j=0;j<6;j++)for(let i=0;i<7;i++){if(SHIELDPX[j][i]!=='1')continue;h.fillStyle=full?'#8aa8f0':'#232a48';h.fillRect(x+i,y+j,1,1)}if(full){h.fillStyle='#d8e4ff';h.fillRect(x+1,y+1,2,1)}}

Object.assign(Game.prototype,{
  draw(){
    const ctx=this.ctx;ctx.imageSmoothingEnabled=false;ctx.setTransform(1,0,0,1,0,0);
    const h=this.hctx;h.setTransform(1,0,0,1,0,0);h.clearRect(0,0,this.hud.width,this.hud.height);h.setTransform(this.hs,0,0,this.hs,0,0);h.imageSmoothingEnabled=false;
    if(this.state==='boot'||this.state==='title'||this.state==='scene'||!this.room||!this.p){this.drawScene(ctx);this.drawFade(h);return}
    ctx.fillStyle='#07060d';ctx.fillRect(0,0,W,H);
    this.drawWorld(ctx);this.drawHUD(h);this.drawFade(h);
  },
  drawFade(h){if(this.fade>0){h.fillStyle='rgba(5,3,10,'+this.fade+')';h.fillRect(0,0,W,H)}},
  /* ---------- мир ---------- */
  drawWorld(ctx){
    const r=this.room,p=this.p,th=BIOMES[r.theme]||BIOMES.hub;
    const sx=this.shk>0?rnd(-this.shk,this.shk):0,sy=this.shk>0?rnd(-this.shk,this.shk):0;
    const ox=Math.round(OX-this.cam.x+sx),oy=Math.round(OY-this.cam.y+sy);this.ox=ox;this.oy=oy;
    ctx.save();ctx.translate(ox,oy);
    ctx.drawImage(r.bg,0,0);
    this.labels=[];const t=this.t;
    drawDoors(ctx,r,th);
    // лужи
    for(const s of r.slows){const sx=Math.round(s.x),sy=Math.round(s.y);pxEll(ctx,'rgba(0,0,0,.22)',sx,sy+1,s.r+1,s.r*.6+1);pxEll(ctx,th.slow,sx,sy,s.r,s.r*.6);
      ctx.fillStyle='rgba(255,255,255,.16)';ctx.fillRect(Math.round(sx-s.r*.5),Math.round(sy-s.r*.25+Math.sin(t*.05+s.x)),Math.round(s.r*.5),1);ctx.fillRect(Math.round(sx+s.r*.1),Math.round(sy+s.r*.2+Math.cos(t*.04+s.y)),Math.round(s.r*.35),1)}
    // ловушки
    for(const tr of r.traps){const x=Math.round(tr.x),y=Math.round(tr.y);
      if(CONFIG.haz[tr.k]){this.drawHaz(ctx,tr,t);continue}
      if(tr.k==='spike'){ctx.fillStyle='#0e0b16';ctx.fillRect(x-7,y-7,14,14);ctx.fillStyle='#2a2636';ctx.fillRect(x-6,y-6,12,12);ctx.fillStyle='#3e3a50';ctx.fillRect(x-6,y-6,12,1);
        for(let i=0;i<3;i++)for(let j=0;j<3;j++){const cx=x-5+i*4,cy=y-5+j*4;
          if(tr.up){ctx.fillStyle='#6a6a7c';ctx.fillRect(cx,cy-2,3,5);ctx.fillStyle='#f0f0fa';ctx.fillRect(cx+1,cy-4,1,6);ctx.fillStyle='#b8b8c8';ctx.fillRect(cx,cy-1,1,3)}
          else if(tr.warn){ctx.fillStyle='#0e0b16';ctx.fillRect(cx,cy,3,3);ctx.fillStyle='#ff8a6a';ctx.fillRect(cx+1,cy-1,1,3)}
          else{ctx.fillStyle='#0e0b16';ctx.fillRect(cx,cy,3,3);ctx.fillStyle='#55556a';ctx.fillRect(cx+1,cy+1,1,1)}}}
      else{ctx.fillStyle='#120c0c';ctx.fillRect(x-7,y-7,14,14);ctx.fillStyle=tr.up?'#5a2a12':tr.warn?'#4a2414':'#2c2020';ctx.fillRect(x-6,y-6,12,12);
        ctx.fillStyle=tr.up?'#ffb040':tr.warn?'#c85a2a':'#4a3030';for(let i=0;i<4;i++)ctx.fillRect(x-5+i*3,y-5,1,10);ctx.fillStyle='#1c1414';for(let i=0;i<3;i++)ctx.fillRect(x-6,y-4+i*4,12,1);
        if(tr.up){const f=Math.floor(t/3)%3;ctx.fillStyle='#ff5a1a';ctx.fillRect(x-4,y-9-f,8,8+f);ctx.fillStyle='#ffa030';ctx.fillRect(x-3,y-7-f,6,6+f);ctx.fillStyle='#ffe9a0';ctx.fillRect(x-1,y-5,3,4)}}}
    // капканы
    for(const tr of this.traps){if(tr.k!=='trap'){this.drawMine(ctx,tr);continue}ctx.fillStyle='#8a8a98';ctx.beginPath();ctx.arc(tr.x,tr.y,5,0,TAU);ctx.fill();ctx.fillStyle='#d0d0d8';for(let i=0;i<6;i++){const a=i*TAU/6;ctx.fillRect(tr.x+Math.cos(a)*4-.5,tr.y+Math.sin(a)*4-.5,1.4,1.4)}ctx.fillStyle=tr.t<20?'#ffe14a':'#c83a3a';ctx.fillRect(tr.x-1,tr.y-1,2,2)}
    // зоны (под объектами)
    for(const a of this.areas){const ak=AREAS[a.k]||AREAS.tox;ctx.fillStyle=ak.fill;ctx.beginPath();ctx.ellipse(a.x,a.y,a.r,a.r*.62,0,0,TAU);ctx.fill();ctx.strokeStyle=ak.line;ctx.stroke();
      if(a.k==='well'){for(let i=0;i<3;i++){const k=(t*.02+i/3)%1,rr=a.r*(1-k);ctx.globalAlpha=k;ctx.beginPath();ctx.ellipse(a.x,a.y,rr,rr*.62,0,0,TAU);ctx.stroke()}ctx.globalAlpha=1;pxDisc(ctx,'#12061f',Math.round(a.x),Math.round(a.y),3)}}
    for(const z of this.zones){

      if(z.k==='c'){ctx.beginPath();ctx.ellipse(z.x,z.y,z.r,z.r*.7,0,0,TAU);ctx.fill();ctx.stroke();ctx.beginPath();ctx.ellipse(z.x,z.y,z.r*k,z.r*.7*k,0,0,TAU);ctx.stroke()}
      else{const dx=z.x2-z.x,dy=z.y2-z.y,L=Math.hypot(dx,dy),a=Math.atan2(dy,dx);ctx.save();ctx.translate(z.x,z.y);ctx.rotate(a);ctx.fillRect(0,-z.w/2,L,z.w);ctx.strokeRect(0,-z.w/2,L,z.w);ctx.fillStyle=`rgba(${col},${.25+.35*k})`;ctx.fillRect(0,-z.w/2*k,L,z.w*k);ctx.restore()}
    }
    // сортируемые объекты
    const L=[];
    for(const o of r.obs)L.push({y:o.ty*TS+14,f:()=>this.drawObs(ctx,o)});
    for(const it of r.inter)L.push({y:it.y+6,f:()=>this.drawInter(ctx,it)});
    for(const it of r.items)L.push({y:it.y+2,f:()=>this.drawItem(ctx,it)});
    for(const a of this.allies)L.push({y:a.y,f:()=>this.drawAlly(ctx,a)});
    for(const e of this.enemies)L.push({y:e.y,f:()=>e.draw(ctx)});

    L.sort((a,b)=>a.y-b.y);for(const o of L)o.f();

  hostMsg(m){
    if(!Array.isArray(m))return;

    switch(m[0]){
      case 'hello':{
        const d=m[1]||{};if(d.v!==NETV){this.raw(['kick','ver']);return}
        this.rprof=this.san(d.prof);this.rst={};this.rb=false;this.bexp=0;this.back=0;this.pend={};this.rin=null;this.rinSeq=-1;

        });break}
      case 'prof':this.rprof=this.san(m[1]);this.q.push(()=>G.reprofile());break;
      case 'busy':this.rb=!!m[1];if(m[2]>this.back)this.back=m[2];break;

        const p=rp(),r=G.room;if(!p||p.dead||!r||G.wpaused||(G.state!=='play'&&G.state!=='hub'))return;
        const it=m[1]?r.items.find(i=>i.id===m[2]&&i.k==='weapon'):r.inter.find(i=>i.id===m[2]);
        if(!it||it.sold||(it.used&&it.k!=='camp')||dist(p.x,p.y,it.x,it.y)>60)return;

      });break;

    }
  },

  /* редко меняющееся состояние шлём только при изменении */

  },
  /* смена комнаты: гостю уходит полное описание новой комнаты */

    const rp=G.players.find(q=>q.remote),r=G.room;if(!rp||!r)return;

  /* пули: шлём рождение, смену направления и исчезновение — между ними гость двигает их сам */
  scanBullets(){

      if(b.a){
        if(b.nsg!==b.gen||!b.nsa){b.nsg=b.gen;b.nsa=true;b.svx=b.vx;b.svy=b.vy;b.nst=wt;
          out.push(['b+',i,b.gen,wt,rd2(b.x),rd2(b.y),rd3(b.vx),rd3(b.vy),rd2(b.r),b.col,Math.max(0,BKIND.indexOf(b.kind)),(b.own?1:0)|(b.glow?2:0)|(b.crit?4:0),Math.round(b.life),b.t,b.slow||0,b.grow||0,b.own?rd2(b.dmg):0])}

    }
  },
  sendSnap(){

      w.u8(Math.max(0,ESTATE.indexOf(e.state)));w.u8(e.st);w.pos(e.x);w.pos(e.y);w.ang(e.sa!==null&&e.sa!==undefined&&e.state!=='tel'&&e.state!=='dash'?e.sa:e.la);

    w.u8(G.allies.length);for(const a of G.allies){w.u8(Math.max(0,ALK.indexOf(a.k)));w.pos(a.x);w.pos(a.y);w.u16(a.life);w.u8(a.face<0?1:0)}
    w.u8(G.traps.length);for(const t of G.traps){w.u8(Math.max(0,TRK.indexOf(t.k)));w.pos(t.x);w.pos(t.y);w.u8(t.t<20?0:1)}
    w.u8(G.areas.length);for(const a of G.areas){w.u8(Math.max(0,ARK.indexOf(a.k)));w.pos(a.x);w.pos(a.y);w.u8(a.r)}
    const rt=r?r.traps:[];w.u8(rt.length);for(const t of rt)w.u8((t.up?1:0)|(t.warn?2:0));

      this.cos.length=0;if(cs.length>20000)cs=''}
    w.str(cs);

  },
  pre(){

/* =====================================================================
   Аккаунты. Сервера у игры нет (это один HTML-файл), поэтому аккаунт живёт на устройстве:
   имя, отпечаток пароля и отдельное сохранение. На другое устройство аккаунт переносится кодом
   (в коде — имя, отпечаток пароля и весь прогресс; без пароля код не принять).
   Без аккаунта игра работает как раньше — «гость», сохранение в прежнем ключе emberhall_save_v1.
   ===================================================================== */
const SHA_K=(()=>{const k=[],h=[],p=[];for(let n=2;k.length<64;n++){if(p.every(q=>n%q)){p.push(n);k.push(Math.floor((Math.cbrt(n)%1)*4294967296)>>>0);if(h.length<8)h.push(Math.floor((Math.sqrt(n)%1)*4294967296)>>>0)}}return{k,h}})();

    for(let i=16;i<64;i++){const x=w[i-15],y=w[i-2];w[i]=(w[i-16]+(r(x,7)^r(x,18)^(x>>>3))+w[i-7]+(r(y,17)^r(y,19)^(y>>>10)))|0}

    for(let i=0;i<8;i++)H[i]=(H[i]+v[i])|0;

const DBG={
  on:false,god:false,seen:new Set(),n:{evo:0,evi:0,sto:0,sti:0,evn:0,snap:0,snapMax:0,step:0,stepMax:0,steps:0},last:{},
  $(id){return document.getElementById(id)},
  err(m){if(this.seen.has(m))return;this.seen.add(m);console.error('[данные] '+m)},
  /* ---------- проверка таблиц: возвращает список ошибок (пустой — всё в порядке) ---------- */
  validate(){
    const E=[],er=m=>E.push(m),has=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
    const dup=(a,nm)=>{const s=new Set();for(const x of a){if(s.has(x))er(nm+': повторяется id «'+x+'»');s.add(x)}};
    /* лимиты формата и повторы id */
    if(ENK.length>200)er('типов врагов '+ENK.length+' — больше 200');if(BSK.length>56)er('боссов '+BSK.length+' — больше 56');
    dup(ENK.concat(BSK),'враги и боссы');dup(WP.map(w=>w.id),'оружие');dup(RELICS.map(r=>r.id),'реликвии');dup(ACHS.map(a=>a.id),'достижения');
    dup(PETS.map(p=>p.id),'питомцы');dup(ELITE_ABIL.map(a=>a.id),'способности элиты');dup(UPGR.map(u=>u.id),'улучшения');dup(WMODS.map(m=>m.id),'модификаторы оружия');
    for(const [nm,l] of [['BKIND',BKIND],['ESTATE',ESTATE],['ITK',ITK],['ALK',ALK],['TRK',TRK],['ARK',ARK]]){dup(l,nm);if(l.length>255)er(nm+': больше 255 записей')}
    /* то, что записано в коде, должно быть в сетевых списках */
    const ai=Enemy.toString()+Boss.toString()+Object.keys(ATK).map(k=>ATK[k].toString()).join('');
    for(const m of ai.matchAll(/\.state='(\w+)'/g))if(!ESTATE.includes(m[1]))er('состояние «'+m[1]+'», которое выставляет ИИ, не внесено в ESTATE');
    const code=ai+Game.toString()+ebullet+throwBomb;
    for(const m of code.matchAll(/(?:BL\.spawn|ebullet)\(/g)){const k=/kind:([^,}]*)/.exec(code.substr(m.index,700));
      if(k)for(const q of k[1].matchAll(/'(\w+)'/g))if(!BKIND.includes(q[1]))er('вид пули «'+q[1]+'» не внесён в BKIND')}
    for(const m of code.matchAll(/spawnItem\('(\w+)'/g))if(!ITK.includes(m[1]))er('вид предмета «'+m[1]+'» не внесён в ITK');
    for(const m of code.matchAll(/allies\.push\(\{k:'(\w+)'/g))if(!ALK.includes(m[1]))er('вид союзника «'+m[1]+'» не внесён в ALK');
    for(const m of code.matchAll(/traps\.push\(\{k:'(\w+)'/g))if(!TRK.includes(m[1])&&!['spike','fire'].includes(m[1]))er('вид ловушки игрока «'+m[1]+'» не внесён в TRK');
    for(const m of code.matchAll(/areas\.push\(\{k:'(\w+)'/g))if(!ARK.includes(m[1]))er('вид зоны игрока «'+m[1]+'» не внесён в ARK (таблица AREAS)');
    const aiK=[...Enemy.prototype.update.toString().matchAll(/case '(\w+)':/g)].map(m=>m[1]);
    /* спрайты: каждая буква силуэта есть в палитре того, кто его носит */
    const pal=(who,sh,p)=>{const def=SHAPES[sh];if(!def){er(who+': нет силуэта «'+sh+'» в SHAPES');return}
      p=p||{};const bad=new Set(),rows=(def.r||def).concat(def.alt||[],def.atk||[],def.prop?def.prop.r:[]);
      for(const r of rows)for(const c of r){if(c==='.'||p[c]||SPR_FIX[c])continue;const lo=c.toLowerCase();if(lo!==c&&p[lo])continue;if(SPR_DARK[c]&&p[SPR_DARK[c]])continue;bad.add(c)}
      if(bad.size)er(who+': в палитре нет цветов для букв «'+[...bad].join('')+'» силуэта '+sh)};
    /* сами силуэты: строки — либо половинки одной длины, либо во всю ширину */
    for(const sh in SHAPES){const def=SHAPES[sh],rows=def.r||def;let hw=1e9,mx=0;for(const r of rows){hw=Math.min(hw,r.length);mx=Math.max(mx,r.length)}
      if(!def.full)for(const r of rows)if(r.length!==hw&&r.length!==hw*2)er('силуэт '+sh+': строка «'+r+'» не половинка ('+hw+') и не полная ('+hw*2+')');
      if(def.alt&&def.alt.length!==rows.length)er('силуэт '+sh+': во втором кадре другое число строк');
      if(def.atk&&(def.atk.length!==rows.length||def.atk.some((r,i)=>r.length!==rows[i].length)))er('силуэт '+sh+': кадр атаки другого размера');
      if(def.alt)def.alt.forEach((r,i)=>{if(r.length!==rows[i].length)er('силуэт '+sh+': строка '+(i+1)+' второго кадра другой длины')})}
    for(const q of PETS)pal('питомец '+q.id,q.sh,{a:q.col,b:q.col});
    for(const k of ENK){const d=EN[k];pal('враг '+k,d.sh,d.pal);
      if(!aiK.includes(d.ai))er('враг '+k+': неизвестный ИИ «'+d.ai+'»');
      if(d.minion&&!EN[d.minion])er('враг '+k+': призывает несуществующего «'+d.minion+'»');
      if(d.bk&&!BKIND.includes(d.bk))er('враг '+k+': вид снаряда «'+d.bk+'» не внесён в BKIND');
      if(d.ai==='bomber'&&d.bk&&!BOMBS[d.bk])er('враг '+k+': бомбист бросает «'+d.bk+'», а это не бомба (BOMBS)');
      if(d.split&&!EN[d.split])er('враг '+k+': распадается на несуществующего «'+d.split+'»');
      if(d.pat&&!ePat.toString().includes("case '"+d.pat+"'"))er('враг '+k+': узора стрельбы «'+d.pat+'» нет в ePat');
      for(const f of ['tel','dl','fuse'])if(d[f]>255)er('враг '+k+': '+f+'='+d[f]+' больше 255 кадров');
      if(!(d.hp>0)||!(d.r>0)||!(d.cost>0))er('враг '+k+': нет здоровья, радиуса или цены')}
    for(const k of BSK){const d=BOSS[k],a=BOSS_AI[k];pal('босс '+k,d.sh,d.pal);
      if(!a||a.length!==3)er('босс '+k+': в BOSS_AI должно быть три фазы');
      else a.forEach((ph,i)=>{if(!ph.length)er('босс '+k+': фаза '+(i+1)+' пуста');for(const n of ph)if(typeof ATK[n]!=='function')er('босс '+k+': атаки «'+n+'» нет в ATK')});
      if(d.mv&&!['walk','hover'].includes(d.mv.k))er('босс '+k+': неизвестное движение «'+d.mv.k+'»');
      if(d.minion&&!EN[d.minion])er('босс '+k+': призывает несуществующего «'+d.minion+'»');
      if(d.ach&&!ACHS.some(x=>x.id===d.ach))er('босс '+k+': нет достижения «'+d.ach+'»');
      if(!d.speech||!d.speech.length)er('босс '+k+': нет реплик');
      const st=BSTY[k];if(!st)er('босс '+k+': нет стиля снарядов в BSTY');else for(const f of ['k','k2','k3','bk'])if(st[f]&&!BKIND.includes(st[f]))er('босс '+k+': вид снаряда «'+st[f]+'» не внесён в BKIND');
      if(st&&st.bk&&!BOMBS[st.bk])er('босс '+k+': «'+st.bk+'» не бомба (BOMBS)')}
    if(ATKK.length>255)er('атак боссов больше 255 — номер не влезет в байт снимка');
    for(const k in BOSS_AI)if(!BOSS[k])er('BOSS_AI: атаки для несуществующего босса «'+k+'»');
    for(const id in CHARS){const c=CHARS[id];pal('герой '+id,c.sh,c.pal);
      for(const w of [c.w1,c.w2])if(w&&!WP_BY[w])er('герой '+id+': нет оружия «'+w+'»');
      if(c.unlock&&!BOSS[c.unlock])er('герой '+id+': открывается несуществующим боссом «'+c.unlock+'»')}
    /* оружие и реликвии */
    const WK=['gun','laser','flame','nade','melee','boom','chain','charge','beam','mine','summon','spear','whip','throw','sticky','well'];
    for(const w of WP){
      if(w.k==='charge'&&!(w.ch>0&&['shot','cone','chain','slam'].includes(w.mode)))er('оружие '+w.id+': заряду нужны ch и mode');
      if(w.k==='beam'&&!(w.heat>0&&w.cool>0&&w.range>0))er('оружие '+w.id+': лучу нужны heat, cool и range');
      if(w.k==='mine'&&!(TRK.includes(w.tk)&&w.max>0&&w.exp>0))er('оружие '+w.id+': мине нужны tk из TRK, max и exp');
      if(w.k==='summon'&&!(ALK.includes(w.ally)&&CONFIG.wx.ally[w.ally]&&ALLY_SPR[w.ally]&&w.life>0&&w.life<=65535&&w.max>0))er('оружие '+w.id+': призыву нужны ally из ALK (с числами в CONFIG.wx.ally и силуэтом), life и max');
      if(w.k==='throw'&&!(w.am>0&&w.re>0&&BKIND.includes(w.bk)))er('оружие '+w.id+': метательному нужны am, re и bk из BKIND');
      if((w.k==='spear'||w.k==='whip')&&!(w.reach>0&&(w.k==='spear'?w.wid>0:w.arc>0)))er('оружие '+w.id+': нужны reach и '+(w.k==='spear'?'wid':'arc'));
      if(w.k==='well'&&!(w.wr>0&&w.wr<=255&&w.wt>0&&w.exp>0))er('оружие '+w.id+': колодцу нужны wr (до 255), wt и exp');
      if(w.k==='sticky'&&!(w.exp>0))er('оружие '+w.id+': липкой бомбе нужен exp');
      if(w.bk&&!BKIND.includes(w.bk))er('оружие '+w.id+': вид пули «'+w.bk+'» не внесён в BKIND');
      for(const q of w.nomod||[])if(!WMODS.some(m=>m.id===q))er('оружие '+w.id+': nomod называет несуществующий модификатор «'+q+'»')}
    for(const k in WMOD_NO){if(!WK.includes(k))er('WMOD_NO: неизвестный класс «'+k+'»');for(const q of WMOD_NO[k])if(!WMODS.some(m=>m.id===q))er('WMOD_NO.'+k+': нет модификатора «'+q+'»')}
    for(const w of WP){if(!WK.includes(w.k))er('оружие '+w.id+': неизвестный класс «'+w.k+'»');
      if(!(w.minR>=0&&w.maxR<=5&&w.minR<=w.maxR))er('оружие '+w.id+': редкость '+w.minR+'…'+w.maxR+' вне 0…5');
      if(w.legend&&w.minR!==5)er('оружие '+w.id+': легендарное должно иметь редкость 5')}
    for(const r of RELICS)for(const k in r.m)if(!has(MODS0,k))er('реликвия '+r.id+': ключ «'+k+'» не объявлен в MODS0');
    for(const k in CONFIG.caps)if(!has(MODS0,k))er('потолки: ключ «'+k+'» не объявлен в MODS0');
    for(const d of UPGR)for(const k in d.m||{})if(!has(MODS0,k))er('улучшение '+d.id+': ключ «'+k+'» не объявлен в MODS0');
    for(const d of PETS)for(const k in d.m||{})if(!has(MODS0,k))er('питомец '+d.id+': ключ «'+k+'» не объявлен в MODS0');
    /* волны и закалка: таблицы должны покрывать всё, что могут вернуть формулы */
    const WV=CONFIG.waves,LV=CONFIG.weapon.lvl;
    for(let b=0;b<=120;b+=.5){const n=WV.count(b),sp=WV.split[n];if(!sp||sp.length!==n){er('волны: для бюджета '+b+' нужно '+n+' волн, а долей в split нет');break}}
    for(const n in WV.split)if(Math.abs(WV.split[n].reduce((a,x)=>a+x,0)-1)>.01)er('волны: доли split['+n+'] в сумме не дают 1');
    if(LV.chance.length<LV.max)er('закалка: шансов '+LV.chance.length+', а уровней '+LV.max);
    for(const k in CONFIG.diff){const d=CONFIG.diff[k];for(const f of ['hp','dmg','gold','cry','heal','waves'])if(!(d[f]>0))er('сложность '+k+': нет множителя «'+f+'»')}
    for(let f=0;f<ROUTE.n();f++){const ch=ROUTE.ch(f),S=CONFIG.scale;if(!(S.hp(f,ch)>0)||!(S.dmg(f,ch)>0)||!(S.bossHp(f,ch)>0)||!(S.budget(f)>0))er('рост сложности: формула дала не число на этаже '+(f+1));
      /* К5: урон одного попадания по гостю ограничен 50 */
      for(const k in CONFIG.diff)if(CONFIG.diff[k].dmg*S.dmg(f,ch)*3*CONFIG.elite.touch>50)er('урон на этаже '+(f+1)+' ('+k+') может превысить 50 за попадание')}
    /* биомы и маршрут */
    const TH=['floor','wall','top','face','line','dark','name'];
    for(const id in BIOMES){const b=BIOMES[id];
      for(const f of TH)if(!b[f])er('биом '+id+': нет поля «'+f+'»');
      if(!TRACKS[b.music])er('биом '+id+': нет музыки «'+b.music+'» в TRACKS');
      for(const o of [b.solid].concat(b.dest||[]))if(!has(OBS_HP,o))er('биом '+id+': нет препятствия «'+o+'» в OBS_HP');
      if(b.haz&&!(CONFIG.haz[b.haz]&&CONFIG.haz[b.haz].cyc>CONFIG.haz[b.haz].up&&CONFIG.haz[b.haz].up>CONFIG.haz[b.haz].warn))er('биом '+id+': нет опасности «'+b.haz+'» в CONFIG.haz или её времена не по порядку');
      if(!FLOOR_ART[b.style]||!WALL_ART[b.style])er('биом '+id+': нет рисунка пола или стен «'+b.style+'»');
      if(b.hub)continue;
      if(!b.pool||!b.pool.length)er('биом '+id+': пустой пул врагов');
      for(const e of b.pool||[]){if(!EN[e])er('биом '+id+': в пуле нет врага «'+e+'»');else if(EN[e].cost>=90)er('биом '+id+': служебный враг «'+e+'» в пуле')}
      if(!BOSS[b.guard]||!BOSS[b.guard].mini)er('биом '+id+': страж «'+b.guard+'» не найден или не отмечен mini');
      if(!BOSS[b.boss]||BOSS[b.boss].mini)er('биом '+id+': босс «'+b.boss+'» не найден или отмечен mini')}
    for(const k in OBS_ART)if(!has(OBS_HP,k))er('препятствие «'+k+'» нарисовано, но не внесено в OBS_HP');
    for(const k in CONFIG.haz)if(!Game.prototype.drawHaz.toString().includes("case '"+k+"'"))er('опасность «'+k+'» не нарисована (drawHaz)');
    for(const k in BOMBS)if(!BKIND.includes(k))er('бомба «'+k+'» не внесена в BKIND');
    const R=CONFIG.run;
    for(const r of R.floors)if(!['normal','guard','boss'].includes(r))er('маршрут: неизвестная роль этажа «'+r+'»');
    if(R.floors[R.floors.length-1]!=='boss')er('маршрут: последний этаж главы должен быть этажом босса');
    R.chapters.forEach((c,i)=>{
      if(!c.bio||!c.bio.length)er('маршрут: у главы '+(i+1)+' нет биомов');
      for(const b of c.bio||[])if(!BIOMES[b]||BIOMES[b].hub)er('маршрут: глава '+(i+1)+' ссылается на биом «'+b+'»');
      for(const s of c.shards||[])if(!R.floors.includes(s))er('маршрут: глава '+(i+1)+' даёт осколок на несуществующем этаже «'+s+'»');
      if(c.ach&&!ACHS.some(x=>x.id===c.ach))er('маршрут: нет достижения «'+c.ach+'»');
      if(i<R.chapters.length-1&&!STORY.camp[i])er('сюжет: нет стоянки после главы '+(i+1))});
    const lastB=R.chapters[R.chapters.length-1].bio;
    for(const b of lastB)if(BIOMES[b]&&BOSS[BIOMES[b].boss]&&!BOSS[BIOMES[b].boss].final)er('маршрут: босс последней главы («'+BIOMES[b].boss+'») должен быть отмечен final');
    if(ROUTE.shards()!==5)er('маршрут: осколков за забег '+ROUTE.shards()+', а тексты говорят о пяти');
    for(const k in STORY.echo){const m=/^(\d+):(\d+)$/.exec(k);if(!m||+m[1]>=R.chapters.length||+m[2]>=R.floors.length)er('сюжет: эхо «'+k+'» — нет такого этажа')}
    for(const t of ['menu','hub','boss','sad','win'])if(!TRACKS[t])er('нет музыки «'+t+'» в TRACKS');
    return E;
  },
  /* ---------- проверки на ходу (раз в полсекунды, только в режиме отладки) ---------- */
  watch(){
    const r=G.room;if(!r||!r.grid)return;
    for(let i=0;i<r.grid.length;i++)if(r.grid[i]>9){this.err('значение тайла '+r.grid[i]+' больше 9');break}
    for(const e of G.enemies){const id=e.bd?e.bd.id:e.d.id;
      if(!ESTATE.includes(e.state))this.err('состояние «'+e.state+'» ('+id+') не внесено в ESTATE');
      for(const k of ['st','spawn','fuse','intro'])if(e[k]>255)this.err(k+'='+e[k]+' у '+id+' — больше 255');
      if(e.hop>31)this.err('hop='+e.hop+' у '+id+' — больше 31')}
    for(const b of BL.b)if(b.a&&!BKIND.includes(b.kind))this.err('вид пули «'+b.kind+'» не внесён в BKIND');
    for(const it of r.items||[])if(!ITK.includes(it.k))this.err('вид предмета «'+it.k+'» не внесён в ITK');
    for(const a of G.allies)if(!ALK.includes(a.k))this.err('вид союзника «'+a.k+'» не внесён в ALK');
    for(const a of G.traps)if(!TRK.includes(a.k))this.err('вид ловушки игрока «'+a.k+'» не внесён в TRK');
    for(const a of G.areas){if(!ARK.includes(a.k))this.err('вид зоны игрока «'+a.k+'» не внесён в ARK');if(a.r>255)this.err('радиус зоны игрока '+a.r+' — больше 255')}
    for(const p of G.players){
      if(p.maxHp>655||p.maxArmor>655)this.err('здоровье или броня героя больше 655');if(p.maxEnergy>6553)this.err('энергия героя больше 6553');
      if(p.gold>65535||p.cry>65535)this.err('золото или кристаллы за забег больше 65535');if(p.inv>255||p.rev>255)this.err('inv или rev героя больше 255');
      for(const k in p.mods)if(!(k in MODS0))this.err('ключ mods «'+k+'» не объявлен в MODS0')}
  },
  /* ---------- инструменты ---------- */
  host(){if(NET.role==='client'){G.toast('В гостях мир меняет только хост',false,true);return false}return true},
  floor(f,bio){
    if(!this.host())return;f=clamp(Math.floor(+f)||0,0,ROUTE.n()-1);
    if(G.state!=='play'||!G.run){UI.forceClose();G.scene=null;G.newRun(0)}
    if(bio&&BIOMES[bio]&&!BIOMES[bio].hub){G.run.bio=G.run.bio||[];G.run.bio[f]=bio}
    UI.forceClose();G.fadeCb=null;G.startFloor(f);G.fade=1;G.fadeDir=-1;
  },
  spawn(id,n){if(!this.host()||G.state!=='play'||!EN[id])return;for(let i=0;i<(n||1);i++){const q=G.randPos(60,EN[id].fly);G.spawnEnemy(id,q.x,q.y,{})}},
  boss(id){if(!this.host()||G.state!=='play'||!BOSS[id])return;G.spawnBoss(id)},
  wpn(id,rar){const p=G.p;if(!this.host()||!p||!WP_BY[id])return;const w=new Weapon(WP_BY[id],clamp(Math.floor(+rar)||0,0,5));p.weapons[p.cur]=w;p.recalc();G.tell(p,w.name)},
  lvl(){const p=G.p,w=p&&p.w;if(!this.host()||!w)return;w.setLvl(w.lvl>=CONFIG.weapon.lvl.max?0:w.lvl+1);G.tell(p,w.name)},
  relic(id){const p=G.p,r=RELIC_BY[id];if(!this.host()||!p||!r)return;if(p.relics.includes(r)){G.tell(p,'Эта реликвия уже есть');return}G.giveRelic(p,r)},
  godT(el){if(!this.host())return;this.god=!this.god;if(el)el.textContent='Бессмертие: '+(this.god?'вкл':'выкл')},
  killAll(){if(!this.host())return;for(const e of G.enemies.slice())if(!e.dead){e.intro=0;e.invul=0;e.spawn=0;e.hurt(1e9,{by:G.p,noCrit:true})}},
  check(){const v=this.validate();v.forEach(m=>console.error('[данные] '+m));G.toast(v.length?'Ошибок в данных: '+v.length+' — список в консоли':'Данные в порядке',true,true);return v},
  fold(){const b=this.$('dbgB');if(b)b.style.display=b.style.display==='none'?'':'none'},
  /* счётчики за последнюю секунду: байты по каналам в обе стороны, события, пули, размер снимка, время шага */
  show(){
    const N=this.n,el=this.$('dbgN'),k=v=>(v/1024).toFixed(1);let ob=0,eb=0;for(const b of BL.b)if(b.a){if(b.own===1)eb++;else ob++}
    this.last={ev:N.evo,evIn:N.evi,st:N.sto,stIn:N.sti,events:N.evn,snap:N.snap,snapMax:N.snapMax,step:N.step/Math.max(1,N.steps),stepMax:N.stepMax,bullets:ob,ebullets:eb,enemies:G.enemies.length};
    if(el)el.textContent='шаг '+this.last.step.toFixed(2)+' мс (пик '+N.stepMax.toFixed(1)+') · врагов '+G.enemies.length+' · пуль '+ob+' своих + '+eb+' вражеских'+
      (NET.role?'\n'+(NET.role==='host'?'хост':'гость')+' · события ↑'+k(N.evo)+' ↓'+k(N.evi)+' КБ/с, '+N.evn+' шт/с · снимки ↑'+k(N.sto)+' ↓'+k(N.sti)+' КБ/с, '+N.snap+' Б (пик '+N.snapMax+')':'\nсеть выключена');
    N.evo=N.evi=N.sto=N.sti=N.evn=N.step=N.steps=N.stepMax=0;
  },
  init(){
    if(this.on)return;this.on=true;
    Save.save=function(){};Acc.store=function(){};
    const v=this.validate();if(v.length)v.forEach(m=>console.error('[данные] '+m));else console.log('[данные] проверка пройдена, ошибок нет');
    /* бессмертие: у хоста — для всех героев */
    const hurt=Player.prototype.hurt;Player.prototype.hurt=function(n,o){return DBG.god?false:hurt.call(this,n,o)};
    /* счётчики сети: оборачиваем каналы и отправку, сама игра об этом не знает */
    const N=this.n,len=d=>typeof d==='string'?BW.te.encode(d).length:(d&&d.byteLength)||0;
    const setCh=NET.setCh;NET.setCh=function(ch){setCh.call(this,ch);const st=ch.label==='st',send=ch.send.bind(ch),om=ch.onmessage;
      ch.send=d=>{const l=len(d);if(st){N.sto+=l;if(NET.role==='host'){N.snap=l;if(l>N.snapMax)N.snapMax=l}}else N.evo+=l;return send(d)};
      ch.onmessage=e=>{const l=len(e.data);if(st){N.sti+=l;if(NET.role==='client'){N.snap=l;if(l>N.snapMax)N.snapMax=l}}else N.evi+=l;om(e)}};
    const raw=NET.raw;NET.raw=function(m){N.evn+=m&&m.e?m.e.length:1;return raw.call(this,m)};
    const cm=NET.clientMsg;NET.clientMsg=function(m){if(m&&m.e)N.evn+=m.e.length;return cm.call(this,m)};
    const step=G.step;G.step=function(){const t=performance.now();step.call(G);const d=performance.now()-t;N.step+=d;N.steps++;if(d>N.stepMax)N.stepMax=d;if(G.t%30===0)DBG.watch()};
    /* панель */
    const d=document.createElement('div');d.id='dbg';
    d.style.cssText='position:fixed;left:4px;top:4px;z-index:9;background:rgba(8,6,20,.92);border:2px solid #ffd34d;color:#e9e4ff;font:bold 11px "Courier New",monospace;padding:4px 6px;max-width:360px;line-height:1.7';
    const op=(a,f)=>a.map(x=>{const q=f?f(x):[x,x];return'<option value="'+q[0]+'">'+q[1]+'</option>'}).join('');
    const bt=(t,f)=>'<span style="display:inline-block;background:#2a2250;border:1px solid #6b5bd6;padding:0 6px;margin:1px;cursor:pointer" onclick="'+f+'">'+t+'</span>';
    const fl=[];for(let f=0;f<ROUTE.n();f++)fl.push([f,(f+1)+' — гл. '+(ROUTE.ch(f)+1)+', '+({normal:'обычный',guard:'страж',boss:'босс'})[ROUTE.role(f)]]);
    d.innerHTML='<div>'+bt('ОТЛАДКА ▾','DBG.fold()')+' <span style="color:#ff9a9a">сохранение не пишется</span></div><div id="dbgB">'+
      '<div>Этаж <select id="dF">'+op(fl,x=>x)+'</select> <select id="dBi"><option value="">биом по маршруту</option>'+op(Object.keys(BIOMES).filter(k=>!BIOMES[k].hub),k=>[k,BIOMES[k].name])+'</select> '+bt('Перейти',"DBG.floor(DBG.$('dF').value,DBG.$('dBi').value)")+'</div>'+
      '<div>Враг <select id="dE">'+op(ENK,k=>[k,EN[k].n])+'</select> × <select id="dN">'+op([1,3,8])+'</select> '+bt('Создать',"DBG.spawn(DBG.$('dE').value,+DBG.$('dN').value)")+'</div>'+
      '<div>Босс <select id="dBo">'+op(BSK,k=>[k,BOSS[k].n])+'</select> '+bt('Создать',"DBG.boss(DBG.$('dBo').value)")+'</div>'+
      '<div>Оружие <select id="dW">'+op(WP,w=>[w.id,w.n])+'</select> <select id="dR">'+op(RAR.map((r,i)=>[i,r.n]),x=>x)+'</select> '+bt('Выдать',"DBG.wpn(DBG.$('dW').value,DBG.$('dR').value)")+bt('Закалка +1','DBG.lvl()')+'</div>'+
      '<div>Реликвия <select id="dRl">'+op(RELICS,r=>[r.id,r.n])+'</select> '+bt('Выдать',"DBG.relic(DBG.$('dRl').value)")+'</div>'+
      '<div>'+bt('Бессмертие: выкл','DBG.godT(this)')+bt('Убить всех','DBG.killAll()')+bt('Проверить данные','DBG.check()')+'</div>'+
      '<div id="dbgN" style="color:#9ad8ff;white-space:pre-line;line-height:1.3;margin-top:2px"></div></div>';
    document.body.appendChild(d);
    for(const s of d.querySelectorAll('select'))s.style.cssText='font:bold 11px "Courier New",monospace;max-width:150px;padding:0 2px;border-width:1px';
    setInterval(()=>this.show(),1000);
  }
};

/* ---------- Запуск ---------- */
window.addEventListener('load',()=>{
  Acc.load();Save.load();const o=Save.d.opts;
  A=new GameAudio();A.vm=o.music;A.vs=o.sfx;A.muted=!!o.muted;Inp.layout=o.layout;Inp.sens=o.sens;
  PT=new Particles(CONFIG.maxParticles);BL=new Bullets(CONFIG.maxBullets);
  Inp.init(document.getElementById('stage'));Inp.opts(o);
  UI.scr=document.getElementById('scr');
  G=new Game();G.state='title';G.scene={kind:'title'};
  const mb=document.createElement('div');mb.id='muteBtn';mb.textContent=UI.muteIcon();
  mb.addEventListener('click',e=>{e.stopPropagation();UI.toggleMute()});mb.addEventListener('touchstart',e=>{e.stopPropagation()},{passive:true});
  document.getElementById('ui').appendChild(mb);
  const unlock=()=>{A.init();A.resume();if(A.ctx&&A.tr&&A.nextT===0)A.nextT=A.ctx.currentTime+.1;if(!A.name)A.play('menu')};
  ['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlock,{passive:true}));
  A.play('menu');
  const dlg=document.getElementById('dlg');dlg.addEventListener('click',()=>UI.dlgNext());dlg.addEventListener('touchend',e=>{e.preventDefault();UI.dlgNext()},{passive:false});
  addEventListener('keydown',e=>{
    if(UI.dlgActive&&['Space','Enter','KeyE'].includes(e.code)){e.preventDefault();UI.dlgNext();return}
    if(UI.sl&&['Space','Enter'].includes(e.code)){e.preventDefault();UI.slideNext();return}
    if(e.code==='Escape'&&G.modal&&UI.esc)UI.esc();
  });
  const autoPause=()=>{if(G&&(G.state==='play'||G.state==='hub')&&!G.modal&&!G.dlgOpen)UI.pause()};
  addEventListener('blur',()=>{if(!NET.role)autoPause()});document.addEventListener('visibilitychange',()=>{if(document.hidden)autoPause()});
  addEventListener('pagehide',()=>{if(NET.role)NET.close(true)});
  /* пиксельный шрифт лежит в самом файле; просим браузер подготовить его до первого кадра HUD */
  if(document.fonts&&document.fonts.load)document.fonts.load('10px EH').catch(()=>{});
  {const c=document.getElementById('rotPic'),x=c.getContext('2d');x.fillStyle='#0a0810';x.fillRect(6,1,12,22);x.fillStyle='#453a64';x.fillRect(7,2,10,20);x.fillStyle='#1b1626';x.fillRect(8,4,8,15);x.fillStyle='#ffd34d';x.fillRect(11,20,2,1);x.fillRect(10,8,4,1);x.fillRect(9,10,6,1);x.fillRect(10,12,4,1)}
  /* телефон: поворот и полноэкранный режим меняют окно; экран не должен гаснуть посреди боя (блокировка сна работает только на https) */
  addEventListener('orientationchange',()=>setTimeout(()=>G.resize(),250));document.addEventListener('fullscreenchange',()=>setTimeout(()=>G.resize(),100));
  {let wl=null;const wake=()=>{if(!navigator.wakeLock||wl||document.hidden||!Inp.touch)return;try{navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null})},()=>{})}catch(e){}};
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});addEventListener('touchstart',wake,{passive:true})}
  G.start();UI.main();
  /* ссылка-приглашение: …?room=КОД сразу открывает вход в комнату с этим кодом */
  {const m=/[?&]room=([A-Za-z0-9]{5})(&|$)/.exec(location.search);if(m){UI.joinPre=m[1].toUpperCase();UI.coop('main')}}
  if(/[?&]debug=1(&|$)/.test(location.search))DBG.init();
});

</script>
