<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Созвучие">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Созвучие</title>
<style>
:root{
  --bg:#0b0b10;--surface:#15151d;--surface2:#1f1f2a;--line:#2a2a37;
  --text:#f3f3f7;--muted:#8d8d9d;--accent:#8b5cf6;--accent2:#ec4899;
  --grad:linear-gradient(135deg,var(--accent),var(--accent2));
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --tab:58px;--mini:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;overscroll-behavior:none}
body{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit}
svg{display:block;fill:currentColor}
#app{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 8px) 16px calc(var(--tab) + var(--mini) + var(--sb) + 24px)}
.h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:8px 0 16px}
.h2{font-size:20px;font-weight:750;margin:26px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.h2 small{font-size:13px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.top{display:flex;justify-content:space-between;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{background:var(--surface2)}

/* Поток */
.flow{position:relative;height:250px;border-radius:24px;overflow:hidden;background:#120f22;display:flex;flex-direction:column;align-items:center;justify-content:center;isolation:isolate}
.flow .blob{position:absolute;width:220px;height:220px;border-radius:42% 58% 63% 37%/45% 40% 60% 55%;filter:blur(28px);opacity:.75;animation:spin 14s linear infinite;z-index:-1}
.flow .b1{background:var(--accent);left:10%;top:-10%}
.flow .b2{background:var(--accent2);right:5%;bottom:-20%;animation-duration:18s;animation-direction:reverse}
.flow .b3{background:#22d3ee;left:40%;top:30%;width:140px;height:140px;animation-duration:10s;opacity:.45}
.flow.on .blob{animation-duration:4s}
@keyframes spin{to{transform:rotate(360deg) scale(1.05)}}
.flow-title{font-size:30px;font-weight:850;letter-spacing:-.02em}
.flow-sub{color:#d8d4f0;font-size:13px;margin:4px 0 16px}
.flow-play{width:64px;height:64px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;box-shadow:0 8px 30px #0006}
.flow-play svg{width:30px;height:30px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar,.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface2);font-size:14px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);font-weight:600}

.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:0 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.card{flex:none;width:148px;scroll-snap-align:start;text-align:left}
.card .cv{width:148px;height:148px;border-radius:14px}
.card b{display:block;margin-top:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv{background:#222 center/cover no-repeat;flex:none}
.round .cv{border-radius:50%}

.trk{display:flex;align-items:center;gap:12px;padding:7px 0;width:100%;text-align:left}
.trk .cv{width:48px;height:48px;border-radius:8px;position:relative}
.trk .num{width:20px;text-align:center;color:var(--muted);font-size:14px;flex:none}
.trk .meta{flex:1;min-width:0}
.trk .meta b{display:block;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .meta span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .dur{font-size:13px;color:var(--muted)}
.trk.cur .meta b{color:#c4b5fd}
.trk .more{width:32px;height:32px;display:grid;place-items:center;color:var(--muted)}
.trk .more svg{width:20px;height:20px}
.liked-mark{color:var(--accent2)}
.eq{position:absolute;inset:0;display:none;align-items:flex-end;justify-content:center;gap:3px;padding:13px;background:#0008;border-radius:8px}
.trk.cur .eq{display:flex}
.eq i{width:4px;background:#fff;border-radius:2px;height:30%;animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:25%}50%{height:90%}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{height:84px;border-radius:14px;padding:12px;font-weight:700;font-size:16px;text-align:left;position:relative;overflow:hidden}
.tile::after{content:"";position:absolute;width:70px;height:70px;right:-14px;bottom:-14px;border-radius:12px;background:#fff3;transform:rotate(20deg)}
.lib-item{display:flex;align-items:center;gap:14px;padding:10px 0;width:100%;text-align:left}
.lib-item .cv{width:56px;height:56px;border-radius:10px;display:grid;place-items:center}
.lib-item .cv svg{width:26px;height:26px}
.lib-item b{display:block}.lib-item span{font-size:13px;color:var(--muted)}

.search{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:12px;padding:0 12px;height:44px;margin-bottom:16px}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;background:none;border:0;outline:0;height:100%;font-size:16px}

/* шапка страницы плейлиста/альбома */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-top:4px}
.hero .cv{width:200px;height:200px;border-radius:18px;box-shadow:0 20px 50px #0008;margin:4px 0 16px}
.hero.round .cv{border-radius:50%}
.hero h1{font-size:24px;font-weight:800}
.hero p{color:var(--muted);font-size:14px;margin-top:4px}
.hero .acts{display:flex;gap:14px;align-items:center;margin:18px 0 8px}
.btn-main{height:48px;padding:0 26px;border-radius:999px;background:var(--grad);font-weight:700;display:flex;align-items:center;gap:8px}
.btn-main svg{width:22px;height:22px}
.btn-sec{width:48px;height:48px;border-radius:50%;background:var(--surface2);display:grid;place-items:center}
.btn-sec svg{width:22px;height:22px}
.btn-sec.on{color:var(--accent2)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}

/* таб-бар и мини-плеер */
#tabs{position:fixed;left:0;right:0;bottom:0;height:calc(var(--tab) + var(--sb));padding-bottom:var(--sb);background:#0b0b10f2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;border-top:1px solid var(--line);z-index:20}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
#tabs button svg{width:24px;height:24px}
#tabs button.on{color:var(--text)}
#mini{position:fixed;left:8px;right:8px;bottom:calc(var(--tab) + var(--sb) + 6px);height:var(--mini);background:var(--surface2);border-radius:14px;display:none;align-items:center;gap:10px;padding:0 6px 0 8px;z-index:21;overflow:hidden;box-shadow:0 10px 30px #0009}
#mini.show{display:flex}
#mini .cv{width:46px;height:46px;border-radius:8px}
#mini .meta{flex:1;min-width:0}
#mini .meta b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .meta span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--grad);width:0}

/* полноэкранный плеер */
#player{position:fixed;inset:0;z-index:40;background:var(--bg);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(var(--st) + 6px) 24px calc(var(--sb) + 20px);overflow:hidden}
#player.open{transform:none}
#player .bgc{position:absolute;inset:-20%;background:center/cover;filter:blur(60px) saturate(1.4);opacity:.45;z-index:-1}
#player .bgc::after{content:"";position:absolute;inset:0;background:linear-gradient(#0b0b1033,#0b0b10ee 75%)}
.p-head{display:flex;justify-content:space-between;align-items:center;text-align:center}
.p-head div{font-size:12px;color:#ccc;text-transform:uppercase;letter-spacing:.08em}
.p-head div b{display:block;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);margin-top:2px}
.p-cover-wrap{flex:1;display:grid;place-items:center;min-height:0;padding:12px 0}
.p-cover{width:min(84vw,46vh,380px);aspect-ratio:1;border-radius:20px;background:#222 center/cover;box-shadow:0 30px 60px #000a;transition:transform .35s}
#player.paused .p-cover{transform:scale(.9)}
.p-info{display:flex;align-items:center;gap:12px}
.p-info .meta{flex:1;min-width:0}
.p-info h2{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-info p{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-info .on{color:var(--accent2)}
.seek{margin:18px 0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,#fff var(--p,0%),#ffffff33 var(--p,0%));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;border:0}
.times{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.ctrls{display:flex;justify-content:space-between;align-items:center;margin:12px 0 14px}
.ctrls .icon-btn svg{width:28px;height:28px}
.ctrls .sm svg{width:22px;height:22px}
.ctrls .sm{color:var(--muted)}.ctrls .sm.on{color:var(--accent)}
.ctrls .rep1{position:relative}.ctrls .rep1::after{content:"1";position:absolute;font-size:9px;font-weight:800;top:8px;right:8px}
.big-play{width:72px;height:72px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center}
.big-play svg{width:34px;height:34px}
.p-foot{display:flex;justify-content:space-between}
.spin{width:30px;height:30px;border:3px solid #0003;border-top-color:#111;border-radius:50%;animation:spin .8s linear infinite}

/* шторки */
#veil{position:fixed;inset:0;background:#0009;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
#veil.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;padding:8px 16px calc(var(--sb) + 16px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:80vh;overflow-y:auto}
.sheet.show{transform:none}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:#444;margin:0 auto 12px}
.sheet .opt{display:flex;align-items:center;gap:14px;width:100%;padding:13px 4px;text-align:left;font-size:16px}
.sheet .opt svg{width:22px;height:22px;color:var(--muted)}
.sheet input.txt{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);padding:0 14px;font-size:16px;outline:0;margin:8px 0 14px}
.sheet .btn-main{width:100%;justify-content:center}
#toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--mini) + var(--sb) + 20px);transform:translate(-50%,20px);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;z-index:60;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ytbox{position:fixed;z-index:22;display:none;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 10px 30px #000a;right:8px;bottom:calc(var(--tab) + var(--mini) + var(--sb) + 14px);width:200px;height:200px}
#ytbox.show{display:block}
#ytbox.big{z-index:45;border-radius:20px}
#ytbox iframe,#ytbox>div{width:100%;height:100%;border:0;display:block}
#ytbox .x{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:#000b;color:#fff;font-size:18px;line-height:30px;text-align:center;z-index:2}
#ytbox.big .x{display:none}
.seg{display:flex;background:var(--surface2);border-radius:10px;padding:3px;margin:-6px 0 16px}
.seg button{flex:1;height:34px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:600}
.seg button.on{background:var(--text);color:var(--bg)}
.yt-badge{position:absolute;right:3px;bottom:3px;background:#e11d48;color:#fff;font-size:8px;font-weight:800;padding:1px 3px;border-radius:3px}
.note{background:var(--surface);border-radius:14px;padding:16px;font-size:14px;color:#cfcfdb;line-height:1.5}
.note b{color:var(--text)}
.note ol{padding-left:18px;margin:8px 0}
.note .btn-main{margin-top:12px;height:42px}
@media (min-width:700px){#app{max-width:680px;margin:0 auto;left:0;right:0}}
</style>
</head>
<body>
<main id="app"></main>

<div id="mini">
  <div class="bar"></div>
  <div class="cv" id="m-cv"></div>
  <div class="meta" data-act="openPlayer"><b id="m-t"></b><span id="m-a"></span></div>
  <button class="icon-btn" data-act="likeCur" id="m-like"></button>
  <button class="icon-btn" data-act="toggle" id="m-play"></button>
  <button class="icon-btn" data-act="next" id="m-next"></button>
</div>

<nav id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M12 3 3 10.5V21h6.5v-6h5v6H21V10.5z"/></svg>Главная</button>
  <button data-tab="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.96 12.05l4.74 4.74-1.41 1.41-4.74-4.74A7.5 7.5 0 1 1 10.5 3m0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11"/></svg>Поиск</button>
  <button data-tab="library"><svg viewBox="0 0 24 24"><path d="M4 3h2v18H4zm5 0h2v18H9zm4.6.8 1.9-.6 5.6 17-1.9.6z"/></svg>Коллекция</button>
</nav>

<section id="player" class="paused">
  <div class="bgc" id="p-bg"></div>
  <div class="p-head">
    <button class="icon-btn" data-act="closePlayer"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6-1.4-1.4L12 12.2 7.4 7.6z"/></svg></button>
    <div id="p-ctx">Играет из<b></b></div>
    <button class="icon-btn" data-act="moreCur"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="p-cover-wrap"><div class="p-cover" id="p-cv"></div></div>
  <div class="p-info">
    <button class="icon-btn" data-act="dislikeCur" id="p-dis" title="Не нравится"></button>
    <div class="meta" style="text-align:center"><h2 id="p-t"></h2><p id="p-a" data-act="goArtistCur"></p></div>
    <button class="icon-btn" data-act="likeCur" id="p-like"></button>
  </div>
  <div class="seek"><input type="range" id="p-seek" min="0" max="1000" value="0"><div class="times"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div></div>
  <div class="ctrls">
    <button class="icon-btn sm" data-act="shuffle" id="p-shuf"></button>
    <button class="icon-btn" data-act="prev" id="p-prev"></button>
    <button class="big-play" data-act="toggle" id="p-play"></button>
    <button class="icon-btn" data-act="next" id="p-next"></button>
    <button class="icon-btn sm" data-act="repeat" id="p-rep"></button>
  </div>
  <div class="p-foot">
    <button class="icon-btn sm" data-act="share"><svg viewBox="0 0 24 24"><path d="M18 16a3 3 0 0 0-2.4 1.2l-6.7-3.5a3 3 0 0 0 0-1.4l6.7-3.5A3 3 0 1 0 15 7c0 .2 0 .5.1.7L8.4 11.2a3 3 0 1 0 0 1.6l6.7 3.5A3 3 0 1 0 18 16"/></svg></button>
    <button class="icon-btn sm" data-act="queue"><svg viewBox="0 0 24 24"><path d="M3 6h13v2H3zm0 5h13v2H3zm0 5h9v2H3zm15-2v-4h2v4h3l-4 5-4-5z"/></svg></button>
  </div>
</section>

<div id="ytbox"><div id="yt-frame"></div><button class="x" data-act="ytClose" aria-label="Закрыть видео">×</button></div>

<div id="veil" data-act="closeSheet"></div>
<div class="sheet" id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" accept="audio/*" multiple hidden>

<script>
"use strict";
/* ===================== утилиты ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=2166136261;for(const c of String(s)){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return h>>>0};
const rng=seed=>{let s=seed>>>0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const plural=(n,a,b,c)=>{const m=n%10,h=n%100;return n+' '+(m==1&&h!=11?a:m>=2&&m<=4&&(h<10||h>=20)?b:c)};
const shuffleArr=(a,R=Math.random)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const I={
  play:'<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg>',
  pause:'<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>',
  next:'<svg viewBox="0 0 24 24"><path d="M5 5v14l10-7zm11 0h3v14h-3z"/></svg>',
  prev:'<svg viewBox="0 0 24 24"><path d="M19 5v14L9 12zM5 5h3v14H5z"/></svg>',
  heart:'<svg viewBox="0 0 24 24"><path d="M12 20.5 10.6 19.2C5.4 14.5 2 11.4 2 7.6 2 4.5 4.4 2 7.5 2c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 2C19.6 2 22 4.5 22 7.6c0 3.8-3.4 6.9-8.6 11.6zM7.5 4C5.5 4 4 5.6 4 7.6c0 2.9 3 5.7 8 10.2 5-4.5 8-7.3 8-10.2C20 5.6 18.5 4 16.5 4c-1.5 0-3 1-3.6 2.4h-1.8C10.5 5 9 4 7.5 4"/></svg>',
  heartF:'<svg viewBox="0 0 24 24"><path d="M12 20.5 10.6 19.2C5.4 14.5 2 11.4 2 7.6 2 4.5 4.4 2 7.5 2c1.7 0 3.4.8 4.5 2.1A6 6 0 0 1 16.5 2C19.6 2 22 4.5 22 7.6c0 3.8-3.4 6.9-8.6 11.6z"/></svg>',
  ban:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20M4 12a8 8 0 0 1 12.9-6.3L5.7 16.9A8 8 0 0 1 4 12m8 8a8 8 0 0 1-4.9-1.7L18.3 7.1A8 8 0 0 1 12 20"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24"><path d="M14.8 4H20v5.2l-1.9-1.9-12.7 12.7L4 18.6 16.7 5.9zM4 5.4 5.4 4l5 5L9 10.4zm9.6 10L15 14l3.1 3.1L20 15.2V20h-4.8l1.9-1.9z"/></svg>',

const coverCache={};
function cover(seed){
  if(coverCache[seed])return coverCache[seed];
  const c=document.createElement('canvas');c.width=c.height=320;const x=c.getContext('2d');const R=rng(seed);
  const h1=R()*360,h2=(h1+40+R()*140)%360;
  const gr=x.createLinearGradient(0,0,320,320);gr.addColorStop(0,`hsl(${h1},72%,56%)`);gr.addColorStop(1,`hsl(${h2},68%,24%)`);
  x.fillStyle=gr;x.fillRect(0,0,320,320);
  const st=Math.floor(R()*5);
  for(let i=0;i<7;i++){
    x.globalAlpha=.16+R()*.38;x.fillStyle=x.strokeStyle=`hsl(${(h1+R()*200)%360},85%,${50+R()*35}%)`;
    if(st==0){x.beginPath();x.arc(R()*320,R()*320,24+R()*110,0,7);x.fill()}
    else if(st==1){x.save();x.translate(160,160);x.rotate(R()*3);x.fillRect(-200+R()*200,-160+i*46,240+R()*160,14+R()*26);x.restore()}
    else if(st==2){x.beginPath();x.moveTo(R()*320,R()*320);x.lineTo(R()*320,R()*320);x.lineTo(R()*320,R()*320);x.fill()}
    else if(st==3){x.lineWidth=5+R()*12;x.beginPath();x.arc(160,160,24+i*22,0,7);x.stroke()}
    else{x.lineWidth=3+R()*8;x.beginPath();x.moveTo(0,40+i*40);for(let k=0;k<=8;k++)x.lineTo(k*40,40+i*40+(R()-.5)*60);x.stroke()}
  }
  x.globalAlpha=.18;x.fillStyle='#000';for(let i=0;i<1400;i++)x.fillRect(R()*320,R()*320,1.5,1.5);
  return coverCache[seed]=c.toDataURL('image/jpeg',.86);
}

/* ===================== синтезатор (оригинальная музыка генерируется на лету) ===================== */
/* Весь синтезатор — одна самодостаточная функция: её текст запускается в Web Worker,
   а если воркер недоступен — прямо на странице. Звук считается сэмпл за сэмплом без узлов Web Audio. */
function SYNTH(){
  const rng=seed=>{let s=seed>>>0;return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}};
  const SCALES={minor:[0,2,3,5,7,8,10],major:[0,2,4,5,7,9,11],dorian:[0,2,3,5,7,9,10]};
  const PROGS=[[0,5,3,4],[0,3,4,4],[0,4,5,3],[5,3,0,4],[0,2,5,4],[0,5,1,4],[3,4,0,0]];
  const DRUMS={
    house:{k:[0,4,8,12],s:[4,12],h:[2,6,10,14],ho:true},
    rock:{k:[0,6,8,10],s:[4,12],h:[0,2,4,6,8,10,12,14]},
    pop:{k:[0,7,8],s:[4,12],h:[0,2,4,6,8,10,12,14]},
    lofi:{k:[0,7,10],s:[4,12],h:[0,2,4,6,8,10,12,14],soft:true},
  };
  const SR=22050,TAU=Math.PI*2;
  const WAVE={
    sine:p=>Math.sin(TAU*p),
    triangle:p=>4*Math.abs(p-.5)-1,
    sawtooth:p=>2*p-1,
    square:p=>p<.5?.8:-.8,
  };
  // двухполюсный НЧ-фильтр (биквад), применяется ко всей шине
  function lowpass(a,f,q=.707){
    const w=TAU*f/SR,al=Math.sin(w)/(2*q),c=Math.cos(w),a0=1+al;
    const b0=(1-c)/2/a0,b1=(1-c)/a0,b2=b0,a1=-2*c/a0,a2=(1-al)/a0;
    let x1=0,x2=0,y1=0,y2=0;
    for(let i=0;i<a.length;i++){const x=a[i],y=b0*x+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=x;y2=y1;y1=y;a[i]=y}
  }
  function highpass1(a,k){let px=0,py=0;for(let i=0;i<a.length;i++){const x=a[i];py=k*(py+x-px);px=x;a[i]=py}return a}
  function note(buf,type,f,t0,len,vol,a=.01,r=.08,det=0,phase=0){
    const i0=Math.floor(t0*SR);if(i0>=buf.length)return;
    const n=Math.min(Math.floor(len*SR),buf.length-i0),A=Math.max(1,Math.floor(a*SR)),Rl=Math.max(1,Math.min(Math.floor(r*SR),n-A));
    const inc=f*Math.pow(2,det/1200)/SR,w=WAVE[type];let p=phase;
    for(let i=0;i<n;i++){const e=i<A?i/A:i>n-Rl?(n-i)/Rl:1;buf[i0+i]+=w(p)*vol*e;p+=inc;if(p>=1)p-=1}
  }
  function addSample(buf,s,t0,v){const i0=Math.floor(t0*SR);const n=Math.min(s.length,buf.length-i0);for(let i=0;i<n;i++)buf[i0+i]+=s[i]*v}
  function drumSamples(R){
    const kick=new Float32Array(Math.floor(SR*.4));let ph=0;
    for(let i=0;i<kick.length;i++){const t=i/SR,f=42+108*Math.exp(-t/.035);ph+=TAU*f/SR;kick[i]=Math.sin(ph)*Math.exp(-t/.11)}

    highpass1(snare,.75);for(let i=0;i<snare.length;i++){const t=i/SR;snare[i]+=Math.sin(TAU*190*t)*.4*Math.exp(-t/.03)}
    const hat=len=>{const a=new Float32Array(Math.floor(SR*len*4));for(let i=0;i<a.length;i++)a[i]=(R()*2-1)*Math.exp(-i/SR/len);return highpass1(highpass1(a,.25),.25)};

  }
  // ревербератор Шрёдера: 4 гребенчатых фильтра с затуханием + 2 всепропускающих
  function reverb(src,off,fb){
    const out=new Float32Array(src.length);
    [1116,1188,1277,1356].forEach(d=>{d=Math.floor((d+off)*SR/44100*1.6);const b=new Float32Array(d);let k=0,lp=0;

      for(let i=0;i<out.length;i++){const bo=b[k],x=out[i];b[k]=x+bo*.5;out[i]=bo-x*.5;if(++k>=d)k=0}});

        note(pad,g.pad,f,t0,bar+.35,v,bar*.25,bar*.35,-7,R());note(pad,g.pad,f,t0,bar+.35,v,bar*.25,bar*.35,7,R())});
      if(amb&&b%2==0)note(lead,'sine',hz(d2m(chord[Math.floor(R()*3)])+36),t0+R()*bar,bar*1.5,.035,.8,1.2);

        if(t.genre=='house')[2,6,10,14].forEach(s=>note(bass,g.bass,bf,t0+s*spb/4,spb*.4,bv*.7));
        else if(t.genre=='synth')for(let s=0;s<8;s++)note(bass,g.bass,bf*(s%4==3?2:1),t0+s*spb/2,spb*.42,bv*.7);
        else if(t.genre=='pop')[0,2,3,4,6].forEach(s=>note(bass,g.bass,bf,t0+s*spb/2,spb*.45,bv));
        else if(amb)note(bass,'sine',bf,t0,bar,.2,.5,.6);
        else{note(bass,g.bass,bf,t0,spb*1.4,bv,.02,.3);note(bass,g.bass,bf,t0+spb*2.5,spb*1.2,bv*.8,.02,.3)}}

          if(full&&dp.k.includes(s))addSample(drum,smp.kick,st,v);
          if(full&&dp.s.includes(s))addSample(drum,smp.snare,st,v*(dp.soft?.7:1));
          if(dp.h.includes(s)&&(full||t.genre=='house'||b>=2))addSample(drum,dp.ho&&s%4==2?smp.open:smp.hat,st,(dp.soft?.22:.32)*(s%4==0?.7:1));
        }
        if(full&&b%4==3)for(let s=12;s<16;s++)addSample(drum,smp.hat,t0+s*spb/4,.18);
      }
      // арпеджио
      if(g.arp&&b>=4&&!outro){const arp=chord.concat([chord[0]+7]);for(let s=0;s<16;s++)note(lead,'square',hz(d2m(arp[s%arp.length])+24),t0+s*spb/4,spb*.2,.02,.003,.04)}

      if(b>=leadStart&&!outro&&!(brk&&b==mid)){
        const m=motifs[Math.floor((b-leadStart)/4)%2],off=(b%2)*8;
        for(let k=0;k<8;k++){const n=m[off+k];if(!n)continue;let d=n.d;
          if(k%2==0){let best=d,bd=9;chord.forEach(c=>{for(let o=-14;o<=14;o+=7){const dd=Math.abs(c+o-d);if(dd<bd){bd=dd;best=c+o}}});d=best}
          const lv=g.lead=='sine'||g.lead=='triangle'?.1:.05;

    const send=new Float32Array(N);const ps=amb?.9:.45;for(let i=0;i<N;i++)send[i]=pad[i]*ps+lead[i]*.5;

    if(YTS.q!==q||YTS.state=='idle')return `<div class="empty">Нажмите «Найти» на клавиатуре</div>`;
    if(YTS.state=='loading')return `<div class="empty">Ищем на YouTube…</div>`;
    if(YTS.state=='error')return `<div class="empty">${esc(YTS.msg)}<br><br><button class="chip" data-act="ytKey">Проверить ключ API</button></div>`;
    return YTS.ids.length?`<div class="h2">YouTube <small data-act="ytKey">Ключ API</small></div>${trackList(YTS.ids)}`:`<div class="empty">Ничего не нашлось</div>`;
  }
  const ql=q.toLowerCase();
  if(!ql)return `<div class="h2">Жанры и настроения</div><div class="grid2">${Object.entries(GENRES).map(([k,g])=>`<button class="tile" style="background:${g.color}" data-act="openGenre" data-id="${k}">${g.name}</button>`).join('')}</div>`;
  const tr=TRACKS.concat(Object.values(LOCAL),Object.keys(S.yt).map(ytTrack)).filter(t=>t&&(t.title+' '+t.artist+' '+(t.local||t.yt?'':AM[t.album].title+' '+GENRES[t.genre].name)).toLowerCase().includes(ql));
  const ar=ARTISTS.filter(a=>a.name.toLowerCase().includes(ql)),al=ALBUMS.filter(a=>(a.title+' '+a.artist).toLowerCase().includes(ql));
  return (ar.length?`<div class="h2">Исполнители</div><div class="hscroll round">${ar.map(a=>card(cover(a.seed),a.name,'Исполнитель','openArtist',`data-id="${esc(a.name)}"`)).join('')}</div>`:'')
    +(al.length?`<div class="h2">Альбомы</div><div class="hscroll">${al.map(a=>card(cover(a.seed),a.title,a.artist,'openAlbum',`data-id="${a.id}"`)).join('')}</div>`:'')
    +(tr.length?`<div class="h2">Треки</div>${trackList(tr.map(t=>t.id))}`:'')
    ||`<div class="empty">Ничего не нашлось по запросу «${esc(query)}»<br><br><button class="chip" data-act="searchYT">Искать на YouTube</button></div>`;
}

  if(p.type=='artist'){const a=ARTISTS.find(x=>x.name==p.id),als=ALBUMS.filter(x=>x.artist==p.id),ids=TRACKS.filter(t=>t.artist==p.id).sort((x,y)=>y.plays-x.plays).map(t=>t.id);

    +(ids.length?trackList(ids):`<div class="empty">Найдите песню во вкладке «Поиск» → «YouTube» или вставьте туда ссылку на видео</div>`)}
  if(p.type=='local'){const ids=Object.keys(LOCAL);return hero(cover(99),'Мои файлы','Музыка с вашего устройства хранится только в этом браузере',ids,'Мои файлы',{extraBtn:`<button class="btn-sec" data-act="addFiles">${I.plus}</button>`})
    +(ids.length?trackList(ids):`<div class="empty">Нажмите «+», чтобы добавить MP3 и другие аудиофайлы с телефона</div>`)}
  if(p.type=='userpl'){const pl=S.playlists.find(x=>x.id==p.id);if(!pl)return '<div class="empty">Плейлист удалён</div>';const ids=pl.ids.filter(T);
    return hero(cover(hash(pl.id)),pl.name,plural(ids.length,'трек','трека','треков'),ids,pl.name,{extraBtn:`<button class="btn-sec" data-act="delPl" data-id="${pl.id}">${I.trash}</button>`})
    +(ids.length?trackList(ids):'<div class="empty">Добавляйте треки через меню «⋯»</div>')}
  return '';
}

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){const same=tab==tb.dataset.tab&&!stack.length;tab=tb.dataset.tab;stack=[];render();if(same)$('#app').scrollTo({top:0,behavior:'smooth'});else $('#app').scrollTop=0;return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const f=A[el.dataset.act];if(f){e.stopPropagation();f(el)}
});
$('#mini .cv').addEventListener('click',A.openPlayer);
// свайп вниз закрывает плеер
(()=>{let y0=null;const p=$('#player');
  p.addEventListener('touchstart',e=>{if(e.target.closest('input'))return;y0=e.touches[0].clientY},{passive:true});
  p.addEventListener('touchmove',e=>{if(y0==null)return;const dy=e.touches[0].clientY-y0;if(dy>0){p.style.transition='none';p.style.transform=`translateY(${dy}px)`}},{passive:true});
  p.addEventListener('touchend',e=>{if(y0==null)return;const dy=e.changedTouches[0].clientY-y0;y0=null;p.style.transition='';p.style.transform='';if(dy>120)p.classList.remove('open')});
})();
// аппаратная кнопка «назад» на Android
history.replaceState({b:0},'');history.pushState({b:1},'');
addEventListener('popstate',()=>{
  if($('#sheet').classList.contains('show'))closeSheet();
  else if($('#player').classList.contains('open'))$('#player').classList.remove('open');
  else if(stack.length)back();
  else if(tab!='home'){tab='home';render()}
  else{history.back();return}
  history.pushState({b:1},'');
});

/* ===================== запуск ===================== */
loadLocal().then(()=>render());render();
// заранее готовим первый трек потока, чтобы кнопка «Поток» срабатывала сразу
let warm=null;
setTimeout(()=>{P.stream=S.mood||'all';warm=streamPick(1)[0];P.stream=null;getSrc(T(warm)).catch(()=>{})},600);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
